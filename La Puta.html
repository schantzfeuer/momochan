    <div class="flexrow"><b>Slot ${index+1}</b><span class="muted">${slot.productId?`${esc(slot.name||'Product')} · ${slot.quantity}/${WHOLESALE_SLOT_CAPACITY} units · ${fmtMoney(slot.unitPrice||0)}`:'Empty'}</span><span class="spacer"></span>
      <select id="whProduct_${index}"><option value="">Select product</option>${state.products.filter(p=>p.quantity>0).map(p=>`<option value="${p.id}" ${slot.productId===p.id?'selected':''}>${esc(p.name)} · ${p.quantity} available</option>`).join('')}</select>
      <input type="number" id="whQty_${index}" min="1" max="${WHOLESALE_SLOT_CAPACITY}" value="${Math.max(1,Math.min(WHOLESALE_SLOT_CAPACITY-slot.quantity,20))}" aria-label="Units to stock in slot ${index+1}">
      <button class="sm" data-act="wholesalestock" data-slot="${index}" ${state.products.every(p=>p.quantity<=0)?'disabled':''}>Stock</button>
    </div>
  </div>`).join('')}
  <h2 class="sect">Packaged Inventory</h2>
  <div class="card">${state.products.filter(p=>p.quantity>0).length===0?'<div class="muted">No packaged products yet.</div>':`<table><tr><th>Product</th><th>Type</th><th>Grade</th><th>Stock</th><th>Price / unit</th></tr>
    ${state.products.filter(p=>p.quantity>0).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(PRODUCT_RECIPES.find(r=>r.id===p.recipeId)?.name||p.recipeId)}</td><td>${gradeTag(p.grade)}</td><td>${p.quantity}</td><td>${fmtMoney(p.unitPrice)}</td></tr>`).join('')}</table>`}</div>
  `;
  return html;
}

/* ---------- CONTRACTS ---------- */

function renderContracts(){
  for(const offer of state.offers) refreshContractOfferQuantity(offer);
  const availableVehicles=state.vehicles.filter(vehicle=>vehicleAvailable(vehicle));
  const active = state.contracts.filter(c=>c.status==='active');
  const done = state.contracts.filter(c=>c.status!=='active');

  let html = `<h2 class="sect">Contract Offers</h2>
  <div class="card muted">Offer quantities scale with reputation and are capped by your largest vehicle's usable payload. Organization deliveries require a vehicle. Product at or above the minimum grade is delivered automatically on each due date; shortfalls incur penalties.</div>`;
  if(state.offers.length === 0){
    html += `<div class="card muted">No open offers. Build relationships with organizations to receive them.</div>`;
  } else {
    for(const o of state.offers){
      const org = state.organizations.find(x=>x.id===o.orgId);
      const expires = o.expiresMinute - state.time.minutes;
      html += `<div class="card" style="margin-bottom:10px">
        <div class="flexrow">
          <h3 style="margin:0">${esc(o.orgName)}${o.special?' · PREMIUM':''}</h3>
          <span class="pill">Relationship ${org?org.relationship.toFixed(0):'—'}</span>
          <span class="spacer"></span>
          <span class="warn">expires in ${minutesToClock(expires)}</span>
        </div>
        <div class="sep"></div>
        <div class="grid g2">
          <div>
            <div class="row"><span class="k">Quantity</span><span>${formatMass(o.qtyPerPeriod)} / ${o.periodDays} days</span></div>
            <div class="row"><span class="k">Minimum grade</span><span>${gradeTag(o.minGrade)}</span></div>
            <div class="row"><span class="k">Duration</span><span>${o.periods} periods (${o.periods*o.periodDays} days)</span></div>
            ${o.special?`<div class="row"><span class="k">Introduction</span><span>${esc(o.referredBy)}</span></div>`:''}
          </div>
          <div>
            <div class="row"><span class="k">Price type</span><span>${o.priceType==='fixed'?'Fixed price':'Market ±'}</span></div>
            ${o.priceType==='fixed'
              ? `<div class="row"><span class="k">Price</span><span>${fmtMoney(o.pricePerUnit)}/g</span></div>`
              : `<div class="row"><span class="k">Market modifier</span><span>×${o.marketMod.toFixed(2)}</span></div>`}
            <div class="row"><span class="k">Shortfall penalty</span><span class="bad">${fmtMoney(o.penaltyPerUnit)}/g</span></div>
          </div>
        </div>
        <div class="sep"></div>
        <div class="flexrow">
          ${availableVehicles.length>0?`<label class="muted" for="contractVehicle_${o.id}">Vehicle</label><select id="contractVehicle_${o.id}">${availableVehicles.map(v=>`<option value="${v.id}">${esc(v.name)} · ${formatMass(vehicleUsableCapacity(v))} usable</option>`).join('')}</select>`:''}
          <button class="primary" data-act="acceptoffer" data-offer="${o.id}" ${availableVehicles.length===0?'disabled':''}>Send Contract</button>
          ${availableVehicles.length===0?`<span class="warn">${state.vehicles.length===0?'Buy a vehicle before accepting.':'All vehicles are assigned to a shipment or active contract.'}</span>`:''}
          <button data-act="declineoffer" data-offer="${o.id}">Decline</button>
        </div>
      </div>`;
    }
  }

  html += `<h2 class="sect">Active Contracts</h2>`;
  if(active.length === 0){
    html += `<div class="card muted">No active contracts.</div>`;
  } else {
    html += `<div class="card"><table>
      <tr><th>Organization</th><th>Vehicle</th><th>Qty / period</th><th>Min grade</th><th>Price</th><th>Next due</th><th>Shipment</th><th>Delivered</th></tr>
      ${active.map(c=>{
        const remaining = c.nextDueMinute - state.time.minutes;
        const shipment=state.shipments.find(s=>s.id===c.pendingShipmentId && s.status==='scheduled');
        return `<tr>
          <td>${esc(c.orgName)}</td>
          <td>${esc(state.vehicles.find(v=>v.id===c.vehicleId)?.name||'Unavailable')}</td>
          <td>${formatMass(c.qtyPerPeriod)} / ${c.periodDays}d</td>
          <td>${gradeTag(c.minGrade)}</td>
          <td>${c.priceType==='fixed'? fmtMoney(c.pricePerUnit)+'/g' : 'market ×'+c.marketMod.toFixed(2)}</td>
          <td class="${remaining < MINUTES_PER_DAY ? 'warn':''}">${minutesToClock(remaining)}</td>
          <td>${shipment?`In transit · ${minutesToClock(shipment.duration-shipment.elapsed)}`:'—'}</td>
          <td>${formatMass(c.totalDelivered)} · ${fmtMoney(c.totalValue)}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  }

  if(done.length > 0){
    html += `<h2 class="sect">Completed Contracts</h2>
    <div class="card"><table>
      <tr><th>Organization</th><th>Delivered</th><th>Value</th><th>Status</th></tr>
      ${done.map(c=>`<tr><td>${esc(c.orgName)}</td><td>${c.totalDelivered}</td><td>${fmtMoney(c.totalValue)}</td><td>${c.status}</td></tr>`).join('')}
    </table></div>`;
  }

  return html;
}

/* ---------- PEOPLE ---------- */

function renderJobControls(p){
  if(p.role==='worker'){
    const job = p.jobType||'idle';
    let html = `<select data-act="jobtype" data-person="${p.id}">
      <option value="idle" ${job==='idle'?'selected':''}>Idle</option>
      <option value="cultivate" ${job==='cultivate'?'selected':''}>Plant / harvest</option>
      <option value="dry" ${job==='dry'?'selected':''}>Dry product</option>
      <option value="product" ${job==='product'?'selected':''}>Produce packaged product</option>
    </select>`;
    if(job==='cultivate'){
      html += `<select data-act="jobfield" data-field="gardenId" data-person="${p.id}">
        ${state.gardens.map(g=>{
          const assigned = state.people.filter(x=>x.role==='worker' && x.jobType==='cultivate' && x.gardenId===g.id).length;
          return `<option value="${g.id}" ${p.gardenId===g.id?'selected':''} ${assigned>=3 && p.gardenId!==g.id?'disabled':''}>${esc(g.name)} (${assigned}/3)</option>`;
        }).join('')}
      </select>
      <select data-act="jobfield" data-field="seedGenetics" data-person="${p.id}">
        ${GENETICS.map(g=>`<option value="${g.id}" ${p.seedGenetics===g.id?'selected':''}>${g.name}</option>`).join('')}
      </select>
      <select data-act="jobfield" data-field="carePackage" data-person="${p.id}">
        ${Object.values(CARE).map(c=>`<option value="${c.key}" ${p.carePackage===c.key?'selected':''}>${c.name}</option>`).join('')}
      </select>`;
    } else if(job==='dry'){
      html += `<select data-act="jobfield" data-field="dryGrade" data-person="${p.id}">
        ${GRADES.map(g=>`<option value="${g}" ${p.dryGrade===g?'selected':''}>Grade ${g}</option>`).join('')}
      </select>
      <select data-act="jobfield" data-field="dryMode" data-person="${p.id}">
        ${Object.values(DRY_MODES).map(m=>`<option value="${m.key}" ${p.dryMode===m.key?'selected':''}>${m.name}</option>`).join('')}
      </select>
      <select data-act="jobfield" data-field="dryQuantity" data-person="${p.id}">
        <option value="one" ${p.dryQuantity==='one'?'selected':''}>1 batch</option>
        <option value="all" ${p.dryQuantity!=='one'?'selected':''}>All available</option>
      </select>`;
    } else if(job==='product'){
      html += `<select data-act="jobfield" data-field="productRecipeId" data-person="${p.id}">
        ${PRODUCT_RECIPES.map(r=>`<option value="${r.id}" ${p.productRecipeId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
      </select><span class="hint">Maximum 20 units per day</span>`;
    }
    return html;
  }
  if(p.role==='seller'){
    return `<select data-act="sellerjob" data-person="${p.id}">
      <option value="sell_messages" ${p.jobType==='sell_messages'?'selected':''}>Handle messages + auto sell</option>
      <option value="messages" ${p.jobType==='messages'?'selected':''}>Handle messages</option>
      <option value="sell" ${p.jobType==='sell'?'selected':''}>Auto sell inventory</option>
      <option value="idle" ${p.jobType==='idle'?'selected':''}>Idle</option>
    </select>
    ${['sell','sell_messages'].includes(p.jobType)?`<select data-act="jobfield" data-field="sellGrade" data-person="${p.id}">
      <option value="any" ${p.sellGrade==='any'?'selected':''}>Any grade</option>
      ${GRADES.map(g=>`<option value="${g}" ${p.sellGrade===g?'selected':''}>Grade ${g}</option>`).join('')}
    </select>
    <select data-act="jobfield" data-field="sellRule" data-person="${p.id}">
      <option value="always" ${p.sellRule!=='minimum'?'selected':''}>Sell now</option>
      <option value="minimum" ${p.sellRule==='minimum'?'selected':''}>At minimum price</option>
    </select>
    ${p.sellRule==='minimum'?`<input type="number" min="0" step="0.1" aria-label="Minimum market price" data-act="jobfield" data-field="sellMinPrice" data-person="${p.id}" value="${p.sellMinPrice||0}">`:''}`:''}`;
  }
  if(p.role==='technician'){
    return `<select data-act="assign" data-person="${p.id}">
      <option value="none" ${!p.gardenId?'selected':''}>No garden</option>
      ${state.gardens.map(g=>`<option value="${g.id}" ${p.gardenId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
    </select>`;
  }
  if(p.role==='restocker'){
    const dealer=state.dealers.find(d=>d.id===p.restockDealerId);
    const nextVisit=Math.max(0,(Number(p.restockNextMinute)||state.time.minutes)-state.time.minutes);
    return `<select data-act="jobfield" data-field="restockState" data-person="${p.id}">
      ${['raw','dried','processed','random'].map(itemState=>`<option value="${itemState}" ${p.restockState===itemState?'selected':''}>${itemState==='random'?'Random · all inventory categories':itemState[0].toUpperCase()+itemState.slice(1)}</option>`).join('')}
    </select><select data-act="jobfield" data-field="restockGrade" data-person="${p.id}" ${p.restockState==='random'?'disabled':''}>
      ${GRADES.map(grade=>`<option value="${grade}" ${p.restockGrade===grade?'selected':''}>Grade ${grade}</option>`).join('')}
    </select><span class="hint">${dealer?`Next: ${esc(dealer.name)} in ${minutesToClock(nextVisit)}`:'Waiting for a dealer'}</span>`;
  }
  if(p.role==='driver' || p.role==='security') return `<span class="muted">Available for shipments · skill ${Math.round(p.skill)}</span>`;
  return '<span class="muted">Legacy role · no active job</span>';
}

function renderDealers(){
  refreshDealerCandidates();

  let html=`<h2 class="sect">Dealer Network</h2>
    <div class="card">
      <div class="row"><span class="k">Business</span><span>${esc(state.player.name)} · ${esc(state.player.organizationName)}</span></div>
      <div class="row"><span class="k">Reputation</span><span>${state.player.reputation}/1000</span></div>
      <div class="row"><span class="k">Dealer capacity</span><span>${state.dealers.length}/${limit}</span></div>

    </div>
    <h2 class="sect">Active Dealers</h2>`;
  html+=state.dealers.length===0?'<div class="card muted">No active dealers.</div>':state.dealers.map(d=>{
    const stock=d.inventory||[];
    const options=state.inventory.filter(s=>s.qty>0).map(s=>`<option value="biomass:${s.id}">${s.state} cannabis · Grade ${s.grade}${s.variant?' · '+esc(s.variant):''} · ${formatMass(s.qty)}</option>`).join('')+
      state.products.filter(p=>p.quantity>0).map(p=>`<option value="product:${p.id}">Product · ${esc(p.name)} · Grade ${p.grade} · ${p.quantity} units</option>`).join('');
    return `<div class="card" style="margin-bottom:10px">
      <div class="flexrow"><h3 style="margin:0">${esc(d.name)}</h3><span class="pill">Rep ${d.reputation}/1000</span><span class="pill">Reliability ${d.reliability}</span><span class="pill">Commission ${d.cutPercent}%</span><span class="spacer"></span><button class="sm danger" data-act="releasedealer" data-dealer="${d.id}">End cooperation</button></div>
      <div class="row"><span class="k">Dealer stock</span><span>${formatMass(dealerInventoryMass(d))} / ${formatMass(d.capacityGrams)} · ${formatMass(d.dailyRateGrams)} daily sales limit</span></div>
      ${stock.length===0?'<div class="muted">No dealer stock. Transfer inventory to begin sales.</div>':`<table><tr><th>Item</th><th>Grade</th><th>Stock</th><th>Type</th></tr>
        ${stock.map(s=>`<tr><td>${s.kind==='product'?esc(s.name):(esc(s.state)+(s.variant?' · '+esc(s.variant):'')+' cannabis')}</td><td>${gradeTag(s.grade)}</td><td>${s.kind==='product'?`${s.quantity} units · ${formatMass(s.quantity*s.weightGrams)}`:formatMass(s.qty)}</td><td>${s.kind==='product'?'Packaged':'Cannabis'}</td></tr>`).join('')}
      </table>`}
      <div class="sep"></div>
      <div class="flexrow"><select id="dealerSource_${d.id}" aria-label="Stock to transfer to ${esc(d.name)}"><option value="">Select stock to transfer</option>${options}</select>
        <input type="number" id="dealerQty_${d.id}" min="1" step="1" value="100" aria-label="Transfer quantity to ${esc(d.name)}">
        <button class="sm primary" data-act="transferdealerstock" data-dealer="${d.id}" ${options?'':'disabled'}>Transfer quantity</button>
        <button class="sm" data-act="transferalldealerstock" data-dealer="${d.id}" ${options?'':'disabled'}>Transfer All</button></div>
    </div>`;
  }).join('');
  html+=`<h2 class="sect">Available Candidates</h2>`;
  if(limit<=state.dealers.length) return html+`<div class="card muted">Increase business reputation to unlock more dealer capacity.</div>`;
  html+=state.dealerCandidates.length===0?'<div class="card muted">No candidates available.</div>':`<div class="card"><table><tr><th>Name</th><th>Reputation</th><th>Reliability</th><th>Commission</th><th>Capacity</th><th>Rate / day</th><th>One-time fee</th><th></th></tr>
    ${state.dealerCandidates.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.reputation}/1000</td><td>${d.reliability}</td><td>${d.cutPercent}%</td><td>${formatMass(d.capacityGrams)}</td><td>${formatMass(d.dailyRateGrams)}</td><td>${fmtMoney(d.cooperationCost)}</td>

  return html;
}

    </div>
    <h2 class="sect">Rival Organizations</h2>
    <div class="card"><div class="hint">Successful operations transfer a rival's remaining treasury and properties. One operation can be attempted per day.</div>
      <table><tr><th>Organization</th><th>Properties</th><th>Treasury</th><th>Success chance</th><th>Operation cost</th><th></th></tr>
        ${state.organizations.filter(org=>org.id!==own.id).map(org=>{
          const chance=organizationAttackChance(org);
          const cost=organizationAttackCost(org);
          return `<tr><td>${esc(org.name)}</td><td>${(org.properties||[]).length}</td><td>${fmtMoney(org.treasury||0)}</td><td>${(chance*100).toFixed(0)}%</td><td>${fmtMoney(cost)}</td>
            <td class="right"><button class="sm danger" data-act="attackorg" data-org="${org.id}" ${!attackAvailable||state.player.cash<cost?'disabled':''}>${attackAvailable?'Attack':'Available tomorrow'}</button></td></tr>`;
        }).join('')}
      </table>
    </div>`;
  }else{
    html+=`<div class="card muted">Control one organization at a time. The acquisition price includes its strategic network value. Its treasury transfers as working capital; acquisition also charges integration costs and requires an operating reserve to remain in your cash.</div>
      <div class="card"><table><tr><th>Organization</th><th>Properties</th><th>Daily property income</th><th>Treasury</th><th>Purchase</th><th>Integration</th><th>Operating reserve</th><th>Liquidity required</th><th></th></tr>
        ${state.organizations.map(org=>{
          const requirements=organizationAcquisitionRequirements(org);
          const income=(org.properties||[]).reduce((sum,property)=>sum+organizationPropertyIncome(property),0);
          return `<tr><td>${esc(org.name)}</td><td>${(org.properties||[]).length}</td><td>${fmtMoney(income)}</td><td>${fmtMoney(org.treasury||0)}</td>
            <td>${fmtMoney(requirements.acquisition)}</td><td>${fmtMoney(requirements.integration)}</td><td>${fmtMoney(requirements.operatingReserve)}</td><td>${fmtMoney(requirements.requiredLiquidity)}</td>
            <td class="right"><button class="sm primary" data-act="acquireorg" data-org="${org.id}" ${state.player.cash<requirements.requiredLiquidity?'disabled':''}>Acquire</button></td></tr>`;
        }).join('')}
      </table></div>`;
  }
  html+=`<h2 class="sect">Independent Organizations</h2>
  <div class="card muted">Pay a one-time cooperation fee to establish a direct partnership. Partners can buy inventory shipments at negotiated market prices, and may offer recurring contracts.</div>`;
  const known = state.organizations.filter(o=>o.known&&o.id!==controlled?.orgId);
  const unknown = state.organizations.filter(o=>!o.known&&o.id!==controlled?.orgId);

  if(known.length === 0){
    html += `<div class="card muted">You have no established contacts yet.</div>`;
  } else {
    for(const o of known){
      const contracts = state.contracts.filter(c=>c.orgId===o.id && c.status==='active');
      const shipments = state.shipments.filter(s=>s.organizationSale && s.orgId===o.id && s.status==='scheduled');
      html += `<div class="card" style="margin-bottom:10px">
        <div class="flexrow">
          <h3 style="margin:0">${esc(o.name)}</h3>
          <span class="pill">Leader: ${esc(o.leader)}</span>
          <span class="spacer"></span>
          <span class="pill">${relState(o.relationship)}</span>
        </div>
        <div class="sep"></div>
        <div class="grid g3">
          <div>
            <div class="row"><span class="k">Members</span><span>${o.members.length}</span></div>
            <div class="row"><span class="k">Weekly demand</span><span>${o.demand.toFixed(0)} units</span></div>
            <div class="row"><span class="k">Reach</span><span>${o.reach}/4</span></div>
            <div class="row"><span class="k">Headquarters distance</span><span>${o.distanceKm||100} km one way</span></div>
          </div>
          <div>
            <div class="row"><span class="k">Reliability</span><span>${o.reliability}</span></div>
            <div class="row"><span class="k">Relationship</span><span>${o.relationship.toFixed(0)}/100</span></div>
            ${bar(o.relationship, o.relationship>70?'g':o.relationship>40?'y':'r')}
          </div>
          <div>
            <div class="row"><span class="k">Active contracts</span><span>${contracts.length}</span></div>
            <div class="row"><span class="k">Total traded</span><span>${fmtMoney(o.totalTraded)}</span></div>
          </div>
        </div>
        ${contracts.length ? `<div class="sep"></div>${contracts.map(c=>`<div class="row"><span class="k">Contract</span><span>${c.qtyPerPeriod}u / ${c.periodDays}d · min ${c.minGrade}</span></div>`).join('')}` : ''}
        ${shipments.length ? `<div class="sep"></div>${shipments.map(s=>`<div class="row"><span class="k">In transit</span><span>${formatMass(s.quantityGrams)} · ${minutesToClock(s.duration-s.elapsed)} remaining</span></div>`).join('')}` : ''}
        <div class="sep"></div>
        <button class="sm primary" data-act="orgsalemodal" data-org="${o.id}" ${state.inventory.length===0||!state.vehicles.some(vehicleAvailable)?'disabled':''}>Ship inventory for sale</button>
      </div>`;
    }
  }

  if(unknown.length > 0){
    html += `<h2 class="sect">Unknown Contacts</h2>
    <div class="card"><table><tr><th>Organization</th><th>Demand</th><th>Reach</th><th>One-time fee</th><th></th></tr>
      ${unknown.map(o=>{
        const fee=organizationCooperationCost(o);
        return `<tr><td>${esc(o.name)}</td><td>${o.demand.toFixed(0)} units/week</td><td>${o.reach}/4</td><td>${fmtMoney(fee)}</td>
          <td class="right"><button class="sm primary" data-act="cooperateorg" data-org="${o.id}" ${state.player.cash<fee?'disabled':''}>Cooperate</button></td></tr>`;
      }).join('')}
    </table></div>`;
  }

  return html;
}

function renderDistribution(){
  const facility=distributionFacility();
  const capacity=distributionCapacity();
  let html=`<h2 class="sect">Channel Distribution</h2>`;
  if(!facility){
    return html+`<div class="card muted">Channel Distribution is not available yet. A safe migration adds Level 1 automatically.</div>`;
  }
  html+=`<div class="card">
    <div class="row"><span class="k">Channel Distribution</span><span>Level ${facility.level}</span></div>
    <div class="row"><span class="k">Capacity</span><span>${capacity} prospects</span></div>
    <div class="row"><span class="k">Prospects active</span><span>${state.potentialCustomers.length}</span></div>
    <div class="row"><span class="k">Customers</span><span>${state.customers.length}</span></div>
    <div class="sep"></div>
    <div class="flexrow">
      ${REGIONS.map(r=>`<button class="sm" data-act="customersearch" data-region="${r.id}" ${state.potentialCustomers.length>=capacity?'disabled':''}>Search ${esc(r.name)}</button>`).join('')}
      <span class="spacer"></span>
      <button class="sm primary" data-act="build" data-type="distribution" ${state.player.cash<facilityBuildCost('distribution')?'disabled':''}>Upgrade</button>
    </div>
  </div>`;

  html+=`<h2 class="sect">Prospects</h2>`;
  if(state.potentialCustomers.length===0){
    html+=`<div class="card muted">No prospects found. Search a region to build the list.</div>`;
  }else{
    html+=`<div class="card"><table><tr><th>Name</th><th>Location</th><th>Requested grade</th><th></th></tr>
      ${state.potentialCustomers.map(p=>`<tr>
        <td>${esc(p.name)}</td><td>${esc(REGIONS.find(r=>r.id===p.region)?.name||p.region)}</td>
        <td>${gradeTag(p.preferredGrade)}</td>
        <td class="right"><button class="sm primary" data-act="samplemodal" data-prospect="${p.id}" ${state.inventory.length===0?'disabled':''}>Give sample</button></td>
      </tr>`).join('')}
    </table></div>`;
  }

  html+=`<h2 class="sect">Customers</h2>`;
  if(state.customers.length===0){
    html+=`<div class="card muted">No customers yet.</div>`;
  }else{
    html+=`<div class="card"><table><tr><th>Name</th><th>Location</th><th>Requested grade</th><th>Loyalty</th><th>Orders</th><th>Connected organization</th></tr>
      ${state.customers.map(c=>{
        const org=state.organizations.find(o=>o.id===c.connectedOrgId);
        return `<tr><td>${esc(c.name)}</td><td>${esc(REGIONS.find(r=>r.id===c.region)?.name||c.region)}</td>
          <td>${gradeTag(c.preferredGrade)}</td><td>${c.addiction.toFixed(0)}/100 ${bar(c.addiction,c.addiction>=70?'g':c.addiction>=40?'y':'r')}</td>
          <td>${c.ordersCompleted}</td><td>${org&&org.known?esc(org.name):'<span class="dim2">Undiscovered</span>'}</td></tr>`;
      }).join('')}
    </table></div>`;
  }
  return html;
}

function renderMessages(){
  let html=`<h2 class="sect">Incoming Messages</h2>`;
  if(state.messages.length===0){
    html+=`<div class="card muted">No messages yet.</div>`;
  }else{
    html+=state.messages.slice(0,100).map(m=>{
      const remaining=m.deadlineMinute-state.time.minutes;
      return `<div class="card" style="margin-bottom:9px">
        <div class="flexrow"><h3 style="margin:0">${esc(m.customerName)}</h3><span class="pill">${m.status.toUpperCase()}</span><span class="spacer"></span>
          ${m.status==='new'?`<span class="warn">reply within ${minutesToClock(remaining)}</span>`:''}
          <button class="sm danger" data-act="deletemessage" data-message="${m.id}" aria-label="Delete message from ${esc(m.customerName)}">Delete</button></div>
        <div class="sep"></div>
        <div class="row"><span class="k">Order request</span><span>${formatMass(m.qty)} · minimum ${gradeTag(m.grade)}</span></div>
        <div class="row"><span class="k">Requested price</span><span>${fmtMoney(m.quotedPrice)}/g</span></div>
        <div class="row"><span class="k">Requested order value</span><span>${fmtMoney(m.qty*m.quotedPrice)}</span></div>
        ${m.status==='new'?`<div class="flexrow"><span class="spacer"></span><button class="primary" data-act="negotiate" data-message="${m.id}">Negotiate / accept</button></div>`:''}
      </div>`;
    }).join('');
  }

  const active=state.customerOrders.filter(o=>o.status==='active');
  html+=`<h2 class="sect">Customer Orders</h2>`;
  if(active.length===0){
    html+=`<div class="card muted">No open customer orders.</div>`;
  }else{
    html+=active.map(o=>`<div class="card" style="margin-bottom:9px">
      <div class="flexrow"><h3 style="margin:0">${esc(o.customerName)}</h3><span class="spacer"></span>
        <span class="${o.deadlineMinute-state.time.minutes<MINUTES_PER_DAY?'warn':''}">due in ${minutesToClock(o.deadlineMinute-state.time.minutes)}</span></div>
      <div class="row"><span class="k">Remaining</span><span>${formatMass(o.remainingQty)} / ${formatMass(o.qty)} · grade ${gradeTag(o.grade)}+</span></div>
      <div class="row"><span class="k">Negotiated price</span><span>${fmtMoney(o.agreedPrice)}/g</span></div>
      <div class="row"><span class="k">Total order value</span><span>${fmtMoney(o.qty*o.agreedPrice)}</span></div>
      <div class="row"><span class="k">Delivered value</span><span>${fmtMoney(o.value)}</span></div>
      <div class="flexrow"><span class="spacer"></span><button class="sm good" data-act="deliverymodal" data-order="${o.id}" ${state.inventory.length===0?'disabled':''}>Deliver units</button></div>
    </div>`).join('');
  }
  return html;
}

      <tr><th>Name</th><th>Capacity</th><th>Usable</th><th>Speed</th><th>Fuel/km</th><th>Durability</th><th>Maintenance/day</th><th>Resale</th><th></th></tr>

      </tr>`).join('')}
    </table></div>`;
  }

  html += `<h2 class="sect">Vehicle Market</h2>
  <div class="card"><table>
    <tr><th>Model</th><th>New</th><th>Used</th><th>Max payload</th><th>Maintenance / day</th><th>Purchase</th></tr>
    ${VEHICLE_TYPES.map(v=>`<tr>
      <td>${esc(v.name)}</td><td>${fmtMoney(v.cost)}</td><td>${fmtMoney(v.used[0])}–${fmtMoney(v.used[1])}</td><td>${formatMass(v.capacity)}</td>

    </tr>`).join('')}

  return html;

/* ---------- FACILITIES ---------- */

function renderFacilities(){
  const growLevels = state.facilities.filter(f=>f.type==='grow').reduce((sum,f)=>sum + (Number(f.level)||0), 0);
  const buildable=FACILITY_TYPES.filter(f=>!['distribution','grow'].includes(f.id)||!state.facilities.some(current=>current.type===f.id));
  return `<h2 class="sect">Facilities</h2>
    <div class="grid g2">
      <div class="card"><div class="lbl">Storage</div><div class="mid">${formatMass(storageCapacity())}</div></div>
      <div class="card"><div class="lbl">Drying WIP</div><div class="mid">${formatMass(dryingCapacity())}</div></div>
      <div class="card"><div class="lbl">Processing WIP</div><div class="mid">${formatMass(processingCapacity())}</div></div>
      <div class="card"><div class="lbl">Garden expansion</div><div class="mid">L${growLevels}/100 · ${((1+0.20*growLevels)*100).toLocaleString('en-US')}%</div></div>
    </div>
    <h2 class="sect">Installed Facilities</h2>
    ${state.facilities.length===0?'<div class="card muted">No facilities installed.</div>':`<div class="card"><div class="facility-list-scroll"><table>
      <tr><th>Facility</th><th>Level</th><th>Effect</th><th>Upkeep / day</th><th></th></tr>
      ${state.facilities.map(f=>{
        const max=FACILITY_MAX_LEVEL[f.type]||1;
        const cost=facilityUpgradeCost(f);
        return `<tr><td>${esc(f.name)}</td><td>L${f.level}/${max}</td><td>${facilityEffect(f)}</td><td>${fmtMoney(f.upkeepPerDay)}</td>
          <td class="right"><button class="sm primary" data-act="upgradefacility" data-facility="${f.id}" ${f.level>=max||state.player.cash<cost?'disabled':''}>${f.level>=max?'Max level':`Upgrade · ${fmtMoney(cost)}`}</button></td></tr>`;
      }).join('')}
    </table></div></div>`}
    <h2 class="sect">Build Facility</h2>
    <div class="card"><table>
      <tr><th>Facility</th><th>Cost</th><th>Upkeep / day</th><th>Effect</th><th></th></tr>
      ${buildable.map(f=>`<tr><td>${esc(f.name)}</td><td>${fmtMoney(f.cost)}</td><td>${fmtMoney(f.upkeep)}</td><td class="dim2">${esc(f.desc)}</td>
        <td class="right"><button class="sm primary" data-act="build" data-type="${f.id}" ${state.player.cash<f.cost?'disabled':''}>Build</button></td></tr>`).join('')}
    </table></div>`;
}

/* ---------- FINANCES ---------- */

function renderFinances(){
  const ranges = [
    { label:'Today', days:1 },
    { label:'7 Days', days:7 },
    { label:'30 Days', days:30 },
    { label:'90 Days', days:90 },
    { label:'All Time', days:99999 }
  ];

  let html = `<h2 class="sect">Cash Flow</h2><div class="card"><table>
    <tr><th>Period</th><th>Revenue</th><th>Expenses</th><th>Net</th></tr>
    ${ranges.map(r=>{
      const s = sumLedger(ledgerSince(r.days));
      return `<tr>
        <td>${r.label}</td>
        <td class="good">+${fmtMoney(s.inc)}</td>
        <td class="bad">-${fmtMoney(s.exp)}</td>
        <td class="${s.net>=0?'good':'bad'}">${s.net>=0?'+':''}${fmtMoney(s.net)}</td>
      </tr>`;
    }).join('')}
  </table></div>

  <h2 class="sect">Balance</h2>
  <div class="grid g2">
    <div class="card">
      <div class="lbl">Cash</div>
      <div class="big ${state.player.cash<0?'bad':'good'}">${fmtMoney(state.player.cash)}</div>
      <div class="sep"></div>
      <div class="row"><span class="k">Inventory value</span><span>${fmtMoney(inventoryValue())}</span></div>
      <div class="row"><span class="k">Debt</span><span class="bad">${fmtMoney(state.player.debt)}</span></div>
    </div>
    <div class="card">
      <div class="lbl">Loans</div>
      <div class="sep"></div>
      <div class="row"><span class="k">Outstanding</span><span>${fmtMoney(state.player.debt)}</span></div>
      <div class="row"><span class="k">Daily interest</span><span>0.16%</span></div>
      <div class="sep"></div>
      <div class="flexrow">
        <button class="sm" data-act="loan" data-amt="10000">Borrow ${fmtMoney(10000)}</button>
        <button class="sm" data-act="loan" data-amt="25000">Borrow ${fmtMoney(25000)}</button>
        <button class="sm" data-act="repayall">Repay all</button>
      </div>
    </div>
  </div>

  <h2 class="sect">Ledger</h2>
  <div class="card"><table>
    <tr><th>Day</th><th>Time</th><th>Category</th><th>Note</th><th class="right">Amount</th></tr>
    ${state.ledger.slice(0,80).map(l=>{
      const t = String(Math.floor(l.minute/60)%24).padStart(2,'0')+':'+String(Math.floor(l.minute%60)).padStart(2,'0');
      return `<tr>
        <td>${l.day}</td><td>${t}</td><td>${l.cat}</td>
        <td>${esc(l.note)}</td>
        <td class="right ${l.amount>=0?'good':'bad'}">${l.amount>=0?'+':''}${fmtMoney(l.amount)}</td>
      </tr>`;
    }).join('')}
  </table></div>`;

  return html;
}

function openModal(title, body, wide){
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-bg" data-act="closemodal-bg">
    <div class="modal" ${wide?'style="max-width:820px"':''}>
      <div class="modal-h"><span>${esc(title)}</span><button data-act="closemodal">✕</button></div>

}

function modalPlant(gardenId){
  const g = getGarden(gardenId);
  if(!g) return;
  const free = gardenFreeCapacity(g);
  const counts = {};
  for(const s of state.seeds) counts[s.genetics] = (counts[s.genetics]||0)+1;
  const avail = GENETICS.filter(x => (counts[x.id]||0) > 0);

  if(avail.length === 0){
    openModal('Plant — ' + g.name, `<div class="muted">You have no seeds. Buy seeds from the PRODUCTION tab.</div>`);
    return;
  }

  let body = `<div class="hint">Garden capacity: ${gardenPlantCount(g)} / ${gardenCapacity(g)} (${free} free)</div>
  <div class="sep"></div>
  <div class="card">
    <div class="row"><span class="k">Genetics</span>

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  // modal background close
  if(el.classList.contains('modal-bg') && e.target === el){ closeModal(); return; }
  if(el.classList.contains('modal-bg')) return;

  switch(act){
    case 'tab':
      if(UI.tab !== el.dataset.tab){
        UI.tab = el.dataset.tab;
        document.getElementById('view').scrollTop = 0;
      }
      render();
      break;
    case 'speed':
      state.speed = Number(el.dataset.v);
      render();
      break;
    case 'gotomarket':
      UI.tab = 'market'; render();
      break;
    case 'gotodistribution':
      UI.tab='distribution'; render();
      break;
    case 'gotocontracts':
      UI.tab='contracts'; render();
      break;
    case 'acquireorg': {
      const org=state.organizations.find(item=>item.id===el.dataset.org);
      if(!org) break;
      const requirements=organizationAcquisitionRequirements(org);
      if(!confirm(`Acquire ${org.name}? Purchase: ${fmtMoney(requirements.acquisition)}; integration: ${fmtMoney(requirements.integration)}; operating reserve that must remain available: ${fmtMoney(requirements.operatingReserve)}. Total required liquidity: ${fmtMoney(requirements.requiredLiquidity)}. You can control only one organization.`)) break;
      const result=acquireOrganization(org.id);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'withdraworgfunds': {
      const result=withdrawOrganizationFunds();
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'attackorg': {
      const target=state.organizations.find(item=>item.id===el.dataset.org);
      if(!target) break;
      const cost=organizationAttackCost(target);
      const chance=organizationAttackChance(target);
      if(!confirm(`Spend ${fmtMoney(cost)} to attack ${target.name}? Estimated success chance: ${(chance*100).toFixed(0)}%.`)) break;
      const result=attackOrganization(target.id);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'cooperateorg': {
      const org=state.organizations.find(o=>o.id===el.dataset.org);
      if(!org) break;
      const fee=organizationCooperationCost(org);
      if(!confirm(`Pay ${fmtMoney(fee)} once to establish cooperation with ${org.name}?`)) break;
      const result=cooperateWithOrganization(org.id);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'orgsalemodal':
      modalOrganizationSale(el.dataset.org);
      break;
    case 'orgsale':
    case 'orgsaleall': {
      const stackId=document.getElementById('orgSaleStack').value;
      const vehicleId=document.getElementById('orgSaleVehicle').value;
      const stack=state.inventory.find(s=>s.id===stackId);
      const vehicle=state.vehicles.find(v=>v.id===vehicleId);
      const quantity=act==='orgsaleall' && stack && vehicle
        ? Math.min(stack.qty,Math.floor(vehicleUsableCapacity(vehicle)))
        : document.getElementById('orgSaleQty').value;
      const result=sellToOrganization(el.dataset.org,
        stackId,
        quantity,
        vehicleId,
        document.getElementById('orgSaleDriver').value,
        document.getElementById('orgSaleSecurity').value);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'productmodal':
      modalProduct(el.dataset.recipe);
      break;
    case 'makeproduct': {
      const recipe=PRODUCT_RECIPES.find(r=>r.id===el.dataset.recipe);
      const stack=state.inventory.find(s=>s.id===document.getElementById('productStack').value);
      const priceMode=document.getElementById('productPriceMode').value;
      const price=priceMode==='market' && recipe && stack ? productMarketPrice(recipe,stack.grade) : document.getElementById('productPrice').value;
      const result=manufactureProduct(el.dataset.recipe,document.getElementById('productStack').value,document.getElementById('productQty').value,document.getElementById('productName').value,price);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'fertilizerModal':
      modalFertilizer(el.dataset.stack);
      break;
    case 'makefertilizer': {
      const result=makeFertilizer(el.dataset.stack,document.getElementById('fertQty').value);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'wholesaleupgrade': {
      const result=upgradeWholesale();
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'wholesalestock': {
      const index=Number(el.dataset.slot);
      const result=stockWholesale(index,document.getElementById(`whProduct_${index}`).value,document.getElementById(`whQty_${index}`).value);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'recruitdealer': {
      const result=recruitDealer(el.dataset.candidate);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'transferdealerstock': {
      const dealerId=el.dataset.dealer;
      const source=document.getElementById(`dealerSource_${dealerId}`).value;
      const [sourceType,...sourceId]=source.split(':');
      const quantity=document.getElementById(`dealerQty_${dealerId}`).value;
      const result=transferDealerStock(dealerId,sourceType,sourceId.join(':'),quantity);
      if(!result.ok){ alert(result.msg); return; }
      save(); render();
      break;
    }
    case 'transferalldealerstock': {
      const dealerId=el.dataset.dealer;
      const source=document.getElementById(`dealerSource_${dealerId}`).value;
      const [sourceType,...sourceId]=source.split(':');
      const result=transferAllDealerStock(dealerId,sourceType,sourceId.join(':'));
      if(!result.ok){ alert(result.msg); return; }
      save(); render();
      break;
    }
    case 'releasedealer':
      releaseDealer(el.dataset.dealer);
      save(); render();
      break;
    case 'customersearch':
      searchPotentialCustomers(el.dataset.region);
      save(); render();
      break;
    case 'samplemodal':
      modalSample(el.dataset.prospect);
      break;
    case 'sampleunit': {
      const result=samplePotentialCustomer(el.dataset.prospect,document.getElementById('sampleStack').value);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'negotiate':
      modalCustomerNegotiation(el.dataset.message);
      break;
    case 'acceptcustomer': {
      const price=document.getElementById('customerPrice').value;
      const result=acceptCustomerMessage(el.dataset.message,price);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'deliverymodal':
      modalCustomerDelivery(el.dataset.order);
      break;
    case 'delivercustomer': {
      const stackId=document.getElementById('customerDeliveryStack').value;
      const qty=document.getElementById('customerDeliveryQty').value;
      const result=deliverCustomerOrder(el.dataset.order,stackId,qty);
      if(!result.ok){ alert(result.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'deletemessage':
      state.messages = state.messages.filter(m=>m.id!==el.dataset.message);
      save(); render();
      break;
    case 'closemodal':
      closeModal();
      break;

    /* --- gardens --- */
    case 'plant':
      modalPlant(el.dataset.garden);
      break;
    case 'doplant': {
      const gid = el.dataset.garden;
      const genId = document.getElementById('plantGen').value;
      const qty = parseInt(document.getElementById('plantQty').value, 10) || 0;
      const care = document.getElementById('plantCare').value;
      const g = getGarden(gid);
      const free = gardenFreeCapacity(g);
      const n = Math.min(qty, free);
      if(n <= 0){ alert('Invalid quantity.'); return; }
      const pool = state.seeds.filter(s=>s.genetics===genId).slice(0, n);
      if(pool.length < n){ alert('Not enough seeds of that genetics.'); return; }
      const ids = pool.map(s=>s.id);
      const res = startBatch(gid, ids, care);
      if(!res.ok){ alert(res.msg); return; }
      closeModal();
      save();
      render();
      break;
    }
    case 'upgrade':
      actUpgradeEquipment(el.dataset.garden, el.dataset.slot);
      save(); render();
      break;
    case 'buygarden':
      actBuyGarden(el.dataset.region, el.dataset.profile);
      save(); render();
      break;

    /* --- supplies --- */
    case 'buyfert':
      actBuySupply('fertilizer', Number(el.dataset.qty));
      save(); render();
      break;
    case 'buymed':
      actBuySupply('medium', Number(el.dataset.qty));
      save(); render();
      break;
    case 'buyseed':
      actBuySeeds(el.dataset.gen, Number(el.dataset.pouches));
      save(); render();
      break;

    /* --- drying / processing --- */
    case 'drymodal':
      modalDry(el.dataset.stack);
      break;
    case 'dodry': {
      const mode = document.getElementById('dryMode').value;
      const qty = parseInt(document.getElementById('dryQty').value, 10) || 0;
      const res = startDrying(el.dataset.stack, qty, mode);
      if(!res.ok){ alert(res.msg); return; }
      closeModal(); save(); render();
      break;
    }
    case 'procmodal':
      modalProcess(el.dataset.stack);
      break;
    case 'doproc': {
      const rec = document.getElementById('procRecipe').value;
      const qty = parseInt(document.getElementById('procQty').value, 10) || 0;
      const res = startProcessing(el.dataset.stack, qty, rec);
      if(!res.ok){ alert(res.msg); return; }
      closeModal(); save(); render();
      break;
    }

    /* --- contracts --- */
    case 'acceptoffer':
      acceptOffer(el.dataset.offer,document.getElementById(`contractVehicle_${el.dataset.offer}`)?.value);
      save(); render();
      break;
    case 'declineoffer':
      declineOffer(el.dataset.offer);
      save(); render();
      break;

    /* --- people --- */
    case 'hire':
      hireCandidate(el.dataset.cand);
      save(); render();
      break;
    case 'fire':
      if(confirm('Let this person go?')){ firePerson(el.dataset.person); save(); render(); }
      break;

    /* --- vehicles / facilities --- */
    case 'buyvehicle':
      actBuyVehicle(el.dataset.type,el.dataset.condition||'new');
      save(); render();
      break;
    case 'sellvehicle': {
      const vehicle=state.vehicles.find(item=>item.id===el.dataset.vehicle);
      if(!vehicle) break;
      const resaleValue=vehicleResaleValue(vehicle);
      if(!confirm(`Sell ${vehicle.name} for ${fmtMoney(resaleValue)} at ${Math.round(vehicle.condition*100)}% durability?`)) break;
      const result=sellVehicle(vehicle.id);
      if(!result.ok) alert(result.msg);
      save(); render();
      break;
    }
    case 'upgradefacility':
      actUpgradeFacility(el.dataset.facility);
      save(); render();
      break;
    case 'build':
      actBuildFacility(el.dataset.type);
      save(); render();
      break;

    /* --- finances --- */
    case 'loan':
      actLoan(Number(el.dataset.amt));
      save(); render();
      break;
    case 'repayall':
      actRepay(state.player.debt);
      save(); render();
      break;

    /* --- settings --- */
    case 'save':
      save(); render();
      break;
    case 'load':
      if(load()){ render(); pushNote('info','Save loaded.'); }
      else alert('No valid save found.');
      break;
    case 'export':
      exportSave();
      break;
    case 'importbtn':
      document.getElementById('importFile').click();
      break;
    case 'reset':
      resetGame();
      break;
    case 'toggleautosave':
      state.settings.autosave = !state.settings.autosave;
      save(); render();
      break;

  }
});

document.addEventListener('change', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act === 'marketprice'){
    if(!setMarketSellPrice(el.dataset.grade,el.value)) return;
    save(); render(true);
  } else if(el.dataset.act === 'productstack'){
    const recipe=PRODUCT_RECIPES.find(r=>r.id===el.dataset.recipe);
    const stack=state.inventory.find(s=>s.id===el.value);
    if(!recipe || !stack) return;
    const quantity=document.getElementById('productQty');
    const max=Math.max(1,Math.floor(stack.qty/recipe.inputQty));
    quantity.max=String(max);
    quantity.value=String(Math.min(Number(quantity.value)||1,max));
    if(document.getElementById('productPriceMode').value==='market'){
      document.getElementById('productPrice').value=String(productMarketPrice(recipe,stack.grade));
    }
  } else if(el.dataset.act === 'productpricemode' && el.value==='market'){
    const recipe=PRODUCT_RECIPES.find(r=>r.id===el.dataset.recipe);
    const stack=state.inventory.find(s=>s.id===document.getElementById('productStack').value);
    if(recipe && stack) document.getElementById('productPrice').value=String(productMarketPrice(recipe,stack.grade));
  } else if(el.dataset.act === 'assign'){
    if(!assignWorker(el.dataset.person, el.value)) alert('A garden can have at most 3 workers.');
    save(); render(true);
  } else if(el.dataset.act === 'jobtype'){
    if(!setWorkerJob(el.dataset.person, el.value)) alert('This garden already has 3 workers.');
    save(); render(true);
  } else if(el.dataset.act === 'sellerjob'){
    const person = state.people.find(p=>p.id===el.dataset.person);
    if(person) person.jobType = el.value;
    save(); render(true);
  } else if(el.dataset.act === 'jobfield'){
    const person = state.people.find(p=>p.id===el.dataset.person);
    if(!person) return;
    if(el.dataset.field==='gardenId'){
      if(!assignWorker(person.id,el.value)) alert('A garden can have at most 3 workers.');
    } else if(['seedGenetics','carePackage','dryGrade','dryMode','dryQuantity','sellGrade','sellRule','productRecipeId','restockState','restockGrade'].includes(el.dataset.field)){
      person[el.dataset.field] = el.value;
      if(['restockState','restockGrade'].includes(el.dataset.field)){
        person.restockNextMinute=state.time.minutes;
        person.restockDealerId=null;
      }
    } else if(el.dataset.field==='sellMinPrice'){
      person.sellMinPrice = Math.max(0,Number(el.value)||0);
    }
    save(); render(true);
  } else if(el.dataset.act === 'profilefield'){
    const field=el.dataset.field;
    if(['name','organizationName'].includes(field)){
      state.player[field]=String(el.value||'').trim().slice(0,field==='name'?40:48)||(field==='name'?'Operador':'Los Cabrones');
    }
    save(); render(true);
  } else if(el.dataset.act === 'controlledorgname'){
    setControlledOrganizationName(el.value);
    save(); render(true);
  } else if(el.dataset.act === 'orgsaleconfig'){
    const controlled=state.controlledOrganization;
    const slot=controlled?.saleSlots[Number(el.dataset.slot)];
    if(!slot) return;
    if(el.dataset.field==='state'&&['raw','dried','processed','any'].includes(el.value)) slot.state=el.value;
    if(el.dataset.field==='grade'&&['any',...GRADES].includes(el.value)) slot.grade=el.value;
    if(el.dataset.field==='dailyLimit') slot.dailyLimit=clamp(Math.floor(Number(el.value)||0),0,1000000);
    save(); render(true);
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'importFile'){
    const f = e.target.files[0];
    if(f) importSave(f);
    e.target.value = '';
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
  if(e.code === 'Space' && !e.target.matches('input,select,textarea')){
    e.preventDefault();
    state.speed = state.speed === 0 ? 1 : 0;
    render();
  }
});

/* ============================================================================
   SECTION: INITIALIZATION
   ============================================================================ */

function boot(){
  if(!load()){
    state = createGame();
    pushNote('info', 'Welcome. You are an independent producer with a small garden, some seeds and MX$15,000.');
    pushNote('info', 'Buy seeds and fertilizer in PRODUCTION, then plant in GARDENS.');
    save();
  }
  refreshCandidates();
  render();
  requestAnimationFrame(function(t){ lastFrame = t; requestAnimationFrame(loop); });
}

boot();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOS CABRONES v1.1.5</title>
<style>
:root{
  --bg:#0e1014; --panel:#161a22; --panel2:#1c2129; --panel3:#232935;
  --border:#2a313d; --txt:#d7dde7; --dim:#8791a1; --dim2:#5f6877;
  --accent:#4ea1ff; --good:#3fbf78; --bad:#e2564d; --warn:#e0a83c; --purple:#a97bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;font-size:12.5px;line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer;border-radius:3px;border:1px solid var(--border);
  background:var(--panel3);color:var(--txt);padding:4px 9px;transition:background .1s}
button:hover:not(:disabled){background:#2e3644}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:#1d4d80;border-color:#2a6bb0}
button.primary:hover:not(:disabled){background:#22598f}
button.good{background:#1c4a30;border-color:#2c7a4c}
button.good:hover:not(:disabled){background:#22583a}
button.danger{background:#4a1f1c;border-color:#7a302b}
button.danger:hover:not(:disabled){background:#5a2622}
button.sm{padding:2px 6px;font-size:11px}
input,select{font-family:inherit;font-size:inherit;background:#0c0e12;color:var(--txt);
  border:1px solid var(--border);border-radius:3px;padding:3px 6px}
input[type=number]{width:80px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0b0d11}
::-webkit-scrollbar-thumb{background:#2b323e;border-radius:4px}

body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
#topbar{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#12161d;
  border-bottom:1px solid var(--border);flex-wrap:wrap;flex:0 0 auto}
#topbar .brand{font-weight:bold;letter-spacing:1px;color:var(--accent);font-size:13px}
#topbar .clock{color:var(--txt);min-width:210px}
#topbar .cash{color:var(--good);font-weight:bold}
#topbar .cash.neg{color:var(--bad)}
.spd{display:flex;gap:2px}
.spd button{padding:2px 7px;font-size:11px;min-width:34px}
.spd button.on{background:#1d4d80;border-color:#3a7cc0;color:#fff}
#saveInd{color:var(--dim2);font-size:11px}

/* LAYOUT */
#layout{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:176px minmax(0,1fr) 292px;overflow:hidden}
#nav{overflow-y:auto;border-right:1px solid var(--border);padding:8px;background:#101319}
#nav button{display:block;width:100%;text-align:left;margin-bottom:3px;background:transparent;border:1px solid transparent;
  color:var(--dim);padding:6px 9px;font-size:12px;letter-spacing:.4px}
#nav button:hover{background:#1a1f28;color:var(--txt)}
#nav button.on{background:#1b2733;border-color:#2c4a68;color:#8fc4ff}
#nav .badge{float:right;background:#7a302b;color:#fff;border-radius:8px;padding:0 5px;font-size:10px}
#view{min-height:0;overflow-y:auto;padding:12px 14px}
#feed{overflow-y:auto;border-left:1px solid var(--border);padding:8px;background:#101319}

/* CARDS */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:10px 12px}
.card h3{margin:0 0 8px 0;font-size:12px;letter-spacing:1px;color:var(--accent);text-transform:uppercase;font-weight:600}
.card .lbl{color:var(--dim);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
.card .big{font-size:20px;font-weight:bold;letter-spacing:-.5px}
.card .mid{font-size:15px;font-weight:bold}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.row .k{color:var(--dim)}
.sep{height:1px;background:var(--border);margin:7px 0}
.muted{color:var(--dim)}
.dim2{color:var(--dim2)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .pur{color:var(--purple)}
.right{text-align:right}
.nowrap{white-space:nowrap}

h2.sect{font-size:13px;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase;
  margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
h2.sect:first-child{margin-top:0}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:normal;font-size:10.5px;letter-spacing:.7px;
  text-transform:uppercase;border-bottom:1px solid var(--border);padding:4px 6px}
td{padding:3px 6px;border-bottom:1px solid #1d222b}
tr:hover td{background:#1a1f28}

.bar{height:7px;background:#0b0e13;border:1px solid #262d38;border-radius:4px;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2a6bb0,#4ea1ff)}
.bar.g > i{background:linear-gradient(90deg,#2c7a4c,#3fbf78)}
.bar.y > i{background:linear-gradient(90deg,#8a6a1e,#e0a83c)}
.bar.r > i{background:linear-gradient(90deg,#7a302b,#e2564d)}

.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10.5px;letter-spacing:.5px;border:1px solid}
.tag.S{color:#ffd76e;border-color:#6b5a1e;background:#2a2410}
.tag.A{color:#7be08c;border-color:#245c33;background:#0f2416}
.tag.B{color:#6fc2ff;border-color:#1f4a70;background:#0d1c2a}
.tag.C{color:#c3a0ff;border-color:#453070;background:#180f28}
.tag.D{color:#9aa3b1;border-color:#3a4150;background:#161a21}

.note{padding:4px 7px;border-left:3px solid var(--border);margin-bottom:4px;background:#12161d;border-radius:0 3px 3px 0;font-size:11.5px}
.note.info{border-color:#3a7cc0}
.note.warn{border-color:#8a6a1e}
.note.important{border-color:#a33c33}
.note.financial{border-color:#2c7a4c}
.note .t{color:var(--dim2);font-size:10px}

#modal{display:none;position:fixed;inset:0;z-index:50}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:5px;max-width:660px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);
  font-weight:bold;letter-spacing:1px;color:var(--accent);text-transform:uppercase;font-size:12px}
.modal-b{padding:13px;overflow-y:auto}
.modal-b .card{margin-bottom:9px}

.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;background:var(--panel3);border:1px solid var(--border);color:var(--dim)}
.hint{color:var(--dim2);font-size:11px;margin-top:4px}
.flexrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
hr{border:none;border-top:1px solid var(--border);margin:9px 0}
.facility-list-scroll{overflow-x:auto}
.facility-list-scroll table{min-width:620px}

@media (max-width:1080px){
  #layout{grid-template-columns:150px minmax(0,1fr)}
  #feed{display:none}
}
@media (max-width:720px){
  #layout{grid-template-columns:1fr}
  #nav{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:5px}
  #nav button{width:auto;white-space:nowrap;margin:0 3px 0 0}
}
</style>
</head>

function fmtMoney(v){
  const n = Math.round(v);

}
function formatMass(grams){
  const n = Number.isFinite(grams) ? Math.max(0, Math.round(grams)) : 0;
  if(n < 1000) return `${n.toLocaleString('en-US')} g`;
  if(n < 1000000){
    const kg = n / 1000;
    const digits = kg >= 100 ? 1 : 2;
    return `${kg.toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:digits})} kg`;
  }
  const t = n / 1000000;
  const digits = t >= 10 ? 1 : 2;
  return `${t.toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:digits})} t`;
}
function esc(s){ return String(s).replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function canAddGarden(){
  return !!state && Array.isArray(state.gardens) && state.gardens.length < MAX_GARDENS;
}

function gardenExpansionLevel(g){
  const overall = Array.isArray(state?.facilities)
    ? state.facilities.filter(f => f.type === 'grow').reduce((sum, f) => sum + (Number(f.level) || 0), 0)
    : 0;
  const local = Number(g && g.expansionLevel);
  const level = Number.isFinite(local) && local >= 0 ? local : overall;
  return clamp(Math.round(level), 0, GARDEN_EXPANSION_MAX_LEVEL);
}

function makeGarden(name, regionId, profileId){
  const region = REGIONS.find(r=>r.id===regionId) || REGIONS[1];
  const profile = GARDEN_PROFILES.find(p=>p.id===profileId) || GARDEN_PROFILES[1];
  const baseCapacity = profile.capacity;
  return {
    id: uid('gar'),
    name, region: region.id,
    profile: profile.id,
    baseCapacity,
    capacity: baseCapacity,
    expansionLevel: 0,
    cycleHours: profile.cycleHours,
    condition: profile.condition,
    equipment: { light:1, water:1, vent:1 },
    workers: [],
    laborNeed: Math.max(1, Math.ceil(baseCapacity / 30)),
    maintenancePerDay: profile.maintenance,
    totalProduced: 0,
    totalCost: 0,
    createdMinute: 0
  };
}

function makeCandidate(){
  const role = pick(['worker','worker','worker','technician','seller','driver','security','restocker']);
  const base = role==='worker' ? randRange(315,420) : role==='technician' ? randRange(480,650) : role==='driver' ? randRange(520,760) : role==='security' ? randRange(450,700) : role==='restocker' ? randRange(380,540) : randRange(430,620);
  return {
    id: uid('cand'),
    name: PERSON_NAMES[Math.floor(Math.random()*PERSON_NAMES.length)],
    role,
    reliability: randInt(45,95),
    skill: randInt(35,92),
    wage: Math.round(base),
    relationship: randInt(30,60)
  };
}

function addSeedPouch(g, geneticsId, pouches){
  const gen = geneticsById(geneticsId);
  for(let p=0;p<pouches;p++){
    for(let i=0;i<10;i++){
      const expectedYield = randRange(gen.expectedYieldBase * 0.78, gen.expectedYieldBase * 1.22);
      g.seeds.push({
        id: uid('seed'),
        genetics: gen.id,
        qualityPotential: randRange(gen.pot[0], gen.pot[1]),
        expectedYield: Math.round(expectedYield),
        uniformityPotential: randRange(gen.uniformityPotential[0], gen.uniformityPotential[1])
      });
    }
  }
}

function dayOf(){ return Math.floor(state.time.minutes / MINUTES_PER_DAY) + 1; }
function hourOf(){ return Math.floor((state.time.minutes % MINUTES_PER_DAY)/60); }
function minuteOf(){ return Math.floor(state.time.minutes % 60); }
function dayIndex(){ return Math.floor(state.time.minutes / MINUTES_PER_DAY); }
function seasonOf(){
  const d = (dayOf()-1) % 360;
  return SEASONS[Math.floor(d/90)];
}
function dowOf(){ return DOW[(dayOf()-1)%7]; }
function timeString(){
  return String(hourOf()).padStart(2,'0')+':'+String(minuteOf()).padStart(2,'0');
}
function minutesToClock(mins){
  const h = Math.floor(mins/60), m = Math.floor(mins%60);
  return (h>0 ? h+'h ' : '') + m + 'm';
}

let lastFrame = performance.now();
let uiAccum = 0;
let saveAccum = 0;

function loop(now){
  const dtReal = Math.min((now - lastFrame)/1000, 0.5);
  lastFrame = now;
  if(state && state.speed > 0){
    simulate(dtReal * state.speed); // 1 real second = 1 game minute at 1x
  }
  uiAccum += dtReal;
  if(uiAccum > 0.45){ uiAccum = 0; render(); }
  saveAccum += dtReal;
  if(saveAccum > 30){ saveAccum = 0; if(state && state.settings.autosave) save(); }
  requestAnimationFrame(loop);
}

function simulate(gameMinutes){
  const MAX_STEP = 5;
  let rem = gameMinutes;
  let guard = 0;
  while(rem > 0 && guard < 400){
    const step = Math.min(rem, MAX_STEP);
    stepSim(step);
    rem -= step;
    guard++;
  }
}

function stepSim(dt){
  const prevHour = Math.floor(state.time.minutes / 60);
  const prevDay = dayIndex();
  state.time.minutes += dt;
  const newHour = Math.floor(state.time.minutes / 60);
  const newDay = dayIndex();

  processBatches(dt);
  processDrying(dt);
  processProcessing(dt);
  processProductBatches(dt);
  processShipments(dt);
  automateWorkerProduction();
  processContracts();

  for(let hour=prevHour+1; hour<=newHour; hour++) wholesaleHourlyTick();

  if(newDay > prevDay){
    for(let d = prevDay+1; d <= newDay; d++) dailyTick();
  }
}

function ledgerAdd(cat, amount, note){
  state.ledger.unshift({
    id: uid('led'),
    minute: state.time.minutes,
    day: dayOf(),
    cat, amount: Math.round(amount), note
  });
  if(state.ledger.length > 4000) state.ledger.length = 4000;
}
const REPUTATION_TRANSACTION_CATEGORIES = new Set([
  'inputs', 'drying', 'processing', 'production', 'capex', 'dealer',
  'sale', 'customer', 'contract', 'wholesale'
]);
function awardOutcomeReputation(delta, reason){
  if(!Number.isFinite(delta) || delta === 0 || !state || !state.player) return;
  const next = clamp((Number(state.player.reputation) || 1) + Number(delta), 1, 1000);
  state.player.reputation = next;
  if(reason) pushNote('financial', `${reason}: reputation ${delta >= 0 ? '+' : ''}${delta}.`);
}
function rewardTransactionReputation(cat, amount){
  if(!REPUTATION_TRANSACTION_CATEGORIES.has(cat) || !Number.isFinite(amount) || amount <= 0) return;
  let delta = 0;
  if(cat === 'customer') delta = clamp(Math.round(amount / 60000), 2, 18);
  else if(cat === 'sale') delta = clamp(Math.round(amount / 80000), 2, 12);
  else if(cat === 'contract') delta = 10;
  else if(cat === 'wholesale' && amount >= 50000) delta = Math.min(3, Math.floor(amount / 50000));
  else if(cat === 'dealer' && amount >= 100000) delta = Math.min(3, Math.floor(amount / 100000));
  if(delta > 0) awardOutcomeReputation(delta, `Successful ${cat} transaction`);
}
function spend(cat, amount, note){
  amount = Math.round(amount);
  state.player.cash -= amount;
  state.stats.totalExpenses += amount;
  ledgerAdd(cat, -amount, note);
}
function earn(cat, amount, note){
  amount = Math.round(amount);
  state.player.cash += amount;
  state.stats.totalRevenue += amount;
  ledgerAdd(cat, amount, note);
}

function ledgerSince(days){
  const cutoff = state.time.minutes - days*MINUTES_PER_DAY;
  return state.ledger.filter(l => l.minute >= cutoff);
}
function sumLedger(entries, cat){
  let inc = 0, exp = 0;
  for(const e of entries){
    if(cat && e.cat !== cat) continue;
    if(e.amount >= 0) inc += e.amount; else exp += -e.amount;
  }
  return { inc, exp, net: inc-exp };
}

   ============================================================================ */

function seasonDemandMod(){
  const s = seasonOf();
  if(s === 'Summer') return 1.10;
  if(s === 'Winter') return 0.93;
  if(s === 'Spring') return 1.03;
  return 1.00;
}

function driftMarket(){
  const m = state.market;
  m.momentum = m.momentum || { S:0, A:0, B:0, C:0, D:0 };
  m.supplyByGrade = m.supplyByGrade || { S:0, A:0, B:0, C:0, D:0 };
  const season = seasonDemandMod();
  const depMod = 1 + (m.dependencyIndex - 34)/260;

  for(const g of GRADES){
    const cur = m.price[g];
    const previous = m.prev[g] || cur;
    const observedTrend = previous ? (cur - previous)/previous : 0;
    m.momentum[g] = clamp((m.momentum[g]||0)*0.55 + observedTrend*0.45, -0.22, 0.22);
    // demand drift
    m.demand[g] = clamp(m.demand[g] * randRange(0.965, 1.038), 0.45, 1.85);

    const gradePressure = clamp(m.supplyByGrade[g]||0, 0, 2.5);
    const totalPressure = clamp(m.supplyPressure||0, 0, 1.5);
    let target = m.base[g] * m.demand[g] * season * depMod *
      (1 - totalPressure*0.12) * (1 - gradePressure*0.18) * (1 + m.momentum[g]*0.75);
    target = Math.max(target, MARKET_PRICE_BANDS[g][0]);

    const pull = 0.16;
    let next = cur + (target - cur)*pull + cur*m.momentum[g]*0.22 + cur*randRange(-0.025, 0.025);
    next = clamp(next, MARKET_PRICE_BANDS[g][0], MARKET_PRICE_BANDS[g][1]);

    m.prev[g] = cur;
    m.price[g] = next;
  }

  m.supplyPressure = (m.supplyPressure||0) * 0.86;
  for(const g of GRADES) m.supplyByGrade[g] = (m.supplyByGrade[g]||0) * 0.82;
  m.dependencyIndex = clamp(m.dependencyIndex + randRange(-1.4, 1.6), 8, 92);

}

function marketTrend(g){
  const cur = state.market.price[g], prev = state.market.prev[g];
  if(!prev) return 0;
  return (cur - prev)/prev;
}

function marketSellPrice(grade){
  return Number(state.market.sellPrice?.[grade]) || state.market.price[grade] || state.market.base[grade] || 1;
}

function setMarketSellPrice(grade, value){
  const band=MARKET_PRICE_BANDS[grade];
  const price=Number(value);
  if(!band || !Number.isFinite(price) || price<1) return false;
  state.market.sellPrice=state.market.sellPrice||{};
  state.market.sellPrice[grade]=clamp(price,band[0],band[1]);
  return true;
}

function recordMarketSupply(grade, qty){
  if(qty <= 0) return;
  const m = state.market;
  m.supplyByGrade = m.supplyByGrade || { S:0, A:0, B:0, C:0, D:0 };
  const depth = Math.max(10000, Number(m.depth) || 10000);
  const impact = clamp((qty / depth) * 0.85, 0, 1.5);
  m.supplyByGrade[grade] = clamp((m.supplyByGrade[grade]||0) + impact, 0, 2.5);
  m.supplyPressure = clamp((m.supplyPressure||0) + impact*0.22, 0, 1.5);
}

function marketDepth(){
  return Math.max(10000, Number(state.market.depth) || 10000);
}

function bulkUnitPrice(grade, variant, qty){
  const m = state.market;
  let base = marketSellPrice(grade);
  let mult = 1;
  if(variant){
    const r = recipeById(variant);
    if(r) mult *= r.demandMult * (1 + r.intensity*0.02);
  }
  const depth = marketDepth();
  const slip = clamp((qty||0)/depth * 0.28, 0, 0.42);
  const supplyOffset = 1 - clamp((m.supplyPressure||0) * 0.18, 0, 0.28);
  return base * mult * (1 - slip) * supplyOffset * randRange(0.975, 1.025);
}

function storageCapacity(){
  let c = 0;
  for(const f of state.facilities){
    if(f.type === 'storage') c += levelCapacity(f.level, STORAGE_CAPACITY_BY_LEVEL);
  }
  return c;
}
function dryingCapacity(){
  let c = 0;
  for(const f of state.facilities){
    if(f.type === 'drying') c += levelCapacity(f.level, DRYING_CAPACITY_BY_LEVEL);
  }
  return c;
}
function processingCapacity(){
  let c = 0;
  for(const f of state.facilities){
    if(f.type === 'processing') c += levelCapacity(f.level, PROCESSING_CAPACITY_BY_LEVEL);
  }
  return c;
}
function hasProcessing(){ return processingCapacity() > 0; }

function inventoryTotal(){
  let t = 0;
  for(const s of state.inventory) t += s.qty;
  return t;
}
function inventoryUsedInDrying(){
  let t = 0;
  for(const d of state.drying) t += d.qty;
  return t;
}
function inventoryUsedInProcessing(){
  let t = 0;
  for(const p of state.processing) t += p.qty;
  return t;
}
function totalStorageUsed(){
  return inventoryTotal() + inventoryUsedInDrying() + inventoryUsedInProcessing();
}

function addInventory(st, grade, variant, qty, unitCost){
  qty = Math.round(qty);
  if(qty <= 0) return;
  let stack = state.inventory.find(i => i.state===st && i.grade===grade && i.variant===(variant||null));
  if(stack){
    const prev = stack.qty;
    stack.qty += qty;
    stack.unitCost = (stack.unitCost*prev + (unitCost||0)*qty) / stack.qty;
  } else {
    state.inventory.push({
      id: uid('inv'), state: st, grade, variant: variant||null,
      qty, unitCost: unitCost||0, createdMinute: state.time.minutes
    });
  }
}

function removeInventory(stackId, qty){
  const idx = state.inventory.findIndex(i=>i.id===stackId);
  if(idx < 0) return 0;
  const s = state.inventory[idx];
  const take = Math.min(qty, s.qty);
  s.qty -= take;
  if(s.qty <= 0) state.inventory.splice(idx,1);
  return take;
}

function inventoryValue(){
  let v = 0;
  for(const s of state.inventory){
    v += s.qty * (state.market.price[s.grade] || 1) * (s.variant ? 1.2 : 1);
  }
  return v;
}

   SECTION: PRODUCTION ENGINE
   ============================================================================ */

function getGarden(id){ return state.gardens.find(g=>g.id===id); }

function gardenPlantCount(g){
  let n = 0;
  for(const b of state.batches) if(b.gardenId === g.id) n += b.seeds.length;
  return n;
}
function gardenBaseCapacity(g){
  if(!g) return 0;
  const base = Number(g.baseCapacity ?? g.capacity ?? 0);
  return Number.isFinite(base) ? Math.max(0, base) : 0;
}
function gardenCapacity(g){
  const base = gardenBaseCapacity(g);
  const level = gardenExpansionLevel(g);
  return Math.round(base * (1 + 0.20 * level));
}
function gardenLaborNeed(g){
  return Math.max(1, Math.ceil(gardenCapacity(g) / 30));
}
function gardenFreeCapacity(g){ return gardenCapacity(g) - gardenPlantCount(g); }

function equipmentScore(g){
  return g.equipment.light + g.equipment.water + g.equipment.vent; // 0..9
}

function gardenConditionScore(g){
  const eq = 0.68 + 0.32 * (equipmentScore(g)/9);
  return eq * (0.75 + 0.25*g.condition);
}

function gardenStaffRatio(g){
  const workers = state.people.filter(p=>p.role==='worker' && p.jobType==='cultivate' && p.gardenId===g.id).length;
  return clamp((workers + 1)/gardenLaborNeed(g), 0, 1.5);
}

function startBatch(gardenId, seedIds, careKey){
  const g = getGarden(gardenId);
  if(!g) return { ok:false, msg:'Garden not found.' };
  if(seedIds.length === 0) return { ok:false, msg:'Select at least one seed.' };
  if(seedIds.length > gardenFreeCapacity(g)) return { ok:false, msg:'Not enough free capacity.' };

  const care = CARE[careKey] || CARE.standard;
  const region = REGIONS.find(r=>r.id===g.region) || REGIONS[1];

  const selectedSeedIds = new Set(seedIds);
  const seeds = state.seeds.filter(s=>selectedSeedIds.has(s.id));
  if(seeds.length !== selectedSeedIds.size) return { ok:false, msg:'No valid seeds.' };

  const n = seeds.length;

  const fertNeed = care.fert * n;
  const medNeed  = 0.10 * n;
  const waterM3  = (care.water * n) / 1000;
  const kwhNeed  = care.kwh * n * (1 + 0.10*equipmentScore(g));

  const fertStockUsed = Math.min(state.supplies.fertilizer, fertNeed);
  const medStockUsed = Math.min(state.supplies.medium, medNeed);
  const fertCost = fertStockUsed*22 + (fertNeed-fertStockUsed)*100;
  const medCost = medStockUsed*12 + (medNeed-medStockUsed)*25;

  const waterCost = waterM3 * region.water;
  const elecCost  = kwhNeed * region.elec;

  const totalCost = Math.round(fertCost + medCost + waterCost + elecCost);

  if(state.player.cash < totalCost){
    return { ok:false, msg:'Not enough cash for production inputs (' + fmtMoney(totalCost) + ').' };
  }

  state.seeds = state.seeds.filter(s=>!selectedSeedIds.has(s.id));
  state.supplies.fertilizer -= fertStockUsed;
  state.supplies.medium -= medStockUsed;

  const staff = gardenStaffRatio(g);
  const workers = state.people.filter(p=>p.role==='worker' && p.jobType==='cultivate' && p.gardenId===g.id);
  const avgSkill = workers.length ? workers.reduce((sum,p)=>sum+p.skill,0)/workers.length : 50;
  const skillBonus = (avgSkill-50)/250;
  const cond = clamp(care.cond * gardenConditionScore(g) * (0.62 + 0.38*Math.min(staff,1)) + skillBonus, 0.05, 0.98);

  const avgYieldMod = seeds.reduce((a,s)=> a + geneticsById(s.genetics).yieldMod, 0)/n;
  const avgUniformity = seeds.reduce((a,s)=> a + (Number(s.uniformityPotential) || clamp((geneticsById(s.genetics).uniformityPotential[0] + geneticsById(s.genetics).uniformityPotential[1]) / 2, 0.72, 0.98)), 0)/n;
  const yieldMod = avgYieldMod * (0.85 + 0.30*cond) * (0.85 + 0.20*Math.min(staff,1.5)) * (0.9 + avgSkill/500) * (0.75 + avgUniformity * 0.35);

  const cycleMultiplier = seeds.reduce((sum, s) => sum + (geneticsById(s.genetics).cycleMod || 1), 0) / n;
  const duration = g.cycleHours * 60 * care.durMult * cycleMultiplier * (1 + (1 - Math.min(staff,1))*0.25);
  const plants = seeds.map(seed => {
    const genetics = geneticsById(seed.genetics);
    const q = clamp(seed.qualityPotential ?? ((genetics.pot[0] + genetics.pot[1]) / 2), 0.08, 0.98);
    const uniformity = clamp(Number(seed.uniformityPotential) || ((genetics.uniformityPotential[0] + genetics.uniformityPotential[1]) / 2), 0.7, 0.99);
    const qualityPotential = q * (0.82 + 0.24 * care.cond) * (0.82 + 0.22 * Math.min(staff, 1.2));
    const biomassPotential = clamp((genetics.biomassPotential[0] + genetics.biomassPotential[1]) / 2, 0.2, 1.6);
    const architecturePotential = clamp((genetics.architecturePotential[0] + genetics.architecturePotential[1]) / 2, 0.2, 1.8);
    const flowerSitePotential = clamp((genetics.flowerSitePotential[0] + genetics.flowerSitePotential[1]) / 2, 0.2, 1.8);
    const variance = randRange(0.82, 1.18);

    const architectureScore = architecturePotential * (0.75 + cond) * care.cond * (0.85 + 0.35*Math.min(staff,1.4)) * (0.88 + avgSkill/350) * variance;
    const biomassScore = biomassPotential * (0.72 + cond) * care.cond * (0.9 + 0.25*Math.min(staff,1.4)) * (0.88 + avgSkill/320) * variance * (0.88 + uniformity * 0.18);
    const inflorescenceCount = Math.max(1, Math.round(architectureScore * randRange(4.6, 8.6)));
    const flowerSites = Math.max(4, Math.round((flowerSitePotential * 16) + (architectureScore * 9) + randRange(-8, 12)));
    const biomass = Math.max(40, Math.round((110 + genetics.yieldMod * 140 + q * 200) * biomassScore));

    return {
      id: uid('plant'),
      seedId: seed.id,
      genetics: seed.genetics,
      qualityPotential: clamp(qualityPotential, 0.08, 0.98),
      architecturePotential: architecturePotential,
      flowerSitePotential: flowerSitePotential,
      biomassPotential: biomassPotential,
      inflorescenceCount,
      flowerSites,
      biomass,
      architectureScore
    };
  });

  const batch = {
    id: uid('bat'),
    gardenId: g.id,
    seeds,
    plants,
    care: careKey,
    condition: cond,
    yieldMod,
    expectedBiomassTotal: plants.reduce((sum,p)=>sum + p.biomass, 0),
    flowerSites: plants.reduce((sum,p)=>sum + p.flowerSites, 0),
    inflorescenceCount: plants.reduce((sum,p)=>sum + p.inflorescenceCount, 0),
    cost: totalCost,
    inputs: { fert: +fertNeed.toFixed(2), medium: +medNeed.toFixed(2), water: +waterM3.toFixed(3), kwh: +kwhNeed.toFixed(1) },
    startMinute: state.time.minutes,
    duration,
    elapsed: 0
  };

  state.batches.push(batch);
  g.totalCost += totalCost;
  spend('inputs', totalCost, `Inputs — ${g.name} (${n} plants, ${care.name})`);

  return { ok:true, batch };
}

function processBatches(dt){
  for(let i = state.batches.length-1; i>=0; i--){
    const b = state.batches[i];
    b.elapsed += dt;
    if(b.elapsed >= b.duration){
      harvestBatch(b);
      state.batches.splice(i,1);
    }
  }
}

function deriveGradeDistribution(qualityScore, condition){
  const score = clamp((qualityScore + (condition || 0.65)) / 1.8 + randRange(-0.10, 0.10), 0.10, 0.96);
  const weights = {
    S: clamp(0.10 + score * 0.36 + randRange(-0.04, 0.04), 0, 0.95),
    A: clamp(0.18 + score * 0.28 + randRange(-0.03, 0.03), 0, 0.95),
    B: clamp(0.30 + (1 - score) * 0.18 + randRange(-0.03, 0.03), 0, 0.95),
    C: clamp(0.24 + (1 - score) * 0.24 + randRange(-0.03, 0.03), 0, 0.95),
    D: clamp(0.10 + (1 - score) * 0.22 + randRange(-0.02, 0.02), 0, 0.95)
  };
  const total = Object.values(weights).reduce((sum,v)=>sum+v, 0) || 1;
  return {
    S: weights.S / total,
    A: weights.A / total,
    B: weights.B / total,
    C: weights.C / total,
    D: weights.D / total
  };
}

function distributeGradeMass(totalMass, percentages){
  const output = {S:0,A:0,B:0,C:0,D:0};
  if(!Number.isFinite(totalMass) || totalMass <= 0) return output;
  let remaining = Math.round(totalMass);
  const grades = ['S','A','B','C'];
  for(const grade of grades){
    const share = Math.round(totalMass * (percentages[grade] || 0));
    const take = Math.min(Math.max(share, 0), remaining);
    output[grade] = take;
    remaining -= take;
  }
  output.D = remaining;
  return output;
}

function harvestBatch(b){
  const g = getGarden(b.gardenId);
  const plants = (b.plants || []).length ? b.plants : (b.seeds || []).map(seed => {
    const genetics = geneticsById(seed.genetics);
    const q = clamp(seed.qualityPotential ?? ((genetics.pot[0] + genetics.pot[1]) / 2), 0.08, 0.98);
    return {
      id: uid('plant'),
      seedId: seed.id,
      genetics: seed.genetics,
      qualityPotential: q,
      architecturePotential: clamp((genetics.architecturePotential[0] + genetics.architecturePotential[1]) / 2, 0.2, 1.8),
      flowerSitePotential: clamp((genetics.flowerSitePotential[0] + genetics.flowerSitePotential[1]) / 2, 0.2, 1.8),
      biomassPotential: clamp((genetics.biomassPotential[0] + genetics.biomassPotential[1]) / 2, 0.2, 1.6),
      inflorescenceCount: Math.max(1, Math.round((q + (b.condition || 0.7)) * 10)),
      flowerSites: Math.max(4, Math.round((q + (b.condition || 0.7)) * 24)),
      biomass: Math.max(40, Math.round((100 + q * 180) * (b.condition || 0.7) * randRange(0.85, 1.15)))
    };
  });

  const totalRawBiomass = plants.reduce((sum,p)=>sum + (p.biomass || 0), 0);
  const totalFlowerSites = plants.reduce((sum,p)=>sum + (p.flowerSites || 0), 0);
  const totalInflorescences = plants.reduce((sum,p)=>sum + (p.inflorescenceCount || 0), 0);
  const averageQuality = plants.length ? plants.reduce((sum,p)=>sum + (p.qualityPotential || 0), 0) / plants.length : 0.5;
  const gradeDistribution = deriveGradeDistribution(averageQuality, b.condition || 0.7);
  const gradeMass = distributeGradeMass(totalRawBiomass, gradeDistribution);

  const free = storageCapacity() - totalStorageUsed();
  let keptBiomass = totalRawBiomass;
  let lost = 0;
  if(totalRawBiomass > free){
    lost = totalRawBiomass - Math.max(0, free);
    keptBiomass = Math.max(0, free);
  }

  const keptGradeMass = distributeGradeMass(keptBiomass, gradeDistribution);
  const costPerGram = totalRawBiomass > 0 ? b.cost / totalRawBiomass : 0;

  for(const gr of GRADES){
    if(keptGradeMass[gr] > 0) addInventory('raw', gr, null, keptGradeMass[gr], costPerGram);
  }

  if(g){
    g.totalProduced += keptBiomass;
  }

  const report = {
    id: uid('hr'),
    garden: g ? g.name : '?',
    day: dayOf(),
    total: totalRawBiomass,
    kept: keptBiomass,
    lost,
    counts: keptGradeMass,
    flowerSites: totalFlowerSites,
    inflorescenceCount: totalInflorescences,
    plantCount: plants.length,
    cost: b.cost,
    costPerGram
  };
  state.harvestReports.unshift(report);
  if(state.harvestReports.length > 25) state.harvestReports.pop();

  state.stats.totalProduced += keptBiomass;
  state.stats.cycles++;
  if(totalRawBiomass > state.stats.bestHarvest) state.stats.bestHarvest = totalRawBiomass;
  if(state.stats.worstHarvest === null || totalRawBiomass < state.stats.worstHarvest) state.stats.worstHarvest = totalRawBiomass;
  for(const gr of GRADES_ASC){
    if(keptGradeMass[gr] > 0){
      if(GRADE_RANK[gr] > GRADE_RANK[state.stats.highestGrade]) state.stats.highestGrade = gr;
      break;
    }
  }

  pushNote('important',
    `Harvest complete — ${g?g.name:'?'}: ${formatMass(totalRawBiomass)} raw cannabis (${GRADES.map(gr=>`${gr}:${keptGradeMass[gr]}`).join(' ')}) cost ${fmtMoney(b.cost)}`);
  if(lost > 0) pushNote('warn', `Storage overflow: ${formatMass(lost)} of raw cannabis was lost.`);
  return report;
}

/* ============================================================================
   SECTION: DRYING & PROCESSING
   ============================================================================ */

function processDrying(dt){
  for(let i = state.drying.length-1; i>=0; i--){
    const d = state.drying[i];
    d.elapsed += dt;
    if(d.elapsed >= d.duration){
      completeDrying(d);
      state.drying.splice(i,1);
    }
  }
}

function startDrying(stackId, qty, modeKey, workerId){
  const stack = state.inventory.find(s=>s.id===stackId);
  if(!stack) return { ok:false, msg:'Stack not found.' };
  if(stack.state !== 'raw') return { ok:false, msg:'Only raw product can be dried.' };
  qty = Math.min(qty, stack.qty);
  if(qty <= 0) return { ok:false, msg:'Invalid quantity.' };
  const mode = DRY_MODES[modeKey];
  if(!mode) return { ok:false, msg:'Invalid mode.' };

  const used = inventoryUsedInDrying();
  if(used + qty > dryingCapacity()) return { ok:false, msg:'Drying WIP capacity exceeded.' };

  const cost = Math.round(qty * mode.cost);
  if(state.player.cash < cost) return { ok:false, msg:'Not enough cash (' + fmtMoney(cost) + ').' };

  const gradeMass = { S:0, A:0, B:0, C:0, D:0 };
  gradeMass[stack.grade] = qty;

  removeInventory(stackId, qty);
  state.drying.push({
    id: uid('dry'),
    grade: stack.grade,
    variant: stack.variant,
    qty,
    inputMass: qty,
    gradeMass,
    unitCost: stack.unitCost,
    mode: modeKey,
    workerId: workerId || null,
    startMinute: state.time.minutes,
    duration: mode.hours*60,
    elapsed: 0
  });
  spend('drying', cost, `Drying (${mode.name}) ${formatMass(qty)}`);
  return { ok:true };
}

function normalizeGradeMasses(totalMass, masses){
  const result = { S:0, A:0, B:0, C:0, D:0 };
  const entries = Object.entries(masses).map(([grade, value]) => ({ grade, value: Number(value) || 0 }));
  const sum = entries.reduce((acc, item) => acc + item.value, 0);
  if(sum <= 0 || !Number.isFinite(totalMass) || totalMass <= 0){ return result; }

  let whole = 0;
  for(const entry of entries){
    const q = (entry.value / sum) * totalMass;
    result[entry.grade] = Math.floor(q);
    whole += result[entry.grade];
  }
  let remainder = Math.round(totalMass - whole);
  const ordered = entries
    .map(entry => ({ grade: entry.grade, value: (entry.value / sum) * totalMass, fraction: (entry.value / sum) * totalMass - Math.floor((entry.value / sum) * totalMass) }))
    .sort((a,b) => b.fraction - a.fraction || a.grade.localeCompare(b.grade));

  while(remainder > 0){
    const item = ordered.shift();
    if(!item) break;
    result[item.grade] += 1;
    remainder--;
  }
  while(remainder < 0){
    const item = ordered.pop();
    if(!item) break;
    if(result[item.grade] > 0){
      result[item.grade] -= 1;
      remainder++;
    }
  }
  return result;
}

function completeDrying(d){
  const mode = DRY_MODES[d.mode];
  const inputMass = Number(d.inputMass ?? d.qty ?? 0);
  const lossMass = Math.round(inputMass * mode.loss);
  const postLossMass = Math.max(0, inputMass - lossMass);
  const inputBreakdown = { ...d.gradeMass };
  const nextGrade = { D:'C', C:'B', B:'A', A:'S', S:'S' };
  const transitional = { S:0, A:0, B:0, C:0, D:0 };

  for(const grade of GRADES){
    const sourceMass = Number(inputBreakdown[grade] || 0);
    if(sourceMass <= 0) continue;
    const keepMass = sourceMass * (1 - mode.upgrade);
    const moveMass = sourceMass * mode.upgrade;
    transitional[grade] += keepMass;
    transitional[nextGrade[grade]] += moveMass;
  }

  const outputCounts = normalizeGradeMasses(postLossMass, transitional);
  let totalOut = 0;
  for(const gr of GRADES){
    const mass = Math.max(0, outputCounts[gr] || 0);
    if(mass > 0){
      addInventory('dried', gr, d.variant, mass, d.unitCost);
      totalOut += mass;
    }
  }
  pushNote('info', `Drying complete (${mode.name}): ${formatMass(totalOut)} dried cannabis, ${formatMass(lossMass)} lost.`);
}

function processProcessing(dt){
  for(let i = state.processing.length-1; i>=0; i--){
    const p = state.processing[i];
    p.elapsed += dt;
    if(p.elapsed >= p.duration){
      completeProcessing(p);
      state.processing.splice(i,1);
    }
  }
}

function startProcessing(stackId, qty, recipeId){
  if(!hasProcessing()) return { ok:false, msg:'No processing facility.' };
  const stack = state.inventory.find(s=>s.id===stackId);
  if(!stack) return { ok:false, msg:'Stack not found.' };
  if(stack.state !== 'dried') return { ok:false, msg:'Only dried product can be processed.' };
  const recipe = recipeById(recipeId);
  if(!recipe) return { ok:false, msg:'Invalid recipe.' };
  qty = Math.min(qty, stack.qty);
  if(qty <= 0) return { ok:false, msg:'Invalid quantity.' };

  const used = inventoryUsedInProcessing();
  if(used + qty > processingCapacity()) return { ok:false, msg:'Processing WIP capacity exceeded.' };

  const cost = Math.round(qty * 0.45 * recipe.costMult);
  if(state.player.cash < cost) return { ok:false, msg:'Not enough cash (' + fmtMoney(cost) + ').' };

  removeInventory(stackId, qty);
  state.processing.push({
    id: uid('proc'),
    grade: stack.grade,
    qty,
    unitCost: stack.unitCost,
    recipe: recipeId,
    variant: recipe.variant,
    marketSegment: recipe.marketSegment,
    demandProfile: recipe.demandProfile,
    qualityModifier: recipe.qualityModifier,
    processingLoss: recipe.processingLoss,
    startMinute: state.time.minutes,
    duration: recipe.hours*60,
    elapsed: 0
  });
  spend('processing', cost, `Processing ${recipe.name} — ${formatMass(qty)}`);
  return { ok:true };
}

function completeProcessing(p){
  const r = recipeById(p.recipe);
  if(!r) return;
  const lossMass = Math.round(p.qty * (r.processingLoss || 0.05));
  let outQty = Math.max(0, p.qty - lossMass);
  let finalGrade = p.grade;
  if((r.qualityModifier || 1) > 1.10 && Math.random() < 0.30){
    const idx = GRADES_ASC.indexOf(finalGrade);
    if(idx < GRADES_ASC.length - 1) finalGrade = GRADES_ASC[idx + 1];
  }
  const unitCost = (p.unitCost || 0) * (1 + ((r.qualityModifier || 1) - 1) * 0.55);
  if(outQty > 0){
    addInventory('processed', finalGrade, r.variant, outQty, unitCost);
  }
  pushNote('info', `Processing complete: ${formatMass(outQty)} ${r.variant} (${r.effect}) with ${formatMass(lossMass)} loss.`);
}

function productRecipeAccepts(recipe, stack){
  if(!recipe || !stack) return false;
  if(recipe.inputState==='raw_or_dried') return stack.state==='raw' || stack.state==='dried';
  if(recipe.inputState==='dried_or_processed') return stack.state==='dried' || stack.state==='processed';
  if(recipe.inputState==='dried') return stack.state==='dried';
  return stack.state===recipe.inputState;
}

function productMarketPrice(recipe, grade){
  const gradePrice=marketSellPrice(grade)||recipe.basePrice;
  return Math.max(1,Math.round(gradePrice*recipe.inputQty*0.65));
}

function manufactureProduct(recipeId, stackId, outputQty, name, unitPrice){
  const recipe=PRODUCT_RECIPES.find(r=>r.id===recipeId);
  const stack=state.inventory.find(s=>s.id===stackId);
  outputQty=Math.floor(Number(outputQty)||0);
  name=String(name||'').trim().slice(0,48);
  unitPrice=Number(unitPrice);
  if(!recipe || !stack || !productRecipeAccepts(recipe,stack)) return {ok:false,msg:'Choose a valid recipe and input stack.'};
  if(outputQty<1 || !name || !Number.isFinite(unitPrice) || unitPrice<1) return {ok:false,msg:'Enter a product name, quantity, and price.'};
  const inputMass=recipe.inputQty*outputQty;
  if(inputMass>stack.qty) return {ok:false,msg:`Not enough input. This batch needs ${formatMass(inputMass)}.`};
  removeInventory(stack.id,inputMass);
  const batch={
    id:uid('prodbatch'), recipeId:recipe.id, name, grade:stack.grade, unitPrice,
    quantity:outputQty, weightGrams:recipe.inputQty, unitCost:(stack.unitCost||0)*recipe.inputQty,
    startMinute:state.time.minutes,
    duration:recipe.productionHours*60*Math.max(1,Math.ceil(outputQty/5)),
    elapsed:0
  };
  state.productBatches.push(batch);
  pushNote('info', `Product batch started: ${outputQty} ${name}, ready in ${minutesToClock(batch.duration)}.`);
  return {ok:true,quantity:outputQty,batch};
}

function produceWorkerProduct(person){
  if(person.productWorkDay!==dayIndex()){
    person.productWorkDay=dayIndex();
    person.productUnitsToday=0;
  }
  if((Number(person.productUnitsToday)||0)>=20 || state.productBatches.some(batch=>batch.workerId===person.id)) return;
  const recipe=PRODUCT_RECIPES.find(r=>r.id===person.productRecipeId);
  if(!recipe) return;
  const stack=state.inventory.find(s=>productRecipeAccepts(recipe,s)&&s.qty>=recipe.inputQty);
  if(!stack) return;
  const quantity=Math.min(20-person.productUnitsToday,Math.floor(stack.qty/recipe.inputQty));
  const result=manufactureProduct(recipe.id,stack.id,quantity,recipe.name,productMarketPrice(recipe,stack.grade));
  if(result.ok){
    person.productUnitsToday+=quantity;
    result.batch.workerId=person.id;
  }
}

function workerBuySeedPouches(person, geneticsId, requestedPouches){
  const genetics=geneticsById(geneticsId);
  const pouchCost=Math.round(genetics.price*1.10);
  const pouches=Math.min(Math.max(0,Math.floor(Number(requestedPouches)||0)),Math.floor(state.player.cash/pouchCost));
  if(pouches<1) return false;
  const cost=pouchCost*pouches;
  spend('inputs',cost,`Seeds — ${person.name} bought ${pouches} ${genetics.name} pouch(es) (+10%)`);
  addSeedPouch(state,genetics.id,pouches);
  pushNote('info',`${person.name} bought ${pouches} ${genetics.name} seed pouch(es) for ${fmtMoney(cost)} (+10%).`);
  return true;
}

function completeProductBatch(batch){
  const existing=state.products.find(p=>p.recipeId===batch.recipeId && p.name===batch.name && p.grade===batch.grade && p.unitPrice===batch.unitPrice);
  if(existing) existing.quantity+=batch.quantity;
  else state.products.push({
    id:uid('product'), recipeId:batch.recipeId, name:batch.name, grade:batch.grade, unitPrice:batch.unitPrice,
    quantity:batch.quantity, weightGrams:batch.weightGrams, unitCost:batch.unitCost,
    createdMinute:state.time.minutes
  });
  const recipe=PRODUCT_RECIPES.find(r=>r.id===batch.recipeId);
  pushNote('info', `Product production complete: ${batch.quantity} ${batch.name} (${recipe?.unit||'units'}).`);
}

function processProductBatches(dt){
  for(let i=state.productBatches.length-1;i>=0;i--){
    const batch=state.productBatches[i];
    batch.elapsed+=dt;
    if(batch.elapsed>=batch.duration){
      completeProductBatch(batch);
      state.productBatches.splice(i,1);
    }
  }
}

function makeFertilizer(stackId, inputGrams){
  const stack=state.inventory.find(s=>s.id===stackId);
  inputGrams=Math.floor(Number(inputGrams)||0);
  if(!stack || !['raw','dried','processed'].includes(stack.state)) return {ok:false,msg:'Choose a valid cannabis stack.'};
  if(inputGrams<1 || inputGrams>stack.qty) return {ok:false,msg:'Input quantity exceeds the available stack.'};
  const outputKg=+(inputGrams/1000*0.8).toFixed(3);
  const cost=Math.round(outputKg*3);
  if(state.player.cash<cost) return {ok:false,msg:`Not enough cash for composting (${fmtMoney(cost)}).`};
  removeInventory(stack.id,inputGrams);
  state.supplies.fertilizer+=outputKg;
  spend('production',cost,`Homemade fertilizer — ${formatMass(inputGrams)} input`);
  pushNote('info',`Made ${outputKg.toFixed(3)} kg of fertilizer from ${formatMass(inputGrams)} cannabis.`);
  return {ok:true,outputKg};
}

function wholesaleSlotCount(){
  return Math.min(40,WHOLESALE_BASE_SLOTS+Math.max(0,(Number(state.wholesale.level)||1)-1)*2);
}

function wholesaleUpgradeCost(){ return 12000*Math.max(1,Number(state.wholesale.level)||1); }

function upgradeWholesale(){
  const current=Number(state.wholesale.level)||1;
  if(wholesaleSlotCount()>=40) return {ok:false,msg:'Wholesale showcase is at maximum capacity.'};
  const cost=wholesaleUpgradeCost();
  if(state.player.cash<cost) return {ok:false,msg:`Not enough cash (${fmtMoney(cost)}).`};
  state.wholesale.level=current+1;
  while(state.wholesale.slots.length<wholesaleSlotCount()) state.wholesale.slots.push({productId:null,quantity:0});
  spend('capex',cost,'Wholesale showcase expansion');
  pushNote('important',`Wholesale expanded to ${wholesaleSlotCount()} display slots.`);
  return {ok:true};
}

function stockWholesale(slotIndex,productId,quantity){
  const slot=state.wholesale.slots[Number(slotIndex)];
  const product=state.products.find(p=>p.id===productId);
  quantity=Math.floor(Number(quantity)||0);
  if(!slot || !product || quantity<1 || quantity>product.quantity) return {ok:false,msg:'Invalid product or quantity.'};
  if(slot.quantity>0 && slot.productId!==product.id) return {ok:false,msg:'Clear this showcase slot before changing its product.'};
  const amount=Math.min(quantity,WHOLESALE_SLOT_CAPACITY-slot.quantity);
  if(amount<=0) return {ok:false,msg:'This showcase slot already holds 20 units.'};
  slot.productId=product.id;
  slot.name=product.name;
  slot.grade=product.grade;
  slot.unitPrice=product.unitPrice;
  slot.weightGrams=product.weightGrams;
  slot.quantity+=amount;
  product.quantity-=amount;
  return {ok:true,quantity:amount};
}

function wholesaleHourlyTick(){
  if(!state.wholesale || !Array.isArray(state.wholesale.slots)) return;
  const reputation=clamp(Number(state.player.reputation)||1,1,1000);
  for(const slot of state.wholesale.slots){
    if(!slot.productId || slot.quantity<=0) continue;
    const demand=state.market.demand[slot.grade]||1;
    const chance=clamp((0.12+reputation/1000*0.66)*demand,0.08,0.92);
    if(Math.random()>chance) continue;
    const maxSale=clamp(Math.ceil(1+reputation/250),1,5);
    const sold=Math.min(slot.quantity,randInt(1,maxSale));
    const revenue=Math.round(sold*slot.unitPrice);
    slot.quantity-=sold;
    earn('wholesale',revenue,`Wholesale sale — ${slot.name} (${sold} units)`);
    rewardTransactionReputation('wholesale',revenue);
    recordMarketSupply(slot.grade,sold*(slot.weightGrams||1));
    state.stats.totalSold+=sold*(slot.weightGrams||1);
    state.stats.salesCount++;
    pushNote('financial',`Wholesale customer bought ${sold} ${slot.name} for ${fmtMoney(revenue)}.`);
    if(slot.quantity<=0){
      slot.productId=null;
      slot.quantity=0;
      delete slot.name;
      delete slot.grade;
      delete slot.unitPrice;
      delete slot.weightGrams;
    }
  }
}

function maxActiveDealers(){ return Math.max(1,Math.min(10,Math.floor(clamp(Number(state.player.reputation)||1,1,1000)/100))); }

function makeDealerCandidate(){
  const capacityGrams=randInt(10,500)*100;
  return {
    id:uid('dealer-cand'), name:pick(PERSON_NAMES), reputation:randInt(180,900),
    cutPercent:randInt(6,24), cooperationCost:randInt(3500,28000),
    capacityGrams, dailyRateGrams:randInt(1,10)*1000, reliability:randInt(45,95)
  };
}

function refreshDealerCandidates(){
  if(!Array.isArray(state.dealerCandidates)) state.dealerCandidates=[];
  const target=Math.max(3,Math.min(8,Math.floor(clamp(Number(state.player.reputation)||1,1,1000)/125)));
  while(state.dealerCandidates.length<target) state.dealerCandidates.push(makeDealerCandidate());
  if(state.dealerCandidates.length>target) state.dealerCandidates.length=target;
}

function recruitDealer(candidateId){
  const candidate=state.dealerCandidates.find(d=>d.id===candidateId);
  if(!candidate) return {ok:false,msg:'Dealer candidate is no longer available.'};
  if(state.dealers.length>=maxActiveDealers()) return {ok:false,msg:`Reputation supports up to ${maxActiveDealers()} dealer(s).`};
  if(candidate.capacityGrams<1000) return {ok:false,msg:'Dealer capacity must be at least 1 kg.'};
  if(state.player.cash<candidate.cooperationCost) return {ok:false,msg:`Not enough cash for the one-time cooperation fee (${fmtMoney(candidate.cooperationCost)}).`};
  spend('dealer',candidate.cooperationCost,`Dealer cooperation fee — ${candidate.name}`);
  state.dealers.push({...candidate,id:uid('dealer'),inventory:[],hiredMinute:state.time.minutes});
  state.dealerCandidates=state.dealerCandidates.filter(d=>d.id!==candidateId);
  pushNote('important',`${candidate.name} joined as a dealer.`);
  return {ok:true};
}

function releaseDealer(dealerId){
  const dealer=state.dealers.find(d=>d.id===dealerId);
  if(!dealer) return;
  for(const stock of dealer.inventory||[]){
    if(stock.kind==='product'){
      const existing=state.products.find(p=>p.recipeId===stock.recipeId&&p.name===stock.name&&p.grade===stock.grade&&p.unitPrice===stock.unitPrice);
      if(existing) existing.quantity+=stock.quantity;
      else state.products.push({...stock,id:uid('product'),quantity:stock.quantity,createdMinute:state.time.minutes});
    }else if(stock.qty>0){
      addInventory(stock.state,stock.grade,stock.variant,stock.qty,stock.unitCost);
    }
  }
  state.dealers=state.dealers.filter(d=>d.id!==dealerId);
  pushNote('warn',`${dealer.name} ended the cooperation. Unsold dealer stock was returned to your inventory.`);
}

function dealerInventoryMass(dealer){
  return (dealer.inventory||[]).reduce((total,stock)=>total+(stock.kind==='product'
    ? (Number(stock.quantity)||0)*(Number(stock.weightGrams)||1)
    : (Number(stock.qty)||0)),0);
}

function transferDealerStock(dealerId,sourceType,sourceId,quantity){
  const dealer=state.dealers.find(d=>d.id===dealerId);
  quantity=Math.floor(Number(quantity)||0);
  if(!dealer||quantity<1) return {ok:false,msg:'Choose a dealer and a positive quantity.'};
  if(!Array.isArray(dealer.inventory)) dealer.inventory=[];
  const source=sourceType==='product'
    ? state.products.find(p=>p.id===sourceId)
    : state.inventory.find(s=>s.id===sourceId);
  const available=sourceType==='product'?source?.quantity:source?.qty;
  if(!source||quantity>available) return {ok:false,msg:'That quantity is no longer available.'};
  const unitWeight=sourceType==='product'?Math.max(1,Number(source.weightGrams)||1):1;
  if(dealerInventoryMass(dealer)+quantity*unitWeight>dealer.capacityGrams){
    return {ok:false,msg:`Dealer storage limit is ${formatMass(dealer.capacityGrams)}.`};
  }

  if(sourceType==='product'){
    const existing=dealer.inventory.find(s=>s.kind==='product'&&s.recipeId===source.recipeId&&s.name===source.name&&s.grade===source.grade&&s.unitPrice===source.unitPrice);
    if(existing) existing.quantity+=quantity;
    else dealer.inventory.push({...source,id:uid('dealer-stock'),kind:'product',quantity});
    source.quantity-=quantity;
  }else{
    const existing=dealer.inventory.find(s=>s.kind!=='product'&&s.state===source.state&&s.grade===source.grade&&s.variant===(source.variant||null));
    if(existing){
      const previous=existing.qty;
      existing.qty+=quantity;
      existing.unitCost=(existing.unitCost*previous+(source.unitCost||0)*quantity)/existing.qty;
    }else{
      dealer.inventory.push({id:uid('dealer-stock'),kind:'biomass',state:source.state,grade:source.grade,variant:source.variant||null,qty:quantity,unitCost:source.unitCost||0});
    }
    removeInventory(source.id,quantity);
  }
  pushNote('info',`${formatMass(quantity*unitWeight)} transferred to ${dealer.name}'s inventory.`);
  return {ok:true,quantity};
}

function transferAllDealerStock(dealerId,sourceType,sourceId){
  const dealer=state.dealers.find(d=>d.id===dealerId);
  if(!dealer) return {ok:false,msg:'Dealer not found.'};
  const source=sourceType==='product'
    ? state.products.find(p=>p.id===sourceId)
    : sourceType==='biomass'?state.inventory.find(s=>s.id===sourceId):null;
  if(!source) return {ok:false,msg:'Choose stock to transfer.'};
  const available=Math.floor(Number(sourceType==='product'?source.quantity:source.qty)||0);
  const unitWeight=sourceType==='product'?Math.max(1,Number(source.weightGrams)||1):1;
  const freeMass=Math.max(0,(Number(dealer.capacityGrams)||0)-dealerInventoryMass(dealer));
  const quantity=Math.min(available,Math.floor(freeMass/unitWeight));
  if(quantity<1) return {ok:false,msg:'No selected stock fits in this dealer inventory.'};
  return transferDealerStock(dealerId,sourceType,sourceId,quantity);
}

function processDealersDaily(){
  for(const dealer of state.dealers){
    let remaining=Math.min(Number(dealer.capacityGrams)||0,Number(dealer.dailyRateGrams)||0);
    let grossTotal=0, commissionTotal=0, soldGrams=0;
    const stocks=(dealer.inventory||[]).filter(s=>s.kind==='product'?s.quantity>0:s.qty>0)
      .sort((a,b)=>GRADE_RANK[b.grade]-GRADE_RANK[a.grade]);
    for(const stock of stocks){
      if(remaining<=0) break;
      const unitWeight=stock.kind==='product'?Math.max(1,Number(stock.weightGrams)||1):1;
      const quantity=stock.kind==='product'
        ? Math.min(stock.quantity,Math.floor(remaining/unitWeight))
        : Math.min(stock.qty,remaining);
      if(quantity<=0) continue;
      const grams=quantity*unitWeight;
      const revenue=Math.round(grams*marketSellPrice(stock.grade));
      if(stock.kind==='product') stock.quantity-=quantity;
      else stock.qty-=quantity;
      const itemName=stock.kind==='product'?`${quantity} ${stock.name}`:`grade ${stock.grade}`;
      earn('dealer',revenue,`Dealer sale — ${dealer.name}, ${itemName} (${formatMass(grams)})`);
      const cut=Math.round(revenue*clamp(Number(dealer.cutPercent)||0,0,100)/100);
      if(cut>0){ commissionTotal+=cut; spend('dealer commission',cut,`Dealer cut — ${dealer.name}`); }
      recordMarketSupply(stock.grade,grams);
      remaining-=grams;
      soldGrams+=grams;
      grossTotal+=revenue;
    }
    dealer.inventory=dealer.inventory.filter(s=>s.kind==='product'?s.quantity>0:s.qty>0);
    if(soldGrams>0){
      state.stats.totalSold+=soldGrams;
      state.stats.salesCount++;
      dealer.reputation=clamp(dealer.reputation+1,1,1000);
      rewardTransactionReputation('dealer',grossTotal);
      pushNote('financial',`${dealer.name} sold ${formatMass(soldGrams)}: ${fmtMoney(grossTotal)} gross, ${fmtMoney(commissionTotal)} commission, ${fmtMoney(grossTotal-commissionTotal)} net.`);
    }
  }
}

function fleetCapacity(){
  let c = 0;
  for(const v of state.vehicles) c += Number(v.capacity || 0);
  return c;
}

function sellBulk(stackId, qty){
  const stack=state.inventory.find(s=>s.id===stackId);
  qty=Math.floor(Number(qty)||0);
  if(!stack) return {ok:false,msg:'Inventory stack not found.'};
  if(qty<1 || qty>stack.qty) return {ok:false,msg:'Invalid sale quantity.'};
  const unitPrice=bulkUnitPrice(stack.grade,stack.variant,qty);
  const revenue=Math.round(unitPrice*qty);
  removeInventory(stackId,qty);
  earn('sale',revenue,`Bulk sale — grade ${stack.grade} (${formatMass(qty)})`);
  recordMarketSupply(stack.grade,qty);
  state.stats.totalSold+=qty;
  state.stats.salesCount++;
  pushNote('financial',`Sold ${formatMass(qty)} grade ${stack.grade} at ${fmtMoney(unitPrice)}/g for ${fmtMoney(revenue)}.`);
  return {ok:true,gross:revenue,net:revenue,unitPrice};
}

function vehicleUsableCapacity(vehicle){
  if(!vehicle) return 0;
  return Math.max(0, Number(vehicle.capacity || 0) * clamp(Number(vehicle.condition || 0.85), 0.1, 1));
}

function vehicleAvailable(vehicle, contractId=null){
  if(!vehicle || state.shipments.some(s=>s.status==='scheduled' && s.vehicleId===vehicle.id)) return false;
  const reservation=state.contracts.find(c=>c.status==='active' && c.vehicleId===vehicle.id);
  return !reservation || reservation.id===contractId;
}

function logisticsCost(qty, vehicle, originRegion, destinationRegion, distanceKm){
  const distance = Math.max(0, Number(distanceKm)||0) * 2;
  const fuelRate = VEHICLE_TYPES.find(v=>v.id===vehicle?.type)?.fuelCostPerKm || 2.97;
  return Math.max(0, Math.round(distance * fuelRate));
}

function routeSupport(role, preferredId){
  const person=state.people.find(p=>p.id===preferredId && p.role===role && !state.shipments.some(s=>s.status==='scheduled' && (s.driverId===p.id || s.securityId===p.id)));
  return person || null;
}

function prepareRoute(distanceKm, quantity, vehicle, driver, security){
  const roundTripKm=Math.max(0,Number(distanceKm)||0)*2;
  const roadSpeed=clamp((Number(vehicle.speedKmh)||60)*randRange(0.72,1),40,70);
  const loadingMinutes=Math.ceil(Math.max(0,quantity)/25000*10);
  const fuelCost=logisticsCost(quantity,vehicle,null,null,distanceKm);
  let delayMinutes=0, bribeCost=0, lostQty=0;
  const events=[];
  const driverSkill=driver?clamp((Number(driver.skill)||50)/100,0,1):0;
  const securitySkill=security?clamp((Number(security.skill)||50)/100,0,1):0;
  if(Math.random()<0.32*(1-driverSkill*0.65)){
    delayMinutes+=randInt(30,180);
    events.push('Traffic delay');
  }
  if(Math.random()<0.18*(1-driverSkill*0.55)){
    const baseBribe=randInt(500,2500);
    bribeCost=Math.round(baseBribe*(1-driverSkill*0.45));
    delayMinutes+=randInt(15,60);
    events.push('Police checkpoint');
  }
  if(Math.random()<0.12*(1-securitySkill*0.75)){
    const lossRate=randRange(0.10,0.45)*(1-securitySkill*0.75);
    lostQty=Math.min(quantity,Math.round(quantity*lossRate));
    delayMinutes+=randInt(20,90);
    events.push('Cargo theft attempt');
  }
  if(Math.random()<0.12*(1-driverSkill*0.45)){
    delayMinutes+=randInt(45,150);
    events.push('Road obstruction');
  }
  const travelMinutes=Math.ceil(roundTripKm/roadSpeed*60);
  return {roundTripKm,roadSpeed,loadingMinutes,fuelCost,delayMinutes,bribeCost,lostQty,events,duration:Math.max(30,travelMinutes+loadingMinutes+delayMinutes)};
}

function makeShipment(vehicleId, quantityGrams, origin, destination, orderId, contractId, options={}){
  const vehicle = state.vehicles.find(v => v.id === vehicleId);
  if(!vehicleAvailable(vehicle,contractId)) return null;
  const quantity=Math.max(0,Number(quantityGrams)||0);
  const destinationOrg=state.organizations.find(org=>org.id===options.orgId);
  const distanceKm=Number(options.distanceKm ?? destinationOrg?.distanceKm ?? 100);
  const driver=routeSupport('driver',options.driverId);
  const security=routeSupport('security',options.securityId);
  const route=prepareRoute(distanceKm,quantity,vehicle,driver,security);
  const shipment = {
    id: uid('ship'),
    vehicleId: vehicle.id,
    vehicleType: vehicle.type,
    quantityGrams: quantity,
    origin: origin || 'centro',
    destination: destination || 'centro',
    orderId: orderId || null,
    contractId: contractId || null,
    startMinute: state.time.minutes,
    distanceKm:route.roundTripKm/2,
    averageSpeedKmh:route.roadSpeed,
    loadingMinutes:route.loadingMinutes,
    fuelCost:route.fuelCost,
    bribeCost:route.bribeCost,
    lostQty:route.lostQty,
    roadEvents:route.events,
    driverId:driver?.id||null,
    securityId:security?.id||null,
    duration:route.duration,
    elapsed: 0,
    status: 'scheduled'
  };
  if(quantity<=0 || quantity>vehicleUsableCapacity(vehicle)) return null;
  state.shipments.push(shipment);
  if(route.fuelCost>0) spend('fuel',route.fuelCost,`Fuel — ${vehicle.name}, ${route.roundTripKm} km round trip`);
  if(route.bribeCost>0) spend('road incident',route.bribeCost,'Road checkpoint settlement');
  if(route.events.length) pushNote('warn',`Road events for ${vehicle.name}: ${route.events.join(', ')}. ETA ${minutesToClock(route.duration)}.`);
  return shipment;
}

function processShipments(dt){
  for(const shipment of state.shipments){
    if(shipment.status!=='scheduled') continue;
    shipment.elapsed=(Number(shipment.elapsed)||0)+dt;
    if(shipment.elapsed>=shipment.duration){
      shipment.status='delivered';
      shipment.completedMinute=state.time.minutes;
      completeShipment(shipment);
    }
  }
  if(state.shipments.length>500) state.shipments=state.shipments.slice(-500);
}

function distributionFacility(){
  return state.facilities.find(f=>f.type==='distribution') || null;
}

function distributionCapacity(){
  const facility = distributionFacility();
  return facility ? 10 + Math.max(0, facility.level-1)*5 : 0;
}

function searchPotentialCustomers(regionId){
  const facility = distributionFacility();
  const region = REGIONS.find(r=>r.id===regionId);
  if(!facility || !region) return;
  const remaining = distributionCapacity() - state.potentialCustomers.length;
  if(remaining <= 0){
    pushNote('warn', 'Potential customer list is full. Sample existing prospects or upgrade the channel.');
    return;
  }
  const count = Math.min(remaining, randInt(3,6));
  for(let i=0;i<count;i++){
    const org = pick(state.organizations);
    state.potentialCustomers.push({
      id:uid('prospect'), name:pick(PERSON_NAMES), region:region.id,
      preferredGrade:pick(['C','B','B','A']), baseQty:randInt(3,9),
      connectedOrgId:org ? org.id : null, searchedMinute:state.time.minutes
    });
  }
  pushNote('info', `Market search in ${region.name} found ${count} potential customers.`);
}

function samplePotentialCustomer(prospectId, stackId){
  const prospect = state.potentialCustomers.find(p=>p.id===prospectId);
  const stack = state.inventory.find(s=>s.id===stackId);
  if(!prospect || !stack || stack.qty<1) return {ok:false,msg:'Prospect or sample unit is no longer available.'};
  const sampleGrade = stack.grade;
  removeInventory(stack.id,1);
  const gradeGap = GRADE_RANK[sampleGrade] - GRADE_RANK[prospect.preferredGrade];
  const chance = clamp(0.28 + GRADE_RANK[sampleGrade]*0.10 + gradeGap*0.07, 0.18, 0.92);
  state.potentialCustomers = state.potentialCustomers.filter(p=>p.id!==prospect.id);
  if(Math.random() >= chance){
    pushNote('warn', `${prospect.name} in ${REGIONS.find(r=>r.id===prospect.region).name} declined the sample (${sampleGrade}).`);
    return {ok:true,converted:false,chance};
  }
  state.customers.push({
    id:uid('customer'), name:prospect.name, region:prospect.region,
    preferredGrade:prospect.preferredGrade, sampleGrade,
    connectedOrgId:prospect.connectedOrgId, addiction:clamp(28+GRADE_RANK[sampleGrade]*3,0,100),
    baseQty:prospect.baseQty, nextMessageMinute:state.time.minutes+randInt(1,3)*MINUTES_PER_DAY,
    activeOrderId:null, referralSent:false, ordersCompleted:0, totalSpent:0
  });
  pushNote('financial', `${prospect.name} became a customer after sampling grade ${sampleGrade} (${Math.round(chance*100)}% chance).`);
  return {ok:true,converted:true,chance};
}

function customerHasOpenOrder(customerId){
  return state.customerOrders.some(o=>o.customerId===customerId && o.status==='active');
}

function processCustomerMessages(){
  const reputation = clamp(Number(state.player.reputation)||1, 1, 1000);
  for(const customer of state.customers){
    if(customerHasOpenOrder(customer.id) || state.messages.some(m=>m.customerId===customer.id && m.status==='new')) continue;
    if(state.time.minutes < customer.nextMessageMinute) continue;
    if(Math.random() > clamp(0.22 + reputation/1000*0.58, 0.22, 0.80)){
      customer.nextMessageMinute += MINUTES_PER_DAY;
      continue;
    }
    const grade = customer.preferredGrade;
    const marketPrice = marketSellPrice(grade);
    const qty = Math.max(1, Math.round(customer.baseQty*(0.65+customer.addiction/100)*(0.75+reputation/1000*0.75)*randRange(0.85,1.2)));
    const quote = Math.max(1, Math.round(marketPrice*(1.18-customer.addiction*0.0018)));
    const waitDays = randInt(3,6);
    state.messages.unshift({
      id:uid('msg'), customerId:customer.id, customerName:customer.name,
      createdMinute:state.time.minutes, kind:'order', status:'new', qty,
      grade, quotedPrice:quote, deadlineMinute:state.time.minutes+waitDays*MINUTES_PER_DAY
    });
    customer.nextMessageMinute = state.time.minutes+randInt(5,9)*MINUTES_PER_DAY;
    pushNote('info', `${customer.name} sent an order request for ${qty} grade ${grade} units.`);
  }
  if(state.messages.length>250) state.messages.length=250;
}

function acceptCustomerMessage(messageId, agreedPrice){
  const message=state.messages.find(m=>m.id===messageId && m.status==='new');
  const customer=message && state.customers.find(c=>c.id===message.customerId);
  if(!message || !customer) return {ok:false,msg:'This message is no longer available.'};
  agreedPrice=Math.max(0,Number(agreedPrice)||0);
  if(agreedPrice<=0) return {ok:false,msg:'Enter a valid unit price.'};
  const order={
    id:uid('corder'), messageId:message.id, customerId:customer.id,
    customerName:customer.name, qty:message.qty, remainingQty:message.qty,
    grade:message.grade, quotedPrice:message.quotedPrice, agreedPrice,
    deadlineMinute:message.deadlineMinute, status:'active', delivered:0, value:0, gradeScore:0
  };
  state.customerOrders.unshift(order);
  message.status='accepted';
  customer.activeOrderId=order.id;
  pushNote('info', `Order agreed with ${customer.name}: ${order.qty} units at ${fmtMoney(agreedPrice)}/unit.`);
  return {ok:true,order};
}

function checkCustomerReferral(customer){
  if(customer.referralSent || customer.addiction<80 || !customer.connectedOrgId) return;
  const org=state.organizations.find(o=>o.id===customer.connectedOrgId);
  if(!org) return;
  customer.referralSent=true;
  org.known=true;
  org.relationship=clamp(Math.max(org.relationship,45),0,100);
  const offered=state.offers.some(o=>o.orgId===org.id && o.special);
  if(!offered){
    const grade=pick(['B','A']);
    const marketPrice=state.market.price[grade] || 1;
    const pricePerUnit=Math.round(marketPrice*randRange(1.45,1.8));
    state.offers.push({
      id:uid('off'), orgId:org.id, orgName:org.name, qtyPerPeriod:Math.max(20,Math.round(org.demand*randRange(1.3,2.0)*(0.75+state.player.reputation/1000*0.75))),
      periodDays:7, minGrade:grade, priceType:'fixed', pricePerUnit,
      marketMod:pricePerUnit/marketPrice, penaltyPerUnit:Math.round(pricePerUnit*0.30),
      periods:pick([4,6,8]), expiresMinute:state.time.minutes+7*MINUTES_PER_DAY,
      createdMinute:state.time.minutes, special:true, referredBy:customer.name
    });
  }
  pushNote('important', `${customer.name} introduced you to ${org.name}. A premium organization contract is available.`);
}

function deliverCustomerOrder(orderId, stackId, qty){
  const order=state.customerOrders.find(o=>o.id===orderId && o.status==='active');
  const stack=state.inventory.find(s=>s.id===stackId);
  if(!order || !stack) return {ok:false,msg:'Order or inventory stack not found.'};
  qty=Math.floor(Number(qty)||0);
  if(qty<=0 || qty>order.remainingQty || qty>stack.qty) return {ok:false,msg:'Quantity exceeds available order or inventory.'};
  const gradeDelta=GRADE_RANK[stack.grade]-GRADE_RANK[order.grade];
  if(gradeDelta<0) return {ok:false,msg:`Grade ${stack.grade} is below the minimum grade ${order.grade}.`};
  const customer=state.customers.find(c=>c.id===order.customerId);
  const unitPrice=gradeDelta>0 ? marketSellPrice(stack.grade) : order.agreedPrice;
  const revenue=Math.round(unitPrice*qty);
  removeInventory(stack.id,qty);
  earn('customer',revenue,`Customer order — ${order.customerName} (${qty}u grade ${stack.grade})`);
  recordMarketSupply(stack.grade,qty);
  state.stats.totalSold+=qty;
  order.delivered+=qty;
  order.remainingQty-=qty;
  order.value+=revenue;
  order.gradeScore+=gradeDelta*qty;
  state.stats.salesCount++;
  if(order.remainingQty===0){
    order.status='fulfilled';
    state.messages = state.messages.filter(m=>m.id!==order.messageId);
    const priceEffect=clamp((order.quotedPrice-order.agreedPrice)/order.quotedPrice*35,-25,20);
    const averageGradeDelta=order.gradeScore/order.delivered;
    let loyaltyChange=7+priceEffect+(averageGradeDelta>=0?averageGradeDelta*5:0);
    if(averageGradeDelta<0) loyaltyChange=Math.min(-5,priceEffect-10*Math.abs(averageGradeDelta));
    else if(order.agreedPrice>order.quotedPrice) loyaltyChange=Math.min(-3,loyaltyChange);
    customer.addiction=clamp(customer.addiction+loyaltyChange,0,100);
    customer.baseQty=clamp(customer.baseQty*(1+loyaltyChange/100),2,180);
    customer.ordersCompleted++;
    customer.totalSpent+=order.value;
    customer.activeOrderId=null;
    rewardTransactionReputation('customer',order.value);
    checkCustomerReferral(customer);
    pushNote(customer.addiction>=70?'financial':'info', `${customer.name}'s order was fulfilled. Loyalty ${customer.addiction.toFixed(0)}/100.`);
  }
  return {ok:true,order};
}

function expireCustomerOrders(){
  for(const message of state.messages){
    if(message.status!=='new' || state.time.minutes<message.deadlineMinute) continue;
    message.status='cancelled';
    const customer=state.customers.find(c=>c.id===message.customerId);
    if(customer){
      customer.addiction=clamp(customer.addiction-14,0,100);
      customer.baseQty=clamp(customer.baseQty*0.88,2,180);
      customer.nextMessageMinute=state.time.minutes+randInt(5,9)*MINUTES_PER_DAY;
    }
    pushNote('warn',`${message.customerName} withdrew an unanswered order request.`);
  }
  for(const order of state.customerOrders){
    if(order.status!=='active' || state.time.minutes<order.deadlineMinute) continue;
    order.status='cancelled';
    const customer=state.customers.find(c=>c.id===order.customerId);
    if(customer){
      customer.addiction=clamp(customer.addiction-28,0,100);
      customer.baseQty=clamp(customer.baseQty*0.72,2,180);
      customer.activeOrderId=null;
      customer.nextMessageMinute=state.time.minutes+randInt(7,12)*MINUTES_PER_DAY;
    }
    const message=state.messages.find(m=>m.id===order.messageId);
    if(message) message.status='cancelled';
    pushNote('important', `${order.customerName} cancelled an overdue order. Loyalty dropped sharply.`);
  }
}

   SECTION: CONTRACTS
   ============================================================================ */

function relState(v){
  if(v >= 88) return 'Trusted Partner';
  if(v >= 72) return 'Dependent';
  if(v >= 52) return 'Partner';
  if(v >= 32) return 'Customer';
  if(v >= 14) return 'Contact';
  return 'Unknown';
}

function processContracts(){
  for(const c of state.contracts){
    if(c.status !== 'active' || c.pendingShipmentId || c.periodIndex>=c.periods) continue;
    if(state.time.minutes >= c.nextDueMinute){
      fulfillContractPeriod(c);
      c.nextDueMinute += c.periodDays * MINUTES_PER_DAY;
      c.periodIndex++;
      if(c.periodIndex >= c.periods && !c.pendingShipmentId) completeContract(c);
    }
  }
}

function fulfillContractPeriod(c){
  const minRank = GRADE_RANK[c.minGrade];
  let need = c.qtyPerPeriod;
  let delivered = 0;
  let value = 0;
  const vehicle=state.vehicles.find(v=>v.id===c.vehicleId && vehicleAvailable(v,c.id));
  if(!vehicle){
    pushNote('important', `Contract with ${c.orgName} could not ship: no vehicle is available.`);
    settleContractPeriod(c,0,0);
    return;
  }
  let transportRemaining = vehicleUsableCapacity(vehicle);
  const items=[];

  const eligible = state.inventory
    .filter(s => GRADE_RANK[s.grade] >= minRank)
    .sort((a,b)=> GRADE_RANK[a.grade]-GRADE_RANK[b.grade]);

  for(const s of eligible){
    if(need <= 0 || transportRemaining <= 0) break;
    const take = Math.min(s.qty, need, transportRemaining);
    if(take <= 0) continue;
    let unitPrice;
    if(GRADE_RANK[s.grade] > minRank) unitPrice = marketSellPrice(s.grade);
    else if(c.priceType === 'fixed') unitPrice = c.special
      ? Math.max(c.pricePerUnit,(state.market.price[s.grade]||1)*1.2)
      : c.pricePerUnit;
    else unitPrice = (state.market.price[s.grade] || 1) * c.marketMod;
    items.push({stackId:s.id,grade:s.grade,quantity:take,unitPrice});
    delivered += take;
    need -= take;
    transportRemaining -= take;
    value += unitPrice * take;
  }

  if(delivered<=0){
    settleContractPeriod(c,0,0);
    return;
  }

  const org=state.organizations.find(o=>o.id===c.orgId);
  const driver=state.people.filter(p=>p.role==='driver' && !state.shipments.some(s=>s.status==='scheduled' && s.driverId===p.id)).sort((a,b)=>b.skill-a.skill)[0];
  const security=state.people.filter(p=>p.role==='security' && !state.shipments.some(s=>s.status==='scheduled' && s.securityId===p.id)).sort((a,b)=>b.skill-a.skill)[0];
  const shipment=makeShipment(vehicle.id,delivered,'centro',org?.region||'centro',null,c.id,{orgId:org?.id,driverId:driver?.id,securityId:security?.id});
  if(!shipment){
    pushNote('important',`Contract with ${c.orgName} could not ship: cargo exceeds usable vehicle payload.`);
    settleContractPeriod(c,0,0);
    return;
  }
  shipment.items=items;
  shipment.value=value;
  shipment.requestedQty=c.qtyPerPeriod;
  shipment.orgName=c.orgName;
  for(const item of items) removeInventory(item.stackId,item.quantity);
  c.pendingShipmentId=shipment.id;
  pushNote('info',`Contract cargo for ${c.orgName} shipped: ${formatMass(delivered)} in ${vehicle.name}. ETA ${minutesToClock(shipment.duration)}.`);
}

function completeShipment(shipment){
  if(!Array.isArray(shipment.items)) return;
  let lossRemaining=Math.max(0,Number(shipment.lostQty)||0);
  for(const item of shipment.items){
    const lost=Math.min(item.quantity,lossRemaining);
    item.quantity-=lost;
    lossRemaining-=lost;
    if(item.quantity>0) recordMarketSupply(item.grade,item.quantity);
  }
  const delivered=shipment.items.reduce((sum,item)=>sum+item.quantity,0);
  const value=shipment.items.reduce((sum,item)=>sum+item.quantity*item.unitPrice,0);
  if(shipment.organizationSale){
    const org=state.organizations.find(o=>o.id===shipment.orgId);
    if(delivered>0){
      earn('sale',Math.round(value),`Organization sale — ${org?.name||shipment.orgName}, grade ${shipment.grade} (${formatMass(delivered)})`);
      state.stats.totalSold+=delivered;
      state.stats.salesCount++;
      if(org){ org.relationship=clamp(org.relationship+2,0,100); org.totalTraded=(Number(org.totalTraded)||0)+value; }
      rewardTransactionReputation('sale',value);
    }
    pushNote(delivered>0?'financial':'important',delivered>0
      ? `${org?.name||shipment.orgName} received ${formatMass(delivered)} after a ${formatMass(shipment.lostQty||0)} road loss. Payment ${fmtMoney(value)}.`
      : `${org?.name||shipment.orgName} shipment was lost before delivery.`);
    return;
  }
  if(!shipment.contractId) return;
  const contract=state.contracts.find(c=>c.id===shipment.contractId);
  if(!contract) return;
  if(delivered>0){
    earn('contract',Math.round(value),`Contract delivery — ${contract.orgName} (${formatMass(delivered)})`);
    const vehicle=state.vehicles.find(v=>v.id===shipment.vehicleId);
    state.stats.totalSold+=delivered;
  }
  settleContractPeriod(contract,delivered,value);
  contract.pendingShipmentId=null;
  if(contract.periodIndex>=contract.periods) completeContract(contract);
  pushNote('financial',`Contract shipment arrived for ${contract.orgName}: ${formatMass(delivered)} delivered.`);
}

function settleContractPeriod(c,delivered,value){
  const org=state.organizations.find(o=>o.id===c.orgId);
  const shortfall = c.qtyPerPeriod - delivered;
  if(shortfall > 0){
    const penalty = Math.round(shortfall * c.penaltyPerUnit);
    if(penalty > 0) spend('penalty', penalty, `Contract shortfall penalty — ${c.orgName}`);
    if(org){
      org.relationship = clamp(org.relationship - Math.min(16, 4 + shortfall*0.6), 0, 100);
    }
    state.player.reputation = clamp(state.player.reputation - 20, 1, 1000);
    pushNote('important', `Contract shortfall with ${c.orgName}: ${shortfall} units missing. Penalty ${fmtMoney(penalty)}.`);
  } else {
    if(org) org.relationship = clamp(org.relationship + 5, 0, 100);
    rewardTransactionReputation('contract',value);
    pushNote('financial', `Contract fulfilled with ${c.orgName}: ${delivered} units, ${fmtMoney(value)}.`);
  }

  c.totalDelivered += delivered;
  c.totalValue += value;
  c.deliveredThisPeriod = 0;
}

function completeContract(contract){
  contract.status='completed';
  const org=state.organizations.find(o=>o.id===contract.orgId);
  if(org) org.activeContractId=null;
  pushNote('info',`Contract with ${contract.orgName} completed.`);
}

function acceptOffer(offerId, vehicleId){
  const o = state.offers.find(x=>x.id===offerId);
  if(!o) return;
  refreshContractOfferQuantity(o);
  const org = state.organizations.find(x=>x.id===o.orgId);
  if(!org) return;
  const vehicle=state.vehicles.find(v=>v.id===vehicleId);
  if(!vehicle){
    pushNote('warn','Organization contracts require at least one vehicle for delivery.');
    return;
  }
  if(!vehicleAvailable(vehicle)){
    pushNote('warn',`${vehicle.name} is already assigned to a shipment or active contract.`);
    return;
  }
  if(vehicleUsableCapacity(vehicle)<o.qtyPerPeriod){
    pushNote('warn',`Choose a vehicle with at least ${formatMass(o.qtyPerPeriod)} usable payload for this contract.`);
    return;
  }

  state.contracts.push({
    id: uid('con'),
    orgId: org.id,
    orgName: org.name,
    vehicleId: vehicle.id,
    qtyPerPeriod: o.qtyPerPeriod,
    periodDays: o.periodDays,
    minGrade: o.minGrade,
    priceType: o.priceType,
    pricePerUnit: o.pricePerUnit,
    marketMod: o.marketMod,
    penaltyPerUnit: o.penaltyPerUnit,
    startMinute: state.time.minutes,
    nextDueMinute: state.time.minutes + o.periodDays*MINUTES_PER_DAY,
    periods: o.periods,
    periodIndex: 0,
    totalDelivered: 0,
    totalValue: 0,
    deliveredThisPeriod: 0,
    status: 'active'
  });
  org.activeContractId = o.id;
  org.relationship = clamp(org.relationship + 4, 0, 100);
  state.offers = state.offers.filter(x=>x.id !== offerId);
  if(o.qtyPerPeriod > state.stats.largestContract) state.stats.largestContract = o.qtyPerPeriod;
  pushNote('info', `Contract signed with ${org.name}.`);
}

function declineOffer(offerId){
  const o = state.offers.find(x=>x.id===offerId);
  if(!o) return;
  const org = state.organizations.find(x=>x.id===o.orgId);
  if(org) org.relationship = clamp(org.relationship - 3, 0, 100);
  state.offers = state.offers.filter(x=>x.id !== offerId);
}

/* ============================================================================
   SECTION: ORGANIZATION AI
   ============================================================================ */

const ORGANIZATION_PROPERTY_INCOME_MULTIPLIER = 10;

function organizationPropertyIncome(property){
  return Math.round(Math.max(0,Number(property?.incomePerDay)||0)*ORGANIZATION_PROPERTY_INCOME_MULTIPLIER);
}

function orgDaily(org){
  org.demand = clamp(org.demand * randRange(0.975, 1.035), 5, 320);
  org.inventory = Math.max(0, org.inventory - org.demand * randRange(0.08, 0.22));
  org.treasury = (Number(org.treasury)||0) + (org.properties||[]).reduce((sum,property)=>sum+organizationPropertyIncome(property),0);

  // relationship drift toward neutral
  if(org.relationship > 50) org.relationship = clamp(org.relationship - 0.12, 0, 100);
  if(org.relationship < 10) org.relationship = clamp(org.relationship + 0.10, 0, 100);

  // become known over time when relationship grows
  if(org.relationship > 18) org.known = true;

  // growth
  if(org.relationship > 60 && Math.random() < 0.012 && org.members.length < 22){
    org.members.push(PERSON_NAMES[Math.floor(Math.random()*PERSON_NAMES.length)]);
    org.demand = clamp(org.demand * 1.07, 5, 320);
  }

  // offer generation
  const hasContract = state.contracts.some(c => c.orgId === org.id && c.status === 'active');
  if(!hasContract && org.known && org.relationship >= 26 &&
      !state.offers.some(o=>o.orgId===org.id) &&
     state.time.minutes - org.lastOfferMinute > 3*MINUTES_PER_DAY &&
    Math.random() < (0.04 + clamp(state.player.reputation, 1, 1000)/1000*0.10)){
    org.lastOfferMinute = state.time.minutes;
    makeOffer(org);
  }

  // spot purchase (small, immediate)
  if(org.known && org.relationship >= 34 && Math.random() < 0.07){
    spotPurchase(org);
  }
}

function controlledOrganization(){
  const controlled=state.controlledOrganization;
  return controlled ? state.organizations.find(org=>org.id===controlled.orgId) || null : null;
}

function organizationAcquisitionCost(org){
  const treasury=Math.max(0,Number(org.treasury)||0);
  const properties=Array.isArray(org.properties)?org.properties:[];
  const propertyValue=properties.reduce((sum,property)=>sum+Math.max(0,Number(property.value)||0),0);
  const demand=Math.max(0,Number(org.demand)||0);
  const members=Math.max(0,Number(org.members?.length)||0);
  const reach=Math.round(clamp(Number(org.reach)||1,1,4));
  const reliability=clamp(Number(org.reliability)||50,0,100);
  const relationship=clamp(Number(org.relationship)||0,0,100);
  const assetValue=treasury*0.85+propertyValue*0.90+demand*25000+members*75000;
  const reachMultiplier=[0,1.00,1.50,2.25,3.25][reach];
  const reliabilityMultiplier=0.90+(reliability/100)*0.35;
  const resistanceMultiplier=1.20-(relationship/100)*0.25;
  const strategicPremium=5000000+demand*15000+members*25000+reach*3000000;
  return Math.round((assetValue*reachMultiplier*reliabilityMultiplier+strategicPremium)*resistanceMultiplier);
}

function organizationAcquisitionRequirements(org){
  const properties=Array.isArray(org.properties)?org.properties:[];
  const propertyValue=properties.reduce((sum,property)=>sum+Math.max(0,Number(property.value)||0),0);
  const demand=Math.max(0,Number(org.demand)||0);
  const members=Math.max(0,Number(org.members?.length)||0);
  const reach=Math.round(clamp(Number(org.reach)||1,1,4));
  const reliability=clamp(Number(org.reliability)||50,0,100);
  const relationship=clamp(Number(org.relationship)||0,0,100);
  const integration=Math.round((1000000+propertyValue*0.10+members*50000+demand*10000+reach*500000)
    *(1.15-relationship/100*0.30)*(1.15-reliability/100*0.15));
  const operatingReserve=Math.round(demand*10000+members*75000+properties.length*250000+reach*500000);
  const acquisition=organizationAcquisitionCost(org);
  return {acquisition,integration,operatingReserve,requiredLiquidity:acquisition+integration+operatingReserve};
}

function acquireOrganization(orgId){
  if(state.controlledOrganization) return {ok:false,msg:'You already control an organization.'};
  const org=state.organizations.find(item=>item.id===orgId);
  if(!org) return {ok:false,msg:'Organization not found.'};
  const requirements=organizationAcquisitionRequirements(org);
  if(state.player.cash<requirements.requiredLiquidity) return {ok:false,msg:`Acquisition requires ${fmtMoney(requirements.requiredLiquidity)} in liquidity, including ${fmtMoney(requirements.acquisition)} purchase price, ${fmtMoney(requirements.integration)} integration, and ${fmtMoney(requirements.operatingReserve)} operating reserve.`};
  spend('capex',requirements.acquisition,`Organization acquisition — ${org.name}`);
  spend('capex',requirements.integration,`Organization integration — ${org.name}`);
  state.controlledOrganization={
    orgId:org.id,
    name:org.name,
    treasury:Number(org.treasury)||0,
    totalSales:0,
    saleSlots:Array.from({length:3},()=>({state:'raw',grade:'any',dailyLimit:1000})),
    properties:Array.isArray(org.properties)?org.properties:[],
    lastAttackDay:-1
  };
  org.treasury=0;
  org.properties=[];
  org.controlled=true;
  pushNote('important',`You acquired ${org.name}. ${fmtMoney(requirements.operatingReserve)} remains reserved for operations; its treasury transferred as organizational working capital.`);
  return {ok:true,cost:requirements.acquisition,integration:requirements.integration,operatingReserve:requirements.operatingReserve};
}

function setControlledOrganizationName(name){
  const controlled=state.controlledOrganization;
  const org=controlledOrganization();
  if(!controlled||!org) return false;
  const cleanName=String(name||'').trim().slice(0,48);
  if(!cleanName) return false;
  controlled.name=cleanName;
  org.name=cleanName;
  return true;
}

function processControlledOrganizationDaily(){
  const controlled=state.controlledOrganization;
  if(!controlled||!controlledOrganization()) return;
  let totalSales=0;
  let totalSold=0;
  for(const slot of controlled.saleSlots){
    let remaining=Math.max(0,Math.floor(Number(slot.dailyLimit)||0));
    const stacks=state.inventory.filter(stack=>
      stack.qty>0 && (slot.state==='any'||stack.state===slot.state) && (slot.grade==='any'||stack.grade===slot.grade)
    ).sort((a,b)=>GRADE_RANK[b.grade]-GRADE_RANK[a.grade]);
    for(const stack of stacks){
      if(remaining<=0) break;
      const quantity=Math.min(stack.qty,remaining);
      const revenue=Math.round((Number(state.market.price[stack.grade])||1)*quantity);
      removeInventory(stack.id,quantity);
      controlled.treasury+=revenue;
      controlled.totalSales+=revenue;
      totalSales+=revenue;
      totalSold+=quantity;
      recordMarketSupply(stack.grade,quantity);
      remaining-=quantity;
    }
  }
  const propertyIncome=(controlled.properties||[]).reduce((sum,property)=>sum+organizationPropertyIncome(property),0);
  controlled.treasury+=propertyIncome;
  if(totalSold>0){
    state.stats.totalSold+=totalSold;
    state.stats.salesCount++;
    pushNote('financial',`${controlled.name} sold ${formatMass(totalSold)} at market price and added ${fmtMoney(totalSales)} to its treasury.`);
  }
  if(propertyIncome>0) pushNote('financial',`${controlled.name} properties generated ${fmtMoney(propertyIncome)} for the organization.`);
}

function withdrawOrganizationFunds(){
  const controlled=state.controlledOrganization;
  if(!controlled) return {ok:false,msg:'You do not control an organization.'};
  const amount=Math.floor(Number(controlled.treasury)||0);
  if(amount<1) return {ok:false,msg:'The organization treasury is empty.'};
  controlled.treasury-=amount;
  earn('organization',amount,`Withdrawal — ${controlled.name}`);
  pushNote('financial',`Withdrew ${fmtMoney(amount)} from ${controlled.name}.`);
  return {ok:true,amount};
}

function organizationAttackCost(org){
  return Math.round(12000+(Number(org.members?.length)||0)*650+(Number(org.reach)||1)*2500);
}

function organizationAttackChance(target){
  const own=controlledOrganization();
  if(!own) return 0;
  const ownPower=own.members.length*3+own.reliability*0.5+own.reach*8;
  const targetPower=target.members.length*3+target.reliability*0.5+target.reach*8;
  return clamp(0.48+(ownPower-targetPower)/150+clamp(Number(state.player.reputation)||1,1,1000)/2000,0.15,0.85);
}

function attackOrganization(orgId){
  const controlled=state.controlledOrganization;
  const own=controlledOrganization();
  const target=state.organizations.find(org=>org.id===orgId);
  if(!controlled||!own||!target||target.id===own.id) return {ok:false,msg:'Choose a valid rival organization.'};
  if(controlled.lastAttackDay===dayIndex()) return {ok:false,msg:'Your organization can make one attack per day.'};
  const cost=organizationAttackCost(target);
  if(state.player.cash<cost) return {ok:false,msg:`Not enough cash for the operation (${fmtMoney(cost)}).`};
  spend('capex',cost,`Organization operation — ${target.name}`);
  controlled.lastAttackDay=dayIndex();
  if(Math.random()>=organizationAttackChance(target)){
    target.relationship=clamp(target.relationship-12,0,100);
    state.player.reputation=clamp(state.player.reputation-5,1,1000);
    pushNote('important',`${own.name}'s operation against ${target.name} failed. The operation cost ${fmtMoney(cost)}.`);
    return {ok:true,success:false};
  }
  const capturedCash=Math.max(0,Number(target.treasury)||0);
  const capturedProperties=Array.isArray(target.properties)?target.properties:[];
  controlled.treasury+=capturedCash;
  controlled.properties.push(...capturedProperties);
  target.treasury=0;
  target.properties=[];
  target.relationship=clamp(target.relationship-20,0,100);
  pushNote('important',`${own.name} took control of ${capturedProperties.length} properties and ${fmtMoney(capturedCash)} from ${target.name}.`);
  return {ok:true,success:true,capturedCash,capturedProperties:capturedProperties.length};
}

function contractQuantity(org, periodDays, variation){
  const reputation = clamp(Number(state.player.reputation) || 1, 1, 1000);
  const demandQuantity = Math.round((Number(org?.demand) || 0) * (Number(periodDays) || 7) / 7 * (Number(variation) || 1) * 250);
  const reputationFloor = Math.max(2500, Math.round(reputation * 80));
  return Math.max(reputationFloor, demandQuantity, 4000);
}

function largestUsableVehicleCapacity(){
  return state.vehicles.reduce((largest,vehicle)=>Math.max(largest,vehicleUsableCapacity(vehicle)),0);
}

function refreshContractOfferQuantity(offer){
  const org=state.organizations.find(item=>item.id===offer.orgId);
  if(!org) return offer.qtyPerPeriod;
  let quantity=contractQuantity(org,Number(offer.periodDays)||7,1.175);
  const capacity=largestUsableVehicleCapacity();
  if(capacity>0) quantity=Math.min(quantity,capacity);
  offer.qtyPerPeriod=quantity;
  return quantity;
}

function makeOffer(org){
  const periodDays = pick([7,7,7,14]);
  const minGrade = pick(['C','C','B','B','B','A']);
  const demandQty = contractQuantity(org,periodDays,randRange(0.9,1.45));
  let baseQty = demandQty;
  const largestVehicle = largestUsableVehicleCapacity();
  if(largestVehicle > 0) baseQty = Math.min(baseQty, largestVehicle);
  const priceType = Math.random() < 0.55 ? 'fixed' : 'market';
  const refGrade = minGrade;
  const refPrice = state.market.price[refGrade] || state.market.base[refGrade];
  const marketMod = randRange(0.96, 1.16);
  const pricePerUnit = Math.round(refPrice * marketMod * randRange(0.95, 1.08));

  state.offers.push({
    id: uid('off'),
    orgId: org.id,
    orgName: org.name,
    qtyPerPeriod: baseQty,
    periodDays,
    minGrade,
    priceType,
    pricePerUnit,
    marketMod,
    penaltyPerUnit: Math.round(pricePerUnit * 0.35),
    periods: pick([4,6,8]),
    expiresMinute: state.time.minutes + 5*MINUTES_PER_DAY,
    createdMinute: state.time.minutes
  });
  pushNote('info', `${org.name} is requesting a supply contract.`);
}

function spotPurchase(org){
  const minRank = 2; // C or better
  const eligible = state.inventory
    .filter(s => GRADE_RANK[s.grade] >= minRank)
    .sort((a,b)=> GRADE_RANK[a.grade]-GRADE_RANK[b.grade]);
  if(eligible.length === 0) return;

  const qtyWanted = Math.round(randRange(5, 30));
  let remaining = qtyWanted, revenue = 0, delivered = 0;
  for(const s of eligible){
    if(remaining <= 0) break;
    const take = Math.min(s.qty, remaining);
    const unit = (state.market.price[s.grade]||1) * randRange(0.92, 1.02);
    removeInventory(s.id, take);
    recordMarketSupply(s.grade, take);
    revenue += unit*take;
    delivered += take;
    remaining -= take;
  }
  if(delivered > 0){
    earn('sale', Math.round(revenue), `Spot purchase — ${org.name} (${delivered}u)`);
    org.relationship = clamp(org.relationship + 1.2, 0, 100);
    org.totalTraded += revenue;
    state.stats.totalSold += delivered;
    pushNote('financial', `${org.name} bought ${delivered} units for ${fmtMoney(revenue)}.`);
  }
}

function organizationCooperationCost(org){
  return Math.round(160000 + (Number(org.demand)||0)*4000 + (Number(org.reach)||1)*35000);
}

function cooperateWithOrganization(orgId){
  const org=state.organizations.find(o=>o.id===orgId);
  if(!org) return {ok:false,msg:'Organization not found.'};
  if(org.known) return {ok:false,msg:'You already work with this organization.'};
  const cost=organizationCooperationCost(org);
  if(state.player.cash<cost) return {ok:false,msg:`Not enough cash for the one-time cooperation fee (${fmtMoney(cost)}).`};
  spend('capex',cost,`Organization cooperation — ${org.name}`);
  org.known=true;
  org.relationship=Math.max(34,Number(org.relationship)||0);
  org.lastOfferMinute=state.time.minutes-4*MINUTES_PER_DAY;
  pushNote('important',`Paid cooperation fee and established a partnership with ${org.name}.`);
  return {ok:true,cost};
}

function sellToOrganization(orgId,stackId,quantity,vehicleId,driverId,securityId){
  const org=state.organizations.find(o=>o.id===orgId && o.known);
  const stack=state.inventory.find(s=>s.id===stackId);
  const vehicle=state.vehicles.find(v=>v.id===vehicleId);
  quantity=Math.floor(Number(quantity)||0);
  if(!org || !stack || !vehicle) return {ok:false,msg:'Choose a partner, inventory stack, and vehicle.'};
  if(quantity<1 || quantity>stack.qty) return {ok:false,msg:'Invalid sale quantity.'};
  if(quantity>vehicleUsableCapacity(vehicle)) return {ok:false,msg:`This load exceeds the vehicle payload of ${formatMass(vehicleUsableCapacity(vehicle))}.`};
  const unitPrice=Math.round((state.market.price[stack.grade]||1)*randRange(0.88,1.16));
  const revenue=Math.round(unitPrice*quantity);
  const shipment=makeShipment(vehicle.id,quantity,'centro',org.region||'centro',null,null,{orgId:org.id,driverId,securityId});
  if(!shipment) return {ok:false,msg:'Unable to schedule this shipment.'};
  shipment.organizationSale=true;
  shipment.orgId=org.id;
  shipment.orgName=org.name;
  shipment.grade=stack.grade;
  shipment.value=revenue;
  shipment.items=[{grade:stack.grade,quantity,unitPrice}];
  removeInventory(stack.id,quantity);
  pushNote('info',`${formatMass(quantity)} grade ${stack.grade} dispatched to ${org.name} in ${vehicle.name}; estimated round trip ${minutesToClock(shipment.duration)}.`);
  return {ok:true,revenue,unitPrice,shipment};
}

function dailyWages(){
  if(state.people.length === 0) return;
  let total = 0;
  for(const p of state.people) total += p.wage;
  spend('wages', total, `Payroll — ${state.people.length} people`);
  if(state.player.cash < 0){
    pushNote('warn', 'Cash is negative. Payroll caused an overdraft.');
  }
}

function hireCandidate(id){
  const i = state.candidates.findIndex(c=>c.id===id);
  if(i < 0) return;
  const c = state.candidates[i];
  state.people.push({
    id: uid('per'),
    name: c.name,
    role: c.role,
    reliability: c.reliability,
    skill: c.skill,
    wage: c.wage,
    relationship: c.relationship,
    gardenId: null,
    jobType: c.role==='seller' ? 'sell_messages' : c.role==='restocker' ? 'restock' : 'idle',
    seedGenetics: 'G1',
    carePackage: 'standard',
    dryGrade: 'D',
    dryMode: 'short',
    dryQuantity: 'all',
    sellGrade: 'any',
    sellRule: 'always',
    sellMinPrice: 0,
    productRecipeId: PRODUCT_RECIPES[0].id,
    productWorkDay: -1,
    productUnitsToday: 0,
    messageWorkDay: -1,
    messagesHandledToday: 0,
    restockState: 'raw',
    restockGrade: 'D',
    restockDealerId: null,
    restockDealerIndex: 0,
    restockNextMinute: state.time.minutes,
    hiredMinute: state.time.minutes
  });
  state.candidates.splice(i,1);
  pushNote('info', `Hired ${c.name} (${c.role}) at ${fmtMoney(c.wage)}/day.`);
}

function firePerson(id){
  const i = state.people.findIndex(p=>p.id===id);
  if(i < 0) return;
  const p = state.people[i];
  for(const g of state.gardens){
    const j = g.workers.indexOf(p.id);
    if(j >= 0) g.workers.splice(j,1);
  }
  state.people.splice(i,1);
  pushNote('warn', `${p.name} was let go.`);
}

function assignWorker(personId, gardenId){
  const p = state.people.find(x=>x.id===personId);
  if(!p) return;
  if(p.role==='worker' && gardenId && gardenId!=='none'){
    const assigned = state.people.filter(x=>x.id!==p.id && x.role==='worker' && x.jobType==='cultivate' && x.gardenId===gardenId).length;
    if(assigned >= 3) return false;
  }
  for(const g of state.gardens){
    const j = g.workers.indexOf(p.id);
    if(j >= 0) g.workers.splice(j,1);
  }
  if(gardenId && gardenId !== 'none'){
    const g = getGarden(gardenId);
    if(g && p.role==='worker') g.workers.push(p.id);
    p.gardenId = g ? g.id : null;
    if(p.role==='worker') p.jobType = g ? 'cultivate' : 'idle';
  } else {
    p.gardenId = null;
    if(p.role==='worker') p.jobType = 'idle';
  }
  return true;
}

function setWorkerJob(personId, jobType){
  const p = state.people.find(x=>x.id===personId);
  if(!p || p.role!=='worker' || !['idle','cultivate','dry','product'].includes(jobType)) return false;
  if(jobType==='cultivate'){
    const hasRoom = g=>state.people.filter(x=>x.id!==p.id && x.role==='worker' && x.jobType==='cultivate' && x.gardenId===g.id).length < 3;
    const currentGarden = getGarden(p.gardenId);
    const gardenId = currentGarden && hasRoom(currentGarden) ? currentGarden.id : (state.gardens.find(hasRoom)||{}).id;
    if(!gardenId || !assignWorker(p.id,gardenId)) return false;
    p.jobType = 'cultivate';
    return true;
  }
  for(const g of state.gardens) g.workers = g.workers.filter(id=>id!==p.id);
  p.gardenId = null;
  p.jobType = jobType;
  return true;
}

function refreshCandidates(){
  if(!Array.isArray(state.candidates)) state.candidates=[];
  while(state.candidates.length < 10){
    state.candidates.push(makeCandidate());
  }
  if(state.candidates.length > 10) state.candidates.length=10;
}

function resetCandidateMarket(){
  state.candidates=[];
  refreshCandidates();
  state.candidateMarketWeek=Math.floor(dayIndex()/7);
  pushNote('info','The weekly hiring market has refreshed with 10 candidates.');
}

function automateWorkerProduction(){
  automateSellerMessages();
  for(const p of state.people){
    if(p.role==='restocker'){
      processRestocker(p);
      continue;
    }
    if(p.role!=='worker') continue;
    if(p.jobType==='cultivate'){
      const g = getGarden(p.gardenId);
      if(!g || state.batches.some(b=>b.gardenId===g.id)) continue;
      const geneticsId=p.seedGenetics||'G1';
      const freeCapacity=gardenFreeCapacity(g);
      let available = state.seeds.filter(s=>s.genetics===geneticsId);
      const missingSeeds=freeCapacity-available.length;
      if(missingSeeds>0 && workerBuySeedPouches(p,geneticsId,Math.ceil(missingSeeds/10))){
        available = state.seeds.filter(s=>s.genetics===geneticsId);
      }
      const qty = Math.min(freeCapacity, available.length);
      if(qty > 0) startBatch(g.id, available.slice(0,qty).map(s=>s.id), p.carePackage||'standard');
    } else if(p.jobType==='dry' && !state.drying.some(d=>d.workerId===p.id)){
      const stack = state.inventory.find(s=>s.state==='raw' && s.grade===(p.dryGrade||'D'));
      if(!stack) continue;
      const free = dryingCapacity()-inventoryUsedInDrying();
      const wanted = p.dryQuantity==='one' ? 1 : stack.qty;
      const qty = Math.min(wanted, free);
      if(qty > 0) startDrying(stack.id, qty, p.dryMode||'short', p.id);
    } else if(p.jobType==='product'){
      produceWorkerProduct(p);
    }
  }
}

function processRestocker(person){
  if(!state.dealers.length || state.time.minutes < (Number(person.restockNextMinute)||0)) return;
  let dealer=state.dealers.find(d=>d.id===person.restockDealerId);
  if(!dealer){
    const nextIndex=Math.max(0,Number(person.restockDealerIndex)||0)%state.dealers.length;
    dealer=state.dealers[nextIndex];
  }
  if(!Array.isArray(dealer.inventory)) dealer.inventory=[];
  let freeMass=Math.max(0,(Number(dealer.capacityGrams)||0)-dealerInventoryMass(dealer));
  const restockState=person.restockState||'raw';
  const selectedStacks=state.inventory.filter(stack=>
    stack.qty>0 && (restockState==='random' || stack.state===restockState) &&
    (restockState==='random' || stack.grade===(person.restockGrade||'D'))
  );
  if(restockState==='random'){
    for(let index=selectedStacks.length-1;index>0;index--){
      const swapIndex=randInt(0,index);
      [selectedStacks[index],selectedStacks[swapIndex]]=[selectedStacks[swapIndex],selectedStacks[index]];
    }
  }
  for(const stack of selectedStacks){
    freeMass=Math.max(0,(Number(dealer.capacityGrams)||0)-dealerInventoryMass(dealer));
    if(freeMass<1) break;
    const quantity=Math.min(stack.qty,freeMass);
    if(quantity>0) transferDealerStock(dealer.id,'biomass',stack.id,quantity);
  }
  const dealerIndex=state.dealers.findIndex(d=>d.id===dealer.id);
  person.restockDealerIndex=(dealerIndex+1)%state.dealers.length;
  person.restockDealerId=state.dealers[person.restockDealerIndex].id;
  person.restockNextMinute=state.time.minutes+randInt(120,240);
}

function automateSellerMessages(){
  for(const person of state.people){
    if(person.role!=='seller'||!['messages','sell_messages'].includes(person.jobType)) continue;
    if(person.messageWorkDay!==dayIndex()){
      person.messageWorkDay=dayIndex();
      person.messagesHandledToday=0;
    }
    let remaining=10-(Number(person.messagesHandledToday)||0);
    for(const message of state.messages.filter(m=>m.status==='new')){
      if(remaining<=0) break;
      const eligible=state.inventory
        .filter(s=>s.qty>0&&GRADE_RANK[s.grade]>=GRADE_RANK[message.grade])
        .sort((a,b)=>GRADE_RANK[a.grade]-GRADE_RANK[b.grade]);
      if(eligible.reduce((sum,s)=>sum+s.qty,0)<message.qty) continue;
      const result=acceptCustomerMessage(message.id,marketSellPrice(message.grade));
      if(!result.ok) continue;
      person.messagesHandledToday++;
      remaining--;
      for(const stack of eligible){
        if(result.order.remainingQty<=0) break;
        deliverCustomerOrder(result.order.id,stack.id,Math.min(stack.qty,result.order.remainingQty));
      }
      pushNote('financial',`${person.name} completed ${message.customerName}'s order at market price.`);
    }
  }
}

function automateSellers(){
  const gradeRank = { S:5, A:4, B:3, C:2, D:1 };
  for(const p of state.people){
    if(p.role!=='seller' || !['sell','sell_messages'].includes(p.jobType)) continue;
    let remaining = 100;
    const stacks = state.inventory.filter(s=>p.sellGrade==='any' || s.grade===p.sellGrade)
      .sort((a,b)=>gradeRank[b.grade]-gradeRank[a.grade]);
    for(const stack of stacks){
      if(remaining<=0) break;
      if(p.sellRule==='minimum' && (state.market.price[stack.grade]||0) < (Number(p.sellMinPrice)||0)) continue;
      const qty = Math.min(remaining, stack.qty);
      const result = sellBulk(stack.id,qty);
      if(result.ok) remaining-=qty;
    }
  }
}

/* ============================================================================
   SECTION: DAILY TICK / EVENTS
   ============================================================================ */

function dailyTick(){
  // wages
  dailyWages();

  // maintenance & upkeep
  let maint = 0;
  for(const g of state.gardens) maint += g.maintenancePerDay;
  for(const v of state.vehicles) maint += v.maintenancePerDay;
  for(const f of state.facilities) maint += f.upkeepPerDay;
  if(maint > 0) spend('maintenance', maint, 'Daily upkeep & maintenance');

  // garden condition decay
  for(const g of state.gardens){
    const technicians = state.people.filter(p=>p.role==='technician' && p.gardenId===g.id).length;
    const decay = 0.0032 - technicians*0.0016;
    g.condition = clamp(g.condition - Math.max(0.0006, decay), 0.35, 1.0);
  }
  // vehicle condition decay
  for(const v of state.vehicles){
    v.condition = clamp(v.condition - 0.0025, 0.25, 1.0);
  }

  // debt interest
  if(state.player.debt > 0){
    const interest = Math.round(state.player.debt * 0.0016);
    state.player.debt += interest;
    ledgerAdd('interest', -interest, 'Loan interest');
  }

  // market
  driftMarket();

  // organizations
  for(const org of state.organizations){
    if(org.id!==state.controlledOrganization?.orgId) orgDaily(org);
  }
  processControlledOrganizationDaily();

  // expire offers
  const before = state.offers.length;
  state.offers = state.offers.filter(o => o.expiresMinute > state.time.minutes);
  if(state.offers.length < before) pushNote('info', 'A contract offer expired.');

  expireCustomerOrders();

  // automated sales
  automateSellers();
  processDealersDaily();
  refreshDealerCandidates();

  // Customer order requests
  processCustomerMessages();

  // Candidate market refreshes once per in-game week.
  const candidateWeek=Math.floor(dayIndex()/7);
  if(candidateWeek>(Number(state.candidateMarketWeek)||0)) resetCandidateMarket();

  // random events
  maybeEvent();

}

function maybeEvent(){
  if(Math.random() > 0.18) return;
  const roll = Math.random();
  const m = state.market;

  if(roll < 0.16){
    // fertilizer price shift
    const sup = state.suppliers.find(s=>s.type==='fertilizer');
    if(sup){
      const dir = Math.random() < 0.5 ? 1 : -1;
      const pct = randRange(0.04, 0.14);
      sup.retail = Math.round(clamp(sup.retail * (1 + dir*pct), 60, 220));
      sup.bulk = Math.round(clamp(sup.bulk * (1 + dir*pct), 12, 70));
      pushNote('warn', `Fertilizer prices ${dir>0?'increased':'decreased'} ${(pct*100).toFixed(0)}%.`);
    }
  } else if(roll < 0.40){
    // demand shift
    const g = pick(GRADES);
    const dir = Math.random() < 0.55 ? 1 : -1;
    const pct = randRange(0.05, 0.22);
    m.demand[g] = clamp(m.demand[g] * (1 + dir*pct), 0.45, 1.85);
    pushNote('info', `Market demand for grade ${g} ${dir>0?'rose':'fell'} ~${(pct*100).toFixed(0)}%.`);
  } else if(roll < 0.55){
    // dependency index
    const dir = Math.random() < 0.5 ? 1 : -1;
    m.dependencyIndex = clamp(m.dependencyIndex + dir*randRange(2,7), 8, 92);
    pushNote('info', `Market Dependency Index is now ${m.dependencyIndex.toFixed(0)}.`);
  } else if(roll < 0.70){
    // worker unavailable
    if(state.people.length > 0){
      const p = pick(state.people);
      p.reliability = clamp(p.reliability - randInt(3,10), 5, 100);
      pushNote('warn', `${p.name} has been unreliable lately.`);
    }
  } else if(roll < 0.82){
    // vehicle maintenance
    if(state.vehicles.length > 0){
      const v = pick(state.vehicles);
      const cost = Math.round(randRange(800, 4200));
      if(state.player.cash > cost){
        spend('maintenance', cost, `Repairs — ${v.name}`);
        v.condition = clamp(v.condition + 0.12, 0, 1);
        pushNote('warn', `${v.name} required repairs (${fmtMoney(cost)}).`);
      }
    }
  } else if(roll < 0.92){
    // garden production issue
    const active = state.batches.length > 0 ? pick(state.batches) : null;
    if(active){
      const g = getGarden(active.gardenId);
      active.condition = clamp(active.condition - randRange(0.04, 0.12), 0.05, 0.98);
      pushNote('warn', `Pest/condition pressure in ${g?g.name:'garden'} — quality conditions reduced.`);
    }
  } else {
    // Keep market events outcome-driven instead of granting random reputation.
    pushNote('info', 'Market conditions shifted without changing your standing in the region.');
  }
}

/* ============================================================================
   SECTION: SAVE / LOAD
   ============================================================================ */

function save(){
  try{
    state.lastSaved = new Date().toISOString();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    document.getElementById('saveInd').textContent = 'Saved ' + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('saveInd').textContent = 'Save failed';
  }
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!validateSave(data)) return false;
    state = migrate(data);
    return true;
  }catch(e){ return false; }
}

function validateSave(d){
  if(!d || typeof d !== 'object') return false;
  if(typeof d.saveVersion !== 'number') return false;
  if(!d.time || typeof d.time.minutes !== 'number') return false;
  if(!d.player || typeof d.player.cash !== 'number') return false;
  if(!Array.isArray(d.gardens)) return false;
  if(!Array.isArray(d.inventory)) return false;
  if(!d.market || !d.market.price) return false;
  return true;
}

function syncGardenExpansionState(){
  const growLevel = Array.isArray(state?.facilities)
    ? state.facilities.filter(f => f.type === 'grow').reduce((sum, f) => sum + (Number(f.level) || 0), 0)
    : 0;
  for(const g of state.gardens){
    const base = Number(g.baseCapacity ?? g.capacity ?? 0) || 0;
    g.baseCapacity = base;
    g.capacity = base;
    g.expansionLevel = clamp(Math.min(GARDEN_EXPANSION_MAX_LEVEL, Math.max(0, Number(g.expansionLevel) || 0, growLevel)), 0, GARDEN_EXPANSION_MAX_LEVEL);
    g.laborNeed = gardenLaborNeed(g);
  }
}

function migrate(d){
  if(!d || typeof d !== 'object') return d;
  const originalSaveVersion=Number(d.saveVersion)||0;
  const savedCandidateMarketWeek=Number(d.candidateMarketWeek);
  if(d.saveVersion < SAVE_VERSION) {
    d.saveVersion = SAVE_VERSION;
  }
  const base = createGame();
  for(const k of Object.keys(base)){
    if(d[k] === undefined) d[k] = base[k];
  }

  d.flags = d.flags || { distributionUnlocked:false };
  d.flags.distributionUnlocked = !!d.flags.distributionUnlocked;
  delete d.flags.debug;

  d.settings = d.settings || { autosave:true };
  d.supplies = d.supplies || { fertilizer:0, medium:0 };
  d.products = Array.isArray(d.products) ? d.products : [];
  d.productBatches = Array.isArray(d.productBatches) ? d.productBatches : [];
  d.dealers = Array.isArray(d.dealers) ? d.dealers : [];
  d.dealerCandidates = Array.isArray(d.dealerCandidates) ? d.dealerCandidates : [];
  d.wholesale = d.wholesale && typeof d.wholesale==='object' ? d.wholesale : {level:1,slots:[]};
  d.wholesale.level=clamp(Math.floor(Number(d.wholesale.level)||1),1,17);
  d.wholesale.slots=Array.isArray(d.wholesale.slots) ? d.wholesale.slots : [];
  const requiredSlots=Math.min(40,WHOLESALE_BASE_SLOTS+(d.wholesale.level-1)*2);
  while(d.wholesale.slots.length<requiredSlots) d.wholesale.slots.push({productId:null,quantity:0});
  d.wholesale.slots=d.wholesale.slots.slice(0,requiredSlots);
  for(const slot of d.wholesale.slots){
    slot.quantity=clamp(Math.floor(Number(slot.quantity)||0),0,WHOLESALE_SLOT_CAPACITY);
    if(!slot.productId) slot.quantity=0;
  }
  if(!Number.isFinite(d.lastWholesaleHour)) d.lastWholesaleHour=Math.floor((Number(d.time.minutes)||0)/60);
  d.player.organizationName=String(d.player.organizationName||'Los Cabrones');
  if(d.player.organizationName==='Ruta del Sur Trading') d.player.organizationName='Los Cabrones';
  for(const org of d.organizations||[]){
    delete org.cash;
    if(!Number.isFinite(org.distanceKm) || org.distanceKm<1) org.distanceKm=randInt(40,500);
    org.treasury=Math.max(0,Number(org.treasury)||randInt(25000,125000));
    if(!Array.isArray(org.properties)) org.properties=Array.from({length:randInt(1,3)},()=>({
      id:uid('property'),name:pick(PROPERTY_NAMES),incomePerDay:randInt(900,4200),value:randInt(70000,320000)
    }));
    for(const property of org.properties){
      property.id=property.id||uid('property');
      property.name=String(property.name||pick(PROPERTY_NAMES));
      property.incomePerDay=Math.max(0,Number(property.incomePerDay)||randInt(900,4200));
      property.value=Math.max(0,Number(property.value)||randInt(70000,320000));
    }
  }
  if(d.controlledOrganization&&typeof d.controlledOrganization==='object'){
    const controlled=d.controlledOrganization;
    const org=(d.organizations||[]).find(item=>item.id===controlled.orgId);
    if(!org){
      d.controlledOrganization=null;
    }else{
      controlled.name=String(controlled.name||org.name);
      org.name=controlled.name;
      controlled.treasury=Math.max(0,Number(controlled.treasury)||0);
      controlled.totalSales=Math.max(0,Number(controlled.totalSales)||0);
      controlled.properties=Array.isArray(controlled.properties)?controlled.properties:[];
      controlled.saleSlots=Array.isArray(controlled.saleSlots)?controlled.saleSlots:[];
      controlled.saleSlots=controlled.saleSlots.slice(0,3);
      while(controlled.saleSlots.length<3) controlled.saleSlots.push({state:'raw',grade:'any',dailyLimit:1000});
      for(const slot of controlled.saleSlots){
        if(!['raw','dried','processed','any'].includes(slot.state)) slot.state='raw';
        if(!['any',...GRADES].includes(slot.grade)) slot.grade='any';
        slot.dailyLimit=clamp(Math.floor(Number(slot.dailyLimit)||0),0,1000000);
      }
      controlled.lastAttackDay=Number.isFinite(controlled.lastAttackDay)?Math.floor(controlled.lastAttackDay):-1;
      org.treasury=0;
      org.properties=[];
      org.controlled=true;
    }
  }else{
    d.controlledOrganization=null;
  }
  if(originalSaveVersion<4) d.player.reputation=(Number(d.player.reputation)||1)*10;
  d.player.reputation=clamp(Number(d.player.reputation)||1,1,1000);
  d.offers = d.offers || [];
  d.potentialCustomers = d.potentialCustomers || [];
  d.customers = d.customers || [];
  d.messages = d.messages || [];
  d.customerOrders = d.customerOrders || [];
  d.candidates = d.candidates || [];
  d.harvestReports = d.harvestReports || [];
  d.shipments = d.shipments || [];
  d.market = d.market || { base:{S:25,A:13,B:6.5,C:2.8,D:1.1}, price:{S:25,A:13,B:6.5,C:2.8,D:1.1}, prev:{S:25,A:13,B:6.5,C:2.8,D:1.1}, demand:{S:1,A:1,B:1,C:1,D:1}, momentum:{S:0,A:0,B:0,C:0,D:0}, supplyByGrade:{S:0,A:0,B:0,C:0,D:0}, dependencyIndex:34, supplyPressure:0, depth:10000 };
  d.market.depth = Number(d.market.depth) || 10000;
  d.market.momentum = d.market.momentum || { S:0, A:0, B:0, C:0, D:0 };
  d.market.supplyByGrade = d.market.supplyByGrade || { S:0, A:0, B:0, C:0, D:0 };
  d.market.price = { ...MARKET_PRICE_BASE, ...(d.market.price || {}) };
  d.market.prev = { ...d.market.price, ...(d.market.prev || {}) };
  d.market.base = { ...MARKET_PRICE_BASE };
  d.market.sellPrice = { ...d.market.price, ...(d.market.sellPrice || {}) };
  for(const grade of GRADES){
    const [low,high]=MARKET_PRICE_BANDS[grade];
    d.market.price[grade]=clamp(Number(d.market.price[grade])||MARKET_PRICE_BASE[grade],low,high);
    d.market.prev[grade]=clamp(Number(d.market.prev[grade])||d.market.price[grade],low,high);
    d.market.sellPrice[grade]=clamp(Number(d.market.sellPrice[grade])||d.market.price[grade],low,high);
  }
  delete d.market.history;
  delete d.market.retailMultiplier;

  if(Array.isArray(d.batches)){
    for(const b of d.batches){
      if(!Array.isArray(b.plants)) b.plants = [];
      if(!Array.isArray(b.seeds)) b.seeds = [];
      if(!Number.isFinite(b.expectedBiomassTotal)) b.expectedBiomassTotal = (b.plants || []).reduce((sum,p)=>sum + (p.biomass || 0), 0);
    }
  }

  if(Array.isArray(d.inventory)){
    for(const stack of d.inventory){
      if(!stack) continue;
      stack.qty = Number(stack.qty) || 0;
      if(stack.qty < 0) stack.qty = 0;
      stack.qty = Math.round(stack.qty);
      if(!stack.state) stack.state = 'raw';
      if(!stack.grade) stack.grade = 'B';
      if(!stack.variant) stack.variant = null;
      if(!Number.isFinite(stack.unitCost) || stack.unitCost < 0) stack.unitCost = 0;
    }
  }

  d.candidates = (d.candidates || []).filter(c=>c.role!=='manager');
  d.candidateMarketWeek=Number.isFinite(savedCandidateMarketWeek)
    ? Math.max(0,Math.floor(savedCandidateMarketWeek))
    : Math.floor(Math.floor(Number(d.time.minutes)||0)/MINUTES_PER_DAY/7);
  for(const product of d.products){
    product.quantity=Math.max(0,Math.floor(Number(product.quantity)||0));
    product.unitPrice=Math.max(1,Number(product.unitPrice)||1);
    product.weightGrams=Math.max(1,Number(product.weightGrams)||1);
  }
  for(const dealer of d.dealers){
    dealer.capacityGrams=Math.max(1000,Number(dealer.capacityGrams)||1000);
    dealer.dailyRateGrams=clamp(Number(dealer.dailyRateGrams)||Math.min(5000,dealer.capacityGrams),1000,dealer.capacityGrams);
    dealer.inventory=Array.isArray(dealer.inventory)?dealer.inventory:[];
    for(const stock of dealer.inventory){
      if(stock.kind==='product'){
        stock.quantity=Math.max(0,Math.floor(Number(stock.quantity)||0));
        stock.weightGrams=Math.max(1,Number(stock.weightGrams)||1);
      }else{
        stock.kind='biomass';
        stock.qty=Math.max(0,Math.floor(Number(stock.qty)||0));
        stock.state=stock.state||'raw';
        stock.grade=stock.grade||'B';
        stock.variant=stock.variant||null;
        stock.unitCost=Math.max(0,Number(stock.unitCost)||0);
      }
    }
  }
  for(const f of d.facilities || []){
    if(f.type === 'admin'){
      f.type = 'distribution';
      f.name = 'Channel Distribution';
    }
    if(f.type === 'grow' && Number(f.level) <= 0){ f.level = 1; }
    f.level = clamp(Math.floor(Number(f.level)||1),1,FACILITY_MAX_LEVEL[f.type]||1);
    if(f.type === 'distribution') d.flags.distributionUnlocked = true;
  }

  const distributionFacilities = (d.facilities || []).filter(f => f.type === 'distribution');
  if(distributionFacilities.length === 0){
    d.facilities.push({ id: uid('fac'), type:'distribution', name:'Channel Distribution', level:1, upkeepPerDay:38, builtMinute:d.time.minutes || 0 });
    d.flags.distributionUnlocked = true;
  } else if(distributionFacilities.length > 1){
    const primary = distributionFacilities[0];
    const mergedLevel = distributionFacilities.reduce((sum, f) => sum + (Number(f.level) || 1), 0);
    primary.level = clamp(Math.max(1, mergedLevel),1,FACILITY_MAX_LEVEL.distribution);
    primary.upkeepPerDay = distributionFacilities.reduce((sum, f) => sum + (Number(f.upkeepPerDay) || 0), 0);
    d.facilities = d.facilities.filter(f => f.type !== 'distribution' || f === primary);
  }

  if(Array.isArray(d.vehicles)){
    const legacyCap = { pickup:50000, van:150000, truck:500000 };
    for(const vehicle of d.vehicles){
      const target = legacyCap[vehicle.type] || vehicle.capacity || 50000;
      const oldCap = Number(vehicle.capacity);
      if(!Number.isFinite(oldCap) || oldCap <= 0 || [250,500,1200].includes(oldCap) || oldCap < 2000){
        vehicle.capacity = target;
      }
      if(!Number.isFinite(vehicle.condition) || vehicle.condition <= 0) vehicle.condition = 0.85;
      if(!Number.isFinite(vehicle.maintenancePerDay) || vehicle.maintenancePerDay < 0) vehicle.maintenancePerDay = 38;
      const vehicleDef=VEHICLE_TYPES.find(v=>v.id===vehicle.type);
      const legacyVehicleDef=vehicle.type==='van'
        ? VEHICLE_TYPES.find(v=>v.id==='compact_van')
        : vehicle.type==='truck' ? VEHICLE_TYPES.find(v=>v.id==='light_truck') : null;
      const vehiclePriceDef=vehicleDef||legacyVehicleDef;
      if(!Number.isFinite(vehicle.purchasePrice) || vehicle.purchasePrice<=0){
        vehicle.purchasePrice=vehicle.name?.startsWith('Used ') && vehiclePriceDef?.used
          ? Math.round((vehiclePriceDef.used[0]+vehiclePriceDef.used[1])/2)
          : vehiclePriceDef?.cost||0;
      }
      vehicle.speedKmh=Number(vehicle.speedKmh)||vehicleDef?.speedKmh||60;
      vehicle.fuelCostPerKm=Number(vehicle.fuelCostPerKm)||vehicleDef?.fuelCostPerKm||2.97;
    }
  }

  if(Array.isArray(d.gardens)){
    for(const g of d.gardens){
      if(!Array.isArray(g.workers)) g.workers = [];
      if(!g.profile) g.profile = 'standard';
      const profile = GARDEN_PROFILES.find(p => p.id === g.profile) || GARDEN_PROFILES[1];
      const base = Number(g.baseCapacity) || Number(g.capacity) || profile.capacity || 0;
      g.baseCapacity = Math.max(0, Number(base) || 0);
      g.capacity = g.baseCapacity;
      const inferred = Number(g.expansionLevel);
      if(!Number.isFinite(inferred) || inferred < 0 || inferred > GARDEN_EXPANSION_MAX_LEVEL){
        const previous = Number(g.capacity) || base;
        const ratio = previous > 0 && base > 0 ? previous / base : 1;
        g.expansionLevel = clamp(Math.round((ratio - 1) / 0.20), 0, GARDEN_EXPANSION_MAX_LEVEL);
      } else {
        g.expansionLevel = clamp(Math.round(inferred), 0, GARDEN_EXPANSION_MAX_LEVEL);
      }
      g.laborNeed = gardenLaborNeed(g);
    }
  }

  const growLevel = (d.facilities || []).filter(f => f.type === 'grow').reduce((sum, f) => sum + (Number(f.level) || 0), 0);
  if(growLevel > 0){
    for(const g of d.gardens || []){
      g.expansionLevel = clamp(growLevel, 0, GARDEN_EXPANSION_MAX_LEVEL);
      g.laborNeed = gardenLaborNeed(g);
    }
  }

  for(const p of d.people || []){
    if(!p.jobType) p.jobType = p.role==='seller' ? 'sell_messages' : p.role==='worker' && p.gardenId ? 'cultivate' : 'idle';
    if(originalSaveVersion<SAVE_VERSION && p.role==='seller' && p.jobType==='sell') p.jobType='sell_messages';
    if(!p.seedGenetics) p.seedGenetics = 'G1';
    if(!p.carePackage) p.carePackage = 'standard';
    if(!p.dryGrade) p.dryGrade = 'D';
    if(!p.dryMode) p.dryMode = 'short';
    if(!p.dryQuantity) p.dryQuantity = 'all';
    if(!p.sellGrade) p.sellGrade = 'any';
    if(!p.sellRule) p.sellRule = 'always';
    if(p.sellMinPrice===undefined) p.sellMinPrice = 0;
    if(!p.productRecipeId) p.productRecipeId = PRODUCT_RECIPES[0].id;
    if(!Number.isFinite(p.productWorkDay)) p.productWorkDay = -1;
    if(!Number.isFinite(p.productUnitsToday)) p.productUnitsToday = 0;
    if(!Number.isFinite(p.messageWorkDay)) p.messageWorkDay = -1;
    if(!Number.isFinite(p.messagesHandledToday)) p.messagesHandledToday = 0;
    if(!['raw','dried','processed','random'].includes(p.restockState)) p.restockState = 'raw';
    if(!GRADES.includes(p.restockGrade)) p.restockGrade = 'D';
    if(!Number.isFinite(p.restockDealerIndex)) p.restockDealerIndex = 0;
    if(!Number.isFinite(p.restockNextMinute)) p.restockNextMinute = Number(d.time.minutes)||0;
    if(!p.restockDealerId) p.restockDealerId = null;
  }
  for(const g of d.gardens || []){
    g.workers = [];
    for(const p of d.people.filter(x=>x.role==='worker' && x.jobType==='cultivate' && x.gardenId===g.id)){
      if(g.workers.length<3) g.workers.push(p.id);
      else { p.gardenId = null; p.jobType = 'idle'; }
    }
  }

  if(!Array.isArray(d.gardens) || d.gardens.length === 0) {
    d.gardens = [makeGarden('La Esperanza', 'centro', 'standard')];
  }

  d.gardens = d.gardens.slice(0, MAX_GARDENS);
  d.saveVersion = SAVE_VERSION;
  return d;
}

function exportSave(){
  const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = 'savegame_' + d.toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  pushNote('info', 'Save exported.');
}

function importSave(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!validateSave(data)){ alert('Invalid save file.'); return; }
      const migrated = migrate(data);
      state = migrated;
      save();
      render();
      pushNote('info', 'Save imported successfully.');
    }catch(err){
      alert('Invalid save file.');
    }
  };
  reader.readAsText(file);
}

function resetGame(){
  if(!confirm('Are you sure? This will permanently erase the current local save.')) return;
  localStorage.removeItem(SAVE_KEY);
  state = createGame();
  UI.tab = 'dashboard';
  save();
  render();
}

function actBuySeeds(geneticsId, pouches){
  const gen = geneticsById(geneticsId);
  const cost = gen.price * pouches;
  if(state.player.cash < cost) return alert('Not enough cash.');
  spend('inputs', cost, `Seeds — ${pouches} pouch(es) ${gen.name}`);
  addSeedPouch(state, geneticsId, pouches);
  pushNote('info', `Bought ${pouches*10} ${gen.name} seeds for ${fmtMoney(cost)}.`);
}

function actBuySupply(type, qty){
  const sup = state.suppliers.find(s => s.type === type);
  if(!sup) return;
  let unit, label;
  if(type === 'fertilizer'){
    unit = qty >= sup.bulkMin ? sup.bulk : sup.retail;
    label = 'fertilizer';
  } else if(type === 'medium'){
    unit = qty >= sup.bulkMin ? sup.bulk : sup.retail;
    label = 'growing medium';
  } else return;

  const cost = Math.round(unit * qty);
  if(state.player.cash < cost) return alert('Not enough cash.');
  spend('inputs', cost, `${label} — ${qty} kg @ ${fmtMoney(unit)}/kg`);
  if(type === 'fertilizer') state.supplies.fertilizer += qty;
  else state.supplies.medium += qty;
  pushNote('info', `Purchased ${qty} kg of ${label} for ${fmtMoney(cost)}.`);
}

function actUpgradeEquipment(gardenId, slot){
  const g = getGarden(gardenId);
  if(!g) return;
  const lvl = g.equipment[slot];
  if(lvl >= 3) return alert('Already at maximum level.');
  const cost = EQUIP_COST[slot][lvl];
  if(state.player.cash < cost) return alert('Not enough cash.');
  spend('capex', cost, `Equipment — ${EQUIP_NAME[slot]} L${lvl+1} (${g.name})`);
  g.equipment[slot] = lvl + 1;
  pushNote('info', `${g.name}: ${EQUIP_NAME[slot]} upgraded to L${lvl+1}.`);
}

function facilityBuildCost(type){
  const def=FACILITY_TYPES.find(f=>f.id===type);
  const current=distributionFacility();
  return def && type==='distribution' && current ? def.cost*current.level : def ? def.cost : 0;
}

function facilityUpgradeCost(facility){
  const def=FACILITY_TYPES.find(f=>f.id===facility.type);
  if(!def) return 0;
  return facility.type==='grow' ? def.cost : def.cost*Math.max(1,Number(facility.level)||1);
}

function facilityEffect(facility){
  if(facility.type==='storage') return `${formatMass(levelCapacity(facility.level,STORAGE_CAPACITY_BY_LEVEL))} storage`;
  if(facility.type==='drying') return `${formatMass(levelCapacity(facility.level,DRYING_CAPACITY_BY_LEVEL))} drying WIP`;
  if(facility.type==='processing') return `${formatMass(levelCapacity(facility.level,PROCESSING_CAPACITY_BY_LEVEL))} processing WIP`;
  if(facility.type==='distribution') return `${10+Math.max(0,facility.level-1)*5} prospects`;
  if(facility.type==='grow') return `${(facility.level*20).toLocaleString('en-US')}% capacity · all gardens`;
  return '—';
}

function actUpgradeFacility(facilityId){
  const facility=state.facilities.find(f=>f.id===facilityId);
  if(!facility) return;
  const def=FACILITY_TYPES.find(f=>f.id===facility.type);
  const maxLevel=FACILITY_MAX_LEVEL[facility.type]||1;
  if(!def || facility.level>=maxLevel) return;
  const cost=facilityUpgradeCost(facility);
  if(state.player.cash<cost) return alert('Not enough cash.');
  const previousLevel=Number(facility.level)||1;
  spend('capex',cost,`Facility upgrade — ${def.name} L${previousLevel+1}`);
  facility.level=previousLevel+1;
  facility.upkeepPerDay=def.upkeep*facility.level;
  if(facility.type==='distribution') state.flags.distributionUnlocked=true;
  if(facility.type==='grow'){
    const growLevel=Math.min(GARDEN_EXPANSION_MAX_LEVEL,state.facilities.filter(f=>f.type==='grow').reduce((sum,f)=>sum+(Number(f.level)||0),0));
    for(const garden of state.gardens){
      garden.expansionLevel=growLevel;
      garden.capacity=garden.baseCapacity;
      garden.laborNeed=gardenLaborNeed(garden);
    }
    pushNote('important',`Growing Expansion upgraded to level ${growLevel} for all ${state.gardens.length} gardens.`);
  }else{
    pushNote('important',`${def.name} upgraded to level ${facility.level}.`);
  }
}

function actBuildFacility(type){
  const def = FACILITY_TYPES.find(f=>f.id===type);
  if(!def) return;
  const existing = ['distribution','grow'].includes(type) ? state.facilities.find(f=>f.type===type) : null;
  if(existing){ actUpgradeFacility(existing.id); return; }
  const cost = def.cost;
  if(state.player.cash < cost) return alert('Not enough cash.');
  spend('capex', cost, `Facility — ${def.name}`);
  state.facilities.push({
    id: uid('fac'), type: def.id, name: def.name, level:1,
    upkeepPerDay: def.upkeep, builtMinute: state.time.minutes
  });
  if(def.id==='grow') syncGardenExpansionState();
  if(def.id === 'distribution') state.flags.distributionUnlocked = true;
  pushNote('important', `Built: ${def.name}.`);
}

function actBuyVehicle(typeId, condition='new'){
  const def = VEHICLE_TYPES.find(v=>v.id===typeId);
  if(!def) return;
  const used=condition==='used';
  const cost=used?randInt(def.used[0],def.used[1]):def.cost;
  const upkeep=randInt(def.upkeep[0],def.upkeep[1]);
  if(state.player.cash < cost) return alert('Not enough cash.');
  spend('capex', cost, `Vehicle — ${def.name} (${used?'used':'new'})`);
  state.vehicles.push({
    id: uid('veh'), type: def.id, name: `${used?'Used ':''}${def.name}`,
    capacity: def.capacity, condition: used?randRange(0.65,0.82):0.96, purchasePrice:cost,
    maintenancePerDay: upkeep, speedKmh:def.speedKmh, fuelCostPerKm:def.fuelCostPerKm, assignedTo: null
  });
  pushNote('info', `Purchased a ${used?'used':'new'} ${def.name} for ${fmtMoney(cost)}.`);
}

function vehicleInUse(vehicle){
  return state.shipments.some(shipment=>shipment.status==='scheduled' && shipment.vehicleId===vehicle.id) ||
    state.contracts.some(contract=>contract.status==='active' && contract.vehicleId===vehicle.id);
}

function vehicleResaleValue(vehicle){
  const definition=VEHICLE_TYPES.find(item=>item.id===vehicle.type);
  const purchasePrice=Number(vehicle.purchasePrice)||definition?.cost||0;
  const durability=clamp(Number(vehicle.condition)||0.25,0.25,1);
  return Math.round(purchasePrice*(0.20+0.60*durability));
}

function sellVehicle(vehicleId){
  const index=state.vehicles.findIndex(vehicle=>vehicle.id===vehicleId);
  if(index<0) return {ok:false,msg:'Vehicle not found.'};
  const vehicle=state.vehicles[index];
  if(vehicleInUse(vehicle)) return {ok:false,msg:'This vehicle is assigned to an active shipment or contract.'};
  const resaleValue=vehicleResaleValue(vehicle);
  state.vehicles.splice(index,1);
  earn('asset sale',resaleValue,`Vehicle sale — ${vehicle.name} (${Math.round(vehicle.condition*100)}% durability)`);
  pushNote('financial',`${vehicle.name} sold for ${fmtMoney(resaleValue)} at ${Math.round(vehicle.condition*100)}% durability.`);
  return {ok:true,resaleValue};
}

function actBuyGarden(regionId, profileId){
  if(!canAddGarden()){ alert(`Garden limit reached: ${MAX_GARDENS}/${MAX_GARDENS}.`); return; }
  const region = REGIONS.find(r=>r.id===regionId) || REGIONS[1];
  const profile = GARDEN_PROFILES.find(p=>p.id===profileId) || GARDEN_PROFILES[1];
  const cost = profile.cost;
  if(state.player.cash < cost) return alert('Not enough cash.');
  const names = ['La Esperanza','El Mirador','Las Palmas','Cerro Alto','La Loma','El Roble','Vista Hermosa','San Rafael'];
  const used = state.gardens.map(g=>g.name);
  let nm = names.find(n=>!used.includes(n)) || ('Garden ' + (state.gardens.length+1));
  if(profile.id!=='standard') nm += ' — ' + profile.name;
  spend('capex', cost, `Garden acquisition — ${nm}`);
  const garden=makeGarden(nm, regionId, profile.id);
  garden.expansionLevel=clamp(state.facilities.filter(f=>f.type==='grow').reduce((sum,f)=>sum+(Number(f.level)||0),0),0,GARDEN_EXPANSION_MAX_LEVEL);
  garden.laborNeed=gardenLaborNeed(garden);
  state.gardens.push(garden);
  pushNote('important', `Acquired ${nm} (${region.name}), base capacity ${profile.capacity}, condition ${(profile.condition*100).toFixed(0)}%.`);
}

function actLoan(amount){
  amount = Math.round(amount);
  if(amount <= 0) return;
  if(state.player.debt + amount > 120000) return alert('Credit limit reached (MX$120,000).');
  state.player.debt += amount;
  earn('loan', amount, `Loan taken — ${fmtMoney(amount)}`);
  pushNote('warn', `Took a loan of ${fmtMoney(amount)}.`);
}

function actRepay(amount){
  amount = Math.round(Math.min(amount, state.player.debt, state.player.cash));
  if(amount <= 0) return;
  state.player.debt -= amount;
  spend('loan', amount, `Loan repayment — ${fmtMoney(amount)}`);
  pushNote('financial', `Repaid ${fmtMoney(amount)} of debt.`);
}

const TABS = [
  { id:'dashboard',    label:'DASHBOARD',     render: renderDashboard },
  { id:'tutorial',     label:'TUTORIAL',      render: renderTutorial },
  { id:'gardens',      label:'GARDENS',       render: renderGardens },

  { id:'distribution', label:'DISTRIBUTION',   render: renderDistribution },
  { id:'messages',     label:'MESSAGES',       render: renderMessages },
  { id:'contracts',    label:'CONTRACTS',     render: renderContracts },
  { id:'people',       label:'PEOPLE',        render: renderPeople },
  { id:'organizations',label:'ORGANIZATIONS', render: renderOrganizations },
  { id:'dealers',      label:'DEALERS',        render: renderDealers },
  { id:'vehicles',     label:'VEHICLES',      render: renderVehicles },

  { id:'log',          label:'LOG',           render: renderLog },
  { id:'settings',     label:'SETTINGS',      render: renderSettings }
];

function render(forceView){
  if(!state) return;
  renderTopbar();
  renderNav();
  const view = document.getElementById('view');
  const active = document.activeElement;
  const modal = document.getElementById('modal');
  const isEditing = active && (active.matches('input, select, textarea') || active.isContentEditable);
  if(modal.style.display === 'block' || (isEditing && !forceView)) {
    renderFeed();
    return;
  }
  const tab = TABS.find(t=>t.id===UI.tab) || TABS[0];
  const html = tab.render();
  if(view.innerHTML !== html){
    const scrollTop = view.scrollTop;
    view.innerHTML = html;
    view.scrollTop = scrollTop;
  }
  renderFeed();
}

function renderTopbar(){
  const brand=document.querySelector('#topbar .brand');
  if(brand) brand.textContent=state.player.organizationName||'LOS CABRONES';
  const d = document.getElementById('clock');
  d.textContent = `Day ${dayOf()} — ${timeString()} · ${dowOf()} · ${seasonOf()}`;
  const c = document.getElementById('topcash');
  c.textContent = fmtMoney(state.player.cash) + (state.player.debt > 0 ? `  (debt ${fmtMoney(state.player.debt)})` : '');
  c.className = 'cash' + (state.player.cash < 0 ? ' neg' : '');

  const spd = document.getElementById('spd');
  const speeds = [0,1,2,5,10,25,50,100];
  const html = speeds.map(s =>
    `<button data-act="speed" data-v="${s}" class="${state.speed===s?'on':''}">${s===0?'❚❚':s+'×'}</button>`
  ).join('');
  if(spd.innerHTML !== html) spd.innerHTML = html;
}

function renderNav(){
  const nav = document.getElementById('nav');
  const badgeFor = (id)=>{
    if(id === 'contracts'){
      const n = state.offers.length;
      return n > 0 ? `<span class="badge">${n}</span>` : '';
    }
    if(id === 'messages'){
      const n=state.messages.filter(m=>m.status==='new').length;
      return n>0 ? `<span class="badge">${n}</span>` : '';
    }
    return '';
  };
  const html = TABS.map(t =>
    `<button data-act="tab" data-tab="${t.id}" class="${UI.tab===t.id?'on':''}">${t.label}${badgeFor(t.id)}</button>`
  ).join('');
  if(nav.innerHTML !== html) nav.innerHTML = html;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  const notes = state.notifications.slice(0, 60);
  const html = `<div style="color:var(--dim);font-size:10.5px;letter-spacing:1px;padding:2px 4px 8px;">FEED</div>` +
    (notes.length === 0 ? '<div class="muted" style="padding:6px;">No events yet.</div>' :
    notes.map(n => {
      const t = String(Math.floor(n.minute/60)).padStart(2,'0') + ':' + String(Math.floor(n.minute%60)).padStart(2,'0');
      return `<div class="note ${SEVERITY_CLASS[n.sev]||'info'}">
        <div class="t">Day ${n.day} · ${t}</div>
        <div>${esc(n.text)}</div>
      </div>`;
    }).join(''));
  if(feed.innerHTML !== html) feed.innerHTML = html;
}

function progressOf(b){

          <div class="row"><span class="k">Water system</span><span>L${g.equipment.water} ${g.equipment.water<3?`<button class="sm" data-act="upgrade" data-garden="${g.id}" data-slot="water">↑ ${fmtMoney(EQUIP_COST.water[g.equipment.water])}</button>`:''}</span></div>
          <div class="row"><span class="k">Ventilation</span><span>L${g.equipment.vent} ${g.equipment.vent<3?`<button class="sm" data-act="upgrade" data-garden="${g.id}" data-slot="vent">↑ ${fmtMoney(EQUIP_COST.vent[g.equipment.vent])}</button>`:''}</span></div>

/* ---------- INVENTORY ---------- */

function renderInventory(){
  const stacks = state.inventory.slice();
  const order = { processed:0, dried:1, raw:2 };
  const gradeOrder = {S:0,A:1,B:2,C:3,D:4};
  stacks.sort((a,b)=>{
    if(order[a.state] !== order[b.state]) return order[a.state]-order[b.state];
    if(gradeOrder[a.grade] !== gradeOrder[b.grade]) return gradeOrder[a.grade]-gradeOrder[b.grade];
    return a.qty-b.qty;
  });

  const totals = {S:0,A:0,B:0,C:0,D:0};
  for(const s of state.inventory) totals[s.grade] += s.qty;

  let html = `<h2 class="sect">Inventory</h2>
  <div class="grid g2">
    <div class="card">
      <div class="lbl">Total cannabis</div>
      <div class="big">${formatMass(inventoryTotal())}</div>
      <div class="sep"></div>
      <div class="row"><span class="k">Storage</span><span>${formatMass(totalStorageUsed())} / ${formatMass(storageCapacity())}</span></div>
      ${bar(totalStorageUsed()/storageCapacity()*100, totalStorageUsed()>storageCapacity()*0.9?'y':'')}
    </div>
    <div class="card">
      <div class="lbl">Grade distribution</div>
      <div class="sep"></div>
      ${GRADES.map(g=>`<div class="row"><span>${gradeTag(g)}</span><span>${formatMass(totals[g])}</span></div>`).join('')}
    </div>
  </div>

  <h2 class="sect">Stacks</h2>`;

  if(stacks.length === 0){
    html += `<div class="card muted">No inventory.</div>`;
  } else {
    html += `<div class="card"><table>
      <tr><th>State</th><th>Grade</th><th>Variant</th><th>Qty</th><th>Unit cost</th><th>Bulk value</th><th></th></tr>
      ${stacks.map(s=>{
        const bulk = bulkUnitPrice(s.grade, s.variant, s.qty);
        return `<tr>
          <td>${s.state}</td>
          <td>${gradeTag(s.grade)}</td>
          <td>${s.variant ? esc(recipeById(s.variant) ? recipeById(s.variant).name : s.variant) : '<span class="dim2">—</span>'}</td>
          <td>${formatMass(s.qty)}</td>
          <td>${fmtMoney(s.unitCost)}</td>
          <td>${fmtMoney(bulk*s.qty)} <span class="dim2">(${fmtMoney(bulk)}/g)</span></td>
          <td class="right nowrap">
            ${s.state==='raw'?`<button class="sm" data-act="drymodal" data-stack="${s.id}">Dry</button>`:''}
            ${s.state==='dried' && hasProcessing()?`<button class="sm" data-act="procmodal" data-stack="${s.id}">Process</button>`:''}
          </td>
        </tr>`;
      }).join('')}
    </table></div>`;
  }
  const unstockedProducts=state.products.filter(p=>p.quantity>0);
  html+=`<h2 class="sect">Packaged Products Not in Wholesale</h2>
    <div class="card">${unstockedProducts.length===0?'<div class="muted">No packaged products available outside wholesale.</div>':`<table>
      <tr><th>Product</th><th>Grade</th><th>Available</th><th>Unit price</th><th>Unit weight</th></tr>
      ${unstockedProducts.map(p=>`<tr><td>${esc(p.name)}</td><td>${gradeTag(p.grade)}</td><td>${p.quantity} units</td><td>${fmtMoney(p.unitPrice)}</td><td>${formatMass(p.weightGrams)}</td></tr>`).join('')}
    </table>`}</div>`;
  return html;
}

    <div class="flexrow">

  <h2 class="sect">Product Workshop</h2>

    <h3>${esc(recipe.name)}</h3>
    <div class="row"><span class="k">Input</span><span>${formatMass(recipe.inputQty)} · ${recipe.inputState.replaceAll('_',' / ')}</span></div>

  <h2 class="sect">Product Production</h2>
  <div class="card">${state.productBatches.length===0?'<div class="muted">No product batches in production.</div>':state.productBatches.map(batch=>`<div style="margin-bottom:8px">
    <div class="flexrow"><span>${esc(batch.name)} · ${batch.quantity} units · grade ${gradeTag(batch.grade)}</span><span class="spacer"></span><span class="muted">${minutesToClock(batch.duration-batch.elapsed)}</span></div>
    ${bar(progressOf(batch))}
  </div>`).join('')}</div>

  <h2 class="sect">Wholesale Showcase</h2>
  <div class="card">
    <div class="row"><span class="k">Showcase level</span><span>${state.wholesale.level} · ${wholesaleSlotCount()} slots · ${WHOLESALE_SLOT_CAPACITY} units each</span></div>
    <div class="row"><span class="k">Automatic sales</span><span>Hourly</span></div>
    <div class="sep"></div>
    <div class="flexrow"><span class="spacer"></span><button class="sm primary" data-act="wholesaleupgrade" ${wholesaleSlotCount()>=40 || state.player.cash<wholesaleUpgradeCost()?'disabled':''}>Add 2 slots · ${fmtMoney(wholesaleUpgradeCost())}</button></div>
  </div>

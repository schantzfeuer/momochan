  const points=account.history.filter(point=>point.day>=Math.floor(day)-90).slice(-90);
  if(!points.length) return '<p class="hint">NAV history will appear after daily accrual.</p>';
  const values=points.map(point=>BigInt(point.navE4));
  let minimum=values.reduce((value,item)=>item<value?item:value,values[0]);
  let maximum=values.reduce((value,item)=>item>value?item:value,values[0]);
  if(maximum===minimum){minimum=minimum>1n?minimum-1n:1n;maximum+=1n;}
  const coords=values.map((value,index)=>{
    const x=16+index*(448/Math.max(1,values.length-1));
    const ratio=Number((value-minimum)*1000000n/(maximum-minimum))/1000000;
    const y=122-ratio*104;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg class="marine-fund-chart" viewBox="0 0 480 145" role="img" aria-label="NAV per unit over the last 90 days">'+
    '<line x1="12" y1="18" x2="468" y2="18" stroke="rgba(201,160,74,.18)"/><line x1="12" y1="70" x2="468" y2="70" stroke="rgba(201,160,74,.18)"/>'+
    '<line x1="12" y1="122" x2="468" y2="122" stroke="rgba(201,160,74,.18)"/><polyline points="'+coords+'" fill="none" stroke="#d8b455" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function marinePortfolioPanel(){
  const assets=[
    {label:'MdP wallet',value:BigInt(state.wallet.mdp||'0'),color:'#d8b455'},
    {label:'Marine Bonds',value:marineBondMarketValueMdp(),color:'#79a9d5'},
    {label:'Marine Funds',value:marineFundsValueMdp(state.marinesFunds),color:'#78bd8b'},
  ];
  const total=assets.reduce((sum,asset)=>sum+asset.value,0n);
  const radius=38;
  const circumference=2*Math.PI*radius;
  let offset=0;
  const segments=assets.filter(asset=>asset.value>0n).map(asset=>{
    const length=total?circumference*Number(asset.value*10000n/total)/10000:0;
    const segment='<circle cx="50" cy="50" r="'+radius+'" stroke="'+asset.color+'" stroke-dasharray="'+
      length.toFixed(2)+' '+(circumference-length).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'"/>';
    offset+=length;
    return segment;
  }).join('');
  const legend=assets.map(asset=>{
    const share=total?Number(asset.value*10000n/total)/100:0;
    return '<div class="marine-portfolio-item"><span class="marine-portfolio-label"><i class="marine-portfolio-swatch" style="background:'+asset.color+'"></i>'+asset.label+
      '</span><strong class="marine-portfolio-value">'+fmtMdP(asset.value)+'</strong><span class="marine-portfolio-share">'+share.toFixed(1)+'% of Marine portfolio</span></div>';
  }).join('');
  return '<section class="panel marine-portfolio"><div class="panel-title"><h3>Portfolio Overview</h3><span class="tag rare">Marine · '+fmtMdP(total)+'</span></div>'+ 
    '<div class="marine-portfolio-layout"><div class="marine-portfolio-visual"><svg class="marine-portfolio-chart" viewBox="0 0 100 100" role="img" aria-label="Marine portfolio allocation by asset type">'+
      '<g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="'+radius+'" stroke="rgba(239,225,194,.12)"/>'+segments+'</g></svg>'+ 
      '<div class="marine-portfolio-center"><span>Total value</span><strong>'+fmtMdP(total)+'</strong></div></div>'+ 
      '<div class="marine-portfolio-legend">'+legend+'</div></div></section>';
}

function updateMarineFundPreviews(detail){
  if(!detail) return;
  const id=detail.dataset.fundDetail;
  const product=MARINES_FUND_PRODUCTS[id];
  const account=state.marinesFunds.products[id];
  const depositInput=detail.querySelector('[data-fund-amount="deposit"]');
  const depositPreview=detail.querySelector('[data-fund-preview="deposit"]');
  const depositText=String(depositInput?.value||'');
  if(depositPreview){
    const amount=/^\d+$/.test(depositText)?BigInt(depositText):0n;
    const units=amount>=BigInt(product.minDeposit)?marineFundDepositUnits(amount,account.navE4):0n;
    depositPreview.textContent='Units received: '+marineFundDisplayE4(units.toString(),4);
  }
  const withdrawInput=detail.querySelector('[data-fund-amount="withdraw"]');
  const withdrawPreview=detail.querySelector('[data-fund-preview="withdraw"]');
  const withdrawText=String(withdrawInput?.value||'');
  if(withdrawPreview){
    const amount=/^\d+$/.test(withdrawText)?BigInt(withdrawText):0n;
    const quote=amount?marineFundWithdrawalQuote(id,amount,false,Math.floor(state.gameDay),account):null;
    withdrawPreview.textContent=quote?'Receive '+fmtMdP(quote.received)+' · early-exit fee '+fmtMdP(quote.fee)+
      ' · burn '+marineFundDisplayE4(quote.burned.toString(),4)+' units': 'Enter an amount covered by your units.';
  }
}

function viewCaptain(){
  const branches = {};
  for(const s of SKILLS){ (branches[s.branch] = branches[s.branch] || []).push(s); }
  const totalRanks = SKILLS.reduce((total,skill)=>total+(state.skills[skill.id]||0),0);
  const shipAssets=fleetAssetValue();
  const cargoAssets=state.ships.reduce((total,ship)=>{
    const market=state.markets[ship.locationId];
    return total+Object.entries(ship.cargo||{}).reduce((value,[name,quantity])=>{
      const commodity=COMM_BY_NAME[name];
      if(!commodity||quantity<=0) return value;
      const entry=market&&market.prices[name];
      return value+quantity*(entry?entry.price:referencePrice(name,ship.locationId));
    },0);
  },0);
  const bondAssets=state.bonds.reduce((total,bond)=>total+portCoinsToLegacy(bondValue(bond),bond.portId),0);
  const marineBondAssets=Number(marineBondMarketValueMdp())*1000/legacyToSilverG(1);
  const marineFundsAssets=Number(marineFundsValueMdp(state.marinesFunds))*1000/legacyToSilverG(1);
  const pendingBondAssets=state.bondOrders.filter(order=>order.kind==='buy')
    .reduce((total,order)=>total+portCoinsToLegacy(order.units*order.pricePerShare,order.portId),0);
  const savingsAssets=totalBankSavings();
  const loanLiability=state.bankLoan?portCoinsToLegacy(Math.max(0,Number(state.bankLoan.remaining)||0),state.bankLoan.originPortId||state.portId):0;
  const couponAssets=totalBondCouponsLegacy();
  const controlledPortAssets=controlledPortsValue();
  const totalAssets=state.funds+savingsAssets+couponAssets+shipAssets+cargoAssets+bondAssets+marineBondAssets+marineFundsAssets+
    pendingBondAssets+controlledPortAssets;
  const netWorth=totalAssets-loanLiability;
  const financialPosition=
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Net Worth</h3><span class="tag">Financial position</span></div>'+
      '<div style="font-size:24px;color:var(--bronze);font-weight:700;margin:2px 0 10px">'+fmtWalletValue(netWorth)+'</div>'+ 
      '<h4>Assets</h4>'+ 
      '<div class="kv"><span>Funds</span><span>'+fmtWalletValue(state.funds)+'</span></div>'+ 
      '<div class="kv"><span>Merchant savings</span><span>'+fmtWalletValue(savingsAssets)+'</span></div>'+ 
      '<div class="kv"><span>Bond coupon funds</span><span>'+fmtWalletValue(couponAssets)+'</span></div>'+ 
      '<div class="kv"><span>Fleet value</span><span>'+fmtWalletValue(shipAssets)+'</span></div>'+ 
      '<div class="kv"><span>Cargo aboard (estimated)</span><span>'+fmtWalletValue(cargoAssets)+'</span></div>'+ 
      '<div class="kv"><span>Bond holdings</span><span>'+fmtWalletValue(bondAssets)+'</span></div>'+ 
      '<div class="kv"><span>Marine Bond holdings · market</span><span>'+fmtWalletValue(marineBondAssets)+'</span></div>'+ 
      '<div class="kv"><span>Marine Funds · NAV</span><span>'+fmtWalletValue(marineFundsAssets)+'</span></div>'+ 
      '<div class="kv"><span>Controlled ports (estimated)</span><span>'+fmtWalletValue(controlledPortAssets)+'</span></div>'+ 
      (pendingBondAssets?'<div class="kv"><span>Pending bond purchases</span><span>'+fmtWalletValue(pendingBondAssets)+'</span></div>':'')+
      '<div class="divider"></div>'+ 
      '<div class="kv"><b>Total assets</b><b>'+fmtWalletValue(totalAssets)+'</b></div>'+ 
      '<h4 style="margin-top:10px">Liabilities</h4>'+ 
      '<div class="kv"><span>Merchant loan balance</span><span>'+fmtWalletValue(loanLiability)+'</span></div>'+ 
      '<div class="divider"></div>'+ 
      '<div class="kv"><b>Net worth</b><b>'+fmtWalletValue(netWorth)+'</b></div>'+ 
      '<p class="hint" style="margin-bottom:0">Fleet uses listed ship values; cargo is estimated at the ship’s known local market price or reference price.</p>'+ 
    '</div>';
  const branchHtml = Object.keys(branches).map(b=>
    '<div class="panel"><div class="panel-title"><h3>'+esc(b)+'</h3><span class="tag">'+
      branches[b].reduce((total,skill)=>total+(state.skills[skill.id]||0),0)+' ranks</span></div>'+
      branches[b].map(sk=>{
        const rank = state.skills[sk.id]||0;
        const capped = skillIsMaxed(sk);
        const cost = rank+1;
        const canBuy = !capped && state.skillPoints>=cost;
        return '<div class="row between" style="padding:5px 0;border-bottom:1px solid rgba(201,160,74,.12)">'+
          '<div style="flex:1;min-width:220px"><b>'+esc(sk.name)+'</b> <span class="tag">Rank '+rank+(capped?' · Maxed':'')+'</span>'+
          '<div class="small muted">'+esc(sk.desc)+'</div>'+
          '<div class="small">Current effect: '+esc(skillEffectSummary(sk,rank))+'</div>'+
          '<div class="small muted">Next rank '+(capped?'—':rank+1)+': '+esc(capped?'Reduction cap reached':skillEffectSummary(sk,rank+1))+' '+(capped?'':'· Cost '+cost+' skill point(s)')+'</div></div>'+
          '<button class="btn sm'+(canBuy?' primary':'')+'" data-act="skill" data-skill="'+sk.id+'" '+(canBuy?'':'disabled')+
            ' title="'+(capped ? 'Skill is maxed at the reduction cap' : 'Upgrade to rank '+(rank+1)+' for '+cost+' skill point(s)')+'">'+(capped?'Maxed':'Upgrade · '+cost)+'</button>'+
        '</div>';
      }).join('')+'</div>'
  ).join('');
  const stats = state.stats;
  const statLabels={
    searches:'Searches',battlesWon:'Battles won',treasures:'Treasures found',trades:'Trade sales',
    totalEarned:'Total earned',legendaryMissions:'Legendary missions',survivor:'Low-hull mission returns',
    missionsDone:'Missions completed',missionsFailed:'Missions failed',shipsLost:'Ships lost',
    shipsCaptured:'Ships captured',distanceSailed:'Distance sailed',payrollsPaid:'Payrolls paid',
    payrollsMissed:'Payrolls missed',trainingsDone:'Trainings completed',trainingsStarted:'Trainings started',
  };
  const recordRows=Object.entries(statLabels).map(([key,label])=>{
    const value=key==='totalEarned'?fmtWalletValue(stats[key]||0):
      key==='distanceSailed'?Number(stats[key]||0).toFixed(1):fmtNum(stats[key]||0);
    return '<div class="kv"><span>'+label+'</span><span>'+value+'</span></div>';
  }).join('');
  const portBankRows=PORTS.map(port=>{
    const account=state.bankAccounts[port.id]||{balance:0};
    const bankStats=state.portBankingStats[port.id]||{};
    const market=BOND_CITY_MARKETS[port.id];
    const taxRefunded=Number(bankStats.taxRefunded)||0;
    const netTaxPaid=Math.max(0,(Number(bankStats.taxPaid)||0)-taxRefunded);
    const yields=BOND_TERMS.map(term=>bondAnnualRate(term.years,port.id))
      .map(rate=>(rate*100).toFixed(2)+'%').join(' / ');
    return '<tr><td><b>'+esc(port.name)+'</b></td>'+ 
      '<td class="num">'+(bankSavingsRate(port.id)*100).toFixed(2)+'%</td>'+ 
      '<td class="num">'+(bankSavingsTaxRate(port.id)*100).toFixed(0)+'%</td>'+ 
      '<td class="num">'+fmtWalletValue(account.balance||0)+'</td>'+ 
      '<td class="num">'+yields+'</td>'+ 
      '<td class="num">'+(market.couponMissChance*100).toFixed(0)+'% / '+(bondCouponTaxRate(port.id)*100).toFixed(0)+'%</td>'+ 
      '<td class="num">'+fmtWalletValue(bankStats.savingsInterestEarned||0)+'</td>'+ 
      '<td class="num">'+fmtWalletValue(bankStats.bondCouponsEarned||0)+'</td>'+ 
      '<td class="num">'+fmtWalletValue(bankStats.bondCouponsWithdrawn||0)+'</td>'+ 
      '<td class="num">'+fmtWalletValue(taxRefunded)+'</td>'+ 
      '<td class="num">'+fmtWalletValue(netTaxPaid)+'</td></tr>';
  }).join('');
  const portBankingPanel='<div class="panel"><div class="panel-title"><h3>Banking by Port</h3><span class="tag">Total tax '+fmtWalletValue(totalPortTaxes())+'</span></div>'+ 
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Port</th><th>Savings rate</th><th>Savings tax</th><th>Balance</th><th>Bond yields · 3/5/10y</th><th>Missed coupon / coupon tax</th><th>Interest earned</th><th>Coupons earned</th><th>Coupons withdrawn</th><th>Tax refunded</th><th>Tax paid · net</th></tr></thead><tbody>'+portBankRows+'</tbody></table></div>'+ 
    '<div class="kv" style="margin-top:8px"><span>Total banking tax refunded</span><span>'+fmtWalletValue(PORTS.reduce((total,port)=>total+((state.portBankingStats[port.id]||{}).taxRefunded||0),0))+'</span></div>'+ 
    '<div class="kv" style="margin-top:8px"><span>Savings interest tax</span><span>'+fmtWalletValue(PORTS.reduce((total,port)=>total+((state.portBankingStats[port.id]||{}).savingsInterestTax||0),0))+'</span></div>'+ 
    '<div class="kv"><span>Bond coupon tax</span><span>'+fmtWalletValue(PORTS.reduce((total,port)=>total+((state.portBankingStats[port.id]||{}).bondCouponTax||0),0))+'</span></div>'+ 
    '</div>';
  return (
    '<div class="grid c2">'+
      '<div>'+
        '<div class="panel solid">'+
          '<div class="panel-title"><h3>Captain '+esc(state.captain.name)+'</h3>'+
            '<button class="btn sm" data-act="rename-captain">Edit</button></div>'+
          '<div class="kv"><span>Title</span><span>'+esc(state.captain.title||'—')+'</span></div>'+
          '<div class="kv"><span>Flag</span><span style="color:'+esc(state.captain.flagColor)+'">'+esc(state.captain.flag)+'</span></div>'+
          '<div class="kv"><span>Reputation</span><span>'+Math.floor(state.reputation)+'</span></div>'+
          '<div class="kv"><span>Wanted level · bounty</span><span>'+fmtNum(state.wantedLevel||0)+' · '+fmtWalletValue(wantedBounty(state.wantedLevel))+'</span></div>'+ 
          '<div class="kv"><span>Skill points available</span><span>'+state.skillPoints+'</span></div>'+
          '<div class="kv"><span>Total skill ranks</span><span>'+totalRanks+'</span></div>'+
        '</div>'+
        financialPosition+
        portBankingPanel+
        '<div class="panel">'+
          '<div class="panel-title"><h3>Record</h3></div>'+
          '<div class="kv"><span>Active playtime</span><span data-live-playtime>'+formatPlaytime(state.playtimeMs)+'</span></div>'+
          recordRows+
        '</div>'+
      '</div>'+
      '<div>'+branchHtml+'</div>'+
    '</div>'
  );
}

function viewBlackMarket(){
  const port=PORTS_BY_ID[state.portId];
  if(state.travel||!port?.blackMarket){
    return '<div class="panel"><h2>Black Market Unavailable</h2><p class="muted">The shadow brokers only trade while you are docked at a port that supports a black market.</p></div>';
  }
  if(portIsClosed(state.portId)){
    return '<div class="panel solid"><h2>Black Market Closed</h2><p class="muted">No one is trading while the port is closed.</p></div>';
  }
  const market=ensureBlackMarket();
  processSmelting(state.gameDay);
  const smeltingFacility=ensureSmeltingFacility(port.id);
  const smeltingWindowActive=smeltingFacility.windowEndDay>state.gameDay;
  const smeltingDaysLeft=Math.max(0,smeltingFacility.windowEndDay-state.gameDay);
  const smeltingFee=smeltingWeeklyFee(smeltingFacility.level);
  const smeltingUpgrade=smeltingUpgradeCost(smeltingFacility.level);
  const allCoinsMdp=smeltingAllCoinsPlan().mdp;
  const sourceCurrency=activeCurrency();
  const smeltingJobs=state.smelting.jobs.filter(job=>job.portId===port.id).map(job=>{
    const total=BigInt(job.mdpTotal),done=BigInt(job.mdpDone);
    const percent=total?Number(done*1000n/total)/10:100;
    const status=job.status==='completed'?'Complete':job.status==='running'?'Running':'Paused';
    return '<tr><td>'+esc(job.id.slice(-8))+'</td><td>'+done.toLocaleString('en-US')+' / '+total.toLocaleString('en-US')+' MdP'+
      '<div class="tiny muted">'+smeltingJobLockedText(job)+'</div></td><td>'+status+'</td><td>'+percent.toFixed(1)+'%</td></tr>';
  }).join('')||'<tr><td colspan="4" class="hint">No smelting jobs.</td></tr>';
  const currencyOptions=Object.entries(CURRENCIES).map(([code,currency])=>
    '<option value="'+code+'"'+(code===sourceCurrency?' selected':'')+'>'+esc(currency.name)+' ('+esc(currency.symbol)+')</option>').join('');
  const smeltingPanel='<div class="panel"><div class="panel-title"><h3>Monedas de Plata · Smelting</h3><span class="tag">Level '+smeltingFacility.level+'</span></div>'+ 
    '<div class="kv"><span>Capacity</span><span>'+smeltingCapacity(smeltingFacility.level).toLocaleString('en-US')+' MdP / day</span></div>'+ 
    '<div class="kv"><span>Weekly fee</span><span>'+fmtMoney(smeltingFee,'PESO')+'</span></div>'+ 
    '<div class="kv"><span>Paid window</span><span>'+(smeltingWindowActive?smeltingDaysLeft.toFixed(2)+' days remaining':'Inactive')+'</span></div>'+ 
    '<div class="row" style="margin:10px 0"><button class="btn sm primary" data-act="smelt-fee" '+(smeltingWindowActive?'disabled':'')+'>Pay fee / resume · '+fmtMoney(smeltingFee,'PESO')+'</button> '+ 
    '<button class="btn sm" data-act="smelt-upgrade" '+(smeltingFacility.level>=SMELTING.maxLevel?'disabled':'')+'>Upgrade · '+
      (smeltingFacility.level>=SMELTING.maxLevel?'Max level':fmtMoney(smeltingUpgrade,'PESO'))+'</button></div>'+ 
    '<div class="row" style="align-items:end"><label class="small">MdP amount<input id="smeltMdp" type="text" inputmode="numeric" pattern="[0-9]+" value="1" style="width:150px"></label>'+ 
    '<label class="small">Source currency<select id="smeltCurrency">'+currencyOptions+'</select></label>'+ 
    '<button class="btn sm primary" data-act="smelt-start">Start job</button><span class="small muted">Coins needed: <b id="smeltQuote">'+
      fmtMoney(smeltingCost(1n,sourceCurrency),sourceCurrency)+'</b></span>'+ 
    '<button class="btn sm" data-act="smelt-all-coins" '+(allCoinsMdp?'':'disabled')+'>Smelt all coins · '+fmtMdP(allCoinsMdp)+'</button></div>'+ 
    '<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Job</th><th>Production</th><th>Status</th><th>Progress</th></tr></thead><tbody>'+smeltingJobs+'</tbody></table></div></div>';
  const idleShips=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId===state.portId);
  const shipOpts=idleShips.map(ship=>'<option value="'+esc(ship.id)+'"'+(ui.marketShip===ship.id?' selected':'')+'>'+esc(ship.name)+
    ' ('+Math.round(cargoUsed(ship))+'/'+cargoCapacity(ship)+')</option>').join('');
  if(!ui.marketShip||!idleShips.some(ship=>ship.id===ui.marketShip)) ui.marketShip=idleShips[0]?.id||null;
  const selectedShip=getShip(ui.marketShip);
  const goodsRows=market.goods.map(entry=>{
    const good=ILLEGAL_GOOD_BY_NAME[entry.name];
    const held=selectedShip?Math.floor(selectedShip.cargo[entry.name]||0):0;
    const buyPrice=blackMarketGoodBuyPrice(port.id,entry);
    const sellPrice=blackMarketGoodSellPrice(port.id,entry,good);
    return '<tr><td><b>'+esc(good.name)+'</b><div class="tiny muted">Illegal cargo · '+esc(good.unit)+'</div></td>'+ 
      '<td class="num">'+fmtMoney(buyPrice,'PESO')+'<div class="tiny muted">Buyback '+fmtMoney(sellPrice,'PESO')+'</div></td>'+ 
      '<td class="num">'+entry.stock+'</td><td class="num">'+(held||'—')+'</td><td class="nowrap">'+ 
      '<input type="number" min="1" step="1" value="1" data-bm-qty="'+esc(good.name)+'" style="width:64px;display:inline-block;padding:2px 5px;font-size:12px"> '+ 
      '<button class="btn sm primary" data-act="black-good-buy" data-good="'+esc(good.name)+'" '+(selectedShip&&entry.stock?'':'disabled')+'>Buy</button> '+ 
      '<button class="btn sm" data-act="black-good-sell" data-good="'+esc(good.name)+'" data-ship="'+esc(selectedShip?.id||'')+'" '+(held?'':'disabled')+'>Sell</button></td></tr>';
  }).join('');
  const shipRows=market.ships.map(offer=>{
    const rarity=SHIP_RARITY_BY_ID[offer.rarity];
    const type=SHIP_TYPE_BY_ID[offer.typeId];
    return '<tr><td><b>'+esc(rarity.name)+' '+esc(type.name)+'</b><div class="tiny muted">'+esc(offer.name)+' · '+esc(type.classLabel||'Class')+'</div></td>'+ 
      '<td class="num">'+fmtMoney(offer.price,'PESO')+'</td><td class="nowrap"><button class="btn sm primary" data-act="black-ship-buy" data-offer="'+
      esc(offer.id)+'" '+(state.ships.length<20&&blackMarketCanAffordPesos(offer.price)?'':'disabled')+'>Buy ship</button></td></tr>';
  }).join('')||'<tr><td colspan="3" class="hint">'+(port.blackMarketShips===false?
    'No ships are offered at this port.':'Today’s ship offers have been claimed.')+'</td></tr>';
  return '<div class="panel solid"><div class="panel-title"><h2>Black Market · '+esc(port.name)+'</h2><span class="tag risk-vhigh">Unlicensed trade</span></div>'+ 
    '<p class="hint">Offers and exchange terms reset each game day. Contraband in a travelling hold draws intense Marine scrutiny.</p>'+ 
    smeltingPanel+ 
    '<div class="panel"><div class="panel-title"><h3>Contraband Exchange</h3><label class="small muted">Ship <select id="marketShipSel" style="max-width:260px">'+ 
    (shipOpts||'<option value="">No idle ships</option>')+'</select></label></div>'+ 
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Illegal item</th><th>Price / buyback</th><th>Stock</th><th>Aboard</th><th>Trade</th></tr></thead><tbody>'+goodsRows+'</tbody></table></div></div>'+ 
    '<div class="panel"><div class="panel-title"><h3>Ships of Unusual Rarity</h3><span class="small muted">Daily selection · premium price</span></div>'+ 
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Vessel</th><th>Price</th><th>Offer</th></tr></thead><tbody>'+shipRows+'</tbody></table></div></div>';
}

function viewBanking(){
  const loan=state.bankLoan;
  const loanPortId=loan?.originPortId||state.portId;
  const loanCurrency=currencyForPort(loanPortId);
  const maxRepayment=loan?Math.min(Number(state.wallet.coins[loanCurrency])||0,loan.remaining):0;
  const credit = creditLimit();
  const loanTerms=merchantLoanTerms(state.portId);
  const savingsAccount=bankAccount(state.portId);
  const savingsBalance=Number(savingsAccount.balance)||0;
  const walletBalance=portWalletBalance(state.portId);
  const localCurrency=currencyForPort(state.portId);
  const walletRows=Object.entries(CURRENCIES).map(([code,currency])=>
    '<div class="banking-summary-item"><span>'+esc(currency.name+' · '+currency.symbol)+'</span><strong>'+
      fmtMoney(Number(state.wallet.coins?.[code])||0,code)+'</strong></div>'
  ).join('');
  const exchangeTarget=Object.keys(CURRENCIES).find(code=>code!==localCurrency);
  const initialExchangeQuote=bankExchangeQuote(localCurrency,exchangeTarget,1);
  const savingsRate=bankSavingsRate(state.portId);
  const savingsTaxRate=bankSavingsTaxRate(state.portId);
  const bondMarket=!state.travel?BOND_CITY_MARKETS[state.portId]:null;
  const currentPort=PORTS_BY_ID[state.portId];
  const bondRows=state.bonds.map(bond=>{
    const pending=state.bondOrders.filter(order=>order.kind==='sell'&&order.bondId===bond.id)
      .reduce((total,order)=>total+order.units,0);
    const available=bond.units-pending;
    const value=bondValue(bond);
    return '<tr><td>'+esc(PORTS_BY_ID[bond.portId].name)+'</td>'+ 
      '<td>'+bond.years+' years · '+(bond.rate*100).toFixed(2)+'%</td>'+ 
      '<td class="num">'+bond.units+'</td>'+ 
      '<td class="num">'+fmtPortCoins(value,bond.portId)+'</td>'+ 
      '<td>Day '+Math.ceil(bond.maturityDay)+'</td>'+ 
      '<td class="nowrap"><input type="number" min="1" max="'+available+'" step="1" value="'+Math.max(1,available)+'" data-bond-sell-qty="'+bond.id+'" style="width:72px;display:inline-block;padding:2px 5px;font-size:12px"> '+ 
        '<button class="btn sm" data-act="sell-bond" data-bond="'+bond.id+'" '+(available>0?'':'disabled')+'>Sell</button></td></tr>';
  }).join('')||'<tr><td colspan="6" class="hint">No active bond holdings.</td></tr>';
  const orderRows=state.bondOrders.map(order=>{
    const label=order.kind==='buy'
      ? 'Buy '+order.units+' × '+order.years+'-year · '+esc(PORTS_BY_ID[order.portId].name)
      : 'Sell '+order.units+' bond share(s)';
    return '<div class="kv small"><span>'+label+'</span><span>Settles in '+Math.max(0,Math.ceil(order.settleDay-state.gameDay))+'d</span></div>';
  }).join('')||'<p class="hint">No bond orders pending.</p>';
  let bondPanel;
  if(!bondMarket){
    bondPanel='<div class="panel"><div class="panel-title"><h3>City Bonds</h3></div><p class="hint">Bond purchases are available while docked at a port.</p></div>';
  } else {
    const availableTerms=BOND_TERMS.map(term=>{
      const remaining=state.bondSupply[state.portId][term.years];
      const limit=state.bondSupplyLimit[state.portId][term.years];
      return '<option value="'+term.years+'">'+term.years+' years · '+(bondAnnualRate(term.years,state.portId)*100).toFixed(2)+'% annual · '+
        fmtNum(remaining)+' / '+fmtNum(limit)+' shares available</option>';
    }).join('');
    bondPanel='<div class="panel solid"><div class="panel-title"><h3>City Bonds — '+esc(currentPort.name)+'</h3><span class="tag">'+
      fmtPortCoins(bondMarket.price,state.portId)+' / share · '+(bondMarket.couponMissChance*100).toFixed(0)+'% missed coupon chance · '+
      (bondMarket.couponTaxRate*100).toFixed(0)+'% coupon tax</span></div>'+ 
      '<p class="hint">Annual yields at '+esc(currentPort.name)+' are '+BOND_TERMS.map(term=>term.years+'y '+(bondAnnualRate(term.years,state.portId)*100).toFixed(2)+'%').join(', ')+'. Coupons are credited to a separate funds every 182.5 game days; an issuer may miss a payment.</p>'+ 
      '<div class="row" style="margin-bottom:10px"><label class="fld" style="flex:1"><span>Term and annual rate</span><select id="bondTermSel">'+availableTerms+'</select></label>'+ 
        '<label class="fld" style="width:110px"><span>Shares</span><input id="bondBuyUnits" type="number" min="1" step="1" value="1"></label>'+ 
        '<button class="btn primary" data-act="buy-bond" style="margin-top:14px">Buy bonds</button></div>'+ 
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Issuing city</th><th>Term / rate</th><th>Shares</th><th>Current value</th><th>Matures</th><th>Sell</th></tr></thead><tbody>'+bondRows+'</tbody></table></div>'+ 
      '<div class="divider"></div><h4>Pending Bond Orders</h4>'+orderRows+'</div>';
  }
  const couponBalance=Math.max(0,Number(state.bondCouponFunds[state.portId])||0);
  const localBankStats=portBankingStats(state.portId);
  const localTaxRefunded=Number(localBankStats.taxRefunded)||0;
  const localNetTaxPaid=Math.max(0,(Number(localBankStats.taxPaid)||0)-localTaxRefunded);
  const couponPanel='<div class="panel solid"><div class="panel-title"><h3>Bond Coupon Funds</h3><span class="tag">'+
    fmtPortCoins(couponBalance,state.portId)+'</span></div>'+ 
    '<p class="hint">Bond coupons are held here until withdrawn. Withdrawals incur '+(bondCouponTaxRate(state.portId)*100).toFixed(0)+'% tax at '+esc(currentPort.name)+'. Savings interest is taxed at '+(savingsTaxRate*100).toFixed(0)+'% when credited.</p>'+ 
    '<div class="row"><label class="fld" style="flex:1"><span>Withdrawal amount before tax</span><input id="bondCouponWithdrawAmount" type="number" min="0.01" max="'+couponBalance+'" step="0.01" value="'+couponBalance+'" '+(couponBalance>=0.01?'':'disabled')+'></label>'+

function renderDebug(){
  const el = document.getElementById('debugPanel');
  if(!CONFIG.debug || !state){ el.style.display='none'; return; }
  el.style.display='block';
  const lines = [];
  lines.push('GAME TIME: day '+state.gameDay.toFixed(3)+'  |  real '+new Date().toLocaleTimeString());
  lines.push('FUNDS: '+state.funds+' ('+formatWalletValue(state.funds)+')');
  lines.push('REP: '+state.reputation.toFixed(1)+'  |  SKILL PTS: '+state.skillPoints);
  lines.push('PORT: '+state.portId+'  |  TRAVEL: '+(state.travel?state.travel.toId:'—'));
  lines.push('NEXT PAYROLL: Day '+state.nextPayrollDay+' (in '+Math.max(0,(state.nextPayrollDay-state.gameDay)).toFixed(1)+'d)');
  lines.push('PAYROLL TOTAL: '+crewPayrollCost()+' K');
  lines.push('TASKS: '+state.tasks.length+'  |  SHIPS: '+state.ships.length+'  |  CREW: '+state.crew.length);
  lines.push('TRAINING: '+state.crew.filter(c=>c.training).length+' active');
  lines.push('--- ship locations ---');
  for(const s of state.ships.slice(0,6)){
    lines.push(s.name+' @ '+(s.locationId||'?')+' ['+s.status+'] hull '+Math.round(s.hull)+'/'+s.maxHull);
  }
  lines.push('--- recent ---');
  for(const l of debugBuf.slice(0,8)) lines.push(l);
  el.innerHTML = '<h4>DEBUG</h4>'+esc(lines.join('\n')).replace(/\n/g,'<br>');
}

   ACTIONS

let mapPointerDrag=null;
let suppressMapDragClick=false;
viewEl.addEventListener('pointerdown',function(event){
  const viewport=event.target.closest('.mapwrap');
  if(!viewport||event.target.closest('.portnode')||event.button!==0||!event.isPrimary) return;
  mapPointerDrag={viewport,pointerId:event.pointerId,x:event.clientX,y:event.clientY,
    scrollLeft:viewport.scrollLeft,scrollTop:viewport.scrollTop};
  viewport.classList.add('dragging');
  viewport.setPointerCapture(event.pointerId);
});
viewEl.addEventListener('pointermove',function(event){
  if(!mapPointerDrag||event.pointerId!==mapPointerDrag.pointerId) return;
  const deltaX=event.clientX-mapPointerDrag.x;
  const deltaY=event.clientY-mapPointerDrag.y;
  if(Math.abs(deltaX)+Math.abs(deltaY)>4) mapPointerDrag.moved=true;
  mapPointerDrag.viewport.scrollLeft=mapPointerDrag.scrollLeft-deltaX;
  mapPointerDrag.viewport.scrollTop=mapPointerDrag.scrollTop-deltaY;
});
function stopMapPointerDrag(event){
  if(!mapPointerDrag||event.pointerId!==mapPointerDrag.pointerId) return;
  if(mapPointerDrag.moved){
    suppressMapDragClick=true;
    setTimeout(()=>{ suppressMapDragClick=false; },0);
  }
  mapPointerDrag.viewport.classList.remove('dragging');
  mapPointerDrag=null;
}
viewEl.addEventListener('pointerup',stopMapPointerDrag);
viewEl.addEventListener('pointercancel',stopMapPointerDrag);

document.addEventListener('click', function(e){
  if(suppressMapDragClick&&e.target.closest('.mapwrap')){
    suppressMapDragClick=false;
    e.preventDefault();
    return;
  }
  const tabBtn = e.target.closest('#tabs button');
  if(tabBtn){
    if(isMarineDetained()&&!['captain','marine','settings'].includes(tabBtn.dataset.tab)) return;
    ui.tab = tabBtn.dataset.tab;
    ui.selectedPort = null;
    ui.viewDirty = true;
    if(ui.tab === 'market') tutorialAdvance('market');
    if(ui.tab === 'black-market') tutorialAdvance('blackmarket_visit');
    saveGame(true);
    renderTabs(); renderView();
    return;
  }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(isMarineDetained()&&!['marine-pay-fine','save','export','reset-settings','set-game-speed'].includes(act)) return;
  switch(act){
    case 'set-game-speed': {
      const speed=Number(el.dataset.speed);
      if(!GAME_SPEEDS.includes(speed)) break;
      syncGameTime(Date.now());
      state.settings.gameSpeed=speed;
      saveGame(true);
      renderHeader();
      if(ui.tab==='settings') renderView();
      break;
    }
    case 'exploration-mode':
      if(el.dataset.mode==='exploration'||el.dataset.mode==='trading') ui.explorationMode=el.dataset.mode;
      renderView(); break;
    case 'map-zoom': {
      const viewport=viewEl.querySelector('.mapwrap');
      const horizontal=viewport?viewport.scrollLeft/Math.max(1,viewport.scrollWidth-viewport.clientWidth):0;
      const vertical=viewport?viewport.scrollTop/Math.max(1,viewport.scrollHeight-viewport.clientHeight):0;
      ui.mapZoom=clamp(ui.mapZoom+Number(el.dataset.step),0.65,2.5);
      renderView();
      const resized=viewEl.querySelector('.mapwrap');
      if(resized){
        resized.scrollLeft=horizontal*Math.max(0,resized.scrollWidth-resized.clientWidth);
        resized.scrollTop=vertical*Math.max(0,resized.scrollHeight-resized.clientHeight);
      }
      break;
    }
    case 'search': searchTheSea(); renderView(); break;
    case 'claim-daily': claimDailyReward(); renderView(); break;
    case 'black-good-buy': {
      const qty=viewEl.querySelector('[data-bm-qty="'+CSS.escape(el.dataset.good)+'"]');
      buyIllegalGood(el.dataset.good,qty?qty.value:1); renderHeader(); renderTabs(); renderView(); break;
    }
    case 'black-good-sell': {
      const qty=viewEl.querySelector('[data-bm-qty="'+CSS.escape(el.dataset.good)+'"]');
      sellIllegalGood(el.dataset.ship,el.dataset.good,qty?qty.value:1); renderHeader(); renderTabs(); renderView(); break;
    }
    case 'black-ship-buy':
      buyBlackMarketShip(el.dataset.offer); renderHeader(); renderTabs(); renderView(); break;
    case 'smelt-start': {
      const amount=viewEl.querySelector('#smeltMdp');
      const currency=viewEl.querySelector('#smeltCurrency');
      startSmeltingJob(state.portId,amount?.value,currency?.value);
      renderHeader(); renderTabs(); renderView(); break;
    }
    case 'smelt-all-coins':
      startSmeltingAllCoins(state.portId); renderHeader(); renderTabs(); renderView(); break;
    case 'smelt-fee':
      paySmeltingFee(state.portId); renderHeader(); renderTabs(); renderView(); break;
    case 'smelt-upgrade':
      upgradeSmeltingFacility(state.portId); renderHeader(); renderTabs(); renderView(); break;
    case 'tutorial-start': {
      const tutorial=TUTORIALS.find(item=>item.id===el.dataset.tutorial);
      if(tutorial){
        state.tutorialRuns.activeId=tutorial.id;
        state.tutorialRuns.step=0;
        toast('Now tracking: '+esc(tutorial.name)+'.');
        renderTutorial();
        renderView();
      }
      break;
    }
    case 'sort-fleet-class':
      ui.fleetSortByClass=!ui.fleetSortByClass;
      renderView(); break;
    case 'toggle-ship-active': {
      const ship=getShip(el.dataset.ship);
      if(!ship||ship.status!=='idle') break;
      if(portIsRebelled(ship.locationId)){ toast('That ship is trapped in a rebellious port.','bad'); break; }
      ship.active=ship.active===false;
      if(!ship.active){
        for(const member of state.crew){
          if(member.shipId===ship.id) member.shipId=null;
        }
      }
      toast(esc(ship.name)+(ship.active?' activated for operations.':' deactivated.'),'good');
      renderView(); break;
    }
    case 'repair-ship': { const s = getShip(el.dataset.ship); if(s) repairShip(s); renderView(); break; }
    case 'upgrade-ship': {
      const shipId=el.dataset.ship;
      upgradeShip(shipId,el.dataset.upgrade);
      renderView();
      const upgradeButton=Array.from(viewEl.querySelectorAll('[data-act="upgrade-ship"]'))
        .find(button=>button.dataset.ship===shipId);
      if(upgradeButton) upgradeButton.closest('.ship-upgrades').open=true;
      break;
    }
    case 'rename-ship': {
      const s = getShip(el.dataset.ship); if(!s) break;
      const name = prompt('New name for this ship:', s.name);
      if(name && name.trim()){ s.name = name.trim().slice(0,40); logEntry('SHIP','Ship renamed "'+s.name+'".'); renderView(); }
      break;
    }
    case 'sell-ship': {
      const s = getShip(el.dataset.ship); if(!s) break;
      if(state.ships.length <= 1){ toast('You must keep at least one ship.','bad'); break; }
      if(s.status !== 'idle'){ toast('That ship is at sea.','bad'); break; }
      if(s.locationId !== state.portId){ toast('That ship is not at this port.','bad'); break; }
      const price = shipSalePrice(s);
      if(!confirm('Sell '+s.name+' for '+fmtWalletValue(price)+'?')) break;
      const result=sellShips([s.id]);
      if(!result.ok) toast(result.error,'bad');
      renderHeader();
      renderView(); break;
    }
    case 'sell-class': {
      const classLabel=el.dataset.class;
      const ships=state.ships.filter(ship=>shipClassLabel(ship)===classLabel&&
        ship.status==='idle'&&ship.locationId===state.portId);
      const proceeds=ships.reduce((total,ship)=>total+shipSalePrice(ship),0);
      if(!ships.length){ toast('No idle ships of that class are at this port.','bad'); break; }
      if(state.ships.length<=ships.length){ toast('You must keep at least one ship.','bad'); break; }
      if(!confirm('Sell '+ships.length+' '+classLabel+' ship(s) for '+fmtWalletValue(proceeds)+'?')) break;
      const result=sellShips(ships.map(ship=>ship.id));
      if(!result.ok) toast(result.error,'bad');
      renderHeader();
      renderView(); break;
    }
    case 'buy-ship': {
      const t = SHIP_TYPE_BY_ID[el.dataset.type]; if(!t) break;
      if(t.rewardOnly){ toast(t.name+' can only be won as a prize.','bad'); break; }
      if(portIsClosed(state.portId)){ toast('The port is closed. Shipyard services are unavailable.','bad'); break; }
      if(!portShipyardTypes(state.portId).includes(t.id)){ toast(t.name+' is not sold at this port.','bad'); break; }
      const requiredRep = t.unlock?.minReputation || 0;
      if(state.reputation < requiredRep){ toast('This ship requires '+requiredRep+' reputation.','bad'); break; }
      const price=shipyardPrice(t,state.portId);
      if(!Economy.canAfford(price)){ toast('Not enough coins.','bad'); break; }
      Economy.removeMoney(price, 'Ship Purchase: '+t.name);
      const name = prompt('Name your new '+t.name+':', prizeName());
      const ship = makeShip(t.id, (name||t.name).slice(0,40), state.portId);
      state.ships.push(ship);
      const includedCrewCount=t.class<=3?t.crewCap:0;
      for(let index=0;index<includedCrewCount;index++){
        const member=makeCrewMember(pick(CREW_ROLES).id);
        member.shipId=ship.id;
        state.crew.push(member);
      }
      logEntry('SHIP', 'Purchased a '+t.name+' for '+fmtWalletValue(price)+' — christened "'+ship.name+'".');
      if(includedCrewCount){
        logEntry('CREW',ship.name+' arrived with '+includedCrewCount+' crew included in its purchase.');
      }
      toast('⛵ Acquired the '+esc(ship.name)+'!'+
        (includedCrewCount?' '+includedCrewCount+' crew included.':''),'good');
      if(!includedCrewCount) autoAssignCrew(true);
      ui.headerDirty=true;
      renderView(); break;
    }
    case 'recruit': recruitCrew(el.dataset.crew); renderView(); break;
    case 'recruit-all': recruitAllCrew(); renderHeader(); renderTabs(); renderView(); break;
    case 'upgrade-facility': upgradeCrewFacility(el.dataset.facility); renderView(); break;
    case 'fill-all-ships': fillAllIdleShips(); renderHeader(); renderView(); break;
    case 'auto-assign-crew': autoAssignCrew(); renderView(); break;
    case 'dismiss-crew':
      if(confirm('Dismiss this crew member?')){ dismissCrew(el.dataset.crew); renderView(); }
      break;
    case 'dismiss-all-crew': {
      const crewIds=state.crew.map(member=>member.id);
      if(crewIds.length&&confirm('Dismiss all '+crewIds.length+' crew members?')){
        crewIds.forEach(dismissCrew);
        renderHeader(); renderTabs(); renderView();
      }
      break;
    }
    case 'dismiss-unassigned-crew': {
      const unassigned=state.crew.filter(member=>!member.shipId||!getShip(member.shipId));
      if(unassigned.length&&confirm('Dismiss '+unassigned.length+' unassigned crew member(s)?')){
        dismissUnassignedCrew();
        renderHeader(); renderTabs(); renderView();
      }
      break;
    }
    case 'morale': applyMoraleAction(el.dataset.action); renderView(); break;
    case 'train': startTraining(el.dataset.crew, el.dataset.training); renderView(); break;
    case 'buy': {
      const comm = el.dataset.comm;
      const qtyInput = viewEl.querySelector('input[data-qty="'+CSS.escape(comm)+'"]');
      const qty = qtyInput ? Number(qtyInput.value) : 0;
      const res = buyCommodity(ui.marketShip, comm, qty);
      if(!res.ok) toast('❌ '+esc(res.error),'bad');
      renderView(); break;
    }
    case 'smart-buy': smartBuy(ui.marketShip); renderView(); break;
    case 'sell': {
      const comm = el.dataset.comm;
      const qtyInput = viewEl.querySelector('input[data-qty="'+CSS.escape(comm)+'"]');
      let qty = qtyInput ? Number(qtyInput.value) : 0;
      if(!qty) qty = 999999;
      const res = sellCommodity(ui.marketShip, comm, qty);
      if(!res.ok) toast('❌ '+esc(res.error),'bad');
      renderView(); break;
    }
    case 'select-all-ships': {
      const eligibleIds=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId===state.portId&&
        (el.dataset.selectionContext==='port-raid'||crewOfShip(ship.id).some(member=>!member.training))).map(ship=>ship.id);
      if(el.dataset.selectionContext==='mission'){
        ui.missionShipSelection[el.dataset.mission]=eligibleIds;
      } else if(el.dataset.selectionContext==='raid'){
        ui.raidShipSelection[el.dataset.target]=eligibleIds;
      } else if(el.dataset.selectionContext==='port-raid'){
        ui.portRaidShipSelection=eligibleIds;
      }
      renderView(); break;
    }
    case 'select-travel-ships':
      ui.travelShipSelection=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&
        ship.locationId===state.portId).slice(0,6).map(ship=>ship.id);
      renderView(); break;
    case 'dispatch-mission': {
      const mid = el.dataset.mission;
      const shipIds = ui.missionShipSelection[mid] || [];
      if(!shipIds.length){ toast('Select one or more ships.','bad'); break; }
      const approachSel = viewEl.querySelector('.mission-approach-sel[data-mission="'+CSS.escape(mid)+'"]');
      dispatchMission(mid, shipIds, approachSel ? approachSel.value : 'balanced');
      renderView(); break;
    }
    case 'dispatch-exploration': {
      const shipSel = document.getElementById('explorationShipSel');
      const difficultySel = document.getElementById('explorationDifficultySel');
      if(!shipSel || !shipSel.value){ toast('Select a ship with available crew.','bad'); break; }
      dispatchExploration(shipSel.value, difficultySel ? difficultySel.value : 'easy');
      renderTabs(); renderView(); break;
    }
    case 'return-exploration': returnExploration(el.dataset.task); renderTabs(); renderView(); break;
    case 'dispatch-automated-trading': {
      const capitalInput=document.getElementById('tradingCapital');
      const durationInput=document.getElementById('tradingDuration');
      const indefinite=document.getElementById('tradingIndefinite');
      const shipIds = ui.tradingShipSelection.slice();
      const escortIds = ui.tradingEscortSelection.filter(id => !shipIds.includes(id));
      dispatchAutomatedTrading(shipIds, ui.tradingRouteDraft.slice(), escortIds,
        capitalInput?capitalInput.value:0, durationInput?durationInput.value:30, !!(indefinite && indefinite.checked));
      ui.tradingShipSelection = [];
      ui.tradingEscortSelection = [];
      renderTabs(); renderView(); break;
    }
    case 'add-trading-stop': {
      const stopSel=document.getElementById('tradingRouteStopSel');
      const stopId=stopSel?stopSel.value:null;
      if(stopId&&!ui.tradingRouteDraft.includes(stopId)&&state.markets[stopId]&&stopId!==state.portId){
        ui.tradingRouteDraft.push(stopId); renderView();
      }
      break;
    }
    case 'remove-trading-stop':
      ui.tradingRouteDraft.splice(Number(el.dataset.index),1); renderView(); break;
    case 'move-trading-stop': {
      const index=Number(el.dataset.index);
      const next=index+(el.dataset.direction==='up'?-1:1);
      if(index>=0&&index<ui.tradingRouteDraft.length&&next>=0&&next<ui.tradingRouteDraft.length){
        [ui.tradingRouteDraft[index],ui.tradingRouteDraft[next]]=[ui.tradingRouteDraft[next],ui.tradingRouteDraft[index]];
        renderView();
      }
      break;
    }
    case 'recall-trading': recallAutomatedTrading(el.dataset.task); renderTabs(); renderView(); break;
    case 'cancel-task': cancelTask(el.dataset.task); renderTabs(); renderView(); break;
    case 'dispatch-trade': {
      const shipSel = document.getElementById('tradeShipSel');
      const destSel = document.getElementById('tradeDestSel');
      if(!shipSel || !shipSel.value){ toast('Select a loaded ship.','bad'); break; }
      dispatchTrade(shipSel.value, destSel.value, ui.tradeEscortSelection);
      renderView(); break;
    }
    case 'dispatch-loaded-fleet':
      dispatchLoadedFleet(); renderTabs(); renderView(); break;
    case 'command-remote-ship': {
      const shipSel=document.getElementById('remoteShipSel');
      const destinationSel=document.getElementById('remoteDestinationSel');
      if(shipSel&&destinationSel) commandRemoteShip(shipSel.value,destinationSel.value);
      renderTabs(); renderView(); break;
    }
    case 'port-click': {
      const mapViewport=viewEl.querySelector('.mapwrap');
      const scrollLeft=mapViewport?mapViewport.scrollLeft:0;
      const scrollTop=mapViewport?mapViewport.scrollTop:0;
      ui.selectedPort=el.dataset.port;
      renderView();
      const updatedViewport=viewEl.querySelector('.mapwrap');
      if(updatedViewport){
        updatedViewport.scrollLeft=scrollLeft;
        updatedViewport.scrollTop=scrollTop;
      }
      break;
    }
    case 'travel': {
      const destId = el.dataset.port;
      if(destId === state.portId || state.travel) break;
      startTravel(destId,ui.travelShipSelection);
      renderView(); break;
    }
    case 'cancel-travel': cancelTravel(); renderHeader(); renderTabs(); renderView(); break;
    case 'log-filter': ui.logFilter = el.dataset.cat; renderView(); break;
    case 'skill': spendSkillPoint(el.dataset.skill); renderView(); break;
    case 'rename-captain': {
      const name = prompt('Captain name:', state.captain.name);
      if(name && name.trim()) state.captain.name = name.trim().slice(0,40);
      const title = prompt('Title / nickname:', state.captain.title);
      if(title !== null) state.captain.title = title.trim().slice(0,40);
      renderHeader(); renderView(); break;
    }
    case 'borrow-merchant': {
      const amount=document.getElementById('bankLoanAmount');
      borrowFromMerchant(amount?amount.value:0);
      renderView(); break;
    }
    case 'exchange-currency': {
      const from=document.getElementById('exchangeFrom');
      const to=document.getElementById('exchangeTo');
      const amount=document.getElementById('exchangeAmount');
      if(from?.value==='ALL') exchangeAllBankCurrencies(to?to.value:'');
      else exchangeBankCurrency(from?from.value:'',to?to.value:'',amount?amount.value:0);
      renderView(); break;
    }
    case 'repay-merchant': {
      const amount=document.getElementById('bankRepaymentAmount');
      repayMerchantLoan(amount?amount.value:0);
      renderView(); break;
    }
    case 'deposit-savings': {
      const amount=document.getElementById('savingsDepositAmount');
      depositSavings(amount?amount.value:0);
      renderView(); break;
    }
    case 'withdraw-savings': {
      const amount=document.getElementById('savingsWithdrawAmount');
      withdrawSavings(amount?amount.value:0);
      renderView(); break;
    }
    case 'withdraw-bond-coupons': {
      const amount=document.getElementById('bondCouponWithdrawAmount');
      withdrawBondCoupons(amount?amount.value:0);
      renderView(); break;
    }
    case 'buy-bond': {
      const term=document.getElementById('bondTermSel');
      const units=document.getElementById('bondBuyUnits');
      placeBondOrder(state.portId,term?term.value:0,units?units.value:0);
      renderView(); break;
    }
    case 'evaluate-bond-supply':
      evaluateBondSupply(); renderView(); break;
    case 'reset-settings':
      if(confirm('Restore all game preferences to their defaults?')){
        syncGameTime(Date.now());
        state.settings={autoSave:true,autoSaveIntervalMs:CONFIG.autoSaveMs,gameSpeed:1,dashboardDetail:'expanded',debug:false};
        CONFIG.debug=false;
        saveGame(true);
        renderView(); renderDebug();
      }
      break;
    case 'sell-bond': {
      const bondId=el.dataset.bond;
      const units=viewEl.querySelector('input[data-bond-sell-qty="'+CSS.escape(bondId)+'"]');
      placeBondSale(bondId,units?units.value:0);
      renderView(); break;
    }
    case 'save': saveGame(false); break;
    case 'export': exportSave(); break;
    case 'reset': resetProgress(); break;
    case 'scan-targets': scanTargets(); renderView(); break;
    case 'raid-target': {
      const targetId=el.dataset.target;
      const target=(ui.targets||[]).find(item=>item.id===targetId);
      const shipIds = ui.raidShipSelection[targetId] || [];
      if(!shipIds.length) toast('Select one or more ships for the raid.','bad');
      else if(target) dispatchRaid(target, shipIds);
      delete ui.raidShipSelection[targetId];
      renderTabs(); renderView(); break;
    }
    case 'port-raid':
      dispatchPortRaid(el.dataset.port,ui.portRaidShipSelection);
      renderTabs(); renderView(); break;
    case 'port-optimize':
      optimizePortTaxes(el.dataset.port);
      renderView(); break;
    case 'port-issue-buy-bonds': {
      const term=document.getElementById('portBondTerm');
      const units=document.getElementById('portBondUnits');
      issueAndBuyBonds(el.dataset.port,term?term.value:0,units?units.value:0);
      renderView(); break;
    }
    case 'port-bribe':
      bribePortPoliticians(el.dataset.port);
      renderView(); break;
    case 'port-offer-adjust':
      adjustMarinePortOffer(el.dataset.port,Number(el.dataset.direction));
      renderView(); break;
    case 'port-sell-marine':
      negotiatePortSale(el.dataset.port);
      renderHeader(); renderTabs(); renderView(); break;
    case 'port-release-control':
      relinquishPortControl(el.dataset.port);
      renderHeader(); renderTabs(); renderView(); break;
    case 'port-ransom':
      payPortRansom(el.dataset.port);
      renderView(); break;
    case 'port-upgrade':
      upgradeControlledPort(el.dataset.port,el.dataset.upgrade);
      renderView(); break;
    case 'marine-fund-select':
      if(MARINES_FUND_PRODUCTS[el.dataset.fund]) ui.marineFundId=el.dataset.fund;
      renderView(); break;
    case 'marine-fund-deposit': {
      const input=viewEl.querySelector('[data-fund-detail="'+CSS.escape(el.dataset.fund)+'"] [data-fund-amount="deposit"]');
      marineFundDeposit(el.dataset.fund,input?.value);
      renderHeader(); renderView(); break;
    }
    case 'marine-fund-withdraw': {
      const input=viewEl.querySelector('[data-fund-detail="'+CSS.escape(el.dataset.fund)+'"] [data-fund-amount="withdraw"]');
      marineFundWithdraw(el.dataset.fund,input?.value,false);
      renderHeader(); renderView(); break;
    }
    case 'marine-fund-withdraw-all':
      marineFundWithdraw(el.dataset.fund,'',true);
      renderHeader(); renderView(); break;
    case 'marine-bond-buy': {
      const quantity=viewEl.querySelector('#marineBondBuyQty');
      const issuer=viewEl.querySelector('#marineBondIssuer');
      buyMarineBonds(quantity?.value,issuer?.value);
      renderHeader(); renderTabs(); renderView(); break;
    }
    case 'marine-bond-buy-all': {
      const issuer=viewEl.querySelector('#marineBondIssuer')?.value||'marine';
      const affordable=BigInt(state.wallet.mdp||'0')/BigInt(marineBondBuyPrice(issuer));
      const quantity=Number(affordable>BigInt(Number.MAX_SAFE_INTEGER)?BigInt(Number.MAX_SAFE_INTEGER):affordable);
      if(quantity>0) buyMarineBonds(quantity,issuer);
      renderHeader(); renderTabs(); renderView(); break;
    }
    case 'marine-bond-sell': {
      const quantity=viewEl.querySelector('[data-marine-bond-sell-qty="'+CSS.escape(el.dataset.bond)+'"]');
      sellMarineBonds(quantity?.value,el.dataset.bond);
      renderHeader(); renderTabs(); renderView(); break;
    }
    case 'marine-bond-sell-all':
      sellMarineBonds(marineBondShares());
      renderHeader(); renderTabs(); renderView(); break;
    case 'marine-pay-fine':
      payMarineFine(el.dataset.fine);
      renderTabs(); renderView(); break;
    case 'marine-dispatch': {
      const shipSel=document.getElementById('marineShipSel_'+el.dataset.offer);
      if(shipSel) dispatchMarineMission(el.dataset.offer,shipSel.value);
      renderTabs(); renderView(); break;
    }
    case 'tut-next':
      state.tutorial.step = Math.min(state.tutorial.step+1, 9);
      if(state.tutorial.step >= 9) state.tutorial.done = true;
      renderTutorial(); break;
    case 'tut-off': state.tutorial.done = true; renderTutorial(); break;
    case 'tut-restart':
      state.tutorial={step:0,done:false};
      renderTutorial();
      ui.viewDirty=true;
      break;
  }
  if(state && act!=='save') saveGame(true);
});

document.addEventListener('change', function(e){
  const t = e.target;
  if(t.matches('#exchangeFrom,#exchangeTo')) updateBankExchangeQuote();
  const card = t.closest('[data-ship-select]');
  if(card && t.matches('input[type="checkbox"]')){
    const context = card.dataset.context;
    const shipId = card.dataset.ship;
    const checked = t.checked;
    if(checked && context==='trading' && ui.tradingEscortSelection.includes(shipId)){
      t.checked=false;
      return;
    }
    if(checked && context==='trading-escort' && ui.tradingShipSelection.includes(shipId)){
      t.checked=false;
      return;
    }
    if(checked) card.classList.add('selected'); else card.classList.remove('selected');
    if(context === 'travel'){
      const index=ui.travelShipSelection.indexOf(shipId);
      if(checked&&index<0){
        if(ui.travelShipSelection.length>=6){
          t.checked=false;
          card.classList.remove('selected');
          toast('A voyage can carry at most six ships.','bad');
          return;
        }
        ui.travelShipSelection.push(shipId);
      }
      if(!checked&&index>=0) ui.travelShipSelection.splice(index,1);
      const count=ui.travelShipSelection.length;
      const countLabel=viewEl.querySelector('[data-travel-count]');
      if(countLabel) countLabel.textContent=count+'/6';
      const travelButton=viewEl.querySelector('[data-act="travel"][data-port="'+CSS.escape(ui.selectedPort||'')+'"]');
      if(travelButton){
        const available=!state.travel&&!portIsClosed(state.portId)&&!portIsClosed(travelButton.dataset.port)&&
          travelButton.dataset.port!==state.portId&&count>0;
        travelButton.disabled=!available;
        travelButton.textContent=travelButton.dataset.port===state.portId?'You are here':state.travel?'Already sailing':
          portIsClosed(travelButton.dataset.port)?'Port closed':portIsClosed(state.portId)?'Current port closed':
          available?'Set Sail · '+count+' ship(s)':'Select a ship';
      }
    } else if(context === 'mission'){
      const mid = card.dataset.mission;
      const arr = ui.missionShipSelection[mid] = ui.missionShipSelection[mid] || [];
      const idx = arr.indexOf(shipId);
      if(checked && idx < 0) arr.push(shipId);
      if(!checked && idx >= 0) arr.splice(idx,1);
    } else if(context === 'raid'){
      const tid = card.dataset.target;
      const arr = ui.raidShipSelection[tid] = ui.raidShipSelection[tid] || [];
      const idx = arr.indexOf(shipId);
      if(checked && idx < 0) arr.push(shipId);
      if(!checked && idx >= 0) arr.splice(idx,1);
    } else if(context === 'port-raid'){
      const idx=ui.portRaidShipSelection.indexOf(shipId);
      if(checked&&idx<0) ui.portRaidShipSelection.push(shipId);
      if(!checked&&idx>=0) ui.portRaidShipSelection.splice(idx,1);
    } else if(context === 'trading'){
      const idx = ui.tradingShipSelection.indexOf(shipId);
      if(checked && idx < 0) ui.tradingShipSelection.push(shipId);
      if(!checked && idx >= 0) ui.tradingShipSelection.splice(idx,1);
    } else if(context === 'trading-escort'){
      const idx = ui.tradingEscortSelection.indexOf(shipId);
      if(checked && idx < 0) ui.tradingEscortSelection.push(shipId);
      if(!checked && idx >= 0) ui.tradingEscortSelection.splice(idx,1);
    } else if(context === 'trade-escort'){
      const idx = ui.tradeEscortSelection.indexOf(shipId);
      if(checked && idx < 0) ui.tradeEscortSelection.push(shipId);
      if(!checked && idx >= 0) ui.tradeEscortSelection.splice(idx,1);
    }
    if(context==='mission'){
      const missionId=card.dataset.mission;
      const mission=state.missions.find(item=>item.id===missionId);
      const duration=viewEl.querySelector('[data-mission-duration="'+CSS.escape(missionId)+'"]');
      if(mission&&duration){
        const selectedShips=(ui.missionShipSelection[missionId]||[]).map(getShip).filter(Boolean);
        duration.textContent=(selectedShips.length?'~':'')+
          missionDurationDays(mission,selectedShips).toFixed(1)+' days';
      }
    }
    if(context==='trading'||context==='trading-escort'){
      const otherContext=context==='trading'?'trading-escort':'trading';
      const blocked=context==='trading'
        ? ui.tradingShipSelection.includes(shipId)
        : ui.tradingEscortSelection.includes(shipId);
      viewEl.querySelectorAll('[data-ship-select][data-context="'+otherContext+'"]').forEach(otherCard=>{
        if(otherCard.dataset.ship!==shipId) return;
        const otherInput=otherCard.querySelector('input[type="checkbox"]');
        if(otherInput) otherInput.disabled=blocked;
        otherCard.classList.toggle('disabled',blocked);
      });
    }
    if(context==='port-raid') renderView();
    return;
  }
  if(t.id==='tradingIndefinite'){
    const duration=document.getElementById('tradingDuration');
    if(duration) duration.disabled=t.checked;
    return;
  }
  if(t.id==='fleetSellClass'){ ui.fleetSellClass=t.value; renderView(); return; }
  if(t.id==='portGovernanceSelect'){
    ui.portSelected=t.value;
    ui.portRaidShipSelection=[];
    renderView();
    saveGame(true);
    return;
  }
  if(t.id==='portTradeTax'||t.id==='portPopulationTax'){
    const governance=portGovernance(ui.portSelected||state.portId);
    const rate=clamp(Number(t.value)||0,0,60)/100;
    if(t.id==='portTradeTax') governance.tradeTaxRate=rate;
    else governance.populationTaxRate=rate;
    renderView();
    saveGame(true);
    return;
  }
  if(t.id === 'marketShipSel'){ ui.marketShip = t.value; renderView(); return; }
  if(t.id === 'tradeShipSel'){
    ui.mapTradeShip=t.value;
    ui.tradeEscortSelection=ui.tradeEscortSelection.filter(id=>id!==t.value);
    renderView(); return;
  }
  if(t.id==='remoteShipSel'){ ui.remoteCommandShip=t.value; renderView(); return; }
  if(t.id === 'compareSel'){ ui.compareComm = t.value; renderView(); return; }
  if(t.id === 'importFile' && t.files && t.files[0]){ importSaveFile(t.files[0]); return; }
  if(t.id==='gameSpeedSel'){
    syncGameTime(Date.now());
    state.settings.gameSpeed=Number(t.value);
    saveGame(true);
    ui.headerDirty=true; ui.viewDirty=true;
    return;
  }
  if(t.id==='autoSaveToggle'){
    state.settings.autoSave=t.checked;
    const interval=document.getElementById('autoSaveIntervalSel');
    if(interval) interval.disabled=!t.checked;
    saveGame(true);
    renderView();
    return;
  }
  if(t.id==='autoSaveIntervalSel'){
    state.settings.autoSaveIntervalMs=Number(t.value);
    saveGame(true);
    return;
  }
  if(t.id==='dashboardDetailSel'){
    state.settings.dashboardDetail=t.value==='compact'?'compact':'expanded';
    saveGame(true);
    renderView();
    return;
  }
  if(t.id==='debugToggle'){
    CONFIG.debug=t.checked;
    state.settings.debug=t.checked;
    debugPush('Debug mode '+(t.checked?'enabled':'disabled'));
    saveGame(true);
    renderDebug();
    return;
  }
});

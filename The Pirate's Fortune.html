function sellCommodity(shipId, commName, quantity){
  if(portIsClosed(state.portId)) return {ok:false,error:'This port is closed to trade.'};
  const ship = getShip(shipId);
  if(!ship) return {ok:false, error:'No ship selected.'};
  if(!shipIsActive(ship)) return {ok:false, error:'That ship is inactive.'};
  if(ship.status !== 'idle') return {ok:false, error:'That ship is at sea.'};
  if(ship.locationId !== state.portId) return {ok:false, error:'That ship is not at this port.'};
  const c = COMM_BY_NAME[commName];
  if(!c) return {ok:false, error:'Unknown commodity.'};
  const held = ship.cargo[commName] || 0;
  if(held <= 0) return {ok:false, error:'No '+commName+' aboard '+ship.name+'.'};
  const qty = Math.min(Math.floor(Number(quantity)||0), held);
  if(qty <= 0) return {ok:false, error:'Invalid quantity.'};

  const m = currentMarket();
  const e = m.prices[commName];
  if(!e) return {ok:false, error:'No buyer for that here.'};

  const unitPrice = marketSellUnitPrice(state.portId,e);
  const revenue = Math.round(qty * unitPrice);
  if(revenue <= 0) return {ok:false, error:'Revenue would be zero.'};

  const prevCargo = held;
  ship.cargo[commName] = held - qty;
  if(ship.cargo[commName] <= 1e-9) delete ship.cargo[commName];
  try {
    Economy.addMoney(revenue, 'Commodity Sale: '+qty+' '+c.unit+' '+commName);
  } catch(err){
    ship.cargo[commName] = prevCargo;
    debugPush('[SELL] FAILED to credit revenue: '+err.message);
    return {ok:false, error:'Transaction failed.'};
  }
  debugPush('[SELL] '+ship.name+' sold '+qty+' '+c.unit+' '+commName+' @ '+fmtK(e.price)+' = '+revenue+' K');
  logEntry('TRADE', 'Sold '+qty+' '+c.unit+' of '+commName+' at '+fmtK(unitPrice)+' for '+fmtWalletValue(revenue)+'.');
  toast('💰 Sold '+qty+' '+c.unit+' '+esc(commName)+' for '+fmtWalletValue(revenue),'good');
  tutorialAdvance('sell');
  ui.viewDirty = true;
  return {ok:true, revenue};
}

function buyCommodity(shipId, commName, quantity, options){
  if(portIsClosed(state.portId)) return {ok:false,error:'This port is closed to trade.'};
  options = options || {};
  const ship = getShip(shipId);
  if(!ship) return {ok:false, error:'No ship selected.'};
  if(!shipIsActive(ship)) return {ok:false, error:'That ship is inactive.'};
  if(ship.status !== 'idle') return {ok:false, error:'That ship is at sea.'};
  if(ship.locationId !== state.portId) return {ok:false, error:'That ship is not at this port.'};
  const m = currentMarket();
  const e = m.prices[commName];
  if(!e) return {ok:false, error:'Not traded here.'};
  const c = COMM_BY_NAME[commName];
  const unitPrice=marketBuyUnitPrice(state.portId,e);
  const capacityLeft = cargoCapacity(ship) - cargoUsed(ship);
  const maxByCargo = Math.floor(capacityLeft / c.cargoFactor);
  const maxByStock = e.stock;
  const maxByMoney = Math.floor(state.funds / unitPrice);
  let actual = Math.floor(Number(quantity)||0);
  actual = Math.min(actual, maxByCargo, maxByStock, maxByMoney);
  if(actual <= 0) return {ok:false, error:'Cannot buy that quantity.'};
  const cost = Math.max(1, Math.round(actual * unitPrice));
  if(!Economy.canAfford(cost)) return {ok:false, error:'Not enough coins.'};
  Economy.removeMoney(cost, 'Commodity Buy: '+actual+' '+c.unit+' '+commName);
  addCargo(ship, commName, actual);
  e.stock -= actual;
  logEntry('TRADE', 'Bought '+actual+' '+c.unit+' of '+commName+' at '+fmtK(e.price)+' for '+fmtWalletValue(cost)+' aboard '+ship.name+'.');
  if(!options.silent) toast('📦 Bought '+actual+' '+c.unit+' '+esc(commName)+' for '+fmtWalletValue(cost),'good');
  tutorialAdvance('buy');
  ui.viewDirty = true;
  return {ok:true, cost};
}

function smartBuy(shipId){
  const ship = getShip(shipId);
  if(!ship){ toast('Select a ship first.','bad'); return; }
  if(!shipIsActive(ship) || ship.status !== 'idle' || ship.locationId !== state.portId){
    toast('That ship is not available at this port.','bad'); return;
  }

  const market = currentMarket();
  const bargains = COMMODITIES.filter(c=>{
    const entry = market.prices[c.name];
    return entry && entry.stock > 0 && entry.price / entry.base < 0.85;
  }).sort((a,b)=>market.prices[a.name].price / market.prices[a.name].base -
    market.prices[b.name].price / market.prices[b.name].base);
  let totalUnits = 0, totalCost = 0, typesBought = 0;
  for(const commodity of bargains){
    const previousQty = ship.cargo[commodity.name] || 0;
    const result = buyCommodity(ship.id, commodity.name, Number.MAX_SAFE_INTEGER, {silent:true});
    if(result.ok){
      totalUnits += (ship.cargo[commodity.name] || 0) - previousQty;
      totalCost += result.cost;
      typesBought++;
    }
  }

  if(!typesBought){
    toast('No affordable low-priced goods, or the ship is full.','bad');
    return;
  }
  toast('Smart Buy loaded '+totalUnits+' units across '+typesBought+' commodities for '+fmtWalletValue(totalCost)+'.','good');
}

function estimateVoyage(ship, destPortId){
  const stats = shipStats(ship);
  let days = baseTravelDays(state.portId, destPortId, stats.speed);
  days *= (1 - skillEffectValue('navigation','travel'));
  return days;
}
function recommendTradeDestination(shipOrFleet){
  const ships=Array.isArray(shipOrFleet)?shipOrFleet:[shipOrFleet];
  const cargo=ships.filter(Boolean).flatMap(cargoList);

  };
  const currentValue=estimateValue(state.portId);
  const bestKnown=Object.keys(state.markets).filter(id=>PORTS_BY_ID[id]&&id!==state.portId&&!portIsClosed(id))
    .map(id=>({port:PORTS_BY_ID[id],value:estimateValue(id)}))
    .sort((a,b)=>b.value-a.value)[0];
  if(bestKnown&&bestKnown.value>currentValue){
    return {port:bestKnown.port,kind:'price',value:bestKnown.value};
  }
  const nearest=PORTS.filter(port=>port.id!==state.portId&&!portIsClosed(port.id))
    .map(port=>({port,distance:portDistance(state.portId,port.id)}))
    .sort((a,b)=>a.distance-b.distance)[0];
  return nearest?{port:nearest.port,kind:'nearest'}:null;
}
function dispatchTrade(shipId, destPortId, escortIds, options){
  options=options||{};
  const ship = getShip(shipId);
  const dest = PORTS_BY_ID[destPortId];
  if(!ship || !dest) return false;
  if(!shipIsActive(ship)){ toast('That ship is inactive.','bad'); return false; }
  if(portIsClosed(destPortId)){ toast('That port is closed.','bad'); return false; }
  if(ship.status !== 'idle'){ toast('That ship is already at sea.','bad'); return false; }
  if(ship.locationId !== state.portId){ toast('That ship is not at this port.','bad'); return false; }
  if(destPortId === state.portId){ toast('That is the port you are already in.','bad'); return false; }
  const cargo = cargoList(ship);
  if(!cargo.length){ toast('Load some cargo aboard '+esc(ship.name)+' first.','bad'); return false; }
  const escorts = (escortIds||[]).map(getShip).filter(s=>
    s && shipIsActive(s) && s.id !== ship.id && s.status === 'idle' && s.locationId === state.portId && cargoList(s).length === 0
  );
  const days = estimateVoyage(ship, destPortId);
  const outDays = Math.max(0.15, days);
  const task = {
    id: uid('task'), kind: 'trade',
    shipId: ship.id,
    escortIds: escorts.map(s=>s.id),
    fromPortId: state.portId,
    destPortId,
    startDay: state.gameDay,
    arriveDay: state.gameDay + outDays,
    returnDay: state.gameDay + outDays*2,
    outDays, phase: 'out',
    cargo: JSON.parse(JSON.stringify(ship.cargo)),
    revenue: 0,
    events: [],
  };
  state.tasks.push(task);
  ship.status = 'task';
  ship.taskId = task.id;
  for(const id of task.escortIds){
    const es = getShip(id);
    if(es){ es.status = 'task'; es.taskId = task.id; }
  }
  ui.tradeEscortSelection = [];
  const totalUnits = cargo.reduce((a,c)=>a+c.qty*COMM_BY_NAME[c.name].cargoFactor,0);
  logEntry('TRADE', ship.name+' departed for '+dest.name+' with '+Math.round(totalUnits)+' cargo units'+
    (escorts.length?', escorted by '+escorts.map(e=>e.name).join(', '):'')+'.');
  if(!options.silent) toast('🚢 '+esc(ship.name)+' bound for '+esc(dest.name)+'.','good');
  ui.viewDirty = true;
  return true;
}

function tradeFleetRecommendationPlan(ships){
  return ships.map(ship=>({ship,recommendation:recommendTradeDestination(ship)}))
    .filter(item=>item.recommendation);
}

function dispatchLoadedFleet(){
  const loadedShips=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&
    ship.locationId===state.portId&&cargoList(ship).length);
  if(state.travel){ toast('Return to port before dispatching a trade fleet.','bad'); return false; }
  if(state.reputation<500){ toast('Batch dispatch requires at least 500 reputation.','bad'); return false; }
  if(loadedShips.length<50){ toast('Batch dispatch requires at least 50 loaded ships at this port.','bad'); return false; }
  const plan=tradeFleetRecommendationPlan(loadedShips);
  if(!plan.length){ toast('No recommended trade destinations are available.','bad'); return false; }
  let dispatched=0;
  const destinationCounts=new Map();
  for(const {ship,recommendation} of plan){
    if(dispatchTrade(ship.id,recommendation.port.id,[],{silent:true})){
      dispatched++;
      destinationCounts.set(recommendation.port.name,(destinationCounts.get(recommendation.port.name)||0)+1);
    }
  }
  if(dispatched){
    const destinations=Array.from(destinationCounts,([name,count])=>count+' to '+name).join(', ');
    logEntry('TRADE',dispatched+' loaded ships dispatched to their recommended ports: '+destinations+'.');
    toast('Dispatched '+dispatched+' loaded ships to their recommended ports.','good');
  }
  ui.tradeEscortSelection=[];
  ui.viewDirty=true;
  ui.headerDirty=true;
  return dispatched>0;
}

function resolveTradeSale(task){
  const ship = getShip(task.shipId);
  const dest = PORTS_BY_ID[task.destPortId];
  if(!ship){ task.phase = 'done'; return; }
  if(portIsClosed(task.destPortId)){
    task.arriveDay=portIsRebelled(task.destPortId)?state.gameDay+1:
      Math.max(state.gameDay+0.1,portClosureEndDay(task.destPortId));
    if(!task.portWaitNotified){
      logEntry('EVENT',dest.name+' is inaccessible; '+ship.name+' will wait offshore until access returns.');
      task.portWaitNotified=true;
    }
    return;
  }
  task.portWaitNotified=false;
  ship.locationId = task.destPortId;

  const ev = weightedEvent(null,task.destPortId);
  const evResult = applyTradeEvent(ev, task, ship);
  const escortStrength = task.escortIds.reduce((a,id)=>{
    const s = getShip(id); return a + (s?shipStats(s).strength:0);
  },0);
  const escortShield = Math.min(0.6, escortStrength / 400);

  const destinationMarket = ensureMarket(task.destPortId, false);
  let gross = 0;
  for(const name in task.cargo){
    const qty = task.cargo[name];
    if(qty <= 0 || !COMM_BY_NAME[name]) continue;
    const entry = destinationMarket.prices[name];
    const unitPrice = entry ? entry.price : referencePrice(name, task.destPortId)*0.75;
    gross += qty * unitPrice;
  }
  const mod = contractModifier();
  let revenue = Math.round(gross * (1+mod));
  task.contractMod = mod;

  if(evResult.bonus) revenue = Math.round(revenue * (1 + evResult.bonus + escortShield*0.1));
  if(evResult.money) revenue += evResult.money;
  revenue = Math.max(0, revenue);
  task.revenue = revenue;

  Economy.addMoney(revenue, 'Trade Sale: '+ship.name+' at '+dest.name);
  state.stats.trades++;

  let repDelta = 0;
  if(mod >= 0.07) repDelta = 2;
  else if(mod < 0) repDelta = -1;
  repDelta = Math.round(repDelta * (1 + skillEffectValue('renown','reputation')));
  state.reputation = clamp(state.reputation + repDelta, 0, 1000);

  const sign = mod>=0?'+':'';
  logEntry('TRADE', ship.name+' sold cargo at '+dest.name+'. Gross '+fmtWalletValue(Math.round(gross))+
    ', contract '+(sign+Math.round(mod*100)+'%')+' → '+fmtWalletValue(revenue)+'.'+
    (evResult.text ? ' '+evResult.text : '')+
    (escortShield>0 ? ' (escorts shielded '+Math.round(escortShield*100)+'%)' : ''),
    {dedupeId: 'trade_sale_'+task.id});

  toast('💰 '+esc(ship.name)+' sold cargo at '+esc(dest.name)+' for <b>'+fmtWalletValue(revenue)+'</b>'+
    ' <span class="muted">('+sign+Math.round(mod*100)+'%)</span>', mod>=0?'good':'bad');
  task.phase = 'back';
  task.events.push(ev.id);
  ui.viewDirty = true;
}
function resolveTradeReturn(task){
  const ship = getShip(task.shipId);
  if(ship){
    ship.status = 'idle';
    ship.taskId = null;
    ship.cargo = {};
    ship.locationId = task.fromPortId;
    const armor = Math.max(0.5,1-(ship.upgrades?.armor||0)*0.02);
    ship.hull = clamp(ship.hull - Math.round(ship.maxHull*rnd(0.01,0.05)*armor), 1, ship.maxHull);
    for(const c of crewOfShip(ship.id)){
      c.morale = clamp(c.morale + (task.contractMod >= 0 ? rndInt(1,4) : -rndInt(1,4)), 0, 100);
    }
  }
  for(const id of task.escortIds){
    const es = getShip(id);
    if(es){ es.status = 'idle'; es.taskId = null; es.locationId = task.fromPortId; }
  }
  logEntry('TRADE', ship ? ship.name+' returned to '+PORTS_BY_ID[task.fromPortId].name+'.' : 'A trade ship returned to port.');
  ui.viewDirty = true;
}

function taskHasCommodity(task, ship, commName){
  const shipIds=Array.isArray(task?.shipIds)?task.shipIds:task?.shipId?[task.shipId]:ship?[ship.id]:[];
  return shipIds.some(id=>{
    const member=getShip(id);
    return member&&Number(member.cargo?.[commName])>0;
  })||Number(task?.cargo?.[commName])>0;
}
function applyEventEffect(ev, ship, task){
  let text = ev.name+': '+ev.text;
  if(ev.money && ship){
    const amt = Math.round(rnd(ev.money[0], ev.money[1]));
    if(amt >= 0) Economy.addMoney(amt, 'Event: '+ev.name);
    else Economy.removeMoney(-amt, 'Event: '+ev.name);
    text += ' ('+(amt>=0?'+':'-')+fmtWalletValue(Math.abs(amt))+')';
  }
  if(ev.hull && ship) ship.hull = clamp(ship.hull + Math.round(ship.maxHull*ev.hull/100), 1, ship.maxHull);
  if(ev.rep){
    state.reputation = clamp(state.reputation + ev.rep, 0, 1000);
    text += ' ('+(ev.rep>0?'+':'')+ev.rep+' rep)';
  }
  if(ev.morale && ship){
    const moraleChange=ev.morale<0&&taskHasCommodity(task,ship,'Quinine')?Math.ceil(ev.morale/2):ev.morale;
    if(moraleChange!==ev.morale) text+=' Quinine reduced the morale loss.';
    for(const c of crewOfShip(ship.id)) c.morale = clamp(c.morale + moraleChange, 0, 100);
  }
  if(ev.delay && task){ task.endDay += ev.delay; text += ' (+'+ev.delay.toFixed(1)+' days)'; }
  logEntry('EVENT', text);
  return text;
}
function applyTradeEvent(ev, task, ship){
  const out = { text:'', money:0, bonus:0 };
  const text = ev.name+': '+ev.text;
  if(ev.money){
    const amt = Math.round(rnd(ev.money[0], ev.money[1]));
    if(amt >= 0) out.money += amt;
    else out.money -= Math.min(state.funds, -amt);
  }
  if(ev.rep) state.reputation = clamp(state.reputation + ev.rep, 0, 1000);
  if(ev.delay){ task.returnDay += ev.delay; task.arriveDay += ev.delay; }
  if(ev.cargoLoss && task.cargo){
    for(const k in task.cargo){
      task.cargo[k] = Math.max(0, Math.round(task.cargo[k]*(1-ev.cargoLoss)));
    }
  }
  if(ev.contractBonus) out.bonus += ev.contractBonus;
  if(ev.morale && ship){
    const moraleChange=ev.morale<0&&taskHasCommodity(task,ship,'Quinine')?Math.ceil(ev.morale/2):ev.morale;
    if(moraleChange!==ev.morale) out.text+=' Quinine reduced the morale loss.';
    for(const c of crewOfShip(ship.id)) c.morale = clamp(c.morale + moraleChange, 0, 100);
  }
  out.text = text;
  return out;
}
function maybeAmbientEvent(){
  if(state.travel) return;
  if(Math.random() > 0.006) return;
  if(Math.random() < 0.08){

      state.gameDay+ev.portClosureDays);

    else Economy.removeMoney(-amt, 'Ambient: '+ev.name);

  logEntry('EVENT',text+(ev.portClosureDays?' '+PORTS_BY_ID[state.portId].name+' closed until day '+
    Math.ceil(portClosureEndDay(state.portId))+'.':''));

    (ev.portClosureDays?' '+esc(PORTS_BY_ID[state.portId].name)+' is closed for '+ev.portClosureDays+' days.':''),
    ev.portClosureDays?'bad':'');
}

function spendSkillPoint(skillId){
  const sk = SKILL_BY_ID[skillId];
  if(!sk) return;
  const cur = state.skills[skillId] || 0;
  if(skillIsMaxed(sk)){
    toast(sk.name+' is already maxed out at its reduction cap.','bad');
    return;
  }
  const cost = cur + 1;
  if(state.skillPoints < cost){ toast('Need '+cost+' skill point(s) to reach rank '+(cur+1)+'.','bad'); return; }
  state.skills[skillId] = cur + 1;
  state.skillPoints -= cost;
  logEntry('CREW', 'Captain improved '+sk.name+' to rank '+(cur+1)+' for '+cost+' skill point(s).');
  toast('⭐ '+esc(sk.name)+' → rank '+(cur+1)+' ('+cost+' points)','good');
  ui.viewDirty = true;
}

function searchTheSea(){
  if(Date.now()<(ui.searchCooldownUntil||0)) return;
  if(state.travel){ toast('You are at sea — the crew is busy sailing.','bad'); return; }
  const vessel = [getShip(state.player.vesselId)].find(s=>shipIsActive(s)&&s.status==='idle') ||
                 state.ships.find(s=>shipIsActive(s)&&s.locationId===state.portId&&s.status==='idle');
  if(!vessel){ toast('No vessel available for searching.','bad'); return; }
  if(vessel.locationId !== state.portId){ toast('Your vessel is not at this port.','bad'); return; }
  ui.searchCooldownUntil=Date.now()+1000;
  updateSearchCooldown();

  const stats = shipStats(vessel);
  let rareBonus = Math.min(0.5, state.reputation/400);
  let valueBonus = 0, accident = 0;
  rareBonus += stats.detection * 0.4;
  for(const c of crewOfShip(vessel.id)){
    if(c.training) continue;
    for(const tid of c.traits){
      const tr = TRAIT_BY_ID[tid];
      if(tr.rareFind) rareBonus += tr.rareFind;
      if(tr.accident) accident += tr.accident;
      if(tr.loot) valueBonus += tr.loot;
    }
  }
  const pairs = SCAV_ITEMS.map(it=>{
    let w = it.w;
    const portSearchMultiplier=PORTS_BY_ID[state.portId]?.searchRareWeightMultiplier||1;
    if(it.cat === 'rare') w *= (1 + rareBonus*2.2)*portSearchMultiplier;
    if(it.cat === 'veryrare') w *= (1 + rareBonus*3.6)*portSearchMultiplier;
    if(it.cat === 'legendary') w *= (1 + rareBonus*6.0)*portSearchMultiplier;
    if(it.cat === 'common') w *= Math.max(0.35, 1 - rareBonus*0.9);
    return [it, w];
  });
  const item = weightedPick(pairs);
  let value = rnd(item.min, item.max);
  let mult = 1 + valueBonus;
  if(item.cat === 'legendary') mult *= 1 + skillEffectValue('treasureSense','value');
  value *= mult;
  let accidentText = '';
  if(accident > 0 && Math.random() < accident*0.6){
    const dmg = rndInt(1,3);
    vessel.hull = clamp(vessel.hull - dmg, 1, vessel.maxHull);
    accidentText = ' A rope snapped and cost '+dmg+' hull.';
  }
  const amount = Math.max(1, Math.floor(value));

  const eventId = uid('search');
  const event = {
    id: eventId,
    flavor: pick(SCAV_FLAVOR),
    name: item.name, cat: item.cat,
    value: amount,
    rare: item.cat==='rare'||item.cat==='veryrare'||item.cat==='legendary',
    accidentText,
    _animate: true,
  };
  ui.lastSearchEvent = event;
  state.stats.searches++;
  Economy.addMoney(amount/LEGACY_KREUZER_SILVER_G, 'Search the Sea: '+item.name);
  const localReward=silverToCoins(amount,activeCurrency());
  logEntry('ECONOMY', 'Found '+item.name+' — '+amount+' g silver, sold for '+fmtMoney(localReward,activeCurrency())+'.', {dedupeId: eventId});
  debugPush('[SEARCH] eventId='+eventId+' ship='+vessel.id+' value='+amount);
  if(event.rare) toast('✨ <b>'+esc(item.name)+'</b> — sold for '+fmtMoney(localReward,activeCurrency()),'good');
  tutorialAdvance('search');
  ui.viewDirty = true;
  ui.headerDirty = true;
}

function updateSearchCooldown(){
  const button=document.getElementById('searchBtn');
  if(!button) return;
  const remaining=Math.max(0,(ui.searchCooldownUntil||0)-Date.now());
  button.disabled=remaining>0;
  button.textContent=remaining>0
    ?'SEARCH THE SEA · '+(Math.ceil(remaining/100)/10).toFixed(1)+'s'
    :'🔭 SEARCH THE SEA';
}

const SAVE_VERSION = 18;

function migrateStage1Finance(raw){
  const migrated={...raw};
  const homePortId=PORTS_BY_ID[raw.portId]?raw.portId:'tortuga';
  migrated.inflation=buildInflationTable(raw.gameDay,raw.inflation);
  const convert=(value,code)=>legacyToCoinsAtYear(value,code,raw.gameDay,migrated.inflation);
  const accounts=raw.bankAccounts&&typeof raw.bankAccounts==='object'?raw.bankAccounts:{};
  migrated.bankAccounts=Object.fromEntries(PORTS.map(port=>{
    const account=accounts[port.id];
    return [port.id,account&&typeof account==='object'?{
      ...account,balance:convert(account.balance,currencyForPort(port.id)),
    }:{balance:0,lastAccrualDay:raw.gameDay||1}];
  }));
  if(!Object.keys(accounts).length&&Number(raw.savingsBalance)>0){
    migrated.bankAccounts[homePortId]={balance:convert(raw.savingsBalance,currencyForPort(homePortId)),
      lastAccrualDay:Number(raw.savingsLastDay)||raw.gameDay||1};
  }
  if(raw.bankLoan&&typeof raw.bankLoan==='object'){
    const loanPortId=PORTS_BY_ID[raw.bankLoan.originPortId]?raw.bankLoan.originPortId:homePortId;
    const currency=currencyForPort(loanPortId);
    migrated.bankLoan={...raw.bankLoan,originPortId:loanPortId};
    for(const key of ['principal','interest','totalDue','remaining','feesCharged','principalLimit']){
      if(Number.isFinite(Number(raw.bankLoan[key]))) migrated.bankLoan[key]=convert(raw.bankLoan[key],currency);
    }
    if(!Number.isFinite(Number(raw.bankLoan.principalLimit))){
      migrated.bankLoan.principalLimit=convert(BANKING.maxPrincipal,currency)*(PORTS_BY_ID[loanPortId].loanLimitMultiplier||1);
    }
  }
  migrated.bonds=(Array.isArray(raw.bonds)?raw.bonds:[]).map(bond=>{
    const portId=PORTS_BY_ID[bond?.portId]?bond.portId:homePortId;
    const currency=currencyForPort(portId);
    return {...bond,portId,
      pricePerShare:convert(bond?.pricePerShare??BANKING_BY_PORT_SIZE[PORTS_BY_ID[portId].size].bondPrice,currency),
      principalPerShare:convert(bond?.principalPerShare??bond?.pricePerShare??BANKING_BY_PORT_SIZE[PORTS_BY_ID[portId].size].bondPrice,currency)};
  });
  migrated.bondOrders=(Array.isArray(raw.bondOrders)?raw.bondOrders:[]).map(order=>{
    if(order?.kind!=='buy') return order;
    const portId=PORTS_BY_ID[order.portId]?order.portId:homePortId;
    return {...order,portId,pricePerShare:convert(order.pricePerShare??BANKING_BY_PORT_SIZE[PORTS_BY_ID[portId].size].bondPrice,currencyForPort(portId))};
  });
  const priorCouponKey=['bondCoupon','Treas','ury'].join('');
  const savedCouponFunds=raw.bondCouponFunds??raw[priorCouponKey];
  migrated.bondCouponFunds=Object.fromEntries(PORTS.map(port=>[port.id,0]));
  if(savedCouponFunds&&typeof savedCouponFunds==='object'){
    for(const [portId,value] of Object.entries(savedCouponFunds)){
      if(PORTS_BY_ID[portId]) migrated.bondCouponFunds[portId]=convert(value,currencyForPort(portId));
    }
  } else {
    migrated.bondCouponFunds[homePortId]=convert(savedCouponFunds,currencyForPort(homePortId));
  }
  migrated.portBankingStats=Object.fromEntries(Object.entries(raw.portBankingStats||{}).map(([portId,stats])=>[
    portId,PORTS_BY_ID[portId]&&stats&&typeof stats==='object'
      ?Object.fromEntries(Object.entries(stats).map(([key,value])=>[key,convert(value,currencyForPort(portId))])):stats,
  ]));
  migrated.portGovernance=Object.fromEntries(Object.entries(raw.portGovernance||{}).map(([portId,governance])=>{
    if(!PORTS_BY_ID[portId]||!governance||typeof governance!=='object') return [portId,governance];
    const currency=currencyForPort(portId);
    return [portId,{...governance,
      monthlyAccrual:Object.fromEntries(Object.entries(governance.monthlyAccrual||{}).map(([key,value])=>[key,convert(value,currency)])),
      monthlyPaid:convert(governance.monthlyPaid,currency),
      lifetimeRevenue:convert(governance.lifetimeRevenue,currency),
    }];
  }));
  migrated.financeCurrencyMigration=true;
  return migrated;
}

function migrateV16toV17(raw){
  if(!raw) return raw;
  if(Number(raw.saveVersion||0)>=17){
    return raw.financeCurrencyMigration?raw:migrateStage1Finance(raw);
  }
  const gameDay=Math.max(1,Number(raw.gameDay)||1);
  const portId=PORTS_BY_ID[raw.portId]?raw.portId:'tortuga';
  const currency=PORTS_BY_ID[portId].currency;
  const priorFundsKey=['trea','sury'].join('');
  let legacycoins=Math.max(0,Number(raw[priorFundsKey]??raw.funds??raw.money)||0);
  if(raw.money&&typeof raw.money==='object'){
    legacycoins=(Number(raw.money.gold)||0)*262144+(Number(raw.money.silver)||0)*2048+
      (Number(raw.money.copper)||0)*32+(Number(raw.money.bronze)||0);
  }
  const legacyExchangecoins=Math.max(0,Number(raw[['du','cats'].join('')])||0)*
    Math.max(1,Number(raw.blackMarket?.exchangeRate)||100000);
  const oldCurrencycoins=Math.max(0,Number(raw[['flo','rins'].join('')])||0)*
    Math.max(1,Number(raw[['flo','rinPrice'].join('')])||1e15);
  const marineBondLegacyValue=(Array.isArray(raw.marineBonds)?raw.marineBonds:[]).reduce((total,bond)=>
    total+Math.max(0,Number(bond?.shares)||0)*LEGACY_MARINE_BOND_FACE,0);
  const inflation=buildInflationTable(gameDay);
  const year=Math.floor(gameDay/BANKING.daysPerYear);
  const exchangeSilver=legacyToSilverG(legacyExchangecoins+oldCurrencycoins);
  const mdp=BigInt(Math.floor(exchangeSilver/1000));
  const coinSilver=legacyToSilverG(legacycoins+marineBondLegacyValue)+exchangeSilver-Number(mdp)*1000;
  const coinRate=inflation[year]?.[currency]?.silverPerCoin||CURRENCIES[currency].silverPerCoin;
  const coins=Object.fromEntries(Object.keys(CURRENCIES).map(code=>[code,0]));
  coins[currency]=floorCoins(coinSilver/coinRate);
  const migrated={...raw,version:CONFIG.version,saveVersion:17,gameDay,portId,
    wallet:{coins,mdp:mdp.toString()},inflation,marineBonds:[]};
  if(raw.stats&&typeof raw.stats==='object'){
    migrated.stats={...raw.stats};
    delete migrated.stats[['du','catTrades'].join('')];
  }
  if(raw.tutorialRuns?.activeId==='black_market'){
    const oldStep=Math.max(0,Math.floor(Number(raw.tutorialRuns.step)||0));
    const completed={...(raw.tutorialRuns.completed||{})};
    if(oldStep>=5){
      completed.black_market=true;
      migrated.tutorialRuns={...raw.tutorialRuns,activeId:null,step:0,completed};
    } else {
      migrated.tutorialRuns={...raw.tutorialRuns,step:oldStep>1?oldStep-1:oldStep,completed};
    }
  }
  [priorFundsKey,'funds','money',['du','cats'].join(''),['flo','rins'].join(''),
    ['flo','rinPrice'].join(''),['flo','rinQuoteDay'].join(''),'marineBondFreezeDay',
    'marineBondPrice','marineBondQuoteDay','marineBondPurchaseProgress'].forEach(key=>delete migrated[key]);
  return migrateStage1Finance(migrated);
}

function migrateV17toV18(raw){
  if(!raw) return raw;
  if(Number(raw.saveVersion||0)>=18&&raw.marinesFunds) return raw;
  return {...raw,saveVersion:18,marinesFunds:raw.marinesFunds&&typeof raw.marinesFunds==='object'
    ?raw.marinesFunds:createMarinesFunds(raw.gameDay)};
}

    nextPayrollDay: state.nextPayrollDay,
    nextMaintenanceDay: state.nextMaintenanceDay,

    blackMarket: state.blackMarket,
    smelting: state.smelting,
    portClosures: state.portClosures||{},
    portGovernance: state.portGovernance,
    player: state.player,
    travel: state.travel,
    ships: state.ships,
    crew: state.crew,
    facilities: state.facilities,
    tasks: state.tasks,
    markets: state.markets,
    missions: state.missions,
    missionDay: state.missionDay,
    crewPool: state.crewPool,
    crewPoolDay: state.crewPoolDay,
    log: state.log.slice(0, CONFIG.maxLogEntries),
    achievements: state.achievements,
    skills: state.skills,
    skillPoints: state.skillPoints,
    stats: state.stats,
    tutorial: state.tutorial,
    tutorialStage4Steps: state.tutorialStage4Steps,
    tutorialRuns: state.tutorialRuns,
    settings: state.settings,
  };
  if(!compactLevel) return data;

  const neededMarkets=new Set([state.portId]);
  for(const task of state.tasks){
    if(task.kind!=='trading') continue;
    [task.originId,task.currentPortId,task.legFromId,task.legToId,...(task.routeIds||[])].forEach(portId=>{
      if(PORTS_BY_ID[portId]&&state.markets[portId]) neededMarkets.add(portId);
    });
  }
  data.markets=Object.fromEntries(Array.from(neededMarkets)
    .filter(portId=>state.markets[portId]).map(portId=>[portId,state.markets[portId]]));
  data.marinesFunds={...state.marinesFunds,products:Object.fromEntries(Object.entries(state.marinesFunds.products).map(([id,account])=>[
    id,{...account,history:account.history.slice(-30)},
  ]))};
  data.log=data.log.slice(0,compactLevel===1?80:0);
  data.crewPool=data.crewPool.slice(0,compactLevel===1?25:10);
  data.tasks=data.tasks.map(task=>({...task,events:(task.events||[]).slice(-(compactLevel===1?8:3))}));
  if(compactLevel>1) data.missions=data.missions.slice(0,4);
  return data;
}
function isStorageQuotaError(error){
  return error && (error.name==='QuotaExceededError' || error.name==='NS_ERROR_DOM_QUOTA_REACHED' ||
    error.code===22 || error.code===1014);
}
function saveGame(silent){
  let compacted = false;
  try {
    const prev = localStorage.getItem(CONFIG.saveKey);
    let backupUpdated = !prev;
    if(prev){
      try {
        localStorage.setItem(CONFIG.backupKey, prev);
        backupUpdated = true;
      } catch(e){
        try { localStorage.removeItem(CONFIG.backupKey); } catch(removeError){}
      }
    }
    try {
      localStorage.setItem(CONFIG.saveKey, JSON.stringify(snapshot()));
    } catch(e){
      if(!isStorageQuotaError(e)) throw e;
      try { localStorage.removeItem(CONFIG.backupKey); } catch(removeError){}
      backupUpdated = false;
      let saved = false;
      for(const compactLevel of [0,1,2]){
        try {
          localStorage.setItem(CONFIG.saveKey, JSON.stringify(snapshot(compactLevel)));
          saved = true;
          compacted=compactLevel>0;
          break;
        } catch(retryError){
          if(!isStorageQuotaError(retryError)) throw retryError;
        }
      }
      if(!saved) throw new Error('Browser storage is full. Export the save or free browser storage space.');
    }
    if(!silent) toast(compacted?'Game saved with reduced history to fit browser storage.':
      backupUpdated?'💾 Game saved.':'💾 Game saved; backup removed to free storage.','good');
    return true;
  } catch(e){
    console.error('Save failed', e);
    if(!silent) toast('Could not save: '+e.message,'bad');
    return false;
  }
}

function sanitizeSave(raw){
  if(!raw || typeof raw !== 'object') return null;
  try {
    const s = {};
    s.version = CONFIG.version;
    s.saveVersion = SAVE_VERSION;
    s.gameDay = Number.isFinite(raw.gameDay) && raw.gameDay>=1 ? raw.gameDay : 1;
    s.captain = raw.captain && typeof raw.captain==='object' ? {
      name: String(raw.captain.name || 'Edward Black').slice(0,40),
      title: String(raw.captain.title || '').slice(0,40),
      flag: String(raw.captain.flag || '☠').slice(0,4),
      flagColor: String(raw.captain.flagColor || '#b5453b').slice(0,20),
    } : {name:'Edward Black',title:'',flag:'☠',flagColor:'#b5453b'};

    s.portId = PORTS_BY_ID[raw.portId] ? raw.portId : 'tortuga';
    const savedWallet=raw.wallet&&typeof raw.wallet==='object'?raw.wallet:{};
    s.wallet={coins:Object.fromEntries(Object.keys(CURRENCIES).map(code=>[
      code,floorCoins(Math.max(0,Number(savedWallet.coins?.[code])||0))
    ])),mdp:/^\d+$/.test(String(savedWallet.mdp??'0'))?String(savedWallet.mdp??'0'):'0'};
    s.inflation=buildInflationTable(s.gameDay,raw.inflation);
    if(raw.bankLoan&&typeof raw.bankLoan==='object'){
      const originPortId=PORTS_BY_ID[raw.bankLoan.originPortId]?raw.bankLoan.originPortId:null;
      const originPort=originPortId?PORTS_BY_ID[originPortId]:null;
      const principalLimit=legacyToCoinsAtYear(BANKING.maxPrincipal,currencyForPort(originPortId||raw.portId),raw.gameDay,raw.inflation)*(originPort?.loanLimitMultiplier||1);
      const configuredRate=originPort?.loanInterestRate??BANKING.interestRate;
      const principal=floorCoins(clamp(Number(raw.bankLoan.principal)||0,0,principalLimit));
      const interest=floorCoins(clamp(Number(raw.bankLoan.interest)||0,0,floorCoins(principal*configuredRate)));
      const feesCharged=floorCoins(clamp(Number(raw.bankLoan.feesCharged)||0,0,floorCoins(principalLimit*0.5)));
      const totalDue=floorCoins(principal+interest+feesCharged);
      const remaining=floorCoins(clamp(Number(raw.bankLoan.remaining)||0,0,totalDue));
      const termDays=originPort?.loanTermDays||BANKING.termDays;
      const dueDay = Number.isFinite(raw.bankLoan.dueDay) ? Number(raw.bankLoan.dueDay) :
        (Number.isFinite(raw.gameDay)?raw.gameDay:1)+termDays;
    const nextLateFeeDay = Number.isFinite(raw.bankLoan.nextLateFeeDay) ? Number(raw.bankLoan.nextLateFeeDay) : dueDay + BANKING.lateFeeIntervalDays;
    s.bankLoan=principal>0&&remaining>0?{
      principal,interest,totalDue,remaining,
        borrowedDay:Number.isFinite(raw.bankLoan.borrowedDay)?raw.bankLoan.borrowedDay:(Number(raw.gameDay)||1),
        dueDay, nextLateFeeDay, feesCharged, warned: !!raw.bankLoan.warned,
        originPortId,principalLimit,interestRate:configuredRate,termDays,
      }:null;
    } else s.bankLoan=null;
    s.reputation = Number.isFinite(raw.reputation) ? clamp(Math.floor(raw.reputation),0,1000) : 0;
    s.wantedLevel = Math.max(0,Math.floor(Number(raw.wantedLevel)||0));
    s.marineDetention=raw.marineDetention&&typeof raw.marineDetention==='object'
      ?{releaseDay:Math.max(s.gameDay,Number.isFinite(Number(raw.marineDetention.releaseDay))
        ?Number(raw.marineDetention.releaseDay):s.gameDay+Math.max(1,s.wantedLevel)),
        portId:PORTS_BY_ID[raw.marineDetention.portId]?raw.marineDetention.portId:
          PORTS_BY_ID[raw.portId]?raw.portId:'tortuga'}:null;
    s.ordnanceDiscountUntilDay = Math.max(0,Number(raw.ordnanceDiscountUntilDay)||0);
    s.playtimeMs = Math.max(0, Number(raw.playtimeMs)||0);
    s.lastReal = Number.isFinite(raw.lastReal) ? raw.lastReal : Date.now();
    const hasIssuerPrices=raw.marineBondPrices&&typeof raw.marineBondPrices==='object';
    const oldMarineLots=!hasIssuerPrices&&Array.isArray(raw.marineBonds)?raw.marineBonds.filter(bond=>bond&&Number(bond.shares)>0):[];
    if(oldMarineLots.length){
      const oldPrice=clamp(Number(raw.marineBondPrice)||LEGACY_MARINE_BOND_FACE,
        LEGACY_MARINE_BOND_FACE*0.8,LEGACY_MARINE_BOND_FACE*1.2);
      const oldSalePrice=Math.round(oldPrice*(1-MARINE_BOND.spread/2));
      const oldProceeds=oldMarineLots.reduce((total,bond)=>total+
        BigInt(Math.max(0,Math.floor(Number(bond.shares)||0)))*BigInt(oldSalePrice),0n);
      const currency=currencyForPort(s.portId);
      s.wallet.coins[currency]=floorCoins(s.wallet.coins[currency]+
        legacyToCoinsAtYear(Number(oldProceeds),currency,s.gameDay,s.inflation));
    }
    s.marineBonds=oldMarineLots.length?[]:Array.isArray(raw.marineBonds)?raw.marineBonds.filter(bond=>bond&&Number(bond.shares)>0).map(bond=>{
      const startDay=Number.isFinite(bond.startDay)?bond.startDay:s.gameDay;

      const terms=marineBondIssuer(issuer);
      return {id:String(bond.id||uid('marinebond')),issuer,shares:Math.max(1,Math.floor(Number(bond.shares)||1)),startDay,
        annualRate:clamp(Number.isFinite(Number(bond.annualRate))?Number(bond.annualRate):terms.annualRate,0,1),
        termYears:clamp(Math.floor(Number(bond.termYears)||terms.termYears),1,100),
        couponRemainder:clamp(Math.floor(Number(bond.couponRemainder)||0),0,11999),
        nextCouponDay:Number.isFinite(bond.nextCouponDay)?bond.nextCouponDay:startDay+MARINE_BOND.couponDays,
        maturityDay:Number.isFinite(bond.maturityDay)?bond.maturityDay:startDay+terms.termYears*BANKING.daysPerYear};

    const savedMarinePrices=raw.marineBondPrices&&typeof raw.marineBondPrices==='object'?raw.marineBondPrices:{};
    s.marineBondPrices=Object.fromEntries(Object.keys(MARINE_BOND_ISSUERS).map(issuer=>{
      const saved=Number(savedMarinePrices[issuer]??(issuer==='marine'?raw.marineBondPrice:undefined));
      const price=Number.isFinite(saved)&&saved>=MARINE_BOND.minPrice&&saved<=MARINE_BOND.maxPrice?saved:MARINE_BOND.faceValue;
      return [issuer,clamp(Math.round(price),MARINE_BOND.minPrice,MARINE_BOND.maxPrice)];

    s.smelting={facilities:{},jobs:[]};

      if(!PORTS_BY_ID[portId]?.blackMarket||!facility||typeof facility!=='object') continue;
      s.smelting.facilities[portId]={
        level:clamp(Math.floor(Number(facility.level)||0),0,SMELTING.maxLevel),
        windowEndDay:Math.max(0,Number(facility.windowEndDay)||0),
        lastProcessedDay:Math.min(s.gameDay,Number.isFinite(Number(facility.lastProcessedDay))?Number(facility.lastProcessedDay):s.gameDay),
        capacityRemainder:clamp(Number(facility.capacityRemainder)||0,0,0.999999999),
      };
    }
    s.smelting.jobs=(Array.isArray(rawSmelting.jobs)?rawSmelting.jobs:[]).flatMap(job=>{
      if(!job||!PORTS_BY_ID[job.portId]?.blackMarket) return [];
      const mdpTotal=mdpInteger(job.mdpTotal);
      const mdpDone=mdpInteger(job.mdpDone);
      if(!mdpTotal) return [];
      const done=mdpDone>mdpTotal?mdpTotal:mdpDone;
      const status=done>=mdpTotal?'completed':job.status==='running'?'running':'paused';
      const coinsTotal=floorCoins(Math.max(0,Number(job.coinsTotal)||Number(job.coinsLocked)||0));
      const sourceCoins=Object.fromEntries(Object.entries(job.sourceCoins||{}).filter(([currency])=>CURRENCIES[currency])
        .map(([currency,coins])=>[currency,floorCoins(Math.max(0,Number(coins)||0))]).filter(([,coins])=>coins>0));
      if(!Object.keys(sourceCoins).length&&CURRENCIES[job.currency]&&coinsTotal>0) sourceCoins[job.currency]=coinsTotal;
      if(!Object.keys(sourceCoins).length) return [];
      return [{id:String(job.id||uid('smelt')),portId:job.portId,currency:CURRENCIES[job.currency]?job.currency:'MULTI',sourceCoins,mdpTotal:mdpTotal.toString(),
        mdpDone:done.toString(),coinsTotal,coinsLocked:status==='completed'?0:
          floorCoins(Math.max(0,Number(job.coinsLocked)||coinsTotal)),status}];
    });
    s.portClosures = Object.fromEntries(Object.entries(raw.portClosures||{}).filter(([portId,endDay])=>
      PORTS_BY_ID[portId]&&Number.isFinite(Number(endDay))&&Number(endDay)>s.gameDay
    ).map(([portId,endDay])=>[portId,Number(endDay)]));
    s.portGovernance=normalizePortGovernance(raw.portGovernance,s.gameDay);

    const rawPlayer = raw.player || {};
    s.player = {
      locationId: PORTS_BY_ID[rawPlayer.locationId] ? rawPlayer.locationId : s.portId,
      vesselId: rawPlayer.vesselId || null,
    };

    s.travel = (raw.travel && PORTS_BY_ID[raw.travel.toId]) ? {
      ...raw.travel,
      fromId:PORTS_BY_ID[raw.travel.fromId]?raw.travel.fromId:s.portId,
      shipIds:Array.isArray(raw.travel.shipIds)?raw.travel.shipIds.filter(id=>typeof id==='string').slice(0,6):null,
    } : null;

    s.ships = Array.isArray(raw.ships) ? raw.ships.filter(sh=>sh && SHIP_TYPE_BY_ID[sh.typeId]).map(sh=>({
      id: String(sh.id || uid('ship')),
      typeId: sh.typeId,
      name: String(sh.name || SHIP_TYPE_BY_ID[sh.typeId].name).slice(0,40),
      hull: clamp(Number(sh.hull)||SHIP_TYPE_BY_ID[sh.typeId].hull, 1, Number(sh.maxHull)||SHIP_TYPE_BY_ID[sh.typeId].hull),
      maxHull: Number(sh.maxHull) || SHIP_TYPE_BY_ID[sh.typeId].hull,
      cargo: (sh.cargo && typeof sh.cargo==='object') ? Object.fromEntries(Object.entries(sh.cargo)
        .filter(([name,quantity])=>(COMM_BY_NAME[name]||ILLEGAL_GOOD_BY_NAME[name])&&Number(quantity)>0)
        .map(([name,quantity])=>[name,Math.floor(Number(quantity))])) : {},
      rarity: SHIP_RARITY_BY_ID[sh.rarity] ? sh.rarity : 'common',
      active: sh.active !== false,
      upgrades: SHIP_UPGRADES.reduce((out,upgrade)=>{
        out[upgrade.id] = clamp(Math.floor(Number(sh.upgrades && sh.upgrades[upgrade.id])||0),0,25);
        return out;
      },{}),
      status: (sh.status==='task') ? 'task' : 'idle',
      taskId: sh.taskId || null,
      locationId: PORTS_BY_ID[sh.locationId] ? sh.locationId : s.portId,
      notes: sh.notes || '',
    })) : [];
    if(!s.ships.length) s.ships = [makeShip('sloop','Sea Wraith', s.portId)];
    if(!s.player.vesselId || !s.ships.some(x=>x.id===s.player.vesselId)){
      s.player.vesselId = s.ships[0].id;
    }
    const validShipIds = new Set(s.ships.map(x=>x.id));
    if(s.travel){
      s.travel.shipIds=Array.isArray(s.travel.shipIds)
        ?s.travel.shipIds.filter(id=>validShipIds.has(id)).slice(0,6)
        :s.ships.filter(ship=>ship.locationId===s.travel.fromId&&ship.active!==false&&ship.status==='idle')
          .slice(0,6).map(ship=>ship.id);
    }

    s.crew = Array.isArray(raw.crew) ? raw.crew.filter(c=>c && ROLE_BY_ID[c.role]).map(c=>{
      const level = clamp(Number(c.level)||1,1,10);
      const skill = clamp(Number(c.skill)||50,1,100);
      const traits = Array.isArray(c.traits) ? c.traits.filter(t=>TRAIT_BY_ID[t]) : [];
      let salary = Number(c.salary);
      if(!salary || !isFinite(salary)){
        const oldWage = Number(c.wage)||5;
        salary = Math.round(oldWage * CONFIG.daysPerMonth);
      }
      salary = computeSalary(c.role, level, skill, traits);
      return {
        id: String(c.id || uid('crew')),
        name: String(c.name || 'Sailor').slice(0,40),
        role: c.role, level, skill,
        morale: clamp(Number(c.morale)||60,0,100),
        loyalty: clamp(Number(c.loyalty)||60,0,100),
        salary, traits,
        shipId: validShipIds.has(c.shipId) ? c.shipId : null,
        training: (c.training && c.training.type && TRAINING_BY_ID[c.training.type]) ? {
          type: c.training.type,
          startDay: Number(c.training.startDay)||s.gameDay,
          endDay: Number(c.training.endDay)||s.gameDay+1,
          cost: Number(c.training.cost)||0,

        } : null,
        moraleBuffs: Array.isArray(c.moraleBuffs) ? c.moraleBuffs.filter(b=>b && b.expiresDay > s.gameDay) : [],
        lastPayrollMisses: Number(c.lastPayrollMisses)||0,
      };
    }) : [];

    s.facilities = CREW_FACILITIES.reduce((out,facility)=>{
      out[facility.id] = clamp(Math.floor(Number(raw.facilities && raw.facilities[facility.id])||0),0,facility.maxLevel);
      return out;
    },{});

    s.tasks = Array.isArray(raw.tasks) ? raw.tasks.filter(t=>t && t.shipId && validShipIds.has(t.shipId)).map(t=>({
      id: String(t.id || uid('task')),
      kind: t.kind==='portRaid' ? 'portRaid' : t.kind==='remoteCommand' ? 'remoteCommand' : t.kind==='raid' ? 'raid' : t.kind==='trading' ? 'trading' : t.kind==='trade' ? 'trade' :
        t.kind==='exploration' ? 'exploration' : t.kind==='transfer' ? 'transfer' : 'mission',
      typeId: t.typeId || 'treasure',
      name: String(t.name || 'Voyage').slice(0,40),
      approachId: MISSION_APPROACH_BY_ID[t.approachId] ? t.approachId : 'balanced',
      marineMission: !!t.marineMission,
      wantedReduction: Math.max(0,Math.floor(Number(t.wantedReduction)||0)),
      bondUnits: Math.max(0,Math.floor(Number(t.bondUnits)||0)),

      reputationPenalty: Math.max(0,Math.floor(Number(t.reputationPenalty)||0)),
      shipId: t.shipId,
      shipIds: Array.isArray(t.shipIds) ? t.shipIds.filter(id=>validShipIds.has(id)) : [t.shipId],
      tradeShipIds: Array.isArray(t.tradeShipIds) ? t.tradeShipIds.filter(id=>validShipIds.has(id)) : [t.shipId],

      archetypeId: RAID_FLEET_ARCHETYPES.some(archetype=>archetype.id===t.archetypeId) ? t.archetypeId : 'merchant',
      cashReserve: Math.max(0,Number(t.cashReserve)||0),
      enemyPower: Math.max(0,Number(t.enemyPower)||0),
      ownPower: Math.max(0,Number(t.ownPower)||0),
      portId: PORTS_BY_ID[t.portId] ? t.portId : null,
      garrisonCount: clamp(Math.floor(Number(t.garrisonCount)||0),0,200),
      successChance: clamp(Number(t.successChance)||0,0,1),
      enemyFleet: Array.isArray(t.enemyFleet) ? t.enemyFleet.filter(enemy=>enemy&&SHIP_TYPE_BY_ID[enemy.typeId]).map(enemy=>({
        id:String(enemy.id||uid('enemy')),
        typeId:enemy.typeId,
        name:String(enemy.name||SHIP_TYPE_BY_ID[enemy.typeId].name).slice(0,40),
        hull:clamp(Number(enemy.hull)||SHIP_TYPE_BY_ID[enemy.typeId].hull,1,Number(enemy.maxHull)||SHIP_TYPE_BY_ID[enemy.typeId].hull),
        maxHull:Number(enemy.maxHull)||SHIP_TYPE_BY_ID[enemy.typeId].hull,
        cargo:(enemy.cargo&&typeof enemy.cargo==='object')?Object.fromEntries(Object.entries(enemy.cargo).filter(([name,qty])=>COMM_BY_NAME[name]&&Number(qty)>0).map(([name,qty])=>[name,Math.floor(Number(qty))])):{},
        rarity:SHIP_RARITY_BY_ID[enemy.rarity]?enemy.rarity:'common',
        active:enemy.active!==false,
        upgrades:SHIP_UPGRADES.reduce((out,upgrade)=>{ out[upgrade.id]=clamp(Math.floor(Number(enemy.upgrades&&enemy.upgrades[upgrade.id])||0),0,25); return out; },{}),
        enemyStatMultiplier:Math.max(0.1,Number(enemy.enemyStatMultiplier)||1),
        enemySpeedMultiplier:Math.max(0.1,Number(enemy.enemySpeedMultiplier)||1),
        enemyEscapeMultiplier:Math.max(0.1,Number(enemy.enemyEscapeMultiplier)||1),
        status:'idle',taskId:null,
        locationId:PORTS_BY_ID[enemy.locationId]?enemy.locationId:s.portId,
        isTransport:typeof enemy.isTransport==='boolean'?enemy.isTransport:RAID_TRANSPORT_TYPES.has(enemy.typeId),
        cargoValue:Math.max(0,Number(enemy.cargoValue)||0),
        disabled:!!enemy.disabled,destroyed:!!enemy.destroyed,captured:!!enemy.captured,
        setAblaze:!!enemy.setAblaze,critical:!!enemy.critical,
      })) : [],
      roundsTotal:clamp(Math.floor(Number(t.roundsTotal)||1),1,20),
      roundsComplete:clamp(Math.floor(Number(t.roundsComplete)||0),0,20),
      difficultyId: EXPLORATION_BY_ID[t.difficultyId] ? t.difficultyId : 'easy',
      originPortId: PORTS_BY_ID[t.originPortId] ? t.originPortId : null,
      lastProcessedDay: Number.isFinite(t.lastProcessedDay) ? t.lastProcessedDay :
        Math.floor(Number(t.startDay)||s.gameDay),
      daysExplored: Math.max(0, Number(t.daysExplored)||0),
      earned: Math.max(0, Number(t.earned)||0),
      escortIds: Array.isArray(t.escortIds) ? t.escortIds.filter(x=>validShipIds.has(x)) : [],
      startDay: Number(t.startDay)||s.gameDay,
      endDay: t.indefinite ? null : Number(t.endDay)||s.gameDay+1,
      arriveDay: Number(t.arriveDay)||s.gameDay+1,
      legStartDay: Number(t.legStartDay)||Number(t.startDay)||s.gameDay,
      returnDay: Number(t.returnDay)||s.gameDay+2,
      outDays: Number(t.outDays)||1,
      phase: t.phase==='back' ? 'back' : 'out',
      fromPortId: PORTS_BY_ID[t.fromPortId] ? t.fromPortId : s.portId,
      destPortId: PORTS_BY_ID[t.destPortId] ? t.destPortId : s.portId,
      originId: PORTS_BY_ID[t.originId] ? t.originId : s.portId,
      destinationId: PORTS_BY_ID[t.destinationId] ? t.destinationId : s.portId,
      sourcePortId: PORTS_BY_ID[t.sourcePortId] ? t.sourcePortId : s.portId,
      commandDelay: Math.max(0,Number(t.commandDelay)||0),
      originId: PORTS_BY_ID[t.originId] ? t.originId : s.portId,
      routePortId: PORTS_BY_ID[t.routePortId] ? t.routePortId : s.portId,
      routeIds: (Array.isArray(t.routeIds) ? t.routeIds : [t.routePortId]).filter((id,index,ids)=>
        PORTS_BY_ID[id]&&id!==t.originId&&ids.indexOf(id)===index&&(!raw.markets||!!raw.markets[id])
      ).slice(0,PORTS.length),
      routeIndex: clamp(Math.floor(Number(t.routeIndex)||0),0,PORTS.length),
      currentPortId: PORTS_BY_ID[t.currentPortId] ? t.currentPortId : s.portId,
      legFromId: PORTS_BY_ID[t.legFromId] ? t.legFromId : s.portId,
      legToId: PORTS_BY_ID[t.legToId] ? t.legToId : s.portId,
      indefinite: !!t.indefinite,
      recallRequested: !!t.recallRequested,
      durationDays: Number.isFinite(t.durationDays) ? Math.max(1,t.durationDays) : null,
      initialCapital: Math.max(0,Number(t.initialCapital)||0),
      balance: Math.max(0,Number(t.balance)||0),
      profit: Number(t.profit)||0,
      daysTrading: Math.max(0,Number(t.daysTrading)||0),
      legCommodity: COMM_BY_NAME[t.legCommodity] ? t.legCommodity : null,
      legQuantity: Math.max(0,Number(t.legQuantity)||0),
      legCost: Math.max(0,Number(t.legCost)||0),
      cargo: (t.cargo && typeof t.cargo==='object') ? t.cargo : {},
      revenue: Number(t.revenue)||0,
      contractMod: Number(t.contractMod)||0,
      days: Number(t.days)||1,
      difficulty: Number(t.difficulty)||40,
      rewardMin: Number(t.rewardMin)||100,
      rewardMax: Number(t.rewardMax)||500,
      repMin: Number(t.repMin)||1,
      repMax: Number(t.repMax)||4,
      tier: Number(t.tier)||1,
      portId: PORTS_BY_ID[t.portId] ? t.portId : s.portId,
      events: Array.isArray(t.events) ? t.events : [],
    })) : [];

    s.markets = (raw.markets && typeof raw.markets==='object') ? raw.markets : {};
    s.missions = Array.isArray(raw.missions) ? raw.missions : [];
    s.missionDay = Number.isFinite(raw.missionDay) ? raw.missionDay : -1;
    s.crewPool = Array.isArray(raw.crewPool) ? raw.crewPool.filter(c=>c && ROLE_BY_ID[c.role]) : [];
    s.crewPoolDay = Number.isFinite(raw.crewPoolDay) ? raw.crewPoolDay : -1;
    s.log = Array.isArray(raw.log) ? raw.log.slice(0, CONFIG.maxLogEntries) : [];
    s.achievements = (raw.achievements && typeof raw.achievements==='object') ? raw.achievements : {};
    s.skills = SKILLS.reduce((out,skill)=>{
      out[skill.id] = Math.max(0,Math.min(Number.MAX_SAFE_INTEGER-1,
        Math.floor(Number(raw.skills && raw.skills[skill.id])||0)));
      return out;
    },{});
    s.skillPoints = Math.max(0, Number(raw.skillPoints)||0);
    s.stats = Object.assign(freshStats(), (raw.stats && typeof raw.stats==='object') ? raw.stats : {});
    s.stats.illegalSales=Math.max(0,Math.floor(Number(s.stats.illegalSales)||0));
    const savedTutorial=raw.tutorial&&typeof raw.tutorial==='object'?raw.tutorial:{step:0,done:true};
    const completedOldTutorial=raw.tutorialStage4Steps!==true&&savedTutorial.done===true;
    s.tutorial={step:completedOldTutorial?7:clamp(Math.floor(Number(savedTutorial.step)||0),0,9),
      done:completedOldTutorial?false:!!savedTutorial.done};
    s.tutorialStage4Steps=true;
    const rawTutorialRuns=raw.tutorialRuns&&typeof raw.tutorialRuns==='object'?raw.tutorialRuns:{};
    s.tutorialRuns={
      activeId:TUTORIALS.some(item=>item.id===rawTutorialRuns.activeId)?rawTutorialRuns.activeId:null,
      step:Math.max(0,Math.floor(Number(rawTutorialRuns.step)||0)),
      completed:Object.fromEntries(Object.entries(rawTutorialRuns.completed||{}).filter(([id,done])=>
        TUTORIALS.some(item=>item.id===id)&&done===true).map(([id])=>[id,true])),
    };
    const rawSettings=raw.settings&&typeof raw.settings==='object'?raw.settings:{};
    s.settings={
      autoSave:rawSettings.autoSave!==false,
      autoSaveIntervalMs:[15000,30000,60000].includes(Number(rawSettings.autoSaveIntervalMs))
        ?Number(rawSettings.autoSaveIntervalMs):CONFIG.autoSaveMs,
      gameSpeed:GAME_SPEEDS.includes(Number(rawSettings.gameSpeed))?Number(rawSettings.gameSpeed):1,
      dashboardDetail:rawSettings.dashboardDetail==='compact'?'compact':'expanded',
      debug:rawSettings.debug===true,
    };

    const taskIds = new Set(s.tasks.map(t=>t.id));
    for(const sh of s.ships){
      const onVoyage=s.travel&&s.travel.shipIds.includes(sh.id)&&sh.taskId==='travel';
      if(sh.taskId && !taskIds.has(sh.taskId)&&!onVoyage){ sh.status='idle'; sh.taskId=null; }
    }
    for(const t of s.tasks){
      for(const shipId of (t.shipIds || [t.shipId])){
        const sh = s.ships.find(x=>x.id===shipId);
        if(sh){ sh.status=(t.kind==='transfer'?'idle': 'task'); sh.taskId=t.id; }
      }
    }
    if(s.travel){
      for(const shipId of s.travel.shipIds){
        const ship=s.ships.find(item=>item.id===shipId);
        if(ship){ ship.status='task'; ship.taskId='travel'; }
      }
    }
    return attachLegacyFunds(s);
  } catch(e){
    console.error('sanitizeSave failed', e);
    return null;
  }
}

function loadGame(){
  let raw = null;
  try {
    const main = localStorage.getItem(CONFIG.saveKey);
    if(main) raw = JSON.parse(main);
  } catch(e){ raw = null; }
  let s = sanitizeSave(migrateV17toV18(migrateV16toV17(raw)));
  if(!s){
    try {
      const bak = localStorage.getItem(CONFIG.backupKey);
      if(bak){
        s = sanitizeSave(migrateV17toV18(migrateV16toV17(JSON.parse(bak))));
        if(s) toast('Main save was invalid — backup restored.','bad');
      }
    } catch(e){ s = null; }
  }
  if(!s) return false;
  state = s;
  ensureInflation();
  CONFIG.debug=state.settings.debug;
  return true;
}

function exportSave(){
  try {
    const data = JSON.stringify(snapshot(), null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pirates-fortune-save-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },200);
    toast('📤 Save exported.');
  } catch(e){ toast('Export failed: '+e.message,'bad'); }
}
function importSaveFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const obj = JSON.parse(reader.result);
      const s = sanitizeSave(migrateV17toV18(migrateV16toV17(obj)));
      if(!s){ toast('Invalid save file.','bad'); return; }
      const cur = localStorage.getItem(CONFIG.saveKey);
      if(cur) localStorage.setItem(CONFIG.backupKey, cur);
      state = s;
      CONFIG.debug=state.settings.debug;
      state.lastReal = Date.now();
      saveGame(true);
      toast('📥 Save imported.','good');
      ui.viewDirty = true; ui.headerDirty = true;
      renderAll();
    } catch(e){ toast('Import failed: '+e.message,'bad'); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm('This will permanently erase your pirate and all progress. Continue?')) return;
  const cur = localStorage.getItem(CONFIG.saveKey);
  if(cur) localStorage.setItem(CONFIG.backupKey, cur);
  localStorage.removeItem(CONFIG.saveKey);
  state = null;
  document.getElementById('modalHost').innerHTML = '';
  showNewGameModal();
}

/* ---------------------------------------------------------------------------
   OFFLINE PROGRESSION
   --------------------------------------------------------------------------- */
function applyOfflineProgress(){
  const now = Date.now();
  const elapsedMs = Math.max(0, now - (state.lastReal||now));
  const elapsedDays = elapsedMs / CONFIG.msPerGameDay * currentGameSpeed();
  state.lastReal = now;
  if(elapsedDays < 0.05) return;
  const before = { funds: state.funds, missionsDone: state.stats.missionsDone };
  simulate(elapsedDays);
  state.lastDailyTick = Math.max(state.lastDailyTick, Math.floor(state.gameDay));
  state.offlineReport = {
    realMs: elapsedMs,
    simDays: elapsedDays,
    fundsDelta: state.funds - before.funds,
    missionsDone: state.stats.missionsDone - before.missionsDone,
  };
  if(elapsedDays > 0.5) showOfflineModal();
}
function fmtDuration(ms){
  const totalMin = Math.floor(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h <= 0) return m+'m';
  return h+'h '+m+'m';
}
function formatPlaytime(ms){
  const totalMinutes = Math.floor((ms||0)/60000);
  const hours = Math.floor(totalMinutes/60), minutes = totalMinutes%60;
  const days = Math.floor(hours/24);
  if(days) return days+'d '+(hours%24)+'h';
  if(hours) return hours+'h '+minutes+'m';
  return minutes+'m';
}
function showOfflineModal(){
  const r = state.offlineReport;
  if(!r) return;
  const host = document.getElementById('modalHost');
  const deltaCls = r.fundsDelta >= 0 ? '#8fd6a4' : '#e8a08f';
  host.innerHTML =
  '<div class="modal-back"><div class="modal">'+
    '<h2>Welcome back, Captain.</h2>'+
    '<p>You were away for <b>'+fmtDuration(r.realMs)+'</b>.</p>'+ 
    '<div class="divider"></div>'+
    '<div class="kv"><span>Simulated time</span><span>'+r.simDays.toFixed(2)+' game days</span></div>'+
    '<div class="kv"><span>Net funds change</span><span style="color:'+deltaCls+'">'+
      (r.fundsDelta>=0?'+':'')+fmtWalletValue(r.fundsDelta)+'</span></div>'+
    '<div class="kv"><span>Missions completed</span><span>'+r.missionsDone+'</span></div>'+
    '<div class="divider"></div>'+
    '<button class="btn primary" id="closeOffline" style="width:100%">Back to the helm</button>'+
  '</div></div>';
  document.getElementById('closeOffline').onclick = ()=>{
    host.innerHTML = '';
    state.offlineReport = null;
    ui.viewDirty = true;
    renderAll();
  };
}

function renderTabs(){
  if(!state){ tabsEl.innerHTML=''; return; }
  const hasBlackMarket=!state.travel&&!!PORTS_BY_ID[state.portId]?.blackMarket;
  const visibleTabs=isMarineDetained()?TABS.filter(tab=>['captain','marine','settings'].includes(tab.id)):
    TABS.filter(tab=>tab.id!=='black-market'||hasBlackMarket);
  if(!visibleTabs.some(tab=>tab.id===ui.tab)){ ui.tab='overview'; }
  tabsEl.innerHTML = visibleTabs.map(t=>{
    let badge = '';
    if(t.id==='missions' && state.missions.length) badge = '<span class="badge">'+state.missions.length+'</span>';
    if(t.id==='fleet' && state.tasks.length) badge = '<span class="badge">'+state.tasks.length+'</span>';
    if(t.id==='crew' && state.crew.some(c=>c.training)) badge = '<span class="badge">'+state.crew.filter(c=>c.training).length+'</span>';
    return '<button data-tab="'+t.id+'" class="'+(ui.tab===t.id?'active':'')+'">'+t.label+badge+'</button>';

function updateLiveValues(){
  if(!state) return;
  const currency=activeCurrency();
  const balanceEl=topEl.querySelector('[data-live="currency-balance"]');
  if(balanceEl){ balanceEl.textContent=fmtMoney(state.wallet.coins[currency]||0,currency); }
  const mdpBalanceEl=topEl.querySelector('[data-live="mdp-balance"]');
  if(mdpBalanceEl){ mdpBalanceEl.textContent=fmtMdP(state.wallet.mdp||'0'); }
  const dEl = topEl.querySelector('[data-live="day"]');
  if(dEl) dEl.textContent = Math.floor(state.gameDay);
  const pEl = topEl.querySelector('[data-live="payroll"]');
  if(pEl) pEl.textContent = Math.max(0, Math.ceil(state.nextPayrollDay - state.gameDay))+'d';
  const mEl = topEl.querySelector('[data-live="maintenance"]');
  if(mEl) mEl.textContent = Math.max(0,Math.ceil(state.nextMaintenanceDay-state.gameDay))+'d';
  const playtimeEl = viewEl.querySelector('[data-live-playtime]');
  if(playtimeEl) playtimeEl.textContent = formatPlaytime(state.playtimeMs);

  viewEl.querySelectorAll('[data-task-progress]').forEach(el=>{
    const t = getTask(el.dataset.taskProgress); if(!t) return;
    el.style.width = (taskProgress(t)*100).toFixed(1)+'%';
  });
  viewEl.querySelectorAll('[data-task-eta]').forEach(el=>{
    const t = getTask(el.dataset.taskEta); if(!t) return;
    el.textContent = fmtEta(taskEndDay(t) - state.gameDay);
  });
  viewEl.querySelectorAll('[data-travel-progress]').forEach(el=>{
    if(!state.travel) return;
    const t = state.travel;
    const pct = clamp((state.gameDay-t.startDay)/(t.arriveDay-t.startDay),0,1)*100;
    el.style.width = pct.toFixed(1)+'%';
  });
  viewEl.querySelectorAll('[data-travel-eta]').forEach(el=>{
    if(!state.travel) return;
    el.textContent = fmtEta(state.travel.arriveDay - state.gameDay);
  });
  viewEl.querySelectorAll('[data-overview-task-eta]').forEach(el=>{
    const t = getTask(el.dataset.overviewTaskEta); if(!t) return;
    el.textContent = fmtEta(taskEndDay(t) - state.gameDay);
  });
  viewEl.querySelectorAll('[data-detention-eta]').forEach(el=>{
    el.textContent=Math.max(0,state.marineDetention.releaseDay-state.gameDay).toFixed(1)+' days';
  });
}

function viewControlKey(control){
  if(control.id) return 'id:'+control.id;
  if(control.hasAttribute('data-qty')) return 'qty:'+control.dataset.qty;
  if(control.hasAttribute('data-bond-sell-qty')) return 'bond-sell:'+control.dataset.bondSellQty;
  if(control.matches('.mission-approach-sel')) return 'mission-approach:'+control.dataset.mission;
  return null;
}

function captureViewFormState(){
  const values=new Map();
  viewEl.querySelectorAll('input:not([type="file"]),select,textarea')
    .forEach(control=>{
      const key=viewControlKey(control);
      if(key) values.set(key,{value:control.value,checked:control.checked});
    });
  return values;
}

function restoreViewFormState(values){
  viewEl.querySelectorAll('input:not([type="file"]),select,textarea')
    .forEach(control=>{
      const key=viewControlKey(control);
      if(!key||!values.has(key)) return;
      const saved=values.get(key);
      if(control.type==='checkbox'||control.type==='radio'){
        control.checked=saved.checked;
        if(control.id==='tradingIndefinite'){
          const duration=viewEl.querySelector('#tradingDuration');
          if(duration) duration.disabled=control.checked;
        }
        return;
      }
      const value=saved.value;
      if(control.tagName==='SELECT'&&!Array.from(control.options).some(option=>option.value===value)) return;
      control.value=value;
    });
}

  function captureViewPageState(){
    const scrollContainers=Array.from(viewEl.querySelectorAll('*'))
      .filter(el=>el.scrollTop||el.scrollLeft)
      .map(el=>({path:elementPath(el,viewEl),top:el.scrollTop,left:el.scrollLeft}));
    const openDetails=Array.from(viewEl.querySelectorAll('details[open]'))
      .map(el=>elementPath(el,viewEl));
    const active=document.activeElement;
    const activeKey=active&&viewEl.contains(active)?viewControlKey(active):null;
    const activePath=active&&viewEl.contains(active)?elementPath(active,viewEl):null;
    return {
      scrollX:window.scrollX,scrollY:window.scrollY,scrollContainers,openDetails,
      activeKey,activePath,
      selectionStart:active&&typeof active.selectionStart==='number'?active.selectionStart:null,
      selectionEnd:active&&typeof active.selectionEnd==='number'?active.selectionEnd:null,
    };
  }

  function elementPath(el,root){
    const path=[];
    while(el&&el!==root){
      const parent=el.parentElement;
      if(!parent) return null;
      path.unshift(Array.prototype.indexOf.call(parent.children,el));
      el=parent;
    }
    return el===root?path:null;
  }

  function elementAtPath(path,root){
    if(!Array.isArray(path)) return null;
    return path.reduce((el,index)=>el&&el.children[index]||null,root);
  }

  function restoreViewPageState(saved){
    saved.scrollContainers.forEach(item=>{
      const el=elementAtPath(item.path,viewEl);
      if(el){ el.scrollTop=item.top; el.scrollLeft=item.left; }
    });
    saved.openDetails.forEach(path=>{
      const el=elementAtPath(path,viewEl);
      if(el&&el.tagName==='DETAILS') el.open=true;
    });
    let active=saved.activeKey?Array.from(viewEl.querySelectorAll('input:not([type="file"]),select,textarea'))
      .find(control=>viewControlKey(control)===saved.activeKey):null;
    if(!active) active=elementAtPath(saved.activePath,viewEl);
    if(active&&typeof active.focus==='function'){
      active.focus({preventScroll:true});
      if(saved.selectionStart!==null&&typeof active.setSelectionRange==='function'){
        try { active.setSelectionRange(saved.selectionStart,saved.selectionEnd); } catch(e){}
      }
    }
    window.scrollTo(saved.scrollX,saved.scrollY);
  }

function renderView(){
  const formState=captureViewFormState();
    const pageState=captureViewPageState();
  if(!state){ viewEl.innerHTML=''; ui.viewDirty=false; return; }
  if(isMarineDetained()&&!['captain','marine','settings'].includes(ui.tab)){ ui.tab='marine'; renderTabs(); }
  switch(ui.tab){
    case 'overview': viewEl.innerHTML = viewOverview(); break;
    case 'tutorials': viewEl.innerHTML = viewTutorials(); break;
    case 'fleet':    viewEl.innerHTML = viewFleet(); break;
    case 'crew':     viewEl.innerHTML = viewCrew(); break;
    case 'market':   viewEl.innerHTML = viewMarket(); break;
    case 'black-market': viewEl.innerHTML = viewBlackMarket(); break;
    case 'banking':  viewEl.innerHTML = viewBanking(); break;
    case 'port':     viewEl.innerHTML = viewPort(); break;
    case 'missions': viewEl.innerHTML = viewMissions(); break;
    case 'exploration': viewEl.innerHTML = viewExploration(); break;
    case 'map':      viewEl.innerHTML = viewMap(); break;
    case 'journal':  viewEl.innerHTML = viewJournal(); break;
    case 'captain':  viewEl.innerHTML = viewCaptain(); break;
    case 'marine':   viewEl.innerHTML = viewMarine(); break;
    case 'settings': viewEl.innerHTML = viewSettings(); break;
    default: viewEl.innerHTML = viewOverview();
  }
  restoreViewFormState(formState);
  restoreViewPageState(pageState);
  ui.viewDirty=false;
}

function renderAll(){
  renderHeader();
  renderTabs();
  renderTutorial();
  renderView();
  renderDebug();
}

function taskProgress(task){
  if(task.kind==='remoteCommand'){
    return clamp((state.gameDay-task.startDay)/Math.max(0.001,task.endDay-task.startDay),0,1);
  }
  if(task.kind === 'mission'){
    const total = task.endDay - task.startDay;
    const done = state.gameDay - task.startDay;
    return clamp(done/Math.max(0.001,total),0,1);
  }
  if(task.kind==='raid'||task.kind==='portRaid'){
    return clamp((state.gameDay-task.startDay)/Math.max(0.001,task.endDay-task.startDay),0,1);
  }
  if(task.kind === 'transfer'){
    const total = Math.max(0.001, (task.endDay || task.startDay) - task.startDay);
    return clamp((state.gameDay - task.startDay) / total, 0, 1);
  }
  if(task.kind==='trading'){
    const elapsed=state.gameDay-(task.legStartDay||task.startDay);
    return clamp(elapsed/Math.max(0.001,task.arriveDay-(task.legStartDay||task.startDay)),0,1);
  }
  const total = task.returnDay - task.startDay;
  const done = state.gameDay - task.startDay;
  return clamp(done/Math.max(0.001,total),0,1);
}
function taskCancellationProgress(task){
  if(task.kind==='exploration') return clamp((Number(task.daysExplored)||0)/30,0,1);
  if(task.kind==='trading'&&!task.indefinite&&Number(task.durationDays)>0){
    return clamp((state.gameDay-task.startDay)/task.durationDays,0,1);
  }
  return clamp(Number(taskProgress(task))||0,0,1);
}
function taskShipIds(task){
  return Array.isArray(task.shipIds)?task.shipIds:task.shipId?[task.shipId]:[];
}
function taskHullLoss(ship,progress){
  return Math.min(Math.max(0,Math.floor(ship.hull)-1),Math.round(ship.maxHull*0.2*progress));
}
function cancelTaskButton(task,label){
  const progress=taskCancellationProgress(task);
  const totalLoss=taskShipIds(task).map(getShip).filter(Boolean)
    .reduce((total,ship)=>total+taskHullLoss(ship,progress),0);
  return '<button class="btn sm danger" data-act="cancel-task" data-task="'+esc(task.id)+
    '" title="Hull damage is 20% of maximum hull scaled by task progress.">'+
    (label||'Cancel')+' · Hull -'+totalLoss+'</button>';
}
function travelCancellationProgress(voyage){
  return clamp((state.gameDay-voyage.startDay)/Math.max(0.001,voyage.arriveDay-voyage.startDay),0,1);
}
function travelCancelButton(){
  if(!state.travel) return '';
  const progress=travelCancellationProgress(state.travel);
  const totalLoss=(state.travel.shipIds||[]).map(getShip).filter(Boolean)
    .reduce((total,ship)=>total+taskHullLoss(ship,progress),0);
  return '<button class="btn sm danger" data-act="cancel-travel" title="Hull damage is 20% of maximum hull scaled by voyage progress.">Cancel Voyage · Hull -'+totalLoss+'</button>';
}
function cancelTask(taskId){
  const task=state.tasks.find(item=>item.id===taskId);
  if(!task) return false;
  const progress=taskCancellationProgress(task);
  const ships=taskShipIds(task).map(getShip).filter(Boolean);
  const losses=ships.map(ship=>({ship,amount:taskHullLoss(ship,progress)}));
  const damageText=losses.map(item=>item.ship.name+' -'+item.amount+' hull').join(', ')||'no ships assigned';
  if(!confirm('Cancel '+(task.name||task.kind)+'? Proportional hull damage: '+damageText+'. Ships cannot sink from cancellation.')) return false;

  if(task.kind==='trading'){
    const capital=Math.max(0,Math.floor(Number(task.balance)||0));
    const cargoCost=task.phase==='out'&&task.legCommodity?Math.max(0,Math.floor(Number(task.legCost)||0)):0;
    if(capital+cargoCost) Economy.addMoney(capital+cargoCost,'Cancelled trading fleet capital returned',false);
  }
  for(const {ship,amount} of losses){
    ship.hull=Math.max(1,ship.hull-amount);
    ship.status='idle';
    ship.taskId=null;
    if(task.kind==='transfer') ship.locationId=task.originId;
    else if(task.kind==='trading') ship.locationId=PORTS_BY_ID[task.currentPortId]?task.currentPortId:task.originId;
    else if(task.kind==='trade'){
      ship.locationId=task.phase==='back'?task.destPortId:task.fromPortId;
      if(task.phase==='back') ship.cargo={};
    }
  }
  state.tasks=state.tasks.filter(item=>item.id!==task.id);
  const damage=losses.reduce((total,item)=>total+item.amount,0);
  logEntry('EVENT','Cancelled '+(task.name||task.kind)+' at '+Math.round(progress*100)+'% progress; fleet lost '+damage+' hull.'+
    (task.kind==='trading'?' Uncommitted capital was returned.':''));
  toast('Task cancelled. Hull damage: '+damage+' across '+ships.length+' ship(s).','bad');
  ui.viewDirty=true; ui.headerDirty=true;
  return true;
}
function cancelTravel(){
  const voyage=state.travel;
  if(!voyage) return false;
  const progress=travelCancellationProgress(voyage);
  const ships=(voyage.shipIds||[]).map(getShip).filter(Boolean);
  const losses=ships.map(ship=>({ship,amount:taskHullLoss(ship,progress)}));
  const damageText=losses.map(item=>item.ship.name+' -'+item.amount+' hull').join(', ')||'no ships assigned';
  if(!confirm('Cancel voyage to '+PORTS_BY_ID[voyage.toId].name+'? Proportional hull damage: '+damageText+'. Ships cannot sink from cancellation.')) return false;
  for(const {ship,amount} of losses){
    ship.hull=Math.max(1,ship.hull-amount);
    ship.status='idle';
    ship.taskId=null;
    ship.locationId=voyage.fromId;
  }
  state.portId=voyage.fromId;
  state.player.locationId=voyage.fromId;
  state.travel=null;
  ui.travelShipSelection=null;
  const damage=losses.reduce((total,item)=>total+item.amount,0);
  logEntry('SHIP','Cancelled voyage to '+PORTS_BY_ID[voyage.toId].name+' at '+Math.round(progress*100)+
    '% progress; fleet lost '+damage+' hull.');
  toast('Voyage cancelled. Hull damage: '+damage+' across '+ships.length+' ship(s).','bad');
  ui.viewDirty=true; ui.headerDirty=true;
  return true;
}
function taskEndDay(task){
  if(task.kind==='remoteCommand') return task.endDay;
  if(task.kind === 'mission') return task.endDay;
  if(task.kind==='raid'||task.kind==='portRaid') return task.endDay;
  if(task.kind==='transfer') return task.endDay;
  if(task.kind==='trading') return task.arriveDay;
  return task.phase === 'out' ? task.arriveDay : task.returnDay;
}
function fmtEta(days){
  const remainingDays=Number(days);
  if(!Number.isFinite(remainingDays)||remainingDays<=0) return 'now';
  const gameSpeed=currentGameSpeed();
  if(gameSpeed===0) return 'Paused';
  const remainingSeconds=Math.ceil(remainingDays*CONFIG.msPerGameDay/(1000*gameSpeed));
  const m=Math.floor(remainingSeconds/60),s=remainingSeconds%60;
  if(m <= 0) return s+'s';
  return m+'m '+s+'s';
}
function hullBarClass(ship){
  const r = ship.hull/ship.maxHull;
  if(r < 0.35) return 'bad';
  if(r < 0.7) return 'warn';
  return '';
}

    const status=portIsRebelled(item.id)?' · Rebelled':portIsControlled(item.id)?' · Controlled':

  let management='';

    const ransom=portRansomCost(portId);

      '<div class="kv"><span>Ransom · 5%</span><span>'+fmtPortCoins(ransom,portId)+'</span></div>'+ 
      '<button class="btn primary" data-act="port-ransom" data-port="'+portId+'" '+(portCanAfford(ransom,portId)?'':'disabled')+'>Pay Ransom · '+fmtPortCoins(ransom,portId)+'</button>'+

  } else if(governance.controlled){
    const present=state.portId===portId&&!state.travel;

    const marineOffer=clamp(Math.round(Number(governance.marineOfferPrice)||marineValue),MIN_MARINE_PORT_OFFER,MAX_MARINE_PORT_OFFER);
    const marineSaleHtml=governance.marineSale
      ?'<div class="panel"><div class="panel-title"><h4>Marine Negotiation</h4><span class="tag risk-med">'+
        (governance.marineSale.outcome==='accepted'?'Accepted':'Awaiting decision')+'</span></div>'+ 
        '<div class="kv"><span>Offer under review</span><span>'+fmtWalletValue(governance.marineSale.offer)+'</span></div>'+ 
        '<div class="kv"><span>Estimated acceptance</span><span>'+Math.round(governance.marineSale.successChance*100)+'%</span></div>'+ 
        '<div class="kv"><span>Potential Marine Bonds</span><span>'+governance.marineSale.shares+' shares · '+governance.marineSale.shares*MARINE_BOND.faceValue+' MdP face</span></div>'+ 
        '<div class="kv"><span>'+(governance.marineSale.outcome==='accepted'?'Transfer in':'Decision in')+'</span><span>'+Math.max(0,Math.ceil(governance.marineSale.settleDay-state.gameDay))+' days</span></div>'+ 
        (governance.marineSale.outcome==='accepted'
          ?'<div class="small muted">Transfer reward: reputation +20 and wanted +'+Math.max(10,Math.ceil(state.wantedLevel*0.25))+'.</div>'
          :'<div class="small muted">The result is determined when the negotiation period ends. A refusal raises wanted level.</div>')+'</div>'
      :'<div class="panel"><div class="panel-title"><h4>Sell Port to Marines</h4><span class="tag">75% at fair value</span></div>'+ 
        '<div class="grid c3"><div class="kv"><span>Income · 24 months</span><span>'+fmtWalletValue(portMonthlyRevenueEstimate(portId)*24)+'</span></div>'+ 
          '<div class="kv"><span>Upgrade value</span><span>'+fmtWalletValue(portUpgradeInvestmentValue(portId))+'</span></div>'+ 
          '<div class="kv"><span>Size premium · '+esc(port.size)+'</span><span>'+fmtWalletValue(marineValue-portMonthlyRevenueEstimate(portId)*24-portUpgradeInvestmentValue(portId))+'</span></div></div>'+ 
        '<div class="row between" style="margin-top:8px"><div><b>Offer · '+fmtWalletValue(marineOffer)+'</b><div class="small muted">Estimated acceptance '+Math.round(marineSaleOdds(marineValue,marineOffer)*100)+'% · paid as '+
          marineBondSharesForPortSale(marineOffer)+' Marine Bond share(s)</div></div>'+ 
          '<div class="row"><button class="btn sm" data-act="port-offer-adjust" data-direction="-1" data-port="'+portId+'" title="Lower offer by 10%">−10%</button>'+ 
            '<button class="btn sm" data-act="port-offer-adjust" data-direction="1" data-port="'+portId+'" title="Raise offer by 10%">+10%</button>'+ 
            '<button class="btn sm primary" data-act="port-sell-marine" data-port="'+portId+'">Negotiate</button></div></div>'+ 
        '<div class="small muted" style="margin-top:5px">Fair value: '+fmtWalletValue(marineValue)+'. Success completes in 1–3 months and adds reputation +20 and wanted +'+
          Math.max(10,Math.ceil(state.wantedLevel*0.25))+'. A failed negotiation also raises wanted.</div></div>';
    const streams=governance.monthlyAccrual;
    const bondMarket=BOND_CITY_MARKETS[portId];
    const bondSupplyRows=BOND_TERMS.map(term=>
      '<div class="kv"><span>'+term.years+'-year bonds</span><span>'+fmtNum(state.bondSupply[portId][term.years])+
        ' available / '+fmtNum(state.bondSupplyLimit[portId][term.years])+' max</span></div>'
    ).join('');
    const bondTermOptions=BOND_TERMS.map(term=>
      '<option value="'+term.years+'">'+term.years+' years · '+
        (bondAnnualRate(term.years,portId)*100).toFixed(2)+'% annual · '+fmtNum(state.bondSupply[portId][term.years])+' available</option>'
    ).join('');
    const upgradesHtml='<h4>Port Development</h4>'+PORT_UPGRADES.map(upgrade=>{
      const level=portUpgradeLevel(portId,upgrade.id);
      const cost=portUpgradeCost(portId,upgrade);
      return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="row between"><div><b>'+
        esc(upgrade.name)+' · Level '+level+'/'+PORT_UPGRADE_MAX_LEVEL+'</b><div class="small muted">'+esc(upgrade.desc)+
        '</div></div><button class="btn sm primary" data-act="port-upgrade" data-port="'+portId+'" data-upgrade="'+upgrade.id+'" '+
        (level<PORT_UPGRADE_MAX_LEVEL&&portCanAfford(cost,portId)?'':'disabled')+'>'+
        (level>=PORT_UPGRADE_MAX_LEVEL?'Max level':'Upgrade · '+fmtPortCoins(cost,portId))+'</button></div>'+
        (level<PORT_UPGRADE_MAX_LEVEL&&!portCanAfford(cost,portId)?'<div class="small muted">Short on '+esc(CURRENCIES[currencyForPort(portId)].name)+'. Exchange funds at a bank.</div>':'')+'</div>';
    }).join('');
    management='<div class="panel solid"><div class="panel-title"><h3>Port Governance</h3><span class="tag good">Under your control</span></div>'+ 
      '<div class="grid c4">'+
        '<div class="kv"><span>Population</span><span>'+fmtNum(governance.population)+'</span></div>'+ 
        '<div class="kv"><span>Efficiency</span><span>'+Math.round(portEconomicEfficiency(portId)*100)+'%</span></div>'+ 
        '<div class="kv"><span>Monthly revenue forecast</span><span>'+fmtPortCoins(portMonthlyRevenueEstimate(portId),portId)+'</span></div>'+ 
        '<div class="kv"><span>Next payout</span><span>'+Math.max(0,30-(Math.floor(state.gameDay)-governance.lastPayoutDay))+'d</span></div>'+ 
      '</div><div class="divider"></div>'+ 
      '<div class="grid c2">'+
        '<label class="fld"><span>Trade tax · 0-60%</span><input id="portTradeTax" type="number" min="0" max="60" step="0.1" value="'+(governance.tradeTaxRate*100).toFixed(2)+'"></label>'+ 
        '<label class="fld"><span>Population tax · 0-60%</span><input id="portPopulationTax" type="number" min="0" max="60" step="0.1" value="'+(governance.populationTaxRate*100).toFixed(2)+'"></label>'+ 
      '</div><div class="row"><button class="btn primary" data-act="port-optimize" data-port="'+portId+'">Optimize Taxes</button>'+ 
        '<span class="small muted">Higher rates reduce port activity and raise revolt risk.</span></div>'+ 
      '<div class="divider"></div><h4>Current Cycle · 30 days</h4>'+ 
      '<div class="grid c3">'+
        '<div class="kv"><span>Bond interest share</span><span>'+fmtPortCoins(Math.round(streams.bonds),portId)+'</span></div>'+ 
        '<div class="kv"><span>Trade tax</span><span>'+fmtPortCoins(Math.round(streams.trade),portId)+'</span></div>'+ 
        '<div class="kv"><span>Population tax</span><span>'+fmtPortCoins(Math.round(streams.population),portId)+'</span></div>'+ 
        '<div class="kv"><span>Gate tolls</span><span>'+fmtPortCoins(Math.round(streams.tolls),portId)+'</span></div>'+ 
        '<div class="kv"><span>Ship entry fees</span><span>'+fmtPortCoins(Math.round(streams.shipFees),portId)+'</span></div>'+ 
        '<div class="kv"><span>Last payout</span><span>'+fmtPortCoins(governance.monthlyPaid,portId)+'</span></div>'+ 
      '</div><div class="divider"></div>'+ 
      upgradesHtml+ 
      '<div class="divider"></div>'+marineSaleHtml+
      '<div class="divider"></div><h4>City Bond Issuance</h4>'+ 
      '<p class="small muted">Issue extra shares and buy them immediately. The added maximum is permanent; sold or matured shares return to the available supply.</p>'+ 
      '<div class="grid c3">'+bondSupplyRows+'</div>'+ 
      '<div class="row"><label class="fld" style="flex:1"><span>Bond term</span><select id="portBondTerm">'+bondTermOptions+'</select></label>'+ 
        '<label class="fld" style="width:110px"><span>Shares</span><input id="portBondUnits" type="number" min="1" step="1" value="1"></label>'+ 
        '<button class="btn primary" data-act="port-issue-buy-bonds" data-port="'+portId+'" style="margin-top:14px" '+
            (present&&!portIsClosed(portId)&&portCanAfford(bondMarket.price,portId)?'':'disabled')+'>Issue & Buy Directly</button></div>'+ 
          '<div class="small muted">Price: '+fmtPortCoins(bondMarket.price,portId)+' per share. Direct purchase requires docking here.</div>'+ 
      '<div class="divider"></div>'+ 
      (port.allowBribes===false?'':'<div class="row between"><div><b>Politician Bribe</b><div class="small muted">Costs 25% of forecast monthly revenue; permanently cuts revolt risk by 95%. With all upgrades maxed, prevents rebellion.</div></div>'+

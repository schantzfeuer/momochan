<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pirate's Fortune</title>
<style>
:root{
  --navy:#0b1622;--navy2:#122436;--navy3:#1b3448;--wood:#2c2118;
  --parch:#efe1c2;--parch2:#ddcba3;--bronze:#c9a04a;--bronze2:#8a6a2a;
  --ink:#241c12;--red:#b5453b;--green:#3f7d52;--blue:#3b6ea5;
  --muted:#9a8f78;--line:rgba(201,160,74,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#16304a 0%,transparent 60%),
             linear-gradient(180deg,#0b1622 0%,#0a131d 100%);
  background-attachment:fixed;color:var(--parch);font-size:14px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .4em 0;font-weight:600;letter-spacing:.02em;}
h1{font-size:22px;}h2{font-size:17px;}h3{font-size:15px;}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--bronze);}
.muted{color:var(--muted);}.small{font-size:12px;}.tiny{font-size:11px;}
.mono{font-family:Consolas,"Liberation Mono",Menlo,monospace;}
.center{text-align:center;}.right{text-align:right;}.nowrap{white-space:nowrap;}
#app{max-width:1320px;margin:0 auto;padding:0 14px 60px;}
header#topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#14283c 0%,#0f1f2f 100%);
  border-bottom:2px solid var(--bronze2);box-shadow:0 6px 18px rgba(0,0,0,.5);
  margin:0 -14px 12px;padding:8px 14px;
}
.topgrid{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;}
.captain-block{display:flex;align-items:center;gap:10px;min-width:220px;}
.flag{width:42px;height:30px;border:1px solid var(--bronze2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1a2b3d;flex:0 0 auto;}
.captain-name{font-size:15px;line-height:1.15;}
.captain-title{font-size:11px;color:var(--bronze);text-transform:uppercase;letter-spacing:.1em;}
.topgrid{display:grid;grid-template-columns:minmax(220px,auto) minmax(0,1fr);gap:10px 22px;}
.captain-block{min-width:0;}
.stat-block{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px 12px;width:100%;}
.stat{display:flex;min-width:0;min-height:38px;flex-direction:column;justify-content:center;line-height:1.15;padding-left:10px;border-left:1px solid var(--line);}
.stat .lbl{overflow:hidden;font-size:9px;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.stat .val{overflow:hidden;font-size:13px;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;}
.stat .stat-note{overflow:hidden;font-size:10px;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
.stat .val.gold{color:var(--bronze);}
.time-controls{grid-column:1/-1;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.time-controls .time-label{font-size:10px;text-transform:uppercase;color:var(--muted);margin-right:3px;}
.time-controls .btn{min-width:39px;padding:4px 8px;font-size:11px;}
@media(max-width:900px){.topgrid{grid-template-columns:1fr;gap:9px;}.stat-block{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media(max-width:560px){
  header#topbar{padding:5px 8px;margin-bottom:8px;}
  .topgrid{grid-template-columns:1fr;gap:4px;}
  .captain-block{gap:7px;}
  .captain-block .flag{width:28px;height:22px;font-size:14px;}
  .captain-name{font-size:13px;}
  .captain-title{font-size:9px;}
  .stat-block{display:flex;gap:3px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:2px;}
  .stat{flex:0 0 auto;min-height:24px;flex-direction:row;align-items:center;gap:4px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.18);}
  .stat .lbl{font-size:8px;letter-spacing:0;}
  .stat .val{font-size:11px;}
  .stat .stat-note{display:none;}
}
nav#tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
nav#tabs button{
  font-family:inherit;font-size:13px;background:linear-gradient(180deg,#1d3348,#152636);
  color:var(--parch2);border:1px solid var(--line);border-bottom:none;
  border-radius:6px 6px 0 0;padding:7px 14px;cursor:pointer;transition:.12s;
}
nav#tabs button:hover{background:linear-gradient(180deg,#26455f,#1a2f42);color:var(--parch);}
nav#tabs button.active{background:linear-gradient(180deg,#3a2e1e,#241c12);color:var(--bronze);border-color:var(--bronze2);}
nav#tabs button .badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;margin-left:6px;vertical-align:middle;}
.panel{background:linear-gradient(180deg,rgba(239,225,194,.06),rgba(239,225,194,.02));border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
.panel.solid{background:linear-gradient(180deg,#1a2c3d,#132231);}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;}
.grid{display:grid;gap:12px;}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.spacer{flex:1;}
.btn{font-family:inherit;font-size:13px;background:linear-gradient(180deg,#2a3f55,#1b2c3d);color:var(--parch);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;transition:.12s;}
.btn:hover{background:linear-gradient(180deg,#395a78,#243a4f);border-color:var(--bronze2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.primary{background:linear-gradient(180deg,#c9a04a,#8a6a2a);color:#241c12;font-weight:700;border-color:#e0c078;}
.btn.primary:hover{background:linear-gradient(180deg,#dcb35c,#a07f34);}
.btn.danger{background:linear-gradient(180deg,#8a3a33,#5c2622);border-color:#b5453b;color:#f0dcd8;}
.btn.danger:hover{background:linear-gradient(180deg,#a5453c,#6e2d28);}
.btn.ghost{background:transparent;}
.btn.sm{font-size:11.5px;padding:4px 8px;}
.bar{height:9px;background:rgba(0,0,0,.42);border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.4);}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3f7d52,#63b07a);transition:width .3s;}
.bar.hull>i{background:linear-gradient(90deg,#3f7d52,#63b07a);}
.bar.hull.warn>i{background:linear-gradient(90deg,#b58a2f,#d8b455);}
.bar.hull.bad>i{background:linear-gradient(90deg,#8a3a33,#c0554a);}
.bar.morale>i{background:linear-gradient(90deg,#3b6ea5,#5f9fd8);}
.bar.progress>i{background:linear-gradient(90deg,#8a6a2a,#d8b455);}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--bronze);border-bottom:1px solid var(--line);padding:5px 6px;position:sticky;top:0;background:#16283a;z-index:2;}
table.tbl td{border-bottom:1px solid rgba(201,160,74,.12);padding:5px 6px;}
table.tbl tr:hover td{background:rgba(201,160,74,.06);}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:6px;}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--parch2);letter-spacing:.03em;}
.tag.cheap{color:#8fd6a4;border-color:#3f7d52;}
.tag.expensive{color:#e8a08f;border-color:#b5453b;}
.tag.normal{color:var(--muted);}
.tag.rare{color:#c9a04a;border-color:var(--bronze2);}
.tag.risk-low{color:#8fd6a4;border-color:#3f7d52;}
.tag.risk-med{color:#d8c07a;border-color:#8a6a2a;}
.tag.risk-high{color:#e8a08f;border-color:#b5453b;}
.tag.risk-vhigh{color:#ff8f7f;border-color:#b5453b;background:rgba(181,69,59,.16);}
.tag.good{color:#8fd6a4;border-color:#3f7d52;}
.card{background:linear-gradient(180deg,rgba(239,225,194,.055),rgba(239,225,194,.015));border:1px solid var(--line);border-radius:8px;padding:11px 13px;}
.card.hl{border-color:var(--bronze2);box-shadow:0 0 0 1px rgba(201,160,74,.15) inset;}
.card h3{margin-bottom:2px;}
.ship-upgrades{margin-top:10px;}
.ship-upgrades summary{cursor:pointer;color:var(--bronze);font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
.ship-upgrades[open] summary{margin-bottom:6px;}
.raid-cargo{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:4px 12px;margin-top:5px;}
.raid-ship-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin:8px 0;}
.search-zone{text-align:center;padding:18px 10px;background:radial-gradient(400px 120px at 50% 0%,rgba(201,160,74,.12),transparent 70%);border-radius:10px;}
.dashboard-hero{position:relative;overflow:hidden;background:linear-gradient(115deg,rgba(28,48,64,.98),rgba(19,34,47,.96) 58%,rgba(47,37,25,.88));animation:dashboardReveal .32s ease-out;}
.dashboard-hero::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--bronze),var(--red),transparent 72%);}
.dashboard-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:4px 2px 14px;}
.dashboard-kicker{font-size:10px;text-transform:uppercase;color:var(--bronze);margin-bottom:5px;}
.dashboard-name{font-size:22px;line-height:1.2;margin:0;}
.dashboard-funds{text-align:right;min-width:180px;}
.dashboard-funds span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);}
.dashboard-funds strong{display:block;font-size:21px;color:var(--bronze);font-weight:600;}
.dashboard-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.dashboard-kpi{min-width:0;padding:12px 14px;border-right:1px solid var(--line);}
.dashboard-kpi:last-child{border-right:0;}
.dashboard-kpi-label{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.dashboard-kpi-value{display:block;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;}
.dashboard-kpi-note{display:block;font-size:11px;color:var(--muted);margin-top:4px;}
.dashboard-meter{height:5px;margin-top:8px;background:rgba(0,0,0,.38);overflow:hidden;border-radius:3px;}
.dashboard-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8fc0e8);}
.dashboard-meter.hull i{background:linear-gradient(90deg,var(--green),#8fd6a4);}
.dashboard-details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;padding:12px 2px 1px;}
.dashboard-detail{display:flex;justify-content:space-between;gap:8px;font-size:12px;}
.dashboard-detail span:first-child{color:var(--muted);}
@keyframes dashboardReveal{from{transform:translateY(5px);opacity:.75}to{transform:translateY(0);opacity:1}}
@media(max-width:680px){.dashboard-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}.dashboard-kpi:nth-child(2){border-right:0;}.dashboard-kpi:nth-child(-n+2){border-bottom:1px solid var(--line);}.dashboard-details{grid-template-columns:repeat(2,minmax(0,1fr));}.dashboard-head{align-items:flex-start;flex-direction:column;gap:10px;}.dashboard-funds{text-align:left;}}
#searchBtn{font-size:19px;padding:18px 42px;border-radius:12px;letter-spacing:.06em;font-weight:700;box-shadow:0 6px 22px rgba(201,160,74,.28);}
#searchBtn:active{transform:translateY(2px) scale(.99);}
.find-line{margin-top:12px;min-height:44px;}
.find-name{font-size:16px;color:var(--bronze);}
.find-value{font-size:13px;color:#8fd6a4;}
.pop{animation:pop .32s ease-out;}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.loglist{max-height:420px;overflow:auto;}
.logitem{border-left:3px solid var(--bronze2);padding:5px 9px;margin-bottom:5px;background:rgba(0,0,0,.16);border-radius:0 5px 5px 0;font-size:12.5px;}
.logitem .day{color:var(--bronze);font-size:11px;letter-spacing:.05em;}
.logitem.cat-TRADE{border-left-color:#3b6ea5;}
.logitem.cat-COMBAT{border-left-color:#b5453b;}
.logitem.cat-MISSION{border-left-color:#c9a04a;}
.logitem.cat-CREW{border-left-color:#8f6fb5;}
.logitem.cat-SHIP{border-left-color:#3f7d52;}
.logitem.cat-ECONOMY{border-left-color:#7a8f3f;}
.logitem.cat-EVENT{border-left-color:#c07a3f;}
.logitem.cat-PAYROLL{border-left-color:#c9a04a;background:rgba(201,160,74,.08);}
.map-controls{display:flex;align-items:center;gap:6px;}
.map-controls .btn{min-width:34px;padding:5px 9px;font-size:16px;line-height:1;}
.map-zoom-value{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;}
.mapwrap{position:relative;width:100%;height:min(68vh,680px);min-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0d1c2a;cursor:grab;touch-action:none;user-select:none;}
.mapwrap.dragging{cursor:grabbing;}
.mapstage{position:relative;flex:0 0 auto;aspect-ratio:1.42;background:radial-gradient(600px 300px at 30% 30%,rgba(60,110,150,.16),transparent 70%),linear-gradient(160deg,#12293c,#0d1c2a 60%,#102434);}
.mapstage::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(201,160,74,.06) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(201,160,74,.06) 0 1px,transparent 1px 44px);}
.portnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3;background:none;border:none;padding:0;font-family:inherit;color:inherit;}
.portnode .dot{width:calc(16px * var(--map-scale));height:calc(16px * var(--map-scale));border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c374,#8a6a2a);border:2px solid #2c2118;box-shadow:0 0 10px rgba(201,160,74,.5);}
.portnode.small .dot{width:calc(11px * var(--map-scale));height:calc(11px * var(--map-scale));}
.portnode.large .dot{width:calc(20px * var(--map-scale));height:calc(20px * var(--map-scale));}
.portnode.xl .dot{width:calc(25px * var(--map-scale));height:calc(25px * var(--map-scale));background:radial-gradient(circle at 35% 30%,#f5dc9a,#b58a2f);}
.portnode .nm{font-size:calc(11px * var(--map-scale));margin-top:3px;white-space:nowrap;color:var(--parch2);background:rgba(9,18,28,.78);padding:1px 6px;border-radius:8px;border:1px solid var(--line);}
.portnode .country{margin-top:1px;color:#c0b79f;font-size:calc(8px * var(--map-scale));line-height:1.05;text-shadow:0 1px 3px #08121c;white-space:nowrap;}
.portnode.here .dot{box-shadow:0 0 0 4px rgba(143,214,164,.35),0 0 12px rgba(143,214,164,.7);}
.portnode.here .nm{color:#8fd6a4;border-color:#3f7d52;}
.maplines{position:absolute;inset:0;z-index:1;pointer-events:none;}
.modal-back{position:fixed;inset:0;background:rgba(4,10,16,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
.modal{background:linear-gradient(180deg,#1c2f42,#12202e);border:2px solid var(--bronze2);border-radius:12px;padding:22px 26px;max-width:680px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.7);}
.modal h2{color:var(--bronze);}
label.fld{display:block;margin-bottom:10px;}
label.fld span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--bronze);margin-bottom:3px;}
input[type=text],input[type=number],select,textarea{font-family:inherit;font-size:13px;width:100%;background:rgba(0,0,0,.35);color:var(--parch);border:1px solid var(--line);border-radius:5px;padding:6px 9px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bronze);}
select{cursor:pointer;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;}
.swatch.sel{border-color:var(--bronze);box-shadow:0 0 0 2px rgba(201,160,74,.3);}
#toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:linear-gradient(180deg,#22384c,#16273a);border:1px solid var(--bronze2);border-left:4px solid var(--bronze);border-radius:6px;padding:8px 14px;font-size:13px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:slideIn .25s ease-out;}
.toast.good{border-left-color:#3f7d52;}
.toast.bad{border-left-color:#b5453b;}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
#tutBanner{background:linear-gradient(90deg,rgba(201,160,74,.18),rgba(201,160,74,.05));border:1px solid var(--bronze2);border-left:5px solid var(--bronze);border-radius:6px;padding:8px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#debugPanel{position:fixed;left:0;bottom:0;width:460px;max-height:50vh;overflow:auto;z-index:90;background:rgba(4,12,20,.94);border-top:2px solid var(--bronze2);border-right:2px solid var(--bronze2);border-radius:0 8px 0 0;padding:8px 10px;font-size:11px;font-family:Consolas,Menlo,monospace;color:#9fd6a4;white-space:pre-wrap;}
#debugPanel h4{color:var(--bronze);margin-bottom:4px;font-size:11px;}
.hint{font-size:11.5px;color:var(--muted);font-style:italic;}
.divider{height:1px;background:var(--line);margin:10px 0;}
.scroll-y{max-height:340px;overflow:auto;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0;}
.kv span:last-child{color:var(--parch);font-variant-numeric:tabular-nums;}
.kv span:first-child{color:var(--muted);}
hr{border:none;border-top:1px solid var(--line);margin:10px 0;}
.morale-buff{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(63,125,82,.22);border:1px solid #3f7d52;color:#8fd6a4;margin-right:4px;}
.training-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(59,110,165,.22);border:1px solid #3b6ea5;color:#8fc0e8;}
.payroll-due{color:#e8a08f;font-weight:600;}
.ship-select-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;background:rgba(0,0,0,.18);}
.ship-select-card{display:flex;gap:8px;align-items:center;padding:7px 9px;margin-bottom:5px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,rgba(239,225,194,.045),rgba(239,225,194,.015));cursor:pointer;transition:.12s;}
.ship-select-card:hover{border-color:var(--bronze2);background:rgba(201,160,74,.08);}
.ship-select-card.selected{border-color:var(--bronze2);background:rgba(201,160,74,.12);}
.ship-select-card.disabled{opacity:.45;cursor:not-allowed;}
.ship-select-card input{width:auto;margin:0;flex:0 0 auto;}
.ship-select-card .info{flex:1;line-height:1.25;}
.ship-select-card .info b{font-size:13px;}
.ship-select-card .info .small{font-size:11px;color:var(--muted);}
.tutorial-progress{height:8px;margin:9px 0;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.tutorial-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--bronze));transition:width .25s;}
.marine-page{display:grid;gap:12px;min-width:0;}
.marine-office-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;}

  let h = 2166136261>>>0;

function activeCurrency(){ return PORTS_BY_ID[state?.portId]?.currency||'PESO'; }
function currentInflationYear(){ return Math.floor((Number(state?.gameDay)||0)/BANKING.daysPerYear); }
function buildInflationTable(gameDay,existing){
  const table=existing&&typeof existing==='object'?JSON.parse(JSON.stringify(existing)):{};
  const baseYear={};
  for(const [code,currency] of Object.entries(CURRENCIES)){
    baseYear[code]={silverPerCoin:currency.silverPerCoin,effectiveInflation:0};
  }
  if(!table[0]) table[0]=baseYear;
  const year=Math.floor((Number(gameDay)||0)/BANKING.daysPerYear);
  for(let current=1;current<=year;current++){
    if(table[current]) continue;
    const previous=table[current-1]||baseYear;
    const rates={};
    for(const [code,currency] of Object.entries(CURRENCIES)){
      const base=Array.isArray(currency.inflation)
        ?currency.inflation[0]+rng('inflation-base',code,current)*(currency.inflation[1]-currency.inflation[0])
        :currency.inflation;
      const effective=base*(0.9+rng('inflation-factor',code,current)*0.2);
      rates[code]={silverPerCoin:(Number(previous[code]?.silverPerCoin)||currency.silverPerCoin)*(1-effective),effectiveInflation:effective};
    }
    table[current]=rates;
  }
  return table;
}
function ensureInflation(){
  if(state&&(!state.inflation?.[0]||!state.inflation?.[currentInflationYear()])){
    state.inflation=buildInflationTable(state.gameDay,state.inflation);
  }
}
function silverPerCoin(code){
  const currency=CURRENCIES[code]||CURRENCIES[activeCurrency()];
  ensureInflation();
  return Number(state?.inflation?.[currentInflationYear()]?.[code||activeCurrency()]?.silverPerCoin)||currency.silverPerCoin;
}
function legacyToSilverG(value){ return (Number(value)||0)*LEGACY_KREUZER_SILVER_G; }
function floorCoins(value){
  const amount=Number(value)||0;
  return Math.floor(amount*100+1e-9)/100;
}
function silverToCoins(grams,code){ return floorCoins((Number(grams)||0)/silverPerCoin(code)); }
function silverToCoinsAtDay(grams,code,day){
  const year=Math.floor((Number(day)||0)/BANKING.daysPerYear);
  if(state&&!state.inflation?.[year]) state.inflation=buildInflationTable(day,state.inflation);
  const rate=Number(state?.inflation?.[year]?.[code]?.silverPerCoin)||CURRENCIES[code].silverPerCoin;
  return floorCoins((Number(grams)||0)/rate);
}
function coinsToSilver(coins,code){ return (Number(coins)||0)*silverPerCoin(code); }
function legacyToCoins(value,code){ return silverToCoins(legacyToSilverG(value),code); }
function legacyToCoinsAtYear(value,code,gameDay,inflation){
  const year=Math.floor((Number(gameDay)||0)/BANKING.daysPerYear);
  const rate=Number(inflation?.[year]?.[code]?.silverPerCoin)||CURRENCIES[code].silverPerCoin;
  return floorCoins(legacyToSilverG(value)/rate);
}
function fxRate(from,to){ return silverPerCoin(from)/silverPerCoin(to); }
function currencyForPort(portId){ return PORTS_BY_ID[portId]?.currency||'PESO'; }
function portWalletBalance(portId){ return Number(state?.wallet?.coins?.[currencyForPort(portId)])||0; }
function currencyCoinsToLegacy(coins,code){ return coinsToSilver(coins,code)/legacyToSilverG(1); }
function portCoinsToLegacy(coins,portId){ return currencyCoinsToLegacy(coins,currencyForPort(portId)); }
function fmtPortCoins(coins,portId){ return fmtMoney(coins,currencyForPort(portId)); }
function portCanAfford(coins,portId){ return portWalletBalance(portId)+1e-9>=Math.max(0,Number(coins)||0); }
function portAddCoins(coins,reason,portId){
  const value=Math.max(0,Number(coins)||0);
  if(!value) return 0;
  return Economy.addMoney(portCoinsToLegacy(value,portId),reason,false,{currency:currencyForPort(portId)});
}
function portRemoveCoins(coins,reason,portId){
  const value=Math.max(0,Number(coins)||0);
  if(!value) return 0;
  return Economy.removeMoney(portCoinsToLegacy(value,portId),reason,{currency:currencyForPort(portId)});
}
function walletSilverNetWorthG(){
  if(!state) return 0;
  ensureInflation();
  const coinSilver=Object.entries(state.wallet.coins).reduce((total,[code,coins])=>total+coinsToSilver(coins,code),0);
  return coinSilver+Number(BigInt(state.wallet.mdp||'0'))*1000;
}
function fmtMdP(value){
  let amount;
  try{ amount=BigInt(value||0); }catch{ amount=0n; }
  const negative=amount<0n;
  const absolute=negative?-amount:amount;
  const suffixes=[[10n**18n,'Qn'],[10n**15n,'Qa'],[10n**12n,'T'],[10n**9n,'B'],[10n**6n,'M'],[1000n,'k']];
  for(const [scale,suffix] of suffixes){
    if(absolute>=scale){
      const hundredths=absolute*100n/scale;
      return (negative?'-':'')+(hundredths/100n)+'.'+String(hundredths%100n).padStart(2,'0')+suffix+' MdP';
    }
  }
  return amount.toLocaleString('en-US')+' MdP';
}
function fmtSilverG(grams){
  let value=Number(grams)||0;
  if(!Number.isFinite(value)) value=0;
  const abs=Math.abs(value);
  const suffixes=[[1e18,'Qn'],[1e15,'Qa'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e4,'k']];
  for(const [scale,suffix] of suffixes){
    if(abs>=scale) return (Math.floor(value/scale*100)/100).toFixed(2)+suffix+' g silver';
  }
  return value.toLocaleString('en-US',{maximumFractionDigits:2})+' g silver';
}

function portAllowsCommodity(portId,commodity){

  if(!port||!commodity) return false;
  if(Array.isArray(port.allowedGoods)&&!port.allowedGoods.includes(commodity.name)) return false;

function portHasCommodity(portId, commName){
  const key = portId+'|'+commName;
  if(key in _availCache) return _availCache[key];
  const port = PORTS_BY_ID[portId], c = COMM_BY_NAME[commName];
  if(!portAllowsCommodity(portId,c)){ _availCache[key]=false; return false; }
  let has;
  if(port.guaranteeAllowedGoods||port.size==='Extra Large') has = true;
  else {
    const produced = (port.produce[c.category]||1) < 0.85;
    has = produced || rng(portId, commName, 'avail') < PORT_AVAIL[port.size];
  }
  _availCache[key] = has; return has;
}

const SKILL_BY_ID = {}; SKILLS.forEach(s=>SKILL_BY_ID[s.id]=s);
function skillIsMaxed(skill){
  if(!skill || !skill.effects || !skill.effects.length) return false;
  const reductionEffects = skill.effects.filter(effect=>effect.type==='reduction');
  if(!reductionEffects.length || reductionEffects.length !== skill.effects.length) return false;
  const rank = state.skills[skill.id] || 0;
  return reductionEffects.every(effect=>{
    const cap = Math.min(SKILL_REDUCTION_CAP, effect.max ?? SKILL_REDUCTION_CAP);
    const value = skillEffectValue(skill.id, effect.id, rank);
    return value >= cap - 1e-9;
  });
}
function skillEffectValue(skillId,effectId,rank){
  const skill=SKILL_BY_ID[skillId];
  const effect=skill && skill.effects.find(item=>item.id===effectId);
  if(!effect) return 0;
  const level=rank===undefined?(state.skills[skillId]||0):rank;
  const value=effect.rate*SKILL_EFFECT_SCALE[effect.type||'bonus']*level;
  if(effect.type==='reduction'){
    const cap=Math.min(SKILL_REDUCTION_CAP, effect.max ?? SKILL_REDUCTION_CAP);
    return Math.min(cap,value);
  }
  return value;
}
function skillEffectSummary(skill,rank){
  return skill.effects.map(effect=>{
    const value=skillEffectValue(skill.id,effect.id,rank)*100;
    const capped = effect.type==='reduction' && value >= Math.min(SKILL_REDUCTION_CAP, effect.max ?? SKILL_REDUCTION_CAP)*100 - 0.0001;
    const sign=effect.type==='reduction'?'-':'+';
    return sign+Number(value.toFixed(2))+'% '+effect.label+(capped?' (max)':'');
  }).join(' · ');
}

function weightedEvent(filterKind,portId,includeAmbientOnly){
  const pool = EVENTS.filter(e=>(!filterKind||e.kind===filterKind)&&
    (!e.portId||e.portId===portId)&&!(e.excludedPorts||[]).includes(portId)&&
    (!e.ambientOnly||includeAmbientOnly));
  const total = pool.reduce((a,e)=>a+e.weight,0);
  let r = Math.random()*total;
  for(const e of pool){ r -= e.weight; if(r<=0) return e; }
  return pool[pool.length-1];
}

function fmtMoney(amount,code){
  const currency=CURRENCIES[code]||CURRENCIES[activeCurrency()];
  let value=Number(amount)||0;
  if(!Number.isFinite(value)) value=0;
  const abs=Math.abs(value);
  if(abs>=1e18) return (Math.floor(value/1e18*100)/100).toFixed(2)+'Qn '+currency.symbol;
  if(abs>=1e15) return (Math.floor(value/1e15*100)/100).toFixed(2)+'Qa '+currency.symbol;
  if(abs>=1e12) return (Math.floor(value/1e12*100)/100).toFixed(2)+'T '+currency.symbol;
  if(abs>=1e9) return (Math.floor(value/1e9*100)/100).toFixed(2)+'B '+currency.symbol;
  if(abs>=1000000) return (Math.floor(value/1000000*100)/100).toFixed(2)+'M '+currency.symbol;
  if(abs>=10000) return (Math.floor(value/1000*100)/100).toFixed(2)+'k '+currency.symbol;
  const formatted=floorCoins(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return formatted+' '+currency.symbol;
}
function formatWalletValue(value){ return fmtMoney(legacyToCoins(value,activeCurrency()),activeCurrency()); }
function fmtWalletValue(value){ return formatWalletValue(value); }
function fmtK(value){ return fmtMoney(legacyToCoins(value,activeCurrency()),activeCurrency()); }
function attachLegacyFunds(s){

}

const Economy = {
  ledger: [],
  _pushSilverG(silverG,reason,currency){
    if(!state) return;
    const amount=Number(silverG);
    if(!Number.isFinite(amount)) return;
    const entry = { id: uid('tx'), silverG:amount, currency, reason, day: state.gameDay, ts: Date.now() };
    this.ledger.unshift(entry);
    if(this.ledger.length > CONFIG.maxTxEntries) this.ledger.length = CONFIG.maxTxEntries;
  },
  _push(amount, reason, currency){
    if(!state) return;
    const coins=floorCoins(amount);
    this._pushSilverG(coinsToSilver(coins,currency),reason,currency);
    if(CONFIG.debug) debugPush('[ECON] '+(coins>=0?'+':'')+coins+' '+currency+' | '+reason);
  },
  addMoney(amount, reason, countAsEarned, options){
    if(!state) return 0;
    if(countAsEarned&&typeof countAsEarned==='object'){
      options=countAsEarned;
      countAsEarned=true;
    }
    const legacy=Math.max(0,Number(amount)||0);
    if(legacy<=0) return 0;
    const currency=options?.currency||activeCurrency();
    const coins=legacyToCoins(legacy,currency);
    state.wallet.coins[currency]=floorCoins(state.wallet.coins[currency]+coins);
    if(countAsEarned !== false) state.stats.totalEarned += legacy;
    this._push(coins, reason||'Income', currency);
    ui.headerDirty = true;
    return legacy;
  },
  removeMoney(amount, reason, options){
    if(!state) return 0;
    const legacy=Math.max(0,Number(amount)||0);
    if(legacy<=0) return 0;
    const currency=options?.currency||activeCurrency();
    const coins=legacyToCoins(legacy,currency);
    const balance=state.wallet.coins[currency]||0;
    if(balance+0.0000001<coins){
      toast('Not enough '+CURRENCIES[currency].name+'; exchange funds at a bank.','bad');
      return 0;
    }
    state.wallet.coins[currency]=floorCoins(balance-coins);
    this._push(-coins, reason||'Expense', currency);
    ui.headerDirty = true;
    return legacy;
  },
  addMdP(amount,reason){
    if(!state) return 0;
    const value=mdpInteger(amount);
    state.wallet.mdp=(BigInt(state.wallet.mdp||'0')+value).toString();
    if(value) this._pushSilverG(Number(value)*1000,reason||'MdP income','MdP');
    if(value) logEntry('ECONOMY','Received '+value+' MdP'+(reason?' — '+reason:'')+'.');
    ui.headerDirty=true;
    return value;
  },
  removeMdP(amount,reason){
    if(!state) return 0;
    const value=mdpInteger(amount);
    const balance=BigInt(state.wallet.mdp||'0');
    if(balance<value) return 0;
    state.wallet.mdp=(balance-value).toString();
    if(value) this._pushSilverG(-Number(value)*1000,reason||'MdP expense','MdP');
    if(value) logEntry('ECONOMY','Spent '+value+' MdP'+(reason?' — '+reason:'')+'.');
    ui.headerDirty=true;
    return value;
  },
  canAffordMdP(amount){ return state ? BigInt(state.wallet.mdp||'0')>=mdpInteger(amount) : false; },
  canAfford(amount,reason,options){
    if(!state) return false;
    const currency=options?.currency||activeCurrency();
    return (state.wallet.coins[currency]||0)+0.0000001>=legacyToCoins(amount,currency);
  },
  getLedger(){ return this.ledger.slice(0, 60); },
};

function mdpInteger(value){
  if(typeof value==='bigint') return value>0n?value:0n;
  const text=String(value??'').trim();
  if(/^\d+$/.test(text)) return BigInt(text);
  const number=Number(value);
  return Number.isInteger(number)&&number>0?BigInt(number):0n;
}

const BANK_EXCHANGE_FEES = {'Extra Large':0.01,Large:0.02,Medium:0.03,Small:0.05,gildhall:0.005};
function bankExchangeFee(portId){
  return portId==='gildhall'?BANK_EXCHANGE_FEES.gildhall:(BANK_EXCHANGE_FEES[PORTS_BY_ID[portId]?.size]??BANK_EXCHANGE_FEES.Small);

function bankExchangeQuote(from,to,amount,portId=state.portId){
  const value=Math.max(0,Number(amount)||0);
  const feeRate=bankExchangeFee(portId);
  if(!CURRENCIES[from]||!CURRENCIES[to]||from===to||!value){
    return {rate:from===to?1:fxRate(from,to),feeRate,fee:0,gross:0,received:0};
  }
  const gross=value*fxRate(from,to);
  const received=floorCoins(gross*(1-feeRate));
  return {rate:fxRate(from,to),feeRate,fee:value*feeRate,gross,received};
}
function bankExchangeAllQuote(to,portId=state.portId){
  const feeRate=bankExchangeFee(portId);
  const silver=Object.entries(CURRENCIES).reduce((total,[code])=>{
    if(code===to) return total;
    return total+(Number(state.wallet.coins[code])||0)*silverPerCoin(code);
  },0);
  const gross=silver/silverPerCoin(to);
  return {feeRate,fee:silver*feeRate/silverPerCoin(to),gross,received:floorCoins(gross*(1-feeRate))};
}
function exchangeBankCurrency(from,to,amount){
  const value=floorCoins(amount);
  const portId=state.portId;
  if(state.travel||!CURRENCIES[from]||!CURRENCIES[to]||from===to||value<=0){
    toast('Choose two different currencies and a positive amount while docked.','bad'); return false;
  }
  const quote=bankExchangeQuote(from,to,value,portId);
  if(quote.received<0.01){ toast('Enter a larger amount so the exchange returns at least 0.01 coin.','bad'); return false; }
  if((Number(state.wallet.coins[from])||0)+1e-9<value){
    toast('Not enough '+CURRENCIES[from].name+' to exchange.','bad'); return false;
  }
  Economy.removeMoney(currencyCoinsToLegacy(value,from),'Bank Exchange: '+CURRENCIES[from].name,{currency:from});
  Economy.addMoney(currencyCoinsToLegacy(quote.received,to),'Bank Exchange: '+CURRENCIES[to].name,false,{currency:to});
  logEntry('ECONOMY','Exchanged '+fmtMoney(value,from)+' for '+fmtMoney(quote.received,to)+' at '+PORTS_BY_ID[portId].name+
    ' ('+(quote.feeRate*100).toFixed(2)+'% fee, '+fmtMoney(quote.fee,from)+').');
  toast('Received '+fmtMoney(quote.received,to)+' after '+(quote.feeRate*100).toFixed(2)+'% bank fee.','good');
  tutorialAdvance('bank_exchange');
  ui.headerDirty=true;
  ui.viewDirty=true;
  return true;
}
function exchangeAllBankCurrencies(to){
  const portId=state.portId;
  if(state.travel||!CURRENCIES[to]){
    toast('Choose a target currency while docked.','bad'); return false;
  }
  const sources=Object.entries(CURRENCIES).map(([code])=>({
    code,coins:floorCoins(Math.max(0,Number(state.wallet.coins[code])||0)),
  })).filter(source=>source.code!==to&&source.coins>0);
  if(!sources.length){ toast('No other coins are available to exchange.','bad'); return false; }
  const quote=bankExchangeAllQuote(to,portId);
  if(quote.received<0.01){ toast('The exchange returns less than 0.01 coin after fees.','bad'); return false; }
  for(const source of sources){
    state.wallet.coins[source.code]=floorCoins((Number(state.wallet.coins[source.code])||0)-source.coins);

function newMarineFundSeed(){
  const values=new Uint32Array(4);
  if(globalThis.crypto?.getRandomValues) globalThis.crypto.getRandomValues(values);
  else values.set([Date.now()>>>0,Math.floor(performance.now()*1000)>>>0,++_marineFundSeedCounter>>>0,0x9e3779b9]);
  return Array.from(values,value=>value.toString(16).padStart(8,'0')).join('');
}
function createMarinesFunds(day,seed){
  const createdDay=Math.max(1,Math.floor(Number(day)||1));
  return {seed:String(seed||newMarineFundSeed()),products:Object.fromEntries(Object.entries(MARINES_FUND_PRODUCTS).map(([id,product])=>[
    id,{navE4:String(product.initialNavE4),unitsE4:'0',lastAccrualDay:createdDay,regime:null,lastDepositDay:createdDay,
      stats:{deposited:'0',withdrawn:'0',fees:'0',perfCut:'0',exitFees:'0',navHigh:String(product.initialNavE4),navLow:String(product.initialNavE4)},
      history:[{day:createdDay,rateE4:'0',navE4:String(product.initialNavE4)}]},
  ]))};
}
function marineFundHash(seed,id,day,stream){
  const text=String(seed)+'|'+id+'|'+day+'|'+stream;
  let hash=2166136261;
  for(let index=0;index<text.length;index++) hash=Math.imul(hash^text.charCodeAt(index),16777619);
  return hash>>>0;
}
function marineFundDraw(seed,id,day,stream,min,max){
  const range=BigInt(max-min+1);
  return min+Number(BigInt(marineFundHash(seed,id,day,stream))*range/4294967296n);
}
function marineFundRoundNav(navE4,rateE4,cutPercent,feeRateE4){
  const rate=BigInt(rateE4)*(BigInt(rateE4)>0n?100n-BigInt(cutPercent):100n)-BigInt(feeRateE4)*100n;
  const numerator=BigInt(navE4)*(MARINE_FUND_RATE_DENOM+rate);
  const rounded=(numerator+MARINE_FUND_RATE_DENOM/2n)/MARINE_FUND_RATE_DENOM;
  return rounded<1n?1n:rounded;
}
function marineFundAccrueOne(account,id,seed,day){
  const product=MARINES_FUND_PRODUCTS[id];
  let regime=account.regime;
  if(product.weightPercent&&(!regime||day>=regime.endDay)){
    const regimeRate=marineFundDraw(seed,id,day,'regime-rate',product.loRateE4,product.hiRateE4);
    const length=marineFundDraw(seed,id,day,'regime-length',product.regimeDays[0],product.regimeDays[1]);
    regime={rateE4:String(regimeRate),endDay:day+length};
  }
  const dailyRate=marineFundDraw(seed,id,day,'daily-rate',product.loRateE4,product.hiRateE4);
  const weightedRate=BigInt(regime?.rateE4||dailyRate)*BigInt(product.weightPercent)+
    BigInt(dailyRate)*BigInt(100-product.weightPercent);
  const rateE4=product.weightPercent
    ?Number(weightedRate>=0n?(weightedRate+50n)/100n:-((-weightedRate+49n)/100n)):dailyRate;
  const oldNav=BigInt(account.navE4);
  const units=BigInt(account.unitsE4);
  const nextNav=marineFundRoundNav(oldNav,rateE4,product.cutPercent,product.feeRateE4);
  const withoutFee=marineFundRoundNav(oldNav,rateE4,product.cutPercent,0);
  const withoutCut=marineFundRoundNav(oldNav,rateE4,0,product.feeRateE4);
  if(units){
    const feeNav=withoutFee>nextNav?withoutFee-nextNav:0n;
    const cutNav=withoutCut>nextNav?withoutCut-nextNav:0n;
    account.stats.fees=(BigInt(account.stats.fees)+units*feeNav/10000n).toString();
    account.stats.perfCut=(BigInt(account.stats.perfCut)+units*cutNav/10000n).toString();
  }
  account.navE4=nextNav.toString();
  account.lastAccrualDay=day;
  account.regime=regime;
  if(nextNav>BigInt(account.stats.navHigh)) account.stats.navHigh=nextNav.toString();
  if(nextNav<BigInt(account.stats.navLow)) account.stats.navLow=nextNav.toString();
  account.history.push({day,rateE4:String(rateE4),navE4:nextNav.toString()});
  if(account.history.length>120) account.history.splice(0,account.history.length-120);
  return {day,rateE4:String(rateE4),navE4:nextNav.toString()};
}
function marineFundAccrueThrough(account,id,seed,day){
  const summaries=[];
  for(let accrualDay=Math.floor(Number(account.lastAccrualDay)||0)+1;accrualDay<=day;accrualDay++){
    const point=marineFundAccrueOne(account,id,seed,accrualDay);
    if(accrualDay%30===0) summaries.push(point);
  }
  return summaries;
}
function marineFundValue(unitsE4,navE4){ return BigInt(unitsE4)*BigInt(navE4)/MARINE_FUND_VALUE_SCALE; }
function marineFundDepositUnits(amount,navE4){ return BigInt(amount)*MARINE_FUND_VALUE_SCALE/BigInt(navE4); }
function marineFundWithdrawalUnits(amount,navE4){
  const numerator=BigInt(amount)*MARINE_FUND_VALUE_SCALE;

}
function marineFundExitFee(payout,product,day,lastDepositDay){

function marineFundWithdrawalQuote(id,amount,withdrawAll,day,account){

function marineFundFormatPnl(valueE4){
  const value=BigInt(valueE4);
  const absolute=value<0n?-value:value;
  const sign=value>0n?'+':value<0n?'-':'';
  const roundedMdpHundredths=(absolute+50n)/100n;
  const suffixes=[[10n**18n,'Qn'],[10n**15n,'Qa'],[10n**12n,'T'],[10n**9n,'B'],[10n**6n,'M'],[1000n,'k']];
  for(const [scale,suffix] of suffixes){
    if(roundedMdpHundredths>=scale*100n){
      const hundredths=(absolute*100n+scale*5000n)/(scale*10000n);
      return sign+(hundredths/100n).toLocaleString('en-US')+'.'+String(hundredths%100n).padStart(2,'0')+suffix+' MdP';
    }
  }

    String(roundedMdpHundredths%100n).padStart(2,'0')+' MdP';

    'PnL uses signed MdP denominations');

  const nav=1234567n;
  const boughtUnits=marineFundDepositUnits(101n,nav);
  check(marineFundValue(boughtUnits,nav)<=101n,'deposit rounding cannot create MdP');
  const burnedUnits=marineFundWithdrawalUnits(50n,nav);
  check(50n<=marineFundValue(burnedUnits,nav),'withdrawal payout does not exceed burned unit value');
  const balanced=MARINES_FUND_PRODUCTS.balanced;
  check(marineFundExitFee(1000n,balanced,6,0)===5n&&marineFundExitFee(1000n,balanced,7,0)===0n,'lock boundary');
  const resetAccount=createMarinesFunds(1,'selftest-lock').products.balanced;
  resetAccount.lastDepositDay=0;
  marineFundApplyDeposit(resetAccount,100n,marineFundDepositUnits(100n,resetAccount.navE4),10);
  check(resetAccount.lastDepositDay===10&&marineFundExitFee(1000n,balanced,11,resetAccount.lastDepositDay)===5n,
    'new deposit resets the lock timer');

  const migrated=migrateV17toV18({saveVersion:17,gameDay:120,financeCurrencyMigration:true});
  const migratedFunds=sanitizeMarinesFunds(migrated.marinesFunds,120);
  check(migrated.saveVersion===18&&Object.keys(migratedFunds.products).length===6,'v17 save migration');
  const original=createMarinesFunds(1,'selftest-export');
  marineFundAccrueThrough(original.products.alpha,'alpha',original.seed,95);
  const imported=sanitizeMarinesFunds(JSON.parse(JSON.stringify(original)),95);
  for(const id of Object.keys(MARINES_FUND_PRODUCTS)){
    marineFundAccrueThrough(original.products[id],id,original.seed,220);

    check(original.products[id].navE4===imported.products[id].navE4,'export/import NAV path for '+id);
  }

  const targets={reserve:4.6,income:8.3,balanced:12.0,growth:19.6,alpha:27.7,kraken:35.4};
  const monteCarlo={};
  for(const [id,target] of Object.entries(targets)){
    const returns=[];
    for(let run=0;run<1000;run++){
      const seed='mc-'+run;
      const account=createMarinesFunds(1,seed).products[id];
      marineFundAccrueThrough(account,id,seed,360);
      returns.push((Number(account.navE4)/1000000-1)*100);
    }
    const mean=returns.reduce((total,value)=>total+value,0)/returns.length;
    const standardDeviation=Math.sqrt(returns.reduce((total,value)=>total+(value-mean)**2,0)/returns.length);
    const lossProbability=returns.filter(value=>value<0).length/returns.length;
    check(Math.abs(mean-target)<=Math.abs(target)*0.1,'Monte Carlo mean for '+id);
    monteCarlo[id]={mean:+mean.toFixed(2),standardDeviation:+standardDeviation.toFixed(2),lossProbability:+lossProbability.toFixed(3)};
    if(id==='kraken') check(Math.abs(standardDeviation-54)<=5.4&&Math.abs(lossProbability-0.29)<=0.05,'Kraken risk profile');
  }
  console.table(monteCarlo);

    total+portCoinsToLegacy(Number(account.balance)||0,portId),0);
}
function totalBondCouponsLegacy(){

function totalPortTaxes(){

    total+Math.max(0,(Number(stats.taxPaid)||0)-(Number(stats.taxRefunded)||0)),0);

function initialBondSupply(){
  const supply={};
  for(const [portId,market] of Object.entries(BOND_CITY_MARKETS)){
    supply[portId]={};
    for(const term of BOND_TERMS){
      supply[portId][term.years]=market.unitsPerTerm[term.years];
    }
  }
  return supply;
}
function initialBondSupplyLimit(){
  return Object.fromEntries(Object.entries(BOND_CITY_MARKETS).map(([portId,market])=>[
    portId,{...market.unitsPerTerm},
  ]));
}
function returnBondSupply(portId,years,units){
  if(!state.bondSupply?.[portId]||!BOND_TERMS.some(term=>term.years===Number(years))) return;
  const limit=Number(state.bondSupplyLimit?.[portId]?.[years])||BOND_CITY_MARKETS[portId].unitsPerTerm[years];
  const current=Number(state.bondSupply[portId][years])||0;
  state.bondSupply[portId][years]=Math.min(limit,current+Math.max(0,Math.floor(units)));
}
function evaluateBondSupply(){
  const discrepancies=[];
  for(const [portId,market] of Object.entries(BOND_CITY_MARKETS)){
    for(const term of BOND_TERMS){
      const years=term.years;
      const limit=Math.max(0,Math.floor(Number(state.bondSupplyLimit?.[portId]?.[years])||market.unitsPerTerm[years]));
      const active=state.bonds.filter(bond=>bond.portId===portId&&Number(bond.years)===years)
        .reduce((total,bond)=>total+Math.max(0,Math.floor(Number(bond.units)||0)),0);
      const pending=state.bondOrders.filter(order=>order.kind==='buy'&&order.portId===portId&&Number(order.years)===years)
        .reduce((total,order)=>total+Math.max(0,Math.floor(Number(order.units)||0)),0);
      const expected=Math.max(0,limit-active-pending);
      const current=Math.max(0,Math.floor(Number(state.bondSupply?.[portId]?.[years])||0));
      if(current!==expected){
        discrepancies.push({portId,years,current,expected});
        state.bondSupply[portId][years]=expected;
      }
    }
  }
  if(discrepancies.length){
    const summary=discrepancies.slice(0,4).map(item=>PORTS_BY_ID[item.portId].name+' '+item.years+'y: '+item.current+' → '+item.expected).join('; ');
    logEntry('ECONOMY','Bond supply evaluation reconciled '+discrepancies.length+' term(s): '+summary+'.');
    toast('Bond supply reconciled for '+discrepancies.length+' term(s). '+summary,'good');
  } else {
    logEntry('ECONOMY','Bond supply evaluation found no discrepancies.');
    toast('Bond supply is consistent with outstanding and pending bonds.','good');
  }
  ui.viewDirty=true;
  return discrepancies;
}
function bondAnnualRate(years,portId){
  const portRate=portId&&BOND_CITY_MARKETS[portId]&&BOND_CITY_MARKETS[portId].rates[Number(years)];
  if(portRate!==undefined) return portRate;
  return 0;
}

function portEconomicEfficiency(portId){
  const governance=portGovernance(portId);
  return Math.exp(-10*(governance.tradeTaxRate+governance.populationTaxRate));
}
function portBondAnnualInterest(portId){
  const market=BOND_CITY_MARKETS[portId];
  if(!market) return 0;
  return BOND_TERMS.reduce((total,term)=>total+
    (Number(state?.bondSupplyLimit?.[portId]?.[term.years])||market.unitsPerTerm[term.years])*
      market.price*market.rates[term.years],0);
}
function portMonthlyBondIncome(portId){ return portBondAnnualInterest(portId)*0.10/12; }
function recalculatePortBondAccrual(portId){
  const governance=state.portGovernance?.[portId];
  if(!governance) return;
  const elapsedDays=clamp(Math.floor(state.gameDay)-Math.floor(governance.lastPayoutDay||0),0,30);
  governance.monthlyAccrual.bonds=portMonthlyBondIncome(portId)*elapsedDays/30;
}
function portMonthlyRevenueEstimate(portId){
  const port=PORTS_BY_ID[portId];
  const governance=portGovernance(portId);
  const profile=PORT_GOVERNANCE_PROFILE[port.size];
  const market=generateMarket(portId,Math.floor(state.gameDay));
  const dailyMarketValue=Object.values(market.prices).reduce((total,entry)=>total+entry.price*entry.stock,0);
  const efficiency=portEconomicEfficiency(portId);
  const dailyVisitors=(profile.visitors[0]+profile.visitors[1])/2;
  const visitorFee=(profile.visitorFee[0]+profile.visitorFee[1])/2;
  const dailyShips=(profile.ships[0]+profile.ships[1])/2;
  const shipFee=(profile.shipFee[0]+profile.shipFee[1])/2;
  return (portMonthlyBondIncome(portId)+
    legacyToCoins(dailyMarketValue*governance.tradeTaxRate*efficiency*30,currencyForPort(portId))+
    legacyToCoins(governance.population*1000*portPopulationValueMultiplier(portId)*governance.populationTaxRate/12,currencyForPort(portId))+
    legacyToCoins(dailyVisitors*visitorFee*efficiency*(1+portUpgradeLevel(portId,'port')*0.15)*30,currencyForPort(portId))+
    legacyToCoins(dailyShips*shipFee*efficiency*(1+portUpgradeLevel(portId,'market')*0.03+portUpgradeLevel(portId,'port')*0.15)*30,currencyForPort(portId)))*
    (port.revenueMultiplier||1);
}
function optimizePortTaxes(portId){
  const governance=portGovernance(portId);
  const size=PORTS_BY_ID[portId].size;
  const tierIndex={'Small':0,'Medium':1,'Large':2,'Extra Large':3}[size]||0;
  const profile=PORT_GOVERNANCE_PROFILE[size];
  const market=generateMarket(portId,Math.floor(state.gameDay));
  const marketValue=Object.values(market.prices).reduce((total,entry)=>total+entry.price*entry.stock,0);
  const capacityScale=Math.log10(1+marketValue/profile.population[0]);
  const tradeElasticity=30-tierIndex*2+Math.max(0,capacityScale-2)*1.5;
  const populationElasticity=50-tierIndex*3;
  governance.tradeTaxRate=clamp(1/tradeElasticity,0.02,0.055);
  governance.populationTaxRate=clamp(1/populationElasticity,0.01,0.03);
  logEntry('ECONOMY','Optimized '+PORTS_BY_ID[portId].name+' tax rates to '+
    (governance.tradeTaxRate*100).toFixed(2)+'% trade and '+(governance.populationTaxRate*100).toFixed(2)+'% population tax.');
  ui.viewDirty=true;
}
function bribePortPoliticians(portId){
  if(PORTS_BY_ID[portId]?.allowBribes===false){ toast('Bribes are not allowed at this port.','bad'); return false; }
  const governance=portGovernance(portId);
  if(!governance.controlled||governance.rebelled){ toast('Politicians can only be bribed in a controlled port.','bad'); return false; }
  if(governance.bribeUntilDay>state.gameDay){ toast('The politicians are already bribed.'); return false; }
  const cost=Math.max(1,Math.round(portMonthlyRevenueEstimate(portId)*0.25));
  if(!portCanAfford(cost,portId)){ toast('The bribe requires '+fmtPortCoins(cost,portId)+' in '+CURRENCIES[currencyForPort(portId)].name+'. Exchange funds at a bank.','bad'); return false; }
  portRemoveCoins(cost,'Port Politician Bribe: '+PORTS_BY_ID[portId].name,portId);
  governance.bribeUntilDay=Number.MAX_SAFE_INTEGER;
  logEntry('ECONOMY','Paid '+fmtPortCoins(cost,portId)+' to politicians in '+PORTS_BY_ID[portId].name+'. Rebellion risk reduced permanently.');
  toast('Politicians bribed permanently.','good');
  ui.viewDirty=true;
  return true;
}
function relinquishPortControl(portId){
  const governance=state.portGovernance&&state.portGovernance[portId];
  if(!PORTS_BY_ID[portId]||!governance||!governance.controlled||governance.rebelled||governance.marineSale){
    toast('Only a controlled port can be relinquished.','bad'); return false;
  }
  if(!confirm('Relinquish control of '+PORTS_BY_ID[portId].name+'? Reputation will fall sharply and wanted level will be cleared. Stored assets and accrued revenue will remain.')) return false;
  governance.controlled=false;
  governance.bribeUntilDay=0;
  const reputationLoss=Math.max(20,Math.ceil(state.reputation*0.4));
  state.reputation=Math.max(0,state.reputation-reputationLoss);
  state.wantedLevel=0;
  logEntry('EVENT','Relinquished control of '+PORTS_BY_ID[portId].name+'. Reputation -'+reputationLoss+'; wanted level cleared.');
  toast('Port relinquished. Reputation -'+reputationLoss+'; wanted level cleared.','bad');
  ui.viewDirty=true;
  ui.headerDirty=true;
  return true;
}
function portFrozenAssetValue(portId){
  const ships=state.ships.filter(ship=>ship.locationId===portId&&ship.status==='idle')
    .reduce((total,ship)=>total+shipType(ship).value*(SHIP_RARITY_BY_ID[ship.rarity]||SHIP_RARITIES[0]).multiplier,0);
  const savings=Number(bankAccount(portId).balance)||0;
  const bonds=state.bonds.filter(bond=>bond.portId===portId)
    .reduce((total,bond)=>total+bond.units*(Number(bond.principalPerShare)||Number(bond.pricePerShare)||0),0);
  return legacyToCoins(ships,currencyForPort(portId))+savings+bonds;
}
function portRansomCost(portId){ return Math.round(portFrozenAssetValue(portId)*0.05); }
function payPortRansom(portId){
  if(!portIsRebelled(portId)){ toast('This port is not in rebellion.'); return false; }
  const cost=portRansomCost(portId);
  if(!portCanAfford(cost,portId)){ toast('Ransom requires '+fmtPortCoins(cost,portId)+'. Exchange funds at a bank.','bad'); return false; }
  if(cost) portRemoveCoins(cost,'Port Ransom: '+PORTS_BY_ID[portId].name,portId);
  const governance=portGovernance(portId);
  governance.rebelled=false;
  governance.controlled=true;
  logEntry('EVENT','Paid '+fmtPortCoins(cost,portId)+' ransom to restore control of '+PORTS_BY_ID[portId].name+' and recover its frozen assets.');
  toast(PORTS_BY_ID[portId].name+' is back under your control.','good');
  ui.viewDirty=true;
  return true;
}
function updatePortGovernanceDaily(day){
  for(const port of PORTS){
    const governance=portGovernance(port.id);
    if(!governance.controlled||governance.rebelled||day<=governance.lastRevenueDay) continue;
    const profile=PORT_GOVERNANCE_PROFILE[port.size];
    const efficiency=portEconomicEfficiency(port.id);
    const revenueMultiplier=port.revenueMultiplier||1;
    const market=generateMarket(port.id,day);
    const dailyMarketValue=Object.values(market.prices).reduce((total,entry)=>total+entry.price*entry.stock,0);
    governance.monthlyAccrual.trade+=legacyToCoins(dailyMarketValue*governance.tradeTaxRate*efficiency*revenueMultiplier,currencyForPort(port.id));
    governance.monthlyAccrual.population+=legacyToCoins(governance.population*1000*portPopulationValueMultiplier(port.id)*
      governance.populationTaxRate/360*revenueMultiplier,currencyForPort(port.id));
    const visitors=Math.round((profile.visitors[0]+Math.floor(rng(port.id,day,'visitors')*(profile.visitors[1]-profile.visitors[0]+1)))*
      (1+portUpgradeLevel(port.id,'port')*0.15));
    const visitorFee=profile.visitorFee[0]+Math.floor(rng(port.id,day,'visitor-fee')*(profile.visitorFee[1]-profile.visitorFee[0]+1));
    const shipTraffic=Math.round((profile.ships[0]+Math.floor(rng(port.id,day,'ship-traffic')*(profile.ships[1]-profile.ships[0]+1)))*
      (1+portUpgradeLevel(port.id,'market')*0.03+portUpgradeLevel(port.id,'port')*0.15));
    const shipFee=profile.shipFee[0]+Math.floor(rng(port.id,day,'ship-fee')*(profile.shipFee[1]-profile.shipFee[0]+1));
    governance.monthlyAccrual.tolls+=legacyToCoins(visitors*visitorFee*efficiency*revenueMultiplier,currencyForPort(port.id));
    governance.monthlyAccrual.shipFees+=legacyToCoins(shipTraffic*shipFee*efficiency*revenueMultiplier,currencyForPort(port.id));
    governance.monthlyAccrual.bonds+=portMonthlyBondIncome(port.id)/30*revenueMultiplier;
    governance.lastRevenueDay=day;
    if(day-governance.lastPopulationDay>=30){
      const populationMax=portPopulationCapacity(port.id);
      const capacity=profile.population[0]+Math.floor(rng(port.id,day,'population')*
        (populationMax-profile.population[0]+1));
      governance.population=clamp(Math.round(capacity*efficiency),profile.population[0],populationMax);
      governance.lastPopulationDay=day;
    }
    if(day-governance.lastPayoutDay>=30){
      const revenue=floorCoins(Object.values(governance.monthlyAccrual).reduce((total,value)=>total+value,0));
      if(revenue) portAddCoins(revenue,'Monthly Port Revenue: '+port.name,port.id);
      governance.monthlyPaid=revenue;
      governance.lifetimeRevenue+=revenue;
      governance.monthlyAccrual={trade:0,population:0,tolls:0,shipFees:0,bonds:0};
      governance.lastPayoutDay=day;
      logEntry('ECONOMY',port.name+' paid monthly port revenue of '+fmtPortCoins(revenue,port.id)+'.');
    }
    const present=state.portId===port.id&&!state.travel;
    if(present) continue;
    const fullyUpgraded=PORT_UPGRADES.every(upgrade=>
      portUpgradeLevel(port.id,upgrade.id)>=PORT_UPGRADE_MAX_LEVEL);
    if(fullyUpgraded&&governance.bribeUntilDay>day) continue;
    const excessTax=Math.max(0,governance.tradeTaxRate+governance.populationTaxRate-0.05);
    const taxPressure=Math.exp(excessTax*30);
    const bribeFactor=governance.bribeUntilDay>day?0.05:1;
    const chance=clamp(profile.rebellion*(port.rebellionChanceMultiplier||1)*taxPressure*bribeFactor,0,1);
    if(Math.random()<chance){
      governance.rebelled=true;
      logEntry('EVENT',port.name+' rebelled against your rule. Its bank funds, docked ships and bonds are frozen until ransom is paid.');
      toast(port.name+' has rebelled. Port access and revenue are suspended.','bad');
      ui.viewDirty=true;
    }
  }
}

function fleetAssetValue(){
  return state.ships.reduce((total,ship)=>{
    const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
    return total + shipType(ship).value * rarity.multiplier;
  },0);
}
function merchantLoanTerms(portId){
  const port=PORTS_BY_ID[portId];
  const currency=currencyForPort(portId);
  const limitMultiplier=port?.loanLimitMultiplier||1;
  const maxPrincipal=legacyToCoins(BANKING.maxPrincipal,currency)*limitMultiplier;
  return {
    maxPrincipal,
    creditLimit:Math.min(maxPrincipal,
      legacyToCoins(BANKING.minCredit+state.reputation*2000+0.4*fleetAssetValue(),currency)*limitMultiplier),
    interestRate:port?.loanInterestRate??BANKING.interestRate,
    termDays:port?.loanTermDays||BANKING.termDays,
  };
}
function creditLimit(){
  return merchantLoanTerms(state.portId).creditLimit;
}

function borrowFromMerchant(amount){
  const terms=merchantLoanTerms(state.portId);
  const principal=floorCoins(amount);
  if(state.bankLoan){ toast('Repay your current merchant loan before borrowing again.','bad'); return false; }
  const limit = creditLimit();
  if(principal<0.01||principal>terms.maxPrincipal){ toast('Enter a loan amount from 0.01 to '+fmtPortCoins(terms.maxPrincipal,state.portId)+'.','bad'); return false; }
  if(principal > limit){ toast('Loan limit exceeded: '+fmtPortCoins(limit,state.portId)+'.','bad'); return false; }
  const interest=floorCoins(principal*terms.interestRate);
  const totalDue=principal+interest;
  portAddCoins(principal,'Merchant Loan',state.portId);
  const dueDay = state.gameDay + terms.termDays;
  state.bankLoan={principal,interest,totalDue,remaining:totalDue,borrowedDay:state.gameDay,dueDay,
    originPortId:state.portId,principalLimit:terms.maxPrincipal,interestRate:terms.interestRate,termDays:terms.termDays,
    nextLateFeeDay:dueDay + BANKING.lateFeeIntervalDays,feesCharged:0,warned:false};
  logEntry('ECONOMY','Borrowed '+fmtPortCoins(principal,state.portId)+' from a merchant. Due day '+Math.floor(dueDay)+', fixed interest: '+fmtPortCoins(interest,state.portId)+'.');
  toast('Merchant loan received: '+fmtPortCoins(principal,state.portId)+'. Credit limit '+fmtPortCoins(limit,state.portId)+'. Total repayment: '+fmtPortCoins(totalDue,state.portId)+'.','good');
  ui.viewDirty=true;
  return true;
}

function repayMerchantLoan(amount){
  const loan=state.bankLoan;
  if(!loan){ toast('There is no active merchant loan.'); return false; }
  const requested=floorCoins(amount);
  if(requested<0.01){ toast('Enter a repayment amount of at least 0.01.','bad'); return false; }
  const portId=loan.originPortId||state.portId;
  const payment=Math.min(requested,portWalletBalance(portId),loan.remaining);
  if(payment<0.01){ toast('No available '+CURRENCIES[currencyForPort(portId)].name+' to repay the loan. Exchange funds at a bank.','bad'); return false; }
  portRemoveCoins(payment,'Merchant Loan Repayment',portId);
  logEntry('ECONOMY','Repaid '+fmtPortCoins(payment,portId)+' to the merchant. Remaining balance: '+fmtPortCoins(loan.remaining,portId)+'.');
  loan.remaining-=payment;
  if(loan.remaining<=0){ state.bankLoan=null; toast('Merchant loan fully repaid.','good'); }
  else toast('Loan repayment: '+fmtPortCoins(payment,portId)+'. Balance: '+fmtPortCoins(loan.remaining,portId)+'.','good');
  ui.viewDirty=true;
  return true;
}

function depositSavings(amount){
  if(portIsRebelled(state.portId)){ toast('Savings are frozen while this port is in rebellion.','bad'); return false; }
  const value=floorCoins(amount);
  if(value<0.01){ toast('Enter a deposit of at least 0.01.','bad'); return false; }

  portRemoveCoins(value,'Savings Deposit',state.portId);

  toast('Savings deposit: '+fmtPortCoins(value,state.portId)+'.','good');
  ui.viewDirty=true;
  return true;
}

function withdrawSavings(amount){
  if(portIsRebelled(state.portId)){ toast('Savings are frozen while this port is in rebellion.','bad'); return false; }
  const value=floorCoins(amount);
  accrueSavings(state.gameDay,state.portId);
  const account=bankAccount(state.portId);
  const balance=Number(account.balance)||0;
  if(value<0.01||value>balance){ toast('Enter a withdrawal within your savings balance.','bad'); return false; }
  account.balance=floorCoins(account.balance-value);
  portAddCoins(value,'Savings Withdrawal',state.portId);
  logEntry('ECONOMY','Withdrew '+fmtPortCoins(value,state.portId)+' from the '+PORTS_BY_ID[state.portId].name+' bank.');
  toast('Savings withdrawal: '+fmtPortCoins(value,state.portId)+'.','good');
  ui.viewDirty=true;
  return true;
}

function withdrawBondCoupons(amount){
  const requested=floorCoins(amount);
  const portId=state.portId;
  const balance=Number(state.bondCouponFunds?.[portId])||0;
  if(requested<0.01||requested>balance){ toast('Enter a withdrawal within your bond coupon funds.','bad'); return false; }
  const tax=floorCoins(requested*bondCouponTaxRate(portId));
  const net=floorCoins(requested-tax);
  state.bondCouponFunds[portId]=floorCoins(state.bondCouponFunds[portId]-requested);
  portBankingStats(portId).bondCouponsWithdrawn+=requested;
  recordPortTax(portId,tax,'bondCouponTax');
  if(net>0) portAddCoins(net,'Bond Coupon Withdrawal',portId);
  logEntry('ECONOMY','Withdrew '+fmtPortCoins(requested,portId)+' in bond coupons; '+fmtPortCoins(tax,portId)+' tax paid, '+fmtPortCoins(net,portId)+' transferred to wallet.');
  toast('Bond coupons withdrawn: '+fmtPortCoins(net,portId)+' after '+fmtPortCoins(tax,portId)+' tax.','good');
  ui.viewDirty=true;
  return true;
}

function placeBondOrder(portId,years,units){
  const port=PORTS_BY_ID[portId],market=BOND_CITY_MARKETS[portId];
  const term=BOND_TERMS.find(item=>item.years===Number(years));
  const quantity=Math.floor(Number(units)||0);
  if(state.travel||!port||state.portId!==portId||portIsClosed(portId)||!market||!term||quantity<1){
    toast('Bonds can only be ordered at an eligible city.','bad'); return false;
  }
  const cost=market.price*quantity;
  if(!portCanAfford(cost,portId)){ toast('Not enough '+CURRENCIES[currencyForPort(portId)].name+' for this bond order. Exchange funds at a bank.','bad'); return false; }
  const remaining=state.bondSupply[portId][term.years];
  if(quantity>remaining){
    toast('Only '+remaining+' bond share(s) remain for this term.','bad'); return false;
  }
  portRemoveCoins(cost,'Bond Purchase: '+port.name,portId);
  state.bondSupply[portId][term.years]-=quantity;
  const order={id:uid('bondorder'),kind:'buy',portId,years:term.years,rate:bondAnnualRate(term.years,portId),
    units:quantity,pricePerShare:market.price,placedDay:state.gameDay,
    settleDay:state.gameDay+rndInt(BANKING.purchaseDelay[0],BANKING.purchaseDelay[1])};
  state.bondOrders.push(order);
  logEntry('ECONOMY','Placed an order for '+quantity+' '+term.years+'-year bond share(s) in '+port.name+'.');
  toast('Bond purchase queued. Settlement in '+Math.ceil(order.settleDay-state.gameDay)+' days.','good');
  ui.viewDirty=true;
  return true;
}

function issueAndBuyBonds(portId,years,units){
  const port=PORTS_BY_ID[portId],market=BOND_CITY_MARKETS[portId];
  const term=BOND_TERMS.find(item=>item.years===Number(years));
  const quantity=Math.floor(Number(units)||0);
  if(!port||!market||!term||quantity<1||state.travel||state.portId!==portId||
    !portIsControlled(portId)||portIsClosed(portId)){
    toast('Direct bond purchases require an open controlled port where you are docked.','bad'); return false;
  }
  const cost=market.price*quantity;
  if(!Number.isFinite(cost)||!portCanAfford(cost,portId)){
    toast('Not enough '+CURRENCIES[currencyForPort(portId)].name+' for this direct bond purchase. Exchange funds at a bank.','bad'); return false;
  }
  portRemoveCoins(cost,'Direct Bond Purchase: '+port.name,portId);
  state.bondSupplyLimit[portId][term.years]+=quantity;
  state.bondSupply[portId][term.years]+=quantity;
  const startDay=state.gameDay;
  state.bonds.push({id:uid('bond'),portId,years:term.years,
    rate:bondAnnualRate(term.years,portId),units:quantity,pricePerShare:market.price,
    principalPerShare:market.price,startDay,lastCouponDay:startDay,
    nextCouponDay:startDay+BANKING.bondCouponPeriodDays,
    maturityDay:startDay+term.years*BANKING.daysPerYear});
  state.bondSupply[portId][term.years]-=quantity;
  recalculatePortBondAccrual(portId);
  logEntry('ECONOMY','Directly purchased '+quantity+' '+term.years+'-year bond share(s) in controlled '+port.name+'.');
  toast('Purchased '+quantity+' bond share(s) directly. The city bond limit permanently increased by '+quantity+'.','good');
  ui.viewDirty=true;
  return true;
}

function placeBondSale(bondId,units){
  const bond=state.bonds.find(item=>item.id===bondId);
  if(bond&&portIsRebelled(bond.portId)){ toast('Bond trading is suspended while its port is in rebellion.','bad'); return false; }
  const quantity=Math.floor(Number(units)||0);
  const alreadySelling=state.bondOrders.filter(order=>order.kind==='sell'&&order.bondId===bondId)
    .reduce((total,order)=>total+order.units,0);
  if(!bond||quantity<1||quantity>bond.units-alreadySelling){
    toast('Enter a sale quantity within the available bond shares.','bad'); return false;
  }
  const order={id:uid('bondorder'),kind:'sell',bondId,units:quantity,
    placedDay:state.gameDay,
    settleDay:state.gameDay+rndInt(BANKING.saleDelay[0],BANKING.saleDelay[1])};
  state.bondOrders.push(order);
  logEntry('ECONOMY','Placed a sale order for '+quantity+' bond share(s).');
  toast('Bond sale queued. Settlement in '+Math.ceil(order.settleDay-state.gameDay)+' days.','good');
  ui.viewDirty=true;
  return true;
}

function bondValue(bond){
  return bond.principalPerShare*bond.units;
}

function settleBondOrder(order,day){
  if(order.kind==='buy'){
    const startDay=Math.max(day,order.settleDay);
    state.bonds.push({id:uid('bond'),portId:order.portId,years:order.years,rate:order.rate,
      units:order.units,pricePerShare:order.pricePerShare,principalPerShare:order.pricePerShare,
      startDay,lastCouponDay:startDay,nextCouponDay:startDay+BANKING.bondCouponPeriodDays,
      maturityDay:startDay+order.years*BANKING.daysPerYear});
    logEntry('ECONOMY',order.units+' bond share(s) settled in '+PORTS_BY_ID[order.portId].name+'.');
    toast('Bond purchase settled.','good');
    return;
  }
  const bond=state.bonds.find(item=>item.id===order.bondId);
  if(!bond) return;
  const payout=Math.round(bondValue(bond)*order.units/bond.units);
  returnBondSupply(bond.portId,bond.years,order.units);
  bond.units-=order.units;
  if(bond.units<=0) state.bonds=state.bonds.filter(item=>item.id!==bond.id);
  portAddCoins(payout,'Bond Sale Settlement',bond.portId);
  logEntry('ECONOMY','Bond sale settled for '+fmtPortCoins(payout,bond.portId)+'.');
  toast('Bond sale settled: '+fmtPortCoins(payout,bond.portId)+'.','good');
}

function accrueSavings(day,portId){
  const accounts=portId?[[portId,bankAccount(portId)]]:Object.entries(state.bankAccounts||{});
  for(const [accountPortId,account] of accounts){
    if(portIsRebelled(accountPortId)){
      account.lastAccrualDay=day;
      continue;
    }
    const previousDay=Number(account.lastAccrualDay);
    const elapsed=Math.max(0,day-(Number.isFinite(previousDay)?previousDay:day));
    const periods=Math.floor(elapsed/BANKING.savingsPeriodDays);
    if(periods<=0) continue;
    if(account.balance>0){
      const annualFraction=periods*BANKING.savingsPeriodDays/BANKING.daysPerYear;
      const grossInterest=account.balance*(Math.pow(1+bankSavingsRate(accountPortId),annualFraction)-1);
      const tax=floorCoins(grossInterest*bankSavingsTaxRate(accountPortId));
      const netInterest=grossInterest-tax;
      account.balance=floorCoins(account.balance+netInterest);
      const stats=portBankingStats(accountPortId);
      stats.savingsInterestEarned+=grossInterest;
      recordPortTax(accountPortId,tax,'savingsInterestTax');
      if(tax>0){
        logEntry('ECONOMY','Savings interest tax paid at '+PORTS_BY_ID[accountPortId].name+': '+fmtPortCoins(tax,accountPortId)+'.');
      }
    }
    account.lastAccrualDay=previousDay+periods*BANKING.savingsPeriodDays;
  }
}

function processBankingCoupons(day){
  for(const bond of state.bonds){
    while(bond.nextCouponDay<=day+1e-9&&bond.nextCouponDay<=bond.maturityDay){
      const coupon=floorCoins(bond.principalPerShare*bond.units*bond.rate/2);
      const market=BOND_CITY_MARKETS[bond.portId];
      if(portIsRebelled(bond.portId)){
        logEntry('ECONOMY','Bond coupon from '+PORTS_BY_ID[bond.portId].name+' was forfeited during the rebellion.');
      } else if(Math.random()<(market?.couponMissChance||0)){
        logEntry('ECONOMY','Bond coupon of '+fmtPortCoins(coupon,bond.portId)+' from '+PORTS_BY_ID[bond.portId].name+
          ' was not paid by the issuer.');
      } else {
        state.bondCouponFunds[bond.portId]=floorCoins((Number(state.bondCouponFunds[bond.portId])||0)+coupon);
        portBankingStats(bond.portId).bondCouponsEarned+=coupon;
        logEntry('ECONOMY','Bond coupon of '+fmtPortCoins(coupon,bond.portId)+' from '+PORTS_BY_ID[bond.portId].name+
          ' was credited to its local coupon funds.');
      }
      bond.lastCouponDay=bond.nextCouponDay;
      bond.nextCouponDay+=BANKING.bondCouponPeriodDays;
      ui.viewDirty=true;
    }
  }
}

function processBankingDaily(day){
  accrueSavings(day);
  for(const bond of state.bonds.slice()){
    if(day<bond.maturityDay) continue;
    const principal=floorCoins(bond.principalPerShare*bond.units);
    returnBondSupply(bond.portId,bond.years,bond.units);
    state.bonds=state.bonds.filter(item=>item.id!==bond.id);
    state.bondOrders=state.bondOrders.filter(order=>order.kind!=='sell'||order.bondId!==bond.id);
    if(portIsRebelled(bond.portId)){
      logEntry('ECONOMY',bond.units+' bond share(s) matured in rebellious '+PORTS_BY_ID[bond.portId].name+'; principal was seized.');
    } else {
      portAddCoins(principal,'Matured Bond Principal: '+PORTS_BY_ID[bond.portId].name,bond.portId);
      logEntry('ECONOMY',bond.units+' bond share(s) matured; principal returned: '+fmtPortCoins(principal,bond.portId)+'.');
      toast('Bond matured. Principal returned: '+fmtPortCoins(principal,bond.portId)+'.','good');
    }
  }
  for(let index=state.bondOrders.length-1;index>=0;index--){
    const order=state.bondOrders[index];
    if(day<order.settleDay) continue;
    state.bondOrders.splice(index,1);
    settleBondOrder(order,day);
  }
  ui.viewDirty=true;
}

function processMarineFinanceDaily(day){
  if(!state.marinesFunds) state.marinesFunds=createMarinesFunds(day-1);
  for(const [id,account] of Object.entries(state.marinesFunds.products)){
    const summaries=marineFundAccrueThrough(account,id,state.marinesFunds.seed,day);
    for(const point of summaries){
      logEntry('ECONOMY',MARINES_FUND_PRODUCTS[id].name+' 30-day summary: NAV '+
        (Number(point.navE4)/10000).toFixed(4)+' MdP, rate '+(Number(point.rateE4)/10000).toFixed(2)+'% p.a.',{day:point.day});
    }
  }
  while(day>=state.marineBondQuoteDay){
    for(const issuer of Object.keys(MARINE_BOND_ISSUERS)){
      const current=marineBondMarketPrice(issuer);
      state.marineBondPrices[issuer]=clamp(Math.round(current+(MARINE_BOND.faceValue-current)*0.15+rnd(-35,35)),
        MARINE_BOND.minPrice,MARINE_BOND.maxPrice);
    }
    state.marineBondQuoteDay+=MARINE_BOND.quoteDays;
    ui.viewDirty=true;
  }
  if(!isMarineDetained()) for(const bond of state.marineBonds.slice()){
    const issuer=marineBondIssuer(bond.issuer);
    while(bond.nextCouponDay<=day+1e-9&&bond.nextCouponDay<=bond.maturityDay){
      if(bond.issuer==='marine'){
        const numerator=BigInt(bond.shares)*BigInt(Math.round(MARINE_BOND.faceValue*bond.annualRate*1000))+
          BigInt(Math.max(0,Math.floor(Number(bond.couponRemainder)||0)));
        const coupon=numerator/12000n;
        bond.couponRemainder=Number(numerator%12000n);
        if(coupon) Economy.addMdP(coupon,'Marine Bond Coupon');
        logEntry('ECONOMY','Marine Bond coupon paid: '+coupon+' MdP; fractional coupon carried forward.');
      } else {
        const coupon=silverToCoinsAtDay(MARINE_BOND.faceSilverG*bond.annualRate/12*bond.shares,
          issuer.currency,bond.nextCouponDay);
        Economy.addMoney(currencyCoinsToLegacy(coupon,issuer.currency),'Country Bond Coupon: '+issuer.name,false,{currency:issuer.currency});
        logEntry('ECONOMY',issuer.name+' Bond coupon paid: '+fmtMoney(coupon,issuer.currency)+'.');
      }
      bond.nextCouponDay+=MARINE_BOND.couponDays;
    }
    if(day>=bond.maturityDay){
      state.marineBonds=state.marineBonds.filter(item=>item.id!==bond.id);
      if(bond.issuer==='marine'){
        const principal=BigInt(bond.shares)*BigInt(MARINE_BOND.faceValue);
        Economy.addMdP(principal,'Matured Marine Bond Principal');
        logEntry('ECONOMY',bond.shares+' Marine Bond share(s) matured; principal returned: '+principal+' MdP.');
        toast('Marine Bonds matured. Principal returned: '+principal+' MdP.','good');
      } else {
        const principal=silverToCoinsAtDay(MARINE_BOND.faceSilverG*bond.shares,issuer.currency,bond.maturityDay);
        Economy.addMoney(currencyCoinsToLegacy(principal,issuer.currency),'Matured '+issuer.name+' Bond Principal',false,{currency:issuer.currency});
        logEntry('ECONOMY',bond.shares+' '+issuer.name+' Bond share(s) matured; principal returned: '+fmtMoney(principal,issuer.currency)+'.');
        toast(issuer.name+' Bonds matured. Principal returned: '+fmtMoney(principal,issuer.currency)+'.','good');
      }
    }
  }
  for(const port of PORTS){
    const governance=portGovernance(port.id);
    const sale=governance.marineSale;
    if(!sale||day<sale.settleDay) continue;
    if(!governance.controlled||governance.rebelled){
      governance.marineSale=null;
      logEntry('EVENT','Marine sale of '+port.name+' was cancelled because control was lost during negotiations.');
      continue;
    }
    if(sale.outcome==='pending'&&Math.random()>=sale.successChance){
      governance.marineSale=null;
      const wantedIncrease=Math.max(5,Math.ceil(state.wantedLevel*0.2));
      addWanted(wantedIncrease,'failed Marine port-sale negotiation');
      logEntry('EVENT','Marine port-sale negotiation failed for '+port.name+' at '+fmtWalletValue(sale.offer)+
        '. Wanted +'+wantedIncrease+'.');
      toast('Marine negotiation failed. Wanted +'+wantedIncrease+'.','bad');
      ui.headerDirty=true; ui.viewDirty=true;
      continue;
    }
    governance.marineSale=null;
    governance.controlled=false;
    governance.bribeUntilDay=0;
    governance.marineOwned=true;
    governance.upgrades=PORT_UPGRADES.reduce((levels,upgrade)=>{
      levels[upgrade.id]=1;
      return levels;
    },{});
    grantMarineBonds(sale.shares);
    state.reputation=clamp(state.reputation+20,0,1000);
    const wantedIncrease=Math.max(10,Math.ceil(state.wantedLevel*0.25));
    addWanted(wantedIncrease,'selling a port to the Marines');
    logEntry('EVENT','Sold '+port.name+' to the Marines for '+sale.shares+' Marine Bond share(s). Port upgrades reset to level 1, Marine garrison doubled, and city bonds retained. Reputation +20; wanted +'+wantedIncrease+'.');
    toast(port.name+' sold. Upgrades reset to level 1; Marine garrison doubled. City bonds remain.','good');
    ui.headerDirty=true; ui.viewDirty=true;
  }
}

function computeSalary(roleId, level, skill, traits){
  const role = ROLE_BY_ID[roleId];
  let s = role.baseSalary * (1 + (level-1)*0.15);
  s *= (1 + (skill-50)/200);
  for(const tid of (traits||[])){
    const tr = TRAIT_BY_ID[tid];
    if(tr && tr.salaryMul) s *= (1 + tr.salaryMul);
  }
  return Math.max(20, Math.round(s));
}

/* ---------------------------------------------------------------------------

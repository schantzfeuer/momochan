function raidReputationTier(){ return clamp(1+Math.floor(state.reputation/30),1,12); }
const RAID_RESERVE_HIGH_REP_THRESHOLD=999;
const RAID_RESERVE_HIGH_REP_WEIGHT_MULTIPLIER=20;
function raidScanCost(){
  const reputation=clamp(Number(state.reputation)||0,0,500);
  const reputationSteps=Math.floor(reputation/25);
  const growthPerStep=Math.log(2000)/20;
  return Math.round(100*Math.exp(growthPerStep*reputationSteps));
}

function makeRaidTargetShip(tier,archetype,role){
  const roleEntry=archetype.composition.find(entry=>entry.role===role);
  if(!roleEntry||!roleEntry.types.length) return null;
  const typeId=pick(roleEntry.types);
  const ship=makeShip(typeId,prizeName(),state.portId);
  ship.isTransport=role==='transport';
  const rarityPool=SHIP_RARITIES.map((item,index)=>[
    item,item.weight*Math.pow(1+tier*0.075,index),
  ]).filter(([item])=>archetype.id!=='royal'||SHIP_RARITIES.findIndex(entry=>entry.id===item.id)>=SHIP_RARITIES.findIndex(entry=>entry.id==='epic'));
  const rarity=archetype.id==='ghost_fleet'?SHIP_RARITY_BY_ID.anomaly:weightedPick(rarityPool);
  const rarityRank=SHIP_RARITIES.findIndex(item=>item.id===rarity.id);
  ship.rarity=rarity.id;
  ship.enemyStatMultiplier=Number(archetype.enemyStatMultiplier)||
    (role==='escort'||role==='flagship'?archetype.escortMultiplier:1);
  ship.enemySpeedMultiplier=archetype.specialTag==='smuggler'?1.4:archetype.id==='rival_pirates'?1.2:1;
  ship.enemyEscapeMultiplier=archetype.specialTag==='smuggler'?1.4:archetype.id==='rival_pirates'?1.15:1;
  ship.cashReserve=0;
  for(const upgrade of SHIP_UPGRADES){
    const maxRank=clamp(Math.floor(tier*0.55+rarityRank*0.7),1,15);
    ship.upgrades[upgrade.id]=Math.random()<0.32?0:rndInt(1,maxRank);
  }
  const type=shipType(ship);
  ship.maxHull=Math.round(type.hull*rarity.multiplier*Math.pow(1.08,ship.upgrades.hull||0));
  ship.hull=Math.round(ship.maxHull*rnd(0.62,0.98));
  if(role==='transport'&&archetype.cargoCategories.length){
    const eligible=COMMODITIES.filter(commodity=>archetype.cargoCommodities
      ?archetype.cargoCommodities.includes(commodity.name):archetype.cargoCategories.includes(commodity.category));
    const unitCommodities=eligible.filter(commodity=>commodity.cargoFactor===1);
    const dominant=pick(unitCommodities.length?unitCommodities:eligible);
    const cargoFactor = Number(archetype.cargoRichness) || 1;
    const targetLoad=Math.max(1, Math.floor(cargoCapacity(ship)*rnd(0.75,0.94)*cargoFactor));
    const dominantUnits=Math.ceil(targetLoad*0.85);
    const dominantQuantity=Math.min(Math.floor(cargoCapacity(ship)/dominant.cargoFactor),
      Math.ceil(dominantUnits/dominant.cargoFactor));
    addCargo(ship,dominant.name,dominantQuantity);

    let remaining=Math.max(0,targetLoad-cargoUsed(ship));
    let cargoPool=eligible.filter(commodity=>commodity.name!==dominant.name);
    const mixUnitCommodities=cargoPool.filter(commodity=>commodity.cargoFactor===1);
    if(mixUnitCommodities.length) cargoPool=mixUnitCommodities;
    const mixCount=Math.min(rndInt(2,4),cargoPool.length,7);
    for(let index=0;index<mixCount&&remaining>0;index++){
      const commodity=cargoPool.splice(rndInt(0,cargoPool.length-1),1)[0];
      const available=Math.floor(remaining/commodity.cargoFactor);
      if(available<=0) continue;
      const quantity=index===mixCount-1?available:Math.max(1,Math.floor(available*rnd(0.2,0.6)));
      addCargo(ship,commodity.name,quantity);
      remaining-=quantity*commodity.cargoFactor;
    }
    const unfilled=Math.max(0,targetLoad-cargoUsed(ship));
    if(unfilled){
      const extra=Math.min(Math.floor((cargoCapacity(ship)-cargoUsed(ship))/dominant.cargoFactor),
        Math.ceil(unfilled/dominant.cargoFactor));
      if(extra>0) addCargo(ship,dominant.name,extra);
    }
  }
  ship.cargoValue=Object.entries(ship.cargo).reduce((sum,[name,qty])=>
    sum+qty*COMM_BY_NAME[name].basePrice,0);
  return ship;
}

function makeRaidTarget(tier,maxShipsFromIdleFleet,minShipsFromIdleFleet){
  const fleetLimit = Math.max(1, Number(maxShipsFromIdleFleet) || 3);
  const hasFleetRange=Number.isFinite(minShipsFromIdleFleet);
  const fleetMinimum=hasFleetRange?clamp(Math.floor(minShipsFromIdleFleet),1,fleetLimit):1;
  const targetShips=hasFleetRange?rndInt(fleetMinimum,fleetLimit):null;
  const eligible=RAID_FLEET_ARCHETYPES.filter(archetype=>archetype.minTier<=raidReputationTier() &&
    (hasFleetRange||archetype.composition.reduce((total,entry)=>total+entry.countMin,0)<=fleetLimit));
  const archetype=weightedPick(eligible.map(item=>[item,item.weight*(
    state.reputation>=RAID_RESERVE_HIGH_REP_THRESHOLD&&item.id==='funds'
      ? RAID_RESERVE_HIGH_REP_WEIGHT_MULTIPLIER : 1
  )]));
  const planned=archetype.composition.map(entry=>({entry,count:rndInt(entry.countMin,entry.countMax)}));
  let total=planned.reduce((sum,item)=>sum+item.count,0);
  if(hasFleetRange){
    while(total>targetShips){
      const removable=planned.find(item=>item.count>1);
      if(removable){ removable.count--; total--; }
      else {
        const index=planned.findIndex(item=>item.count>0);
        if(index<0) break;
        planned[index].count--; total--;
        if(!planned[index].count) planned.splice(index,1);
      }
    }
    while(total<targetShips){
      const entry=pick(archetype.composition);
      const rolePlan=planned.find(item=>item.entry===entry);
      if(rolePlan) rolePlan.count++;
      else planned.push({entry,count:1});
      total++;
    }
  } else {
    while(total>fleetLimit){
      const removable=planned.slice().reverse().find(item=>item.count>item.entry.countMin);
      if(!removable) break;
      removable.count--; total--;
    }
  }
  const fleet=[];
  for(const {entry,count} of planned){
    for(let index=0;index<count;index++){
      const ship=makeRaidTargetShip(tier,archetype,entry.role);
      if(ship) fleet.push(ship);
    }
  }
  if(archetype.id==='mining'&&Math.random()<0.08){
    const eligibleTransports=fleet.filter(ship=>ship.isTransport&&cargoCapacity(ship)-cargoUsed(ship)>=COMM_BY_NAME.Silver.cargoFactor);
    if(eligibleTransports.length){
      const ship=pick(eligibleTransports);
      const quantity=Math.min(rndInt(1,3),Math.floor((cargoCapacity(ship)-cargoUsed(ship))/COMM_BY_NAME.Silver.cargoFactor));
      addCargo(ship,'Silver',quantity);
      ship.cargoValue+=quantity*COMM_BY_NAME.Silver.basePrice;
    }
  }
  if(!fleet.length){
    const entry=archetype.composition.find(item=>item.countMin>0) || archetype.composition[0];
    const ship=makeRaidTargetShip(tier,archetype,entry.role);
    if(ship) fleet.push(ship);
  }
  const difficulty=Math.round(fleet.reduce((total,ship)=>total+shipStats(ship).strength,0));
  const cargoValue=Math.round(fleet.reduce((total,ship)=>total+(ship.cargoValue||0),0));
  const cashReserve=Math.round((Number(archetype.cashReserveBase)||0)+cargoValue*archetype.cashFactor);
  const risk=difficulty>220?'Very High':difficulty>130?'High':difficulty>65?'Medium':'Low';
  const template=pick(archetype.nameTemplates);
  const name=template.replaceAll('{port}',PORTS_BY_ID[state.portId].name).replaceAll('{ship}',fleet[0].name);
  debugKV('RAID_TARGET', { archetype: archetype.id, fleetLimit, totalShips: fleet.length, cargoValue, cashReserve, difficulty });
  return {id:uid('target'),archetypeId:archetype.id,name,fleet,difficulty,cargoValue,cashReserve,risk};
}

function claimRaidFleetCargo(enemyShip,raiders){
  let space=raiders.reduce((sum,ship)=>sum+Math.max(0,cargoCapacity(ship)-cargoUsed(ship)),0);
  const claimed=[];
  for(const [name,quantity] of Object.entries(enemyShip.cargo||{})){
    const commodity=COMM_BY_NAME[name];
    if(!commodity||space<commodity.cargoFactor) continue;
    const taken=Math.min(quantity,Math.floor(space/commodity.cargoFactor));
    if(taken<=0) continue;
    let remaining=taken;
    for(const raider of raiders){
      const room=Math.max(0,cargoCapacity(raider)-cargoUsed(raider));
      const amount=Math.min(remaining,Math.floor(room/commodity.cargoFactor));
      if(amount>0){ addCargo(raider,name,amount); remaining-=amount; }
      if(!remaining) break;
    }
    const transferred=taken-remaining;
    if(transferred){
      addCargo(enemyShip,name,-transferred);
      claimed.push({name,quantity:transferred,unit:commodity.unit});
      space-=transferred*commodity.cargoFactor;
    }
  }
  return claimed;
}

function scanTargets(){
  if(state.travel){ toast('Return to port before scanning for enemy fleets.','bad'); return; }
  const idleFleetSize=state.ships.filter(ship=>ship.status==='idle'&&ship.locationId===state.portId&&shipIsActive(ship)).length;
  if(!idleFleetSize){ toast('Activate an idle ship here before scanning for enemy fleets.','bad'); return; }
  const scanCost=raidScanCost();
  if(!Economy.canAfford(scanCost)){ toast('Not enough coins. Need '+fmtWalletValue(scanCost)+'.','bad'); return; }
  Economy.removeMoney(scanCost,'Enemy Fleet Scan');
  const port=PORTS_BY_ID[state.portId];
  const tier=raidReputationTier();
  const targetCount=3+Math.floor(Math.max(0,state.reputation)/100);
  const enemyShipCount=idleFleetSize+Math.floor(idleFleetSize*(state.reputation/50)/8);
  ui.targets=Array.from({length:targetCount},()=>makeRaidTarget(tier,enemyShipCount,enemyShipCount));
  logEntry('EVENT','Scouts spent '+fmtWalletValue(scanCost)+' and reported '+ui.targets.length+' enemy fleets near '+port.name+'.');
  toast('Enemy fleets sighted. Choose your target and raiding ships.');
}

function addFreeRaidCrew(ship,roleIds,minCount,maxCount,minLevel,maxLevel){
  const available=Math.max(0,shipStats(ship).crewCap-crewOfShip(ship.id).length);
  const count=Math.min(rndInt(minCount,maxCount),available);
  for(let index=0;index<count;index++){
    const member=makeCrewMember(pick(roleIds),{level:rndInt(minLevel,maxLevel),skill:rndInt(65,90)});
    member.shipId=ship.id;
    state.crew.push(member);
  }
  return count;
}

function dispatchRaid(target,shipIds){
  if(!target||!Array.isArray(target.fleet)||!target.fleet.length) return;
  if(state.travel){ toast('Return to port before launching a raid.','bad'); return; }
  const ids=Array.from(new Set(shipIds||[]));
  const ships=ids.map(getShip).filter(Boolean);
  if(!ships.length||ships.length!==ids.length){ toast('Select your raiding fleet.','bad'); return; }
  if(ships.some(ship=>!shipIsActive(ship)||ship.status!=='idle'||ship.locationId!==state.portId||!crewOfShip(ship.id).some(member=>!member.training))){
    toast('Every raiding ship must be idle here with available crew.','bad'); return;
  }
  addWanted(15+(target.archetypeId==='rival_pirates'?0:5),'launching a fleet raid');
  const ownPower=ships.reduce((total,ship)=>total+shipStats(ship).strength,0);
  const enemyPower=target.fleet.reduce((total,ship)=>total+shipStats(ship).strength,0);
  const powerRounds=Math.ceil((combatDurationScale(ownPower+enemyPower)-1)*10);
  const roundsTotal=2+Math.ceil(target.fleet.length*0.6)+powerRounds;
  const task={
    id:uid('task'),kind:'raid',name:'Raid: '+target.name,
    shipId:ships[0].id,shipIds:ships.map(ship=>ship.id),
    enemyFleet:JSON.parse(JSON.stringify(target.fleet)),
    enemyName:target.name,archetypeId:target.archetypeId||'merchant',cashReserve:Math.max(0,Number(target.cashReserve)||0),enemyPower,ownPower,
    startDay:state.gameDay,endDay:Math.floor(state.gameDay)+roundsTotal,
    roundsTotal,roundsComplete:0,lastProcessedDay:Math.floor(state.gameDay),
    originId:state.portId,events:[],
  };
  state.tasks.push(task);
  for(const ship of ships){ ship.status='task'; ship.taskId=task.id; }
  ui.targets=ui.targets.filter(item=>item.id!==target.id);
  logEntry('COMBAT',ships.map(ship=>ship.name).join(', ')+' engaged '+target.name+
    ' ('+target.fleet.length+' enemy ships); estimated battle time '+roundsTotal+' days.');
  toast('⚔️ Raid underway. Estimated completion: '+roundsTotal+' days.','good');
  ui.viewDirty=true; ui.headerDirty=true;
}

function portGarrisonCount(portId){
  const port=PORTS_BY_ID[portId];
  const marineMultiplier=portGovernance(portId).marineOwned?MARINE_GARRISON_MULTIPLIER:1;
  return Math.round(PORT_GOVERNANCE_PROFILE[port.size].garrison*(port.garrisonMultiplier||1)*marineMultiplier);
}
function portGarrisonTypes(portId){
  const port=PORTS_BY_ID[portId];
  const profile=PORT_GOVERNANCE_PROFILE[port.size];
  const types=SHIP_TYPES.filter(type=>profile.classes.includes(type.class)&&type.cannons>0);
  return Array.from({length:portGarrisonCount(portId)},(_,index)=>
    types[Math.floor(rng(portId,'garrison',index)*types.length)]
  );
}
function portGarrisonPower(portId){
  return portGarrisonTypes(portId).reduce((total,type)=>
    total+(type.cannonPower+type.boarding*1.3+type.crewCap*3)*0.72,0);
}
function dispatchPortRaid(portId,shipIds){
  const port=PORTS_BY_ID[portId];
  if(!port) return false;
  if(state.travel||portIsClosed(state.portId)){ toast('You must be at an open port to launch a port raid.','bad'); return false; }
  if(portIsRebelled(portId)){ toast('This port is in rebellion; pay its ransom to restore control.','bad'); return false; }
  if(portIsClosed(portId)){ toast('The target port is closed and cannot be raided.','bad'); return false; }
  if(portIsControlled(portId)){ toast('You already control this port.','bad'); return false; }
  if(state.tasks.some(task=>task.kind==='portRaid'&&task.portId===portId)){
    toast('A raid against this port is already underway.','bad'); return false;
  }
  const ids=Array.from(new Set(shipIds||[]));
  const ships=ids.map(getShip).filter(Boolean);
  if(!ships.length||ships.length!==ids.length||ships.some(ship=>!shipIsActive(ship)||
    ship.status!=='idle'||ship.locationId!==state.portId)){
    toast('Select one or more active, idle ships at your current port.','bad'); return false;
  }
  addWanted(20,'assaulting a port garrison');
  const ownPower=ships.reduce((total,ship)=>total+shipStats(ship).strength,0);
  const enemyPower=portGarrisonPower(portId);
  const ratio=ownPower/Math.max(1,enemyPower);
  const successChance=clamp(0.08+0.84/(1+Math.exp(-(ratio-1)*4)),0.03,0.92);
  const distance=portDistance(state.portId,portId);
  const duration=Math.round(clamp(4+distance*0.18+22*enemyPower/(ownPower+enemyPower),4,30));
  const task={id:uid('task'),kind:'portRaid',name:'Port Raid: '+port.name,portId,
    shipId:ships[0].id,shipIds:ships.map(ship=>ship.id),ownPower,enemyPower,
    garrisonCount:portGarrisonCount(portId),successChance,
    startDay:state.gameDay,endDay:state.gameDay+duration,lastProcessedDay:Math.floor(state.gameDay)};
  state.tasks.push(task);
  for(const ship of ships){ship.status='task';ship.taskId=task.id;}
  logEntry('COMBAT',ships.length+' ship(s) began a '+duration+'-day assault on '+port.name+
    ' against '+task.garrisonCount+' warships. Estimated success chance: '+Math.round(successChance*100)+'%.');
  toast('Port raid underway at '+esc(port.name)+'. Estimated duration: '+duration+' days.','good');
  ui.portRaidShipSelection=[];
  ui.viewDirty=true; ui.headerDirty=true;
  return true;
}
function resolvePortRaid(task){
  if(!state.tasks.some(item=>item.id===task.id)) return;
  const ships=task.shipIds.map(getShip).filter(Boolean);
  const success=Math.random()<task.successChance;
  state.tasks=state.tasks.filter(item=>item.id!==task.id);
  if(success){
    const governance=portGovernance(task.portId);
    governance.controlled=true;
    governance.rebelled=false;
    governance.marineOwned=false;
    governance.lastRevenueDay=Math.floor(state.gameDay);
    governance.lastPayoutDay=Math.floor(state.gameDay);
    governance.lastPopulationDay=Math.floor(state.gameDay);
    for(const ship of ships){ship.status='idle';ship.taskId=null;ship.locationId=task.portId;}
    const stats=portBankingStats(task.portId);
    const refund=Math.max(0,Math.round(stats.taxPaid-stats.taxRefunded));
    if(refund){
      Economy.addMoney(refund,'Port Banking Tax Refund: '+PORTS_BY_ID[task.portId].name,false);
      stats.taxRefunded+=refund;
    }
    state.reputation=clamp(state.reputation+5,0,1000);
    logEntry('COMBAT','Port raid succeeded. '+PORTS_BY_ID[task.portId].name+' is under your control.'+
      (refund?' Previous banking taxes refunded: '+fmtWalletValue(refund)+'.':''));
    toast(PORTS_BY_ID[task.portId].name+' captured. Banking taxes refunded: '+fmtWalletValue(refund)+'.','good');
  } else {
    const lostIds=new Set(ships.map(ship=>ship.id));
    state.ships=state.ships.filter(ship=>!lostIds.has(ship.id));
    for(const member of state.crew) if(lostIds.has(member.shipId)) member.shipId=null;
    state.stats.shipsLost+=ships.length;
    if(lostIds.has(state.player.vesselId)) state.player.vesselId=state.ships[0]?.id||null;
    const reputationLoss=Math.max(20,Math.round(state.reputation*0.25));
    state.reputation=clamp(state.reputation-reputationLoss,0,1000);
    logEntry('COMBAT','Port raid failed at '+PORTS_BY_ID[task.portId].name+'. All '+ships.length+
      ' committed ship(s) were destroyed; reputation fell by '+reputationLoss+'.');
    toast('Port raid failed. All committed ships were destroyed; reputation -'+reputationLoss+'.','bad');
  }
  ui.viewDirty=true; ui.headerDirty=true;
}
function processPortRaidsDaily(day){
  for(const task of state.tasks.slice()){
    if(task.kind==='portRaid'&&day>task.lastProcessedDay){
      task.lastProcessedDay=day;
      if(day>=task.endDay) resolvePortRaid(task);
    }
  }
}

function processRaidDaily(day){
  for(const task of state.tasks.slice()){
    if(task.kind!=='raid'||day<=task.lastProcessedDay) continue;
    task.lastProcessedDay=day;
    task.roundsComplete++;
    const raiders=task.shipIds.map(getShip).filter(Boolean);
    const enemies=task.enemyFleet.filter(ship=>!ship.destroyed&&!ship.captured);
    if(!raiders.length||!enemies.length){
      resolveRaid(task); continue;
    }
    const ownPower=raiders.reduce((total,ship)=>total+shipStats(ship).strength,0);
    const enemyPower=enemies.reduce((total,ship)=>total+shipStats(ship).strength,0);
    const enemy=pick(enemies);
    const damage=Math.max(1,Math.round(enemy.maxHull*rnd(0.035,0.095)*ownPower/Math.max(1,ownPower+enemyPower)*2));
    enemy.hull=Math.max(1,enemy.hull-damage);
    if(enemy.hull<=Math.max(1,enemy.maxHull*0.12)) enemy.disabled=true;
    const raider=pick(raiders);
    const armor=Math.max(0.5,1-(raider.upgrades?.armor||0)*0.02);
    const retaliation=task.archetypeId==='rival_pirates'?1.7:1;
    const incoming=Math.max(1,Math.round(raider.maxHull*rnd(0.025,0.075)*
      enemyPower/Math.max(1,ownPower+enemyPower)*2*armor*(1-skillEffectValue('plunderer','damage'))*retaliation));
    raider.hull=Math.max(1,raider.hull-incoming);
    if(raider.hull<=Math.max(1,raider.maxHull*0.08)) raider.critical=true;
    task.events.push('Round '+task.roundsComplete+' of '+task.roundsTotal+': '+enemy.name+' took '+damage+' hull damage.');
    logEntry('COMBAT',task.name+' — round '+task.roundsComplete+'/'+task.roundsTotal+'.');
    ui.viewDirty=true;
    if(task.roundsComplete>=task.roundsTotal) resolveRaid(task);
  }
}

function resolveRaid(task){
  if(!state.tasks.some(item=>item.id===task.id)) return;
  const raiders=task.shipIds.map(getShip).filter(Boolean);
  const ownPower=raiders.reduce((total,ship)=>total+shipStats(ship).strength,0);
  const fierceRaid=Number(task.enemyPower)>=Number(task.ownPower)*0.65;
  const captured=[],destroyed=[],scuttled=[],escaped=[];
  for(const enemy of task.enemyFleet){
    if(enemy.destroyed){
      destroyed.push(enemy);
      const cargo=claimRaidFleetCargo(enemy,raiders);
      if(cargo.length) task.events.push(enemy.name+' wreck salvaged: '+cargo.map(item=>item.quantity+' '+item.unit+' '+item.name).join(', ')+'.');
      continue;
    }
    const transport=typeof enemy.isTransport==='boolean'?enemy.isTransport:RAID_TRANSPORT_TYPES.has(enemy.typeId);
    const relative=clamp(ownPower/Math.max(1,ownPower+shipStats(enemy).strength),0.1,0.9);
    const damaged=enemy.disabled||enemy.hull<enemy.maxHull*0.3;
    const captureChance=clamp((transport?0.48:0.14)+relative*(transport?0.42:0.48)+(damaged?0.16:0)+
      skillEffectValue('plunderer','capture')+(task.archetypeId==='naval_squadron'?0.08:0),0.08,0.95);
    if(Math.random()<captureChance){
      enemy.captured=true; enemy.status='idle'; enemy.taskId=null; enemy.locationId=task.originId;
      enemy.isTransport=transport; state.ships.push(enemy); captured.push(enemy); state.stats.shipsCaptured++;
      if(task.archetypeId==='marine_transport'&&transport){
        const joined=addFreeRaidCrew(enemy,['swordsman','musketeer'],2,4,4,7);
        if(joined) task.events.push(joined+' high-level Marines joined '+enemy.name+' for free.');
      }
      continue;
    }
    const scuttleChance=transport?0.07:0.34;
    if(Math.random()<scuttleChance){
      enemy.destroyed=true; enemy.setAblaze=true; scuttled.push(enemy);
      const cargo=claimRaidFleetCargo(enemy,raiders);
      if(cargo.length) task.events.push(enemy.name+' wreck salvaged: '+cargo.map(item=>item.quantity+' '+item.unit+' '+item.name).join(', ')+'.');
    }
    else if(enemy.hull<enemy.maxHull*0.2){
      enemy.destroyed=true; destroyed.push(enemy);
      const cargo=claimRaidFleetCargo(enemy,raiders);
      if(cargo.length) task.events.push(enemy.name+' wreck salvaged: '+cargo.map(item=>item.quantity+' '+item.unit+' '+item.name).join(', ')+'.');
    }
    else escaped.push(enemy);
  }
  const lost=[];
  const consequences=[];
  for(const ship of raiders){
    if(ship.critical&&Math.random()<0.38){
      lost.push(ship);
      state.ships=state.ships.filter(item=>item.id!==ship.id);
      for(const member of state.crew) if(member.shipId===ship.id) member.shipId=null;
      state.stats.shipsLost++;
    } else {
      ship.status='idle'; ship.taskId=null;
      for(const member of crewOfShip(ship.id)) member.morale=clamp(member.morale+(captured.length?rndInt(1,4):-rndInt(2,5)),0,100);
    }
  }
  if(fierceRaid){
    const crewCandidates=state.crew.filter(member=>task.shipIds.includes(member.shipId)&&!member.training);
    if(crewCandidates.length&&Math.random()>=fleetSupportCasualtyReduction(raiders)){
      const victim=pick(crewCandidates);
      state.crew=state.crew.filter(member=>member.id!==victim.id);
      consequences.push('Crew casualty: '+victim.name+'.');
    }
    const survivingRaiders=raiders.filter(ship=>state.ships.includes(ship))
      .sort((a,b)=>a.hull/a.maxHull-b.hull/b.maxHull);
    const damagedShip=survivingRaiders[0];
    if(damagedShip){
      damagedShip.hull=Math.min(damagedShip.hull,Math.round(damagedShip.maxHull*0.30));
      consequences.push(damagedShip.name+' left heavily damaged at '+
        Math.round(damagedShip.hull/damagedShip.maxHull*100)+'% hull.');
    }
  }
  const allCaptured=captured.length===task.enemyFleet.length;
  if(captured.length){
    state.stats.battlesWon++;
    state.reputation=clamp(state.reputation+rndInt(2,5),0,1000);
    const reward=Math.round(captured.reduce((sum,ship)=>sum+(ship.cargoValue||0)*0.12,0));
    if(reward) Economy.addMoney(reward,'Fleet Raid Salvage: '+task.enemyName);
    if(task.cashReserve>0){
      const cashReward=Math.round(task.cashReserve*captured.length/task.enemyFleet.length);
      if(cashReward) Economy.addMoney(cashReward,'Raid Cash Reserve: '+task.enemyName);
    }
    if(task.archetypeId==='naval_squadron') state.reputation=clamp(state.reputation+Math.round(rndInt(2,5)*0.5),0,1000);
    if(task.archetypeId==='rival_pirates') state.reputation=clamp(state.reputation+10,0,1000);
    if(task.archetypeId==='ghost_fleet') state.reputation=clamp(state.reputation+15,0,1000);
    if(task.archetypeId==='prison_hulk'){
      let freed=0;
      for(const ship of captured.filter(item=>item.isTransport)){
        freed+=addFreeRaidCrew(ship,['swordsman','musketeer'],2,4,2,5);
      }
      if(freed) task.events.push(freed+' freed prisoners joined the Brotherhood crew.');
    }
    if(task.archetypeId==='ordnance_convoy'){
      state.ordnanceDiscountUntilDay=Math.max(state.ordnanceDiscountUntilDay,state.gameDay+30);
      task.events.push('Captured ordnance: ship upgrades cost 25% less for 30 days.');
    }
    if(task.archetypeId==='funds'||task.archetypeId==='royal'){
      const prize=makeShip('treasuregalleon',prizeName(),task.originId);
      state.ships.push(prize); state.stats.shipsCaptured++;
      task.events.push('Prize ship captured: '+prize.name+' (Treasure Galleon).');
    }
    if(task.archetypeId==='ghost_fleet'){
      const prize=makeShip(pick(['xebec','corvette','frigate']),prizeName(),task.originId);
      const rarityPool=SHIP_RARITIES.filter(item=>SHIP_RARITIES.findIndex(entry=>entry.id===item.id)>=
        SHIP_RARITIES.findIndex(entry=>entry.id==='rare'));
      const rarity=weightedPick(rarityPool.map(item=>[item,item.weight]));
      prize.rarity=rarity.id;
      prize.maxHull=Math.round(prize.maxHull*rarity.multiplier);
      prize.hull=prize.maxHull;
      state.ships.push(prize); state.stats.shipsCaptured++;
      task.events.push('Ghost Fleet prize: a '+rarity.name+' '+shipType(prize).name+' named '+prize.name+'.');
    }
  } else state.reputation=clamp(state.reputation-rndInt(1,4),0,1000);
  if(task.archetypeId==='civilian'){
    const penalty=rndInt(3,8);
    state.reputation=clamp(state.reputation-penalty,0,1000);
    logEntry('EVENT','Raiding a civilian convoy cost '+penalty+' reputation.');
  }
  state.tasks=state.tasks.filter(item=>item.id!==task.id);
  if(captured.length) autoAssignCrew(true);
  const outcome=(allCaptured?'captured the entire enemy fleet':captured.length?'captured '+captured.length+' of '+task.enemyFleet.length+' enemy ships':'failed to capture an enemy vessel')+
    (destroyed.length?' · '+destroyed.length+' destroyed':'')+
    (scuttled.length?' · '+scuttled.length+' set ablaze by their crews':'')+
    (escaped.length?' · '+escaped.length+' escaped':'')+
    (lost.length?' · '+lost.length+' of your ships lost':'')+
    (consequences.length?' · '+consequences.join(' '):'');
  logEntry('COMBAT',task.name+' concluded: '+outcome+'.');
  toast((captured.length?'Raid complete: ':'Raid ended: ')+outcome,captured.length?'good':'bad');
  ui.viewDirty=true; ui.headerDirty=true;
}

/* ---------- Travel ---------- */
function marineInterceptionChance(portId,wantedChance,contrabandChance){
  const baseChance=1-(1-wantedChance)*(1-contrabandChance);
  return clamp(baseChance*(PORTS_BY_ID[portId]?.marineInterceptionMultiplier||1),0,1);
}
function startTravel(destId,shipIds){
  const dest = PORTS_BY_ID[destId];
  if(!dest) return;
  if(portIsClosed(state.portId)||portIsClosed(destId)){
    toast('A closed port cannot send or receive ships yet.','bad'); return false;
  }
  const ids=Array.from(new Set(Array.isArray(shipIds)?shipIds:[]));
  const ships=ids.map(getShip).filter(Boolean);
  if(!ships.length||ships.length!==ids.length||ships.length>6||
    ships.some(ship=>!shipIsActive(ship)||ship.status!=='idle'||ship.locationId!==state.portId)){
    toast('Select one to six active idle ships at this port.','bad'); return false;
  }
  let speed = 1.2;
  speed = Math.max.apply(null, ships.map(ship=>shipStats(ship).speed));
  let days = baseTravelDays(state.portId, destId, speed);
  days *= (1 - skillEffectValue('navigation','travel'));
  days = Math.max(0.12, days);
  state.travel = {
    fromId: state.portId, toId: destId,
    startDay: state.gameDay, arriveDay: state.gameDay + days,
    shipIds:ships.map(ship=>ship.id),
  };
  for(const ship of ships){ ship.status='task'; ship.taskId='travel'; }
  state.player.vesselId=ships[0].id;
  logEntry('SHIP', ships.length+' ship(s) set sail from '+PORTS_BY_ID[state.portId].name+' bound for '+dest.name+' ('+days.toFixed(2)+' days).');
  toast('🧭 Sailing to <b>'+esc(dest.name)+'</b> with '+ships.length+' ship(s) — ETA '+fmtEta(days),'good');
  const wanted=Math.max(0,Math.floor(Number(state.wantedLevel)||0));
  const wantedChance=wanted?clamp(0.005+wanted*0.01,0,0.9):0;
  const contraband=ships.reduce((total,ship)=>total+Object.entries(ship.cargo||{}).reduce((sum,[name,qty])=>
    sum+(ILLEGAL_GOOD_BY_NAME[name]?Math.max(0,Number(qty)||0):0),0),0);
  const contrabandChance=contraband?clamp(0.32+contraband*0.06,0.32,0.9):0;
  const interceptionChance=marineInterceptionChance(state.portId,wantedChance,contrabandChance);
  if(Math.random()<interceptionChance){
    const origin=state.portId;
    state.travel=null;
    for(const ship of ships){ship.status='idle';ship.taskId=null;ship.locationId=origin;}
    if(contraband){
      for(const ship of ships){
        for(const name of Object.keys(ship.cargo||{})) if(ILLEGAL_GOOD_BY_NAME[name]) delete ship.cargo[name];
      }
      addWanted(2,'Marines seized contraband at sea');
      logEntry('EVENT','Marines searched the fleet and confiscated its illegal cargo.');
    }
    freezeMarineBonds();
    state.marineDetention={releaseDay:Number(state.gameDay)+Math.max(1,wanted),portId:origin};
    logEntry('EVENT','Marine patrol captured the captain while sailing toward '+dest.name+'. Sentence: '+
      Math.ceil(state.marineDetention.releaseDay-state.gameDay)+' days. Bounty: '+fmtWalletValue(wantedBounty(state.wantedLevel))+'.');
    toast((contraband?'Contraband was seized. ':'')+'Marine patrol captured you. Pay a fine or serve '+
      Math.ceil(state.marineDetention.releaseDay-state.gameDay)+' days.','bad');
    ui.headerDirty=true;
  }
  tutorialAdvance('travel');
  ui.viewDirty = true;
  return true;
}

/* ---------- Tutorial ---------- */
function tutorialAdvance(event){
  if(!state) return;
  if(!state.tutorial.done){
    const s = state.tutorial.step;
    const map = { search:0, recruit:1, dispatch:2, travel:3, market:4, buy:5, sell:6, bank_exchange:7, smelting_start:8, arrive_port:3 };
    if(s===map[event]){
      state.tutorial.step=Math.min(9,s+1);
      if(state.tutorial.step>=9){
        state.tutorial.done=true;
        logEntry('EVENT','Beginner voyage complete — you know the ropes now, Captain.');
        toast('Beginner voyage complete.','good');
      }
      renderTutorial();
    }
  }
  const runs=state.tutorialRuns||(state.tutorialRuns={activeId:null,step:0,completed:{}});
  const tutorial=TUTORIALS.find(item=>item.id===runs.activeId);
  if(!tutorial) return;
  const step=tutorial.steps[runs.step];
  if(!step||step.event!==event) return;
  runs.step++;
  if(runs.step>=tutorial.steps.length){
    const firstCompletion=!runs.completed[tutorial.id];
    runs.completed[tutorial.id]=true;
    logEntry('EVENT','Field guide completed: '+tutorial.name+'.');
    if(firstCompletion){
      Economy.addMdP(1,'first completion of '+tutorial.name);
      toast('Field guide complete: '+esc(tutorial.name)+' · reward 1 MdP.','good');
    } else toast('Field guide complete: '+esc(tutorial.name)+'.','good');
  }
  renderTutorial();
  ui.viewDirty=true;
}

/* ---------------------------------------------------------------------------
   MAIN LOOP
   --------------------------------------------------------------------------- */
let _ambientTimer = 0;

function gameTick(){
  const now = Date.now();
  if(!state){ _lastTick = now; return; }

  syncGameTime(now);

  _ambientTimer += (now - _lastTick);
  _lastTick = now;
  if(_ambientTimer > 4000){ _ambientTimer = 0; maybeAmbientEvent(); }

  checkAchievements();

  if(state.settings.autoSave && now - _lastAutoSave > (state.settings.autoSaveIntervalMs||CONFIG.autoSaveMs)){
    _lastAutoSave = now;
    saveGame(true);
  }

  if(ui.headerDirty){ renderHeader(); renderTabs(); ui.headerDirty = false; }
  if(ui.viewDirty){ renderView(); ui.viewDirty = false; }
  updateLiveValues();
  if(CONFIG.debug) renderDebug();
}

/* ---------------------------------------------------------------------------
   NEW GAME MODAL
   --------------------------------------------------------------------------- */
function showNewGameModal(){
  const host = document.getElementById('modalHost');
  const colors = ['#b5453b','#c9a04a','#3f7d52','#3b6ea5','#8f6fb5','#2c2118','#e8dcc0'];
  const flags = ['☠','⚓','🦜','⚔','🌊','🦴','★'];
  const d = ui.newGameDraft;
  host.innerHTML =
  '<div class="modal-back"><div class="modal">'+
    '<h1 style="color:var(--bronze)">The Pirate\'s Fortune</h1>'+
    '<p class="muted">Hoist your colours, Captain. The sea is wide and full of coin.</p>'+
    '<div class="divider"></div>'+
    '<label class="fld"><span>Pirate name</span><input type="text" id="ngName" value="'+esc(d.name)+'" maxlength="30"></label>'+
    '<label class="fld"><span>Title / nickname</span><input type="text" id="ngTitle" value="'+esc(d.title)+'" maxlength="30"></label>'+
    '<label class="fld"><span>First ship name</span><input type="text" id="ngShip" value="'+esc(d.ship)+'" maxlength="30"></label>'+
    '<label class="fld"><span>Flag symbol</span><div class="swatches" id="ngFlags">'+
      flags.map(f=>'<div class="swatch'+(f===d.flag?' sel':'')+'" data-flag="'+f+'" style="background:#1a2b3d;font-size:18px;display:flex;align-items:center;justify-content:center;color:'+esc(d.color)+'">'+f+'</div>').join('')+
    '</div></label>'+
    '<label class="fld"><span>Flag colour</span><div class="swatches" id="ngColors">'+
      colors.map(c=>'<div class="swatch'+(c===d.color?' sel':'')+'" data-color="'+c+'" style="background:'+c+'"></div>').join('')+
    '</div></label>'+
    '<div class="divider"></div>'+
    '<div class="row">'+
      '<button class="btn primary" id="ngStart" style="flex:1">Set Sail</button>'+
      (localStorage.getItem(CONFIG.saveKey) ? '<button class="btn" id="ngContinue">Continue Saved Game</button>' : '')+
    '</div>'+
    '<p class="hint" style="margin-top:10px">Tip: search the sea, recruit a crew, then send your ship on a treasure hunt.</p>'+
  '</div></div>';
  document.getElementById('ngFlags').addEventListener('click', ev=>{
    const sw = ev.target.closest('[data-flag]'); if(!sw) return;
    d.flag = sw.dataset.flag;
    document.querySelectorAll('#ngFlags .swatch').forEach(x=>x.classList.remove('sel'));
    sw.classList.add('sel');
  });
  document.getElementById('ngColors').addEventListener('click', ev=>{
    const sw = ev.target.closest('[data-color]'); if(!sw) return;
    d.color = sw.dataset.color;
    document.querySelectorAll('#ngColors .swatch').forEach(x=>x.classList.remove('sel'));
    sw.classList.add('sel');
    document.querySelectorAll('#ngFlags .swatch').forEach(x=>x.style.color = d.color);
  });
  document.getElementById('ngStart').onclick = ()=>{
    d.name  = (document.getElementById('ngName').value || 'Edward Black').trim();
    d.title = (document.getElementById('ngTitle').value || '').trim();
    d.ship  = (document.getElementById('ngShip').value || 'Sea Wraith').trim();
    host.innerHTML = '';
    newGame(d);
    state.lastReal = Date.now();
    saveGame(true);
    ui.headerDirty = true; ui.viewDirty = true;
    renderAll();
  };
  const contBtn = document.getElementById('ngContinue');
  if(contBtn){
    contBtn.onclick = ()=>{
      host.innerHTML = '';
      if(loadGame()){
        applyOfflineProgress();
        ui.headerDirty = true; ui.viewDirty = true;
        renderAll();
      } else {
        toast('Save could not be loaded.','bad');
        showNewGameModal();
      }
    };
  }
}

/* ---------------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------------- */
function boot(){
  if(loadGame()){
    applyOfflineProgress();
    ui.headerDirty = true; ui.viewDirty = true;
    renderAll();
  } else {
    showNewGameModal();
  }
  setInterval(gameTick, CONFIG.tickMs);
  setInterval(updateSearchCooldown,100);

  const persistBeforePageExit = ()=>{
    if(state){ state.lastReal = Date.now(); saveGame(true); }
  };
  window.addEventListener('pagehide', persistBeforePageExit);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) persistBeforePageExit();
  });

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && state){
      const now = Date.now();
      const gap = now - state.lastReal;
      if(gap > 3000){
        syncGameTime(now, false);
        ui.headerDirty = true; ui.viewDirty = true;
        renderAll();
      }
    }
  });
}

boot();

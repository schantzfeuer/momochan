   --------------------------------------------------------------------------- */
let _lastTick = Date.now();
let _lastAutoSave = Date.now();
const GAME_SPEEDS = [0,1,2,5,10,25,100];

function syncGameTime(now, countPlaytime){
  if(!state) return 0;
  now = now || Date.now();
  const deltaMs = Math.max(0, now - (state.lastReal || now));
  state.lastReal = now;
  if(deltaMs <= 0) return 0;
  if(countPlaytime !== false && !document.hidden) state.playtimeMs = (state.playtimeMs||0) + deltaMs;
  const days = deltaMs / CONFIG.msPerGameDay * currentGameSpeed();
  simulate(days);
  return days;
}

function currentGameSpeed(){
  const speed=Number(state?.settings?.gameSpeed);
  return Number.isFinite(speed)&&speed>=0?speed:1;
}

function simulate(days){
  if(!state || days <= 0) return;
  const step = CONFIG.simStepDays;
  const targetDay=state.gameDay+days;
  while(state.gameDay<targetDay){
    const remaining=targetDay-state.gameDay;
    const d=Math.min(step,remaining);
    state.gameDay=remaining<=step?targetDay:state.gameDay+d;
    processMarineDetention(state.gameDay);
    processArrivals();
    processDailyTick();
    processBankingCoupons(state.gameDay);
    processPayroll();
    processMaintenance();
    processLoan();
    processTrainingCompletion();
  }
  processSmelting(state.gameDay);
  accrueSavings(state.gameDay);
}

function dispatchTransfer(shipId, destinationId, originId, existingTask){
  const fromId=originId||state.portId;
  if(!destinationId || destinationId===fromId || !PORTS_BY_ID[destinationId] || portIsClosed(destinationId)) return false;
  const ship = getShip(shipId);
  const reserved=existingTask&&ship&&ship.taskId===existingTask.id;
  if(!ship || !shipIsActive(ship) || (!reserved&&ship.status!=='idle') || ship.locationId!==fromId) return false;
  const days=Math.max(1,Math.ceil(baseTravelDays(fromId,destinationId,shipStats(ship).speed)*0.9));
  const task=existingTask||{id:uid('task'),shipId:ship.id,shipIds:[ship.id],createdDay:state.gameDay};
  Object.assign(task,{kind:'transfer',name:'Transfer: '+ship.name,originId:fromId,destinationId,
    startDay:state.gameDay,endDay:state.gameDay+days});
  if(!existingTask) state.tasks.push(task);
  ship.status='task'; ship.taskId=task.id;
  logEntry('SHIP',ship.name+' is transferring from '+PORTS_BY_ID[fromId].name+' to '+PORTS_BY_ID[destinationId].name+'.');
  ui.viewDirty = true;
  return true;
}

function commandRemoteShip(shipId,destinationId){
  const ship=getShip(shipId);
  const source=ship&&PORTS_BY_ID[ship.locationId];
  if(state.travel){ toast('Remote orders cannot be sent while you are at sea.','bad'); return false; }
  if(!ship||!source||source.id===state.portId||!portIsControlled(source.id)||portIsClosed(source.id)||
    !shipIsActive(ship)||ship.status!=='idle'){
    toast('Remote orders require an active idle ship at an open port under your control.','bad'); return false;
  }
  if(!PORTS_BY_ID[destinationId]||destinationId===source.id||portIsClosed(destinationId)){
    toast('Choose a different, open destination port.','bad'); return false;
  }
  const commandDelay=Math.max(0.12,baseTravelDays(state.portId,source.id,shipStats(ship).speed));
  const task={id:uid('task'),kind:'remoteCommand',name:'Order: '+ship.name+' → '+PORTS_BY_ID[destinationId].name,
    shipId:ship.id,shipIds:[ship.id],sourcePortId:source.id,destinationId,
    startDay:state.gameDay,endDay:state.gameDay+commandDelay,commandDelay};
  state.tasks.push(task);
  ship.status='task'; ship.taskId=task.id;
  logEntry('SHIP','Remote order sent to '+ship.name+' at controlled '+source.name+'. Signal delay '+commandDelay.toFixed(2)+
    ' days; the ship will then sail to '+PORTS_BY_ID[destinationId].name+'.');
  toast('Order sent to '+esc(source.name)+'. Command delay: '+commandDelay.toFixed(2)+' days.','good');
  ui.viewDirty=true;
  return true;
}

function resolveRemoteShipCommand(task){
  const ship=getShip(task.shipId);
  const source=PORTS_BY_ID[task.sourcePortId];
  if(!ship||!source||ship.locationId!==task.sourcePortId){
    state.tasks=state.tasks.filter(item=>item.id!==task.id);
    if(ship&&ship.taskId===task.id){ship.status='idle';ship.taskId=null;}
    logEntry('SHIP','Remote order for '+task.name+' was cancelled because the ship is no longer at its source port.');
    return;
  }
  if(!portIsControlled(source.id)||portIsRebelled(source.id)){
    state.tasks=state.tasks.filter(item=>item.id!==task.id);
    ship.status='idle';ship.taskId=null;
    logEntry('SHIP','Remote order for '+ship.name+' was cancelled because control of '+source.name+' was lost.');
    return;
  }
  if(portIsClosed(source.id)){task.endDay=state.gameDay+1;return;}
  if(!dispatchTransfer(ship.id,task.destinationId,source.id,task)){
    state.tasks=state.tasks.filter(item=>item.id!==task.id);
    ship.status='idle';ship.taskId=null;
    logEntry('SHIP','Remote order for '+ship.name+' could not be carried out and was cancelled.');
  }
}

function resolveTransfer(task){
  if(!task) return;
  if(portIsRebelled(task.destinationId)){
    task.endDay=state.gameDay+1;
    return;
  }
  const ship = getShip(task.shipId);
  if(ship){
    ship.status = 'idle'; ship.taskId = null; ship.locationId = task.destinationId;
    logEntry('SHIP', ship.name+' arrived at '+PORTS_BY_ID[task.destinationId].name+'.');
  }
}

function processArrivals(){
  const now = state.gameDay;
  if(state.travel && now >= state.travel.arriveDay){
    const voyage=state.travel;
    const dest = voyage.toId;
    if(portIsRebelled(dest)){
      voyage.arriveDay=now+1;
    } else {
      const from = voyage.fromId;
      for(const shipId of voyage.shipIds||[]){
        const ship=getShip(shipId);
        if(ship){ ship.locationId=dest; ship.status='idle'; ship.taskId=null; }
      }
      if(voyage.shipIds&&voyage.shipIds.length&&!voyage.shipIds.includes(state.player.vesselId)){
        state.player.vesselId=voyage.shipIds[0];
      }
      state.portId = dest;
      state.player.locationId = dest;
      state.travel = null;
      ui.travelShipSelection=null;
      onArriveAtPort(from, dest);
    }
  }
  for(let i = state.tasks.length-1; i >= 0; i--){
    const t = state.tasks[i];
    if(t.kind === 'mission'){
      if(now >= t.endDay){ resolveMission(t); state.tasks.splice(i,1); }
    } else if(t.kind === 'trade'){
      if(t.phase === 'out' && now >= t.arriveDay) resolveTradeSale(t);
      else if(t.phase === 'back' && now >= t.returnDay){ resolveTradeReturn(t); state.tasks.splice(i,1); }
    } else if(t.kind === 'transfer'){
      if(now >= t.endDay){ resolveTransfer(t); state.tasks.splice(i,1); }
    } else if(t.kind==='remoteCommand'&&now>=t.endDay){
      resolveRemoteShipCommand(t);
    }
  }
}

function processDailyTick(){
  while(state.gameDay >= state.lastDailyTick + 1){
    state.lastDailyTick += 1;
    const day = Math.floor(state.lastDailyTick);
    ui.headerDirty = true;
    ui.viewDirty = true;

    processBankingDaily(day);
    processMarineFinanceDaily(day);
    updatePortGovernanceDaily(day);

    for(const ship of state.ships){
      if(!shipIsActive(ship)) ship.hull=Math.max(1,ship.hull-ship.maxHull*0.005);
    }

    const provisions = Math.max(0, state.crew.length * CONFIG.dailyProvisionPerCrew * (1 - skillEffectValue('provisioner','provisions')));
    if(provisions > 0) Economy.removeMoney(provisions, 'Daily Provisions');

    const leaderBonus = skillEffectValue('leadership','morale');
    const housingLevel = crewFacilityLevel('housing');
    const tavernLevel = crewFacilityLevel('tavern');
    const roleEffectMultiplier = crewRoleEffectMultiplier();
    for(const c of state.crew){
      c.moraleBuffs = (c.moraleBuffs||[]).filter(b=>b.expiresDay > state.gameDay);
      let delta = 0;
      const role = ROLE_BY_ID[c.role];
      if(role.moraleMod) delta += role.moraleMod * 3 * roleEffectMultiplier;
      for(const tid of c.traits){
        const tr = TRAIT_BY_ID[tid];
        if(tr.morale) delta += tr.morale * 8;
      }
      delta += leaderBonus * 2;
      delta += housingLevel*0.08 + tavernLevel*0.25;
      delta -= 0.35;
      c.morale = clamp(c.morale + delta, 0, 100);
      if(housingLevel) c.loyalty = clamp(c.loyalty + housingLevel*0.2, 0, 100);
    }

    for(let i = state.crew.length-1; i >= 0; i--){
      const c = state.crew[i];
      if(c.morale < CONFIG.desertionMoraleThreshold){
        let chance = (CONFIG.desertionMoraleThreshold - c.morale) / 220;
        chance *= 1 - skillEffectValue('loyalty','desertion');
        chance *= 1 - housingLevel*0.10;
        for(const tid of c.traits){
          const tr = TRAIT_BY_ID[tid];
          if(tr.desertion) chance *= (1 + tr.desertion);
        }
        if(c.loyalty > 75) chance *= 0.4;
        if(Math.random() < chance){
          logEntry('CREW', c.name+' ('+ROLE_BY_ID[c.role].name+') deserted during the night.');
          state.crew.splice(i,1);
          toast('😶 '+esc(c.name)+' deserted.','bad');
          ui.viewDirty = true;
        }
      }
    }

    ensureMarket(state.portId, true);
    refreshMissions(false);
    refreshCrewPool(false);
    processExplorationDaily(day);
    processTradingDaily(day);
    processRaidDaily(day);
    processPortRaidsDaily(day);
  }
}

function onArriveAtPort(fromId, toId){
  const p = PORTS_BY_ID[toId];
  ensureMarket(toId, true);
  refreshCrewPool(true);
  refreshMissions(true);
  state.stats.distanceSailed += portDistance(fromId, toId);
  logEntry('SHIP', 'Arrived at '+p.name+'.');
  toast('⚓ Arrived at <b>'+esc(p.name)+'</b>');
  ui.viewDirty = true;
  ui.headerDirty = true;
  tutorialAdvance('arrive_port');
  if(state.ships.some(ship=>ship.locationId===toId&&Object.keys(ship.cargo||{}).some(name=>ILLEGAL_GOOD_BY_NAME[name]&&ship.cargo[name]>0))){
    tutorialAdvance('contraband_arrive');
  }
}

function portDistance(aId, bId){
  const a = PORTS_BY_ID[aId], b = PORTS_BY_ID[bId];
  return Math.hypot(a.x-b.x, a.y-b.y);
}
function baseTravelDays(fromId, toId, speed){
  return portDistance(fromId,toId) * CONFIG.travelDaysPerMapUnit / (speed||1);
}
function generateMarket(portId, day){
  const port = PORTS_BY_ID[portId];
  const vol = PORT_VOLATILITY[port.size];
  const sizeF = PORT_SIZE_FACTOR[port.size];
  const prices = {};
  for(const c of COMMODITIES){
    if(!portAllowsCommodity(portId,c)) continue;
    if(c.category==='military' && !port.blackMarket) continue;
    if(c.category!=='military' && !portHasCommodity(portId, c.name)) continue;
    const prod = port.produce[c.category]||1;
    const dem  = port.demand[c.category]||1;
    const r1 = rng(portId,c.name,day,'jitter');
    const r2 = rng(portId,c.name,day,'stock');
    const r3 = rng(portId,c.name,day,'qty');
    const jitter = 1 + (r1-0.5)*2*vol;
    const stockLevel = 0.35 + r2*1.4;
    const stockMod = 1 + (1-stockLevel)*0.22;
    let price = c.basePrice * prod * dem * jitter * stockMod;
    price = clamp(price, c.normalRange[0]*0.50, c.normalRange[1]*1.90);
    if(port.fixedCategoryPriceMultipliers?.[c.category]){
      price=c.basePrice*port.fixedCategoryPriceMultipliers[c.category];
    }
    const baseQty = Math.max(1, Math.round(sizeF * 800 / Math.pow(c.basePrice+1, 0.6) * (0.5+r3)));
    const qty = Math.round(baseQty*(1+0.15*portUpgradeLevel(portId,'market'))*(port.stockMultiplier||1));
    prices[c.name] = {
      price: round2(price), stock: qty, base: c.basePrice,
      demand: dem, production: prod,
    };
  }
  return { day, prices, portId };
}
function ensureMarket(portId, force){
  const day = Math.floor(state.gameDay);
  const m = state.markets[portId];
  if(!m || force || m.day !== day) state.markets[portId] = generateMarket(portId, day);
  return state.markets[portId];
}
function currentMarket(){ return ensureMarket(state.portId, false); }
function makeBlackMarketDay(day){
  const port=PORTS_BY_ID[state?.portId];
  const shipTypes=SHIP_TYPES.filter(type=>type.price>0&&!type.rewardOnly);
  const makeOffer=(rarityId)=>{
    const type=pick(shipTypes);
    const rarity=SHIP_RARITY_BY_ID[rarityId];
    return {id:uid('bmship'),typeId:type.id,rarity:rarityId,
      price:legacyToCoins(Math.round(type.price*rarity.multiplier*rnd(1.35,2.15)),'PESO'),name:prizeName()};
  };
  return {
    day,
    priceCurrency:'PESO',
    goods:ILLEGAL_GOODS.map(good=>({name:good.name,price:Math.round(good.basePrice*rnd(1.1,2.2)),
      stock:rndInt(2,12)})),
    ships:port?.blackMarketShips===false?[]:
      [makeOffer('anomaly'),makeOffer(weightedPick(SHIP_RARITIES.slice(2).map(rarity=>[rarity.id,rarity.weight])))],
  };
}
function ensureBlackMarket(){
  if(!state||!PORTS_BY_ID[state.portId]?.blackMarket||portIsClosed(state.portId)) return null;
  const day=Math.floor(state.gameDay);
  if(!state.blackMarket){
    state.blackMarket=makeBlackMarketDay(day);
  } else {
    while(state.blackMarket.day<day){
      state.blackMarket = makeBlackMarketDay(state.blackMarket.day + 1);
    }
  }
  if(PORTS_BY_ID[state.portId].blackMarketShips===false) state.blackMarket.ships=[];
  return state.blackMarket;
}
function buyIllegalGood(name,quantity){
  const market=ensureBlackMarket();
  const good=ILLEGAL_GOOD_BY_NAME[name];
  const entry=market?.goods.find(item=>item.name===name);

    toast('Select an idle ship at this port.','bad'); return false;
  }
  const amount=Math.min(Math.floor(Number(quantity)||0),entry.stock,

  if(amount<1){ toast('Cannot buy that quantity. Check stock, cargo space, and Peso balance.','bad'); return false; }
  const cost=amount*blackMarketGoodBuyPrice(state.portId,entry);

  ship.cargo[name]=(ship.cargo[name]||0)+amount;
  entry.stock-=amount;

  tutorialAdvance('illegal_buy');

function sellIllegalGood(shipId,name,quantity){
  const market=ensureBlackMarket();
  const good=ILLEGAL_GOOD_BY_NAME[name];
  const ship=getShip(shipId);
  const amount=Math.min(Math.floor(Number(quantity)||0),Math.floor(ship?.cargo?.[name]||0));
  if(!market||!good||!ship||ship.status!=='idle'||ship.locationId!==state.portId||amount<1){
    toast('Select an idle ship with that contraband aboard.','bad'); return false;
  }
  const price=blackMarketGoodSellPrice(state.portId,market.goods.find(item=>item.name===name),good);
  const proceeds=amount*price;

  state.stats.illegalSales++;
  logEntry('TRADE','Sold '+amount+' '+good.unit+'(s) of '+name+' through the black market for '+fmtMoney(proceeds,'PESO')+'.');
  tutorialAdvance('illegal_sell');
  toast('Sold '+amount+' '+esc(name)+' for '+fmtMoney(proceeds,'PESO')+'.','good');
  return true;
}
function buyBlackMarketShip(offerId){
  if(PORTS_BY_ID[state.portId]?.blackMarketShips===false){
    toast('Ships are not offered at this black market.','bad'); return false;
  }
  const market=ensureBlackMarket();

  toast('Black-market ship acquired: '+esc(rarity.name)+' '+esc(shipType(ship).name)+'.','good');
  return true;
}
function blackMarketGoodBuyPrice(portId,entry){
  return Math.max(0.01,legacyToCoins(entry.price*(PORTS_BY_ID[portId]?.illegalBuyPriceMultiplier||1),'PESO'));
}
function blackMarketGoodSellPrice(portId,entry,good){
  const basePrice=entry?.price||good.basePrice;
  return Math.max(0.01,legacyToCoins(basePrice*(PORTS_BY_ID[portId]?.illegalSellPriceMultiplier||0.72),'PESO'));
}
function blackMarketCanAffordPesos(amount){
  return Economy.canAfford(currencyCoinsToLegacy(amount,'PESO'),null,{currency:'PESO'});
}
function blackMarketSpendPesos(amount,reason){
  return amount>0&&Economy.removeMoney(currencyCoinsToLegacy(amount,'PESO'),reason,{currency:'PESO'})>0;
}
function blackMarketReceivePesos(amount,reason){
  return amount>0&&Economy.addMoney(currencyCoinsToLegacy(amount,'PESO'),reason,false,{currency:'PESO'})>0;
}
function smeltingCapacity(level){ return SMELTING.capacityBase*Math.pow(SMELTING.capacityMultiplier,level); }
function smeltingUpgradeCost(level){ return level>=SMELTING.maxLevel?0:SMELTING.upgradeCostBase*Math.pow(SMELTING.upgradeCostMultiplier,level); }
function smeltingWeeklyFee(level){ return SMELTING.weeklyFeeBase*Math.pow(SMELTING.weeklyFeeMultiplier,level); }
function smeltingCost(mdpAmount,currency){
  const mdp=mdpInteger(mdpAmount);
  if(!mdp) return 0;
  return floorCoins(Number(mdp)*SMELTING.mdpGrams/silverPerCoin(currency));
}
function smeltingAllCoinsPlan(){
  const sources=Object.entries(state.wallet.coins).filter(([currency])=>CURRENCIES[currency])
    .map(([currency,coins])=>({currency,coins:floorCoins(Math.max(0,Number(coins)||0)),rate:silverPerCoin(currency)}))
    .filter(source=>source.coins>0).sort((a,b)=>a.rate-b.rate);
  const totalSilverG=sources.reduce((total,source)=>total+source.coins*source.rate,0);
  if(!Number.isFinite(totalSilverG)) return {mdp:0n,sourceCoins:{}};
  const centTolerance=Math.max(0.01,...sources.map(source=>source.rate/100));
  let mdp=BigInt(Math.floor(totalSilverG/SMELTING.mdpGrams));
  while(mdp>0n){
    let remainingSilverG=Number(mdp)*SMELTING.mdpGrams;
    const sourceCoins={};
    for(const source of sources){
      const coins=floorCoins(Math.min(source.coins,remainingSilverG/source.rate)+1e-8);
      if(coins<=0) continue;
      sourceCoins[source.currency]=coins;
      remainingSilverG-=coins*source.rate;
      if(remainingSilverG<=1e-6) break;
    }
    if(remainingSilverG<=centTolerance+1e-6) return {mdp,sourceCoins};
    mdp--;
  }
  return {mdp:0n,sourceCoins:{}};
}
function smeltingJobLockedText(job){
  const total=Number(BigInt(job.mdpTotal));
  const remaining=total?Math.max(0,1-Number(BigInt(job.mdpDone))/total):0;
  const sources=job.sourceCoins||{[job.currency]:Number(job.coinsTotal)||Number(job.coinsLocked)||0};
  const locked=Object.entries(sources).filter(([currency,coins])=>CURRENCIES[currency]&&Number(coins)>0)
    .map(([currency,coins])=>fmtMoney(floorCoins(Number(coins)*remaining),currency)+' '+CURRENCIES[currency].name);
  return (locked.join(' + ')||'No coins')+' locked';
}
function ensureSmeltingFacility(portId){
  state.smelting=state.smelting||{facilities:{},jobs:[]};
  state.smelting.facilities=state.smelting.facilities||{};
  state.smelting.jobs=Array.isArray(state.smelting.jobs)?state.smelting.jobs:[];
  if(!state.smelting.facilities[portId]){
    state.smelting.facilities[portId]={level:0,windowEndDay:0,lastProcessedDay:state.gameDay,capacityRemainder:0};
  }
  return state.smelting.facilities[portId];
}
function processSmelting(day){
  if(!state?.smelting?.facilities) return;
  const now=Number.isFinite(day)?day:state.gameDay;
  for(const [portId,facility] of Object.entries(state.smelting.facilities)){
    if(!PORTS_BY_ID[portId]?.blackMarket) continue;
    const windowEnd=Number(facility.windowEndDay)||0;
    const end=Math.min(now,windowEnd);
    const start=Number.isFinite(facility.lastProcessedDay)?facility.lastProcessedDay:end;
    const elapsed=Math.max(0,end-start);
    const runningJobs=state.smelting.jobs.filter(job=>job.portId===portId&&job.status==='running');
    if(elapsed>0){
      facility.lastProcessedDay=end;
      if(runningJobs.length){
        const capacity=smeltingCapacity(clamp(Math.floor(Number(facility.level)||0),0,SMELTING.maxLevel));
        const total=capacity*elapsed+(Number(facility.capacityRemainder)||0);
        let available=BigInt(Math.floor(total));
        facility.capacityRemainder=total-Math.floor(total);
        for(const job of runningJobs){
          if(available<=0n) break;
          const mdpTotal=BigInt(job.mdpTotal);
          const mdpDone=BigInt(job.mdpDone);
          const produced=available<mdpTotal-mdpDone?available:mdpTotal-mdpDone;
          if(produced<=0n) continue;
          job.mdpDone=(mdpDone+produced).toString();
          available-=produced;
          job.coinsLocked=job.mdpDone===job.mdpTotal?0:
            floorCoins(job.coinsTotal*Number(mdpTotal-BigInt(job.mdpDone))/Number(mdpTotal));
          Economy.addMdP(produced,'Smelting at '+PORTS_BY_ID[portId].name);
          if(job.mdpDone===job.mdpTotal){ job.status='completed'; job.coinsLocked=0; }
        }
      } else facility.capacityRemainder=0;
    }
    if(windowEnd>0&&now>=windowEnd){
      facility.windowEndDay=0;
      facility.capacityRemainder=0;
      for(const job of state.smelting.jobs){
        if(job.portId===portId&&job.status==='running') job.status='paused';
      }
    }
  }
}
function startSmeltingJob(portId,amount,currency){
  const mdp=mdpInteger(amount);
  if(!mdp||!PORTS_BY_ID[portId]?.blackMarket||!CURRENCIES[currency]){
    toast('Enter a whole MdP amount and choose a valid source currency.','bad'); return false;
  }
  processSmelting(state.gameDay);
  const facility=ensureSmeltingFacility(portId);
  const coins=smeltingCost(mdp,currency);
  if(!Number.isFinite(coins)||!Economy.canAfford(currencyCoinsToLegacy(coins,currency),null,{currency})){
    toast('Not enough '+CURRENCIES[currency].name+' to start this job.','bad'); return false;
  }
  if(Economy.removeMoney(currencyCoinsToLegacy(coins,currency),'Smelting job',{currency})<=0){
    toast('Could not lock the source coins for this job.','bad'); return false;
  }
  state.smelting.jobs.push({id:uid('smelt'),portId,currency,mdpTotal:mdp.toString(),mdpDone:'0',
    sourceCoins:{[currency]:coins},coinsTotal:coins,coinsLocked:coins,status:facility.windowEndDay>state.gameDay?'running':'paused'});
  toast('Smelting job started; '+fmtMoney(coins,currency)+' locked.','good');
  tutorialAdvance('smelting_start');
  ui.viewDirty=true;
  return true;
}
function startSmeltingAllCoins(portId){
  if(!PORTS_BY_ID[portId]?.blackMarket){ toast('Smelting is only available at a black market.','bad'); return false; }
  processSmelting(state.gameDay);
  const {mdp,sourceCoins}=smeltingAllCoinsPlan();
  if(!mdp){ toast('You need at least 1,000 g silver in coins to start smelting.','bad'); return false; }
  const sources=Object.entries(sourceCoins);
  if(sources.some(([currency,coins])=>!Economy.canAfford(currencyCoinsToLegacy(coins,currency),null,{currency}))){
    toast('Could not verify all wallet coins for smelting.','bad'); return false;
  }
  for(const [currency,coins] of sources){
    if(Economy.removeMoney(currencyCoinsToLegacy(coins,currency),'Smelt all coins',{currency})<=0){
      toast('Could not lock all wallet coins for smelting.','bad'); return false;
    }
  }
  const facility=ensureSmeltingFacility(portId);
  state.smelting.jobs.push({id:uid('smelt'),portId,currency:'MULTI',sourceCoins,mdpTotal:mdp.toString(),mdpDone:'0',
    coinsTotal:0,coinsLocked:0,status:facility.windowEndDay>state.gameDay?'running':'paused'});
  toast('Wallet coins locked for '+fmtMdP(mdp)+' smelting.','good');
  tutorialAdvance('smelting_start');
  ui.viewDirty=true;
  return true;
}
function paySmeltingFee(portId){
  processSmelting(state.gameDay);
  const facility=ensureSmeltingFacility(portId);
  if(facility.windowEndDay>state.gameDay){ toast('The facility fee window is already active.','bad'); return false; }
  const fee=smeltingWeeklyFee(facility.level);
  if(!blackMarketCanAffordPesos(fee)){ toast('Not enough Pesos to pay the weekly smelting fee.','bad'); return false; }
  if(!blackMarketSpendPesos(fee,'Smelting facility · 7-day fee')) return false;
  facility.windowEndDay=state.gameDay+SMELTING.windowDays;
  facility.lastProcessedDay=state.gameDay;
  facility.capacityRemainder=0;
  for(const job of state.smelting.jobs){
    if(job.portId===portId&&job.status==='paused') job.status='running';
  }
  toast('Smelting facility funded for 7 game days.','good');
  ui.viewDirty=true;
  return true;
}
function upgradeSmeltingFacility(portId){
  const facility=ensureSmeltingFacility(portId);
  if(facility.level>=SMELTING.maxLevel){ toast('This smelting facility is already at maximum level.','bad'); return false; }
  const cost=smeltingUpgradeCost(facility.level);
  if(!blackMarketCanAffordPesos(cost)){ toast('Not enough Pesos to upgrade the smelting facility.','bad'); return false; }
  if(!blackMarketSpendPesos(cost,'Smelting facility upgrade')) return false;
  facility.level++;
  toast('Smelting facility upgraded to level '+facility.level+'.','good');
  ui.viewDirty=true;
  return true;
}
function updateSmeltingQuote(){

function marketStatus(price, base){
  const ratio = price/base;
  if(ratio < 0.85) return {label:'Cheap',cls:'cheap',arrow:'▼'};
  if(ratio > 1.20) return {label:'Expensive',cls:'expensive',arrow:'▲'};
  return {label:'Normal',cls:'normal',arrow:'─'};

function referencePrice(commName, portId){
  const c = COMM_BY_NAME[commName];
  const port = PORTS_BY_ID[portId];
  const prod = port.produce[c.category]||1;
  const dem  = port.demand[c.category]||1;
  return c.basePrice * (0.55*prod+0.45) * (0.55*dem+0.45) * 1.02;
}
function contractModifier(){
  const rep = state.reputation;
  let mod;
  if(rep < 25)      mod = weightedPick([[-0.10,1],[-0.05,2],[0,3],[0.03,2],[0.05,1]]);
  else if(rep < 75) mod = weightedPick([[-0.05,1],[0,2],[0.03,3],[0.07,2],[0.12,1]]);
  else if(rep < 150)mod = weightedPick([[0,1],[0.03,2],[0.07,3],[0.12,2],[0.20,1]]);
  else              mod = weightedPick([[0.03,1],[0.07,2],[0.12,3],[0.20,2],[0.25,1]]);
  mod += skillEffectValue('contracts','contract');
  return mod;
}

/* ---------------------------------------------------------------------------
   SHIPS
   --------------------------------------------------------------------------- */
function shipType(ship){ return SHIP_TYPE_BY_ID[ship.typeId]; }
function shipClassLabel(ship){ return shipType(ship).classLabel || 'Class III'; }
function shipSalePrice(ship){
  const type = shipType(ship);
  const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
  return Math.round(type.value * rarity.multiplier * CONFIG.shipSellRatio *
    (0.5 + 0.5*(ship.hull/ship.maxHull)));
}
function sellShips(shipIds){
  const ids = Array.from(new Set(shipIds));
  const ships = ids.map(getShip);
  if(!ships.length || ships.some(ship=>!ship)) return {ok:false,error:'No valid ships selected.'};
  if(portIsClosed(state.portId)) return {ok:false,error:'The port is closed; ships cannot be sold here.'};
  if(state.ships.length - ships.length < 1) return {ok:false,error:'You must keep at least one ship.'};
  if(ships.some(ship=>ship.status!=='idle'||ship.locationId!==state.portId)){
    return {ok:false,error:'Every ship must be idle at your current port.'};
  }
  const proceeds = ships.reduce((total,ship)=>total+shipSalePrice(ship),0);
  for(const ship of ships){
    Economy.addMoney(shipSalePrice(ship),'Ship Sale: '+ship.name);
    logEntry('SHIP',ship.name+' was sold for '+fmtWalletValue(shipSalePrice(ship))+'.');
  }
  const soldIds = new Set(ids);
  state.ships = state.ships.filter(ship=>!soldIds.has(ship.id));
  for(const member of state.crew) if(soldIds.has(member.shipId)) member.shipId=null;
  if(soldIds.has(state.player.vesselId)) state.player.vesselId=state.ships[0].id;
  toast('💵 Sold '+ships.length+' ship(s) for '+fmtWalletValue(proceeds)+'.','good');
  ui.viewDirty=true;
  ui.headerDirty=true;
  return {ok:true,ships,proceeds};
}
function cargoUsed(ship){
  let used = 0;
  for(const k in ship.cargo){
    const c = COMM_BY_NAME[k]||ILLEGAL_GOOD_BY_NAME[k]; if(!c) continue;
    used += ship.cargo[k] * c.cargoFactor;
  }
  return used;
}
function cargoCapacity(ship){
  const t = shipType(ship);
  const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
  let cap = t.cargo;
  const roleEffectMultiplier = crewRoleEffectMultiplier();
  for(const c of crewOfShip(ship.id)){
    const role = ROLE_BY_ID[c.role];
    if(role.cargoMod) cap *= (1+role.cargoMod*roleEffectMultiplier);
  }
  cap *= (1 + skillEffectValue('cargoMastery','capacity'));
  cap *= rarity.multiplier * (1 + (ship.upgrades?.cargo||0)*0.05);
  return Math.round(cap);
}
function cargoList(ship){
  const out = [];
  for(const k in ship.cargo){
    const commodity=COMM_BY_NAME[k]||ILLEGAL_GOOD_BY_NAME[k];
    if(ship.cargo[k] > 0&&commodity) out.push({name:k, qty:ship.cargo[k], unit:commodity.unit});
  }
  return out;
}
function addCargo(ship, commName, qty){
  ship.cargo[commName] = (ship.cargo[commName]||0) + qty;
  if(ship.cargo[commName] <= 1e-9) delete ship.cargo[commName];
}
function shipStats(ship){
  const t = shipType(ship);
  const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
  const upgrades = ship.upgrades || {};
  const crewCap = shipCrewCapacity(ship);
  const crew = crewOfShip(ship.id).filter(c=>!c.training);
  let cannon = t.cannonPower * rarity.multiplier * (1+(upgrades.cannon||0)*0.04);
  let board = t.boarding * rarity.multiplier, combat = 0;
  let speedBonus = 0, escapeBonus = 0, detectBonus = 0, moraleSum = 0;
  let casualtyReduction = 0, repairBonus = 0, rareFind = 0;
  const roleEffectMultiplier = crewRoleEffectMultiplier();
  for(const c of crew){
    const role = ROLE_BY_ID[c.role];
    const lvlMul = 1 + (c.level-1)*0.35;
    const skillMul = 0.75 + (c.skill/100)*0.5;
    let cm = 1;
    for(const tid of c.traits){
      const tr = TRAIT_BY_ID[tid];
      if(tr.combat) cm += tr.combat;
      if(tr.cannon) cannon += tr.cannon*8*lvlMul;
      if(tr.rareFind) rareFind += tr.rareFind;
    }
    if(role.cannon)   cannon += role.cannon*lvlMul*skillMul*cm*roleEffectMultiplier;
    if(role.boarding) board  += role.boarding*lvlMul*skillMul*cm*roleEffectMultiplier;
    if(role.combat)   combat += role.combat*lvlMul*skillMul*cm*roleEffectMultiplier;
    if(role.speedMod) speedBonus += role.speedMod*roleEffectMultiplier;
    if(role.escapeMod) escapeBonus += role.escapeMod*roleEffectMultiplier;
    if(role.detectMod) detectBonus += role.detectMod*roleEffectMultiplier;
    if(role.casualtyMod) casualtyReduction += role.casualtyMod*roleEffectMultiplier;
    if(role.repairMod) repairBonus += role.repairMod*roleEffectMultiplier;
    moraleSum += c.morale;
  }
  const avgMorale = crew.length ? moraleSum/crew.length : 45;
  const leaderBonus = skillEffectValue('leadership','morale');
  const moraleMod = 0.55 + (clamp(avgMorale*(1+leaderBonus),0,100)/100)*0.65;
  const hullMod   = 0.45 + 0.55*(ship.hull/ship.maxHull);
  const crewMod   = clamp(0.45 + 0.55*(crew.length/crewCap), 0.30, 1.15);
  const skillFleet = 1 + skillEffectValue('fleetCommand','strength');
  const skillBoard = 1 + skillEffectValue('boarding','power');
  const skillCannon= 1 + skillEffectValue('cannons','power');
  cannon *= skillCannon; board *= skillBoard;
  combat *= rarity.multiplier;
  const enemyStatMultiplier = Number(ship.enemyStatMultiplier)||1;
  cannon *= enemyStatMultiplier;
  board *= enemyStatMultiplier;
  combat *= enemyStatMultiplier;
  const strength = (cannon*1.0 + board*1.3 + combat*1.6) * moraleMod * hullMod * crewMod * skillFleet;
  const speed = t.speed * rarity.multiplier * (1+(upgrades.speed||0)*0.02) * (Number(ship.enemySpeedMultiplier)||1) *
    (1+Math.min(0.35,speedBonus)) * (0.75+0.25*(ship.hull/ship.maxHull));
  return {
    cannon, board, combat, strength, speed, avgMorale,
    escape: clamp((t.escape + escapeBonus + (rarity.multiplier-1)*0.04) * (Number(ship.enemyEscapeMultiplier)||1), 0.05,
      Number(ship.enemyEscapeMultiplier)>1?1.4:0.98),
    detection: t.detection + detectBonus + rareFind + (rarity.multiplier-1)*0.08,
    stealth: clamp(t.stealth + (rarity.multiplier-1)*0.06, 0, 1),
    casualtyReduction: clamp(casualtyReduction, 0, 0.7),
    repairBonus, crewCount: crew.length, crewCap,
    moraleMod, hullMod, crewMod,
  };
}

function shipCrewCapacity(ship){
  const type=shipType(ship);
  const rarity=SHIP_RARITY_BY_ID[ship.rarity]||SHIP_RARITIES[0];
  return type.crewCap+(ship.upgrades?.crew||0)+Math.floor(type.crewCap*(rarity.multiplier-1)*0.5);
}

function shipUpgradeCost(ship, upgrade){
  const level = ship.upgrades?.[upgrade.id] || 0;
  const ordnanceDiscount = state.ordnanceDiscountUntilDay > state.gameDay ? 0.75 : 1;
  const port=PORTS_BY_ID[state.portId];
  const localDiscount=upgrade.id==='cannon'&&port&&port.cannonUpgradeDiscount
    ? port.cannonUpgradeDiscount : 1;
  return Math.max(1, Math.round(shipType(ship).value * upgrade.cost * Math.pow(level+1,1.35) *
    (SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0]).multiplier *
    (1 - skillEffectValue('dockmaster','upgrade')) * ordnanceDiscount * localDiscount *
    (port?.shipUpgradeCostMultiplier||1)));
}

function shipyardPrice(type,portId){
  const port=PORTS_BY_ID[portId];
  return Math.round(type.price*(port&&port.shipPriceMultiplier||1));
}

function upgradeShip(shipId, upgradeId){
  const ship = getShip(shipId);
  const upgrade = SHIP_UPGRADES.find(item=>item.id===upgradeId);
  if(!ship || !upgrade) return;
  if(portIsClosed(state.portId)){ toast('The port is closed. Shipyard services are unavailable.','bad'); return; }
  if(ship.status!=='idle' || ship.locationId!==state.portId){ toast('Ship upgrades require an idle ship in port.','bad'); return; }
  ship.upgrades = ship.upgrades || {};
  const level = ship.upgrades[upgradeId] || 0;
  if(level>=25){ toast('That upgrade is at its level 25 maximum.'); return; }
  const cost = shipUpgradeCost(ship, upgrade);
  if(!Economy.canAfford(cost)){ toast('Not enough coins. Need '+fmtWalletValue(cost)+'.','bad'); return; }
  Economy.removeMoney(cost, 'Ship Upgrade: '+ship.name+' — '+upgrade.name);
  if(upgradeId==='hull'){
    const factor = 1.08;
    ship.maxHull = Math.round(ship.maxHull*factor);
    ship.hull = Math.min(ship.maxHull, ship.hull*factor);
  }
  ship.upgrades[upgradeId] = level+1;
  logEntry('SHIP', ship.name+' upgraded '+upgrade.name+' to level '+(level+1)+'.');
  tutorialAdvance('upgrade');
  toast(esc(ship.name)+' upgraded: '+esc(upgrade.name)+' '+(level+1)+'/25.','good');
  ui.viewDirty = true;
}

function explorationRewardPerDay(ship, difficulty,originPortId){
  const crew = crewOfShip(ship.id).filter(c=>!c.training);
  if(!crew.length) return 0;
  const stats = shipStats(ship);
  const avgSkill = crew.reduce((sum,c)=>sum+c.skill,0)/crew.length;
  const avgLevel = crew.reduce((sum,c)=>sum+c.level,0)/crew.length;
  const shipFactor = clamp(0.65 + stats.strength/160, 0.75, 1.9);
  const crewFactor = 0.75 + avgSkill/500 + avgLevel/100;
  const reputationFactor = 1 + clamp(state.reputation/250, 0, 1);
  const captainFactor = (1 + skillEffectValue('exploration','reward')) *
    (1 + skillEffectValue('expedition','income'));
  const port=PORTS_BY_ID[originPortId];
  return Math.max(1, Math.round(difficulty.baseReward * shipFactor * crewFactor * reputationFactor * captainFactor *
    (port?.explorationRewardMultiplier||1)));
}

function explorationRiskPerDay(ship, difficulty,originPortId){
  const stats = shipStats(ship);
  const protection = clamp(1.15 - stats.strength/500 - (stats.escape-0.5)*0.35, 0.55, 1.2);
  const skillMitigation = 1 - skillEffectValue('expedition','risk');
  return clamp(difficulty.dailyRisk * protection * skillMitigation *
    (PORTS_BY_ID[originPortId]?.explorationRiskMultiplier||1),0.001,0.5);
}

function dispatchExploration(shipId, difficultyId){
  const ship = getShip(shipId);
  const difficulty = EXPLORATION_BY_ID[difficultyId];
  if(state.travel){ toast('Return to port before dispatching an exploration.','bad'); return; }
  if(!ship || !difficulty) return;
  if(!shipIsActive(ship)){ toast('Activate that ship before dispatching it.','bad'); return; }
  if(ship.status !== 'idle'){ toast('That ship is already assigned.','bad'); return; }
  if(ship.locationId !== state.player.locationId){ toast('That ship is not at your location.','bad'); return; }
  if(!crewOfShip(ship.id).some(c=>!c.training)){ toast('An exploration ship needs available crew.','bad'); return; }

  const task = {
    id: uid('task'), kind: 'exploration',
    shipId: ship.id,
    originPortId: state.portId,
    difficultyId,
    startDay: state.gameDay,
    lastProcessedDay: Math.floor(state.gameDay),
    daysExplored: 0,
    earned: 0,
  };
  state.tasks.push(task);
  ship.status = 'task';
  ship.taskId = task.id;
  const article = /^[aeiou]/i.test(difficulty.name) ? 'an' : 'a';
  logEntry('MISSION', ship.name+' departed on '+article+' '+difficulty.name+' exploration.');
  tutorialAdvance('exploration_dispatch');
  toast('🧭 '+esc(ship.name)+' began '+article+' '+difficulty.name.toLowerCase()+' exploration.','good');
  ui.viewDirty = true;
}

function returnExploration(taskId){
  const index = state.tasks.findIndex(t=>t.id===taskId && t.kind==='exploration');
  if(index < 0) return;
  const task = state.tasks[index];
  const ship = getShip(task.shipId);
  if(ship){ ship.status = 'idle'; ship.taskId = null; }
  state.tasks.splice(index,1);
  tutorialAdvance('exploration_return');
  logEntry('MISSION', (ship ? ship.name : 'An exploration ship')+' returned after '+task.daysExplored+
    ' day(s), earning '+fmtWalletValue(task.earned)+'.');
  toast('⚓ Exploration returned. Earned '+fmtWalletValue(task.earned)+'.','good');
  ui.viewDirty = true;
}

function processExplorationDaily(day){
  for(let i=state.tasks.length-1;i>=0;i--){
    const task = state.tasks[i];
    if(task.kind !== 'exploration' || day <= task.lastProcessedDay) continue;
    task.lastProcessedDay = day;
    const ship = getShip(task.shipId);
    const difficulty = EXPLORATION_BY_ID[task.difficultyId] || EXPLORATION_DIFFICULTIES[0];
    if(!ship){ state.tasks.splice(i,1); continue; }

    task.daysExplored = (task.daysExplored||0) + 1;
    const wear = ship.maxHull * difficulty.hullWear * Math.max(0.5, 1-shipStats(ship).repairBonus) *
      Math.max(0.5, 1-(ship.upgrades?.armor||0)*0.02);
    ship.hull = Math.max(1, ship.hull - wear);
    if(Math.random() < explorationRiskPerDay(ship, difficulty,task.originPortId)){
      const reputationLoss = Math.min(state.reputation, difficulty.reputationLoss);
      state.reputation -= reputationLoss;
      state.ships = state.ships.filter(s=>s.id!==ship.id);
      for(const c of state.crew) if(c.shipId===ship.id) c.shipId = null;
      state.stats.shipsLost++;
      state.tasks.splice(i,1);
      logEntry('COMBAT', ship.name+' was lost during a '+difficulty.name.toLowerCase()+
        ' exploration. Reputation -'+reputationLoss+'.');
      toast('💀 '+esc(ship.name)+' was lost exploring. Reputation -'+reputationLoss+'.','bad');
      ui.headerDirty = true;
      ui.viewDirty = true;
      continue;
    }

    const reward = explorationRewardPerDay(ship, difficulty,task.originPortId);
    task.earned = (task.earned||0) + Economy.addMoney(reward,
      'Exploration: '+ship.name+' ('+difficulty.name+')');
  }
}

function tradingFleetCapacity(task){
  return task.tradeShipIds.reduce((total,id)=>{
    const ship=getShip(id);
    return total+(ship?cargoCapacity(ship):0);
  },0);
}

function tradingTravelDays(task,fromId,toId){
  const speeds=task.tradeShipIds.map(id=>getShip(id)).filter(Boolean).map(ship=>shipStats(ship).speed);
  const speed=speeds.length?Math.min(...speeds):1;
  return Math.max(0.15,baseTravelDays(fromId,toId,speed)*(1-skillEffectValue('navigation','travel')));
}

function beginTradingLeg(task,fromId,day){
  const routeIndex=clamp(Math.floor(Number(task.routeIndex)||0),0,task.routeIds.length);
  const toId=routeIndex<task.routeIds.length?task.routeIds[routeIndex]:task.originId;
  const source=ensureMarket(fromId,false);
  const arrivalDay=day+tradingTravelDays(task,fromId,toId);
  const destination=generateMarket(toId,Math.ceil(arrivalDay));
  const capacity=tradingFleetCapacity(task);
  let best=null;
  for(const commodity of COMMODITIES){
    const buyEntry=source.prices[commodity.name],sellEntry=destination.prices[commodity.name];
    if(!buyEntry||!sellEntry||buyEntry.stock<=0) continue;
    const buyPrice=marketBuyUnitPrice(fromId,buyEntry);
    const sellPrice=marketSellUnitPrice(toId,sellEntry);
    if(sellPrice<=buyPrice*1.03) continue;
    const quantity=Math.min(buyEntry.stock,Math.floor(capacity/commodity.cargoFactor),Math.floor(task.balance/buyPrice));
    if(quantity<=0) continue;
    const margin=(sellPrice-buyPrice)/buyPrice;
    if(!best||margin>best.margin) best={name:commodity.name,quantity,cost:Math.round(quantity*buyPrice),margin};
  }
  task.legFromId=fromId;
  task.legToId=toId;
  task.legStartDay=day;
  task.currentPortId=fromId;
  task.arriveDay=arrivalDay;
  task.phase='out';
  task.legCommodity=best?best.name:null;
  task.legQuantity=best?best.quantity:0;
  task.legCost=best?best.cost:0;
  if(best){
    task.balance-=best.cost;
    source.prices[best.name].stock-=best.quantity;
  }
}

function dispatchAutomatedTrading(shipIds,routePortIds,escortIds,capital,durationDays,indefinite){
  if(state.travel){ toast('Return to port before dispatching a trade fleet.','bad'); return; }
  const routeIds=Array.from(new Set(routePortIds||[]));
  const tradingShips=Array.from(new Set(shipIds||[])).map(getShip).filter(Boolean);
  const escorts=Array.from(new Set(escortIds||[])).map(getShip).filter(Boolean);
  const knownPortIds=Object.keys(state.markets).filter(id=>PORTS_BY_ID[id]);
  if(!routeIds.length||routeIds.some(id=>!PORTS_BY_ID[id]||!state.markets[id]||id===state.portId||portIsClosed(id))||
    routeIds.length>Math.max(0,knownPortIds.length-(knownPortIds.includes(state.portId)?1:0))){
    toast('Build a route using distinct ports with known prices.','bad'); return;
  }
  if(!tradingShips.length){ toast('Select at least one trading ship.','bad'); return; }
  if(tradingShips.some(ship=>!shipIsActive(ship)||ship.status!=='idle'||ship.locationId!==state.portId||!crewOfShip(ship.id).some(member=>!member.training))){
    toast('Every trading ship must be idle here with available crew.','bad'); return;
  }
  if(escorts.some(ship=>tradingShips.includes(ship)||!shipIsActive(ship)||ship.status!=='idle'||ship.locationId!==state.portId||!crewOfShip(ship.id).some(member=>!member.training))){
    toast('Every escort must be a separate idle ship here with available crew.','bad'); return;
  }
  const amount=Math.floor(Number(capital)||0);
  if(amount<=0||!Economy.canAfford(amount)){ toast('Allocate available capital from your funds.','bad'); return; }
  const days=Math.max(1,Math.floor(Number(durationDays)||1));
  const task={
    id:uid('task'),kind:'trading',shipId:tradingShips[0].id,
    shipIds:tradingShips.concat(escorts).map(ship=>ship.id),
    tradeShipIds:tradingShips.map(ship=>ship.id),escortIds:escorts.map(ship=>ship.id),
    originId:state.portId,routeIds,routePortId:routeIds[0],routeIndex:0,currentPortId:state.portId,
    startDay:state.gameDay,lastProcessedDay:Math.floor(state.gameDay),
    indefinite:!!indefinite,durationDays:indefinite?null:days,
    endDay:indefinite?null:state.gameDay+days,
    initialCapital:amount,balance:amount,profit:0,daysTrading:0,
    phase:'out',legCommodity:null,legQuantity:0,legCost:0,events:[],
  };
  Economy.removeMoney(amount,'Trading capital: '+tradingShips.map(ship=>ship.name).join(', '));
  state.tasks.push(task);
  for(const ship of tradingShips.concat(escorts)){ ship.status='task'; ship.taskId=task.id; }
  beginTradingLeg(task,state.portId,state.gameDay);
  logEntry('TRADE',tradingShips.map(ship=>ship.name).join(', ')+' began a trade route: '+
    [task.originId].concat(routeIds,[task.originId]).map(id=>PORTS_BY_ID[id].name).join(' → ')+
    ' with '+fmtWalletValue(amount)+
    ' capital and '+escorts.length+' escort(s).');
  toast('Trade fleet dispatched on a '+routeIds.length+'-stop route.','good');
  ui.viewDirty=true; ui.headerDirty=true;
}

function finishAutomatedTrading(task,hijacked){
  const index=state.tasks.findIndex(item=>item.id===task.id);
  if(index<0) return;
  const lostShips=hijacked?task.shipIds.map(getShip).filter(Boolean):[];
  const lostCrew=hijacked?state.crew.filter(member=>task.shipIds.includes(member.shipId)).length:0;
  if(hijacked){
    const lostIds=new Set(task.shipIds);
    state.ships=state.ships.filter(ship=>!lostIds.has(ship.id));
    state.crew=state.crew.filter(member=>!lostIds.has(member.shipId));
    state.stats.shipsLost+=lostShips.length;
    if(lostIds.has(state.player.vesselId)) state.player.vesselId=state.ships[0]?.id||null;
  } else {
    const locationId=PORTS_BY_ID[task.currentPortId]?task.currentPortId:task.originId;
    for(const id of task.shipIds){
      const ship=getShip(id);
      if(ship){ ship.status='idle'; ship.taskId=null; ship.locationId=locationId; }
    }
    if(task.balance>0) Economy.addMoney(task.balance,'Trading capital returned');
  }
  state.tasks.splice(index,1);
  const result=(task.profit>=0?'profit ':'loss ')+fmtWalletValue(Math.abs(task.profit));
  if(hijacked){
    const shipNames=lostShips.map(ship=>ship.name).join(', ')||'The trading fleet';
    logEntry('COMBAT',shipNames+' were hijacked. All '+lostShips.length+' ship(s), '+lostCrew+' crew member(s), cargo, and '+
      fmtWalletValue(task.balance)+' committed capital were lost; realized '+result+'.');
    toast('Trading fleet hijacked. All ships, crew, cargo, and '+fmtWalletValue(task.balance)+' capital were lost.','bad');
  } else {
    logEntry('TRADE','Trade route ended after '+Math.floor(state.gameDay-task.startDay)+' days with '+result+'. '+fmtWalletValue(task.balance)+' capital returned.');
    toast('Trade route complete: '+result+'. Capital returned to your wallet.','good');
  }
  ui.viewDirty=true; ui.headerDirty=true;
}

function processTradingDaily(day){
  for(const task of state.tasks.slice()){
    if(task.kind!=='trading'||day<=task.lastProcessedDay) continue;
    task.lastProcessedDay=day;
    task.daysTrading=(task.daysTrading||0)+1;
    const escortStrength=task.escortIds.reduce((total,id)=>{
      const ship=getShip(id); return total+(ship?shipStats(ship).strength:0);
    },0);
    const hijackRisk=Math.max(0,0.0035*(1-clamp(escortStrength/500,0,0.82))*(1-skillEffectValue('smuggler','hijack')));
    if(Math.random()<hijackRisk){ finishAutomatedTrading(task,true); continue; }
    if(day<task.arriveDay) continue;
    if(portIsClosed(task.legToId,day)){
      task.arriveDay=Math.max(day+1,portIsRebelled(task.legToId)?day+1:portClosureEndDay(task.legToId));
      continue;
    }
    const market=ensureMarket(task.legToId,false);
    const entry=task.legCommodity?market.prices[task.legCommodity]:null;
    const revenue=entry?Math.round(task.legQuantity*marketSellUnitPrice(task.legToId,entry)):0;
    if(entry&&task.legQuantity>0){
      state.stats.trades++;
      logEntry('TRADE',task.tradeShipIds.length+'-ship trading fleet sold '+task.legQuantity+' '+
        COMM_BY_NAME[task.legCommodity].unit+' '+task.legCommodity+' at '+
        PORTS_BY_ID[task.legToId].name+' for '+fmtWalletValue(revenue)+'.');
    }
    task.balance+=revenue;
    task.profit+=revenue-task.legCost;
    task.currentPortId=task.legToId;
    for(const id of task.shipIds){ const ship=getShip(id); if(ship) ship.locationId=task.currentPortId; }
    const ending=task.recallRequested||(!task.indefinite&&day>=task.endDay);
    if(ending&&task.currentPortId===task.originId){ finishAutomatedTrading(task,false); continue; }
    task.routeIndex=ending?task.routeIds.length:
      task.currentPortId===task.originId?0:task.routeIds.indexOf(task.currentPortId)+1;
    beginTradingLeg(task,task.currentPortId,day);
    ui.viewDirty=true;
  }
}

function recallAutomatedTrading(taskId){
  const task=state.tasks.find(item=>item.id===taskId&&item.kind==='trading');
  if(!task) return;
  if(!task.indefinite){ toast('A timed trading period cannot be recalled early.','bad'); return; }
  const elapsed=state.gameDay-task.startDay;
  if(elapsed<120){ toast('This fleet can be recalled after 120 days ('+Math.ceil(120-elapsed)+' days remaining).','bad'); return; }
  task.recallRequested=true;
  toast('Recall ordered. The fleet will return to its origin after the next port.','good');
  ui.viewDirty=true;
}

function repairCost(ship){
  const missing = ship.maxHull - ship.hull;
  const t = shipType(ship);
  const port=PORTS_BY_ID[state.portId];
  return Math.max(1, Math.round(missing * (t.value / t.maxHull || t.value / t.hull) * 0.35 *
    (1 - skillEffectValue('pathfinder','repair'))*(port?.repairCostMultiplier||1)));
}
function repairShip(ship){
  if(portIsClosed(state.portId)){ toast('The port is closed. Shipyard services are unavailable.','bad'); return; }
  if(ship.hull >= ship.maxHull){ toast('Hull is already sound.'); return; }
  const cost = repairCost(ship);
  if(!Economy.canAfford(cost)){ toast('Not enough coins. Need '+fmtWalletValue(cost)+'.','bad'); return; }
  Economy.removeMoney(cost, 'Repair: '+ship.name);
  ship.hull = ship.maxHull;
  tutorialAdvance('repair');
  logEntry('SHIP', ship.name+' was fully repaired for '+fmtWalletValue(cost)+'.');
  toast('🔧 '+esc(ship.name)+' repaired.','good');
  ui.viewDirty = true;
}

function refreshCrewPool(force,count){
  const day = Math.floor(state.gameDay);
  if(!force && state.crewPoolDay === day) return;
  state.crewPoolDay = day;
  const port = PORTS_BY_ID[state.portId];
  const baseCount=PORT_CREWCOUNT[port.size]||6;
  const n=Number.isFinite(count)?clamp(Math.floor(count),25,100):
    baseCount*(state.reputation>800?rndInt(1,10):1);
  const poolCount=Math.max(1,Math.round(n*(port.crewPoolMultiplier||1)));
  state.crewPool = [];
  for(let i=0;i<poolCount;i++){
    const level = Math.min(10,weightedPick([[1,50],[2,28],[3,14],[4,6],[5,2]])+(port.crewLevelBonus||0));
    state.crewPool.push(makeCrewMember(pick(CREW_ROLES).id, {level}));
  }
}
function recruitCost(member){
  const role = ROLE_BY_ID[member.role];
  const base = Math.round(member.salary * 1.5 + (member.level-1)*40 + role.baseSalary);
  const port=PORTS_BY_ID[state.portId];
  return Math.max(1, Math.round(base * (1 - skillEffectValue('haggler','recruit')) *
    (port&&port.recruitCostMultiplier||1)));
}
function recruitCrew(memberId){
  if(portIsClosed(state.portId)){ toast('The port is closed. The hiring hall is unavailable.','bad'); return; }
  const idx = state.crewPool.findIndex(c=>c.id===memberId);
  if(idx < 0) return;
  const m = state.crewPool[idx];
  const cost = recruitCost(m);
  if(!Economy.canAfford(cost)){ toast('Not enough coins. Need '+fmtWalletValue(cost)+'.','bad'); return; }
  Economy.removeMoney(cost, 'Recruit: '+m.name);
  state.crewPool.splice(idx,1);
  state.crew.push(m);
  logEntry('CREW', m.name+' ('+ROLE_BY_ID[m.role].name+', Lv'+m.level+') joined for '+fmtWalletValue(cost)+'. Salary '+fmtWalletValue(m.salary)+'/month.');
  toast('🧑‍✈️ '+esc(m.name)+' joined.','good');
  autoAssignCrew(true);
  tutorialAdvance('recruit');
  ui.viewDirty = true;
  ui.headerDirty = true;
}
function recruitAllCrew(){
  if(portIsClosed(state.portId)){ toast('The port is closed. The hiring hall is unavailable.','bad'); return false; }
  const candidates=state.crewPool.slice();
  if(!candidates.length){ toast('No crew candidates are available.','bad'); return false; }
  const totalCost=candidates.reduce((total,member)=>total+recruitCost(member),0);
  if(!Economy.canAfford(totalCost)){
    toast('Recruiting all '+candidates.length+' candidates requires '+fmtWalletValue(totalCost)+'.','bad');
    return false;
  }
  if(!confirm('Recruit all '+candidates.length+' available crew for '+fmtWalletValue(totalCost)+'?')) return false;
  for(const member of candidates){
    Economy.removeMoney(recruitCost(member),'Recruit: '+member.name);
    state.crew.push(member);
    logEntry('CREW',member.name+' ('+ROLE_BY_ID[member.role].name+', Lv'+member.level+') joined for '+
      fmtWalletValue(recruitCost(member))+'. Salary '+fmtWalletValue(member.salary)+'/month.');
  }
  state.crewPool=[];
  autoAssignCrew(true);
  tutorialAdvance('recruit');
  toast('Recruited '+candidates.length+' crew for '+fmtWalletValue(totalCost)+'.','good');
  ui.viewDirty=true;
  ui.headerDirty=true;
  return true;
}
function dismissCrew(crewId){
  const idx = state.crew.findIndex(c=>c.id===crewId);
  if(idx < 0) return;
  const c = state.crew[idx];
  state.crew.splice(idx,1);
  logEntry('CREW', c.name+' was dismissed from the crew.');
  ui.viewDirty = true;
}
function dismissUnassignedCrew(){
  const unassigned=state.crew.filter(member=>!member.shipId||!getShip(member.shipId));
  if(!unassigned.length) return 0;
  unassigned.forEach(member=>dismissCrew(member.id));
  return unassigned.length;
}
function autoAssignCrew(silent){
  const ships = state.ships.filter(ship=>ship.status==='idle'&&shipIsActive(ship));
  if(!ships.length){ if(!silent) toast('No active idle ships in the fleet.','bad'); return; }

  const shipIds = new Set(ships.map(s=>s.id));
  const movable = state.crew.filter(c=>!c.training && (!c.shipId || shipIds.has(c.shipId)));
  if(!movable.length){ if(!silent) toast('No available crew to assign.','bad'); return; }

  const capacities = new Map(ships.map(ship=>[ship.id, shipStats(ship).crewCap]));
  const counts = new Map(ships.map(ship=>[ship.id, crewOfShip(ship.id).filter(member=>member.training).length]));
  const assignments = new Map();
  const eligibleShips = ships.slice();

  for(const member of movable){
    let bestShip = null;
    let bestScore = Infinity;
    for(const ship of eligibleShips){
      const current = counts.get(ship.id) || 0;
      const cap = capacities.get(ship.id) || 0;
      const score = current + (member.shipId === ship.id ? 0.25 : 0);
      if(current < cap && score < bestScore){
        bestScore = score;
        bestShip = ship;
      }
    }
    assignments.set(member.id, bestShip ? bestShip.id : null);
    if(bestShip) counts.set(bestShip.id, counts.get(bestShip.id) + 1);
  }

  let changed = 0;
  for(const member of movable){
    const shipId = assignments.get(member.id) || null;
    if(member.shipId !== shipId){ member.shipId = shipId; changed++; }
  }
  if(changed && !silent){
    logEntry('CREW', 'Crew assignments balanced across '+ships.length+' idle ship(s).');
    ui.viewDirty = true;
  }
  const unassigned = movable.length - Array.from(assignments.values()).filter(v=>v).length;
  if(!silent){
    toast(changed
      ? 'Crew assignments balanced across the idle fleet. '+unassigned+' crew left unassigned.'
      : 'Crew assignments across the idle fleet are already balanced.', changed ? 'good' : '');
  }
}

function fillAllShipsStatus(){
  const ships=state.ships.filter(ship=>ship.status==='idle'&&shipIsActive(ship));
  const shipIds=new Set(ships.map(ship=>ship.id));
  const totalCapacity=ships.reduce((total,ship)=>total+shipCrewCapacity(ship),0);
  let assignedCrew=0;
  let trainingCrew=0;
  let availableUnassigned=0;
  for(const member of state.crew){
    if(shipIds.has(member.shipId)){
      if(member.training) trainingCrew++;
      else assignedCrew++;
    }
    else if(!member.training&&!member.shipId) availableUnassigned++;
  }
  const vacancies=Math.max(0,totalCapacity-trainingCrew-assignedCrew);
  return {ships,vacancies,availableUnassigned,requiredCrew:Math.max(0,vacancies-availableUnassigned)};
}

function fillAllIdleShips(){
  if(state.travel){ toast('Return to port before hiring crew for your fleet.','bad'); return false; }
  if(portIsClosed(state.portId)){ toast('The port is closed. The hiring hall is unavailable.','bad'); return false; }
  const plan=fillAllShipsStatus();
  if(!plan.ships.length){ toast('No active idle ships are available to fill.','bad'); return false; }
  if(!plan.vacancies){ toast('All active idle ships are already fully crewed.'); return false; }
  if(!plan.requiredCrew){
    autoAssignCrew(true);
    toast('Available crew assigned across '+plan.ships.length+' active idle ships.','good');
    ui.viewDirty=true;
    return true;
  }

  const hires=Array.from({length:plan.requiredCrew},()=>{
    const level=weightedPick([[1,50],[2,28],[3,14],[4,6],[5,2]]);
    return makeCrewMember(pick(CREW_ROLES).id,{level});
  });
  const baseCost=hires.reduce((total,member)=>total+recruitCost(member),0);
  const surcharge=Math.round(baseCost*CONFIG.crewFillAllSurcharge);
  const totalCost=baseCost+surcharge;
  if(!Economy.canAfford(totalCost)){
    toast('Filling '+plan.vacancies+' open berths requires '+fmtWalletValue(totalCost)+'.','bad');
    return false;
  }
  if(!confirm('Hire '+hires.length+' crew to fill '+plan.vacancies+' open berths across '+plan.ships.length+
    ' active idle ships? Base hiring cost: '+fmtWalletValue(baseCost)+'. Fleet-fill surcharge (500%): '+
    fmtWalletValue(surcharge)+'. Total: '+fmtWalletValue(totalCost)+'.')) return false;

  Economy.removeMoney(totalCost,'Fleet Crew Fill ('+hires.length+' hires; 500% surcharge)');
  state.crew.push(...hires);
  autoAssignCrew(true);
  logEntry('CREW','Hired '+hires.length+' crew to fill '+plan.ships.length+' active idle ships for '+
    fmtWalletValue(totalCost)+' including a 500% surcharge.');
  tutorialAdvance('recruit');
  toast('Hired '+hires.length+' crew and filled the active idle fleet for '+fmtWalletValue(totalCost)+'.','good');
  ui.viewDirty=true;
  ui.headerDirty=true;
  return true;
}

function applyMoraleAction(actionId){
  const action = MORALE_ACTIONS.find(a=>a.id===actionId);
  if(!action) return;
  const cost=moraleActionCost(action,state.portId);
  if(!Economy.canAfford(cost)){ toast('Not enough coins. Need '+fmtWalletValue(cost)+'.','bad'); return; }
  if(state.crew.length === 0){ toast('No crew to reward.','bad'); return; }
  Economy.removeMoney(cost, 'Morale: '+action.name);
  const expires = state.gameDay + action.days;
  for(const c of state.crew){
    c.morale = clamp(c.morale + action.morale, 0, 100);
    c.moraleBuffs = c.moraleBuffs || [];
    c.moraleBuffs.push({name: action.name, amount: action.morale, expiresDay: expires});
  }
  logEntry('CREW', action.name+' — all crew morale +'+action.morale+' for '+action.days+' days (cost '+fmtWalletValue(cost)+').');
  toast('🎉 '+esc(action.name)+' — crew morale improved!','good');
  ui.viewDirty = true;
}
function moraleActionCost(action,portId){
  const payroll=state.crew.reduce((total,member)=>total+member.salary,0);
  const baseCost=action.costPct?Math.round(payroll*action.costPct):action.cost;
  return Math.round(baseCost*(PORTS_BY_ID[portId]?.moraleActionCostMultiplier||1));
}

function upgradeCrewFacility(facilityId){
  const facility=CREW_FACILITY_BY_ID[facilityId];
  if(!facility) return;
  const level=crewFacilityLevel(facilityId);
  if(level>=facility.maxLevel){ toast(facility.name+' is fully upgraded.'); return; }
  const cost=crewFacilityUpgradeCost(facility);
  if(!Economy.canAfford(cost)){ toast('Not enough coins. Need '+fmtWalletValue(cost)+'.','bad'); return; }
  Economy.removeMoney(cost,'Crew Facility: '+facility.name+' Level '+(level+1));
  state.facilities[facilityId]=level+1;
  logEntry('CREW',facility.name+' upgraded to level '+(level+1)+'.');
  toast(esc(facility.name)+' upgraded to level '+(level+1)+'.','good');
  ui.viewDirty=true;
}

function startTraining(crewId, trainingId){
  const c = getCrew(crewId);
  const tr = TRAINING_BY_ID[trainingId];
  if(!c || !tr) return;
  const terms=trainingTerms(tr,state.portId);
  if(c.training){ toast('Already training.','bad'); return; }
  if(c.shipId){
    const ship = getShip(c.shipId);
    if(ship && ship.status === 'task'){ toast('That crew member is at sea.','bad'); return; }
  }
  if(c.skill >= 100){ toast(c.name+' is already a master.','bad'); return; }
  if(!Economy.canAfford(terms.cost)){ toast('Not enough coins. Need '+fmtWalletValue(terms.cost)+'.','bad'); return; }
  Economy.removeMoney(terms.cost, 'Training: '+c.name+' — '+tr.name);
  c.training = {
    type: trainingId,
    startDay: state.gameDay,
    endDay: state.gameDay + terms.days,
    cost: terms.cost,
    completed: false,
  };
  c.morale = clamp(c.morale - CONFIG.trainingMoraleCost, 0, 100);
  state.stats.trainingsStarted++;
  logEntry('CREW', c.name+' began '+tr.name+' ('+terms.days+' days, '+fmtWalletValue(terms.cost)+').');
  toast('📚 '+esc(c.name)+' began training.','good');
  ui.viewDirty = true;
}
function trainingTerms(training,portId){
  const port=PORTS_BY_ID[portId];
  return {
    cost:Math.max(1,Math.round(training.cost*(port?.trainingCostMultiplier||1))),
    days:Math.max(0.1,Math.round(training.days*(port?.trainingDurationMultiplier||1)*100)/100),
  };
}
function processTrainingCompletion(){
  let completed = false;
  for(const c of state.crew){
    if(!c.training || c.training.completed) continue;
    if(state.gameDay >= c.training.endDay){
      const tr = TRAINING_BY_ID[c.training.type];
      if(!tr){ c.training = null; continue; }
      c.training.completed = true;
      c.skill = clamp(c.skill + tr.skillGain, 0, 100);
      c.morale = clamp(c.morale + (tr.morale||0), 0, 100);
      c.salary = computeSalary(c.role, c.level, c.skill, c.traits);
      if(Math.random() < 0.25 && c.level < 10){
        c.level++;
        c.salary = computeSalary(c.role, c.level, c.skill, c.traits);
      }
      state.stats.trainingsDone++;
      logEntry('CREW', c.name+' completed '+tr.name+'. Skill +'+tr.skillGain+'.');
      toast('🎓 '+esc(c.name)+' finished training.','good');
      c.training = null;
      completed = true;
    }
  }
  if(completed) ui.viewDirty = true;
}

function processPayroll(){
  if(state.gameDay < state.nextPayrollDay) return;
  const period = Math.floor(state.nextPayrollDay);
  const already = state.log.some(l=>l.dedupeId === 'payroll_'+period);
  if(already){
    state.nextPayrollDay = period + CONFIG.daysPerMonth;
    return;
  }
  const totalSalary = crewPayrollCost();
  if(totalSalary === 0){
    state.nextPayrollDay = period + CONFIG.daysPerMonth;
    return;
  }
  if(Economy.canAfford(totalSalary)){
    Economy.removeMoney(totalSalary, 'Monthly Crew Payroll (Day '+period+')');
    state.stats.payrollsPaid++;
    for(const c of state.crew){
      c.lastPayrollMisses = 0;
      c.loyalty = clamp(c.loyalty + 2, 0, 100);
      c.morale = clamp(c.morale + 1, 0, 100);
    }
    logEntry('PAYROLL', 'Paid crew wages: '+fmtWalletValue(totalSalary)+' for '+state.crew.length+' crew.', {dedupeId:'payroll_'+period});
    toast('💼 Payroll paid — '+fmtWalletValue(totalSalary),'good');
  } else {
    state.stats.payrollsMissed++;
    for(const c of state.crew){
      c.lastPayrollMisses = (c.lastPayrollMisses||0) + 1;
      const miss = Math.min(c.lastPayrollMisses, CONFIG.payrollGraceMisses);
      const penalty = CONFIG.payrollMoralePenalty[miss-1] || CONFIG.payrollMoralePenalty[CONFIG.payrollMoralePenalty.length-1];
      c.morale = clamp(c.morale - penalty, 0, 100);
      c.loyalty = clamp(c.loyalty - (penalty*0.8), 0, 100);
    }
    logEntry('PAYROLL', 'Payroll MISSED! Crew wages of '+fmtWalletValue(totalSalary)+' could not be paid.', {dedupeId:'payroll_'+period});
    toast('⚠️ Payroll missed — morale falling!','bad');
  }
  state.nextPayrollDay = period + CONFIG.daysPerMonth;
  ui.viewDirty = true;
  ui.headerDirty = true;
}
function crewPayrollCost(){
  return Math.round(state.crew.reduce((total,member)=>total+member.salary,0)*crewPayrollMultiplier());
}
function crewPayrollMultiplier(){
  const port=PORTS_BY_ID[state.portId];
  const docked=!state.travel&&(!port?.payrollControlledOnly||portIsControlled(state.portId));
  return docked?(port?.payrollMultiplier||1):1;
}

function processMaintenance(){
  if(state.gameDay < state.nextMaintenanceDay) return;
  const period = Math.floor(state.nextMaintenanceDay);
  const dedupeId = 'maintenance_'+period;
  if(state.log.some(entry=>entry.dedupeId===dedupeId)){
    state.nextMaintenanceDay = period + CONFIG.daysPerMonth;
    return;
  }
  let due = 0, paid = 0, repaired = 0;
  for(const ship of state.ships){
    const shipDue = shipMonthlyMaintenance(ship);
    due += shipDue;
    if(shipDue <= 0) continue;
    const shipPaid = Economy.removeMoney(shipDue,'Monthly Ship Maintenance: '+ship.name);
    paid += shipPaid;
    if(shipPaid >= shipDue){ ship.hull=ship.maxHull; repaired++; }
  }
  logEntry('SHIP', 'Ship maintenance: '+fmtWalletValue(paid)+' paid of '+fmtWalletValue(due)+'. '+
    repaired+' ship(s) repaired to full hull.', {dedupeId});
  state.nextMaintenanceDay = period + CONFIG.daysPerMonth;
  ui.viewDirty = true;
}

function processLoan(){
  const loan = state.bankLoan;
  if(!loan) return;
  if(!loan.warned && state.gameDay >= loan.dueDay - 7){
    loan.warned = true;
    const daysLeft = Math.max(0, Math.ceil(loan.dueDay - state.gameDay));
    const currency=currencyForPort(loan.originPortId||state.portId);
    logEntry('ECONOMY', 'Merchant loan due in '+daysLeft+' day(s). Balance due: '+fmtMoney(loan.remaining,currency)+'.');
    toast('⚠️ Merchant loan due in '+daysLeft+' day(s).','bad');
  }
  while(state.gameDay >= loan.nextLateFeeDay){
    const fee = Math.round(loan.remaining * BANKING.lateFeeRate);
    loan.remaining += fee;
    loan.feesCharged += fee;
    loan.totalDue = loan.principal + loan.interest + loan.feesCharged;
    state.reputation = clamp(state.reputation - 2, 0, 1000);
    const currency=currencyForPort(loan.originPortId||state.portId);
    logEntry('ECONOMY', 'Late fee charged on merchant loan: '+fmtMoney(fee,currency)+'. Remaining balance '+fmtMoney(loan.remaining,currency)+'. Reputation -2.');
    toast('Late fee: '+fmtMoney(fee,currency)+'. Reputation -2.','bad');
    loan.nextLateFeeDay += BANKING.lateFeeIntervalDays;
  }
}

function shipMonthlyMaintenance(ship){
  const missingHull = clamp(1 - ship.hull/ship.maxHull,0,1);
  if(missingHull<=0) return 0;
  const discount = Math.max(0.05, 1 - shipStats(ship).repairBonus - skillEffectValue('pathfinder','maintenance'));
  const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
  return Math.max(1,Math.round(shipType(ship).maintenance*missingHull*discount*rarity.multiplier));
}
function fleetMonthlyMaintenance(){
  return state.ships.reduce((total,ship)=>total+shipMonthlyMaintenance(ship),0);
}

function controlledPortsValue(){
  return PORTS.reduce((total,port)=>total+
    (portIsControlled(port.id)?portCoinsToLegacy(Math.max(0,portMonthlyRevenueEstimate(port.id))*12,port.id):0),0);
}

function claimDailyReward(){
  const today = new Date().toISOString().slice(0,10);
  const rewardState = state.dailyReward || (state.dailyReward={lastClaimDate:null,streak:0});
  if(rewardState.lastClaimDate === today){ toast('Today’s reward has already been claimed.'); return; }
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  rewardState.streak = Math.min(30,rewardState.lastClaimDate === yesterday ? rewardState.streak+1 : 1);
  rewardState.lastClaimDate = today;
  const amount=5*rewardState.streak;
  grantMarineBonds(amount,'marine');
  logEntry('ECONOMY', 'Claimed '+amount+' Marine Bond share(s) (day '+rewardState.streak+' streak).');
  toast('Daily reward: '+amount+' Marine Bond share(s) · '+rewardState.streak+' day streak.','good');
  ui.viewDirty = true;
}

function dailyRewardStatus(){
  const rewardState = state.dailyReward || (state.dailyReward={lastClaimDate:null,streak:0});
  const today = new Date().toISOString().slice(0,10);
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const nextStreak=Math.min(30,rewardState.lastClaimDate===yesterday?rewardState.streak+1:1);
  return {claimed:rewardState.lastClaimDate===today,streak:rewardState.streak,
    amount:5*nextStreak};
}

   MISSIONS
   --------------------------------------------------------------------------- */
function refreshMissions(force){
  const day = Math.floor(state.gameDay);
  if(!force && state.missionDay === day) return;
  state.missionDay = day;
  const port = PORTS_BY_ID[state.portId];
  const sizeBonus = {'Small':0,'Medium':0,'Large':1,'Extra Large':2}[port.size] || 0;
  const count = 4 + sizeBonus + (state.reputation > 100 ? 1 : 0);
  const pool = MISSION_TEMPLATES.filter(m=>state.reputation >= m.minRep);
  const list = [];
  for(let i=0;i<count;i++){
    const tmpl = pool.length ? pick(pool) : MISSION_TEMPLATES[0];
    const tier = clamp(1 + Math.floor(state.reputation/30) + sizeBonus, 1, 8);
    const scale = 1 + (tier-1)*0.55;
    const rscale = 1 + (tier-1)*0.80;
    const difficulty = rnd(tmpl.diff[0], tmpl.diff[1]) * scale;
    const rewardMin = Math.round(tmpl.reward[0] * rscale);
    const rewardMax = Math.round(tmpl.reward[1] * rscale);
    const days = rnd(tmpl.baseDays[0], tmpl.baseDays[1]) * (1 + (tier-1)*0.06);
    let riskLabel = 'Low';
    const diffNorm = difficulty / (60 + tier*40);
    if(diffNorm > 1.35) riskLabel = 'Very High';
    else if(diffNorm > 0.85) riskLabel = 'High';
    else if(diffNorm > 0.45) riskLabel = 'Medium';
    list.push({
      id: uid('mis'),
      typeId: tmpl.id, name: tmpl.name, desc: tmpl.desc,
      days: Math.round(days*100)/100,
      difficulty: Math.round(difficulty),
      rewardMin, rewardMax,
      repMin: tmpl.rep[0], repMax: tmpl.rep[1],
      risk: riskLabel, roles: tmpl.roles, aggression:!!tmpl.aggression,
      targetFaction:tmpl.targetFaction||null,wantedGain:tmpl.wantedGain||0,wantedReduction:tmpl.wantedReduction||0,
      portId: state.portId, tier,
    });
  }
  state.missions = list;
}
function missionIsLegendary(m){ return m.tier >= 6; }
function combatDurationScale(power){

}
function missionDurationDays(mission,ships){

  return mission.days*combatDurationScale(fleetPower);
}
function dispatchMission(missionId, shipId, approachId){

  if(ships.some(ship=>ship.locationId!==state.player.locationId)){ toast('Every mission ship must be at your location.','bad'); return; }

  if(m.wantedGain) addWanted(m.wantedGain,'attacking '+(m.targetFaction||'a non-pirate fleet'));
  const approach = MISSION_APPROACH_BY_ID[approachId] || MISSION_APPROACH_BY_ID.balanced;
  const durationDays=missionDurationDays(m,ships);
  const task = {

  state.tasks.push(task);

  toast('⛵ '+ships.length+' ship(s) deployed on '+esc(m.name)+'.','good');

function missionRoleBonus(typeId, shipId){
  const mission = MISSION_BY_ID[typeId];
  if(!mission) return 0;
  const recommended = new Set(mission.roles.map(name=>name.toLowerCase()));
  const shipIds = Array.isArray(shipId) ? shipId : [shipId];
  const specialists = shipIds.flatMap(id=>crewOfShip(id)).filter(c=>
    !c.training && recommended.has(ROLE_BY_ID[c.role].name.toLowerCase())
  ).length;
  return Math.min(0.18, specialists*0.06);
}

function resolveMission(task){
  if(task.marineMission){ resolveMarineMission(task); return; }
  const ships = (task.shipIds || [task.shipId]).map(getShip).filter(Boolean);
  if(!ships.length) return;
  const ship = ships[0];
  for(const missionShip of ships){ missionShip.status='idle'; missionShip.taskId=null; }
  const shipStatsList = ships.map(shipStats);
  const stats = {
    strength: shipStatsList.reduce((total,item)=>total+item.strength,0),
    casualtyReduction: clamp(shipStatsList.reduce((total,item)=>total+item.casualtyReduction,0)/ships.length+
      fleetSupportCasualtyReduction(ships),0,0.9),
  };
  const approach = MISSION_APPROACH_BY_ID[task.approachId] || MISSION_APPROACH_BY_ID.balanced;
  const enemyMod = 1 - skillEffectValue('intimidation','enemy');
  const specialistBonus = missionRoleBonus(task.typeId, ships.map(item=>item.id));
  const diff = task.difficulty * enemyMod * (1-specialistBonus) * approach.difficulty * (1+0.35*(ships.length-1));
  const power = stats.strength;
  const chance = clamp(0.35 + 0.5*Math.tanh((power-diff)/(diff*1.2+20)), 0.05, 0.95);
  const roll = Math.random();
  const success = roll < chance;
  const margin = (power - diff)/(diff+40);
  debugKV('MISSION RESOLVE', {
    mission: task.name, approach: approach.name, power: power.toFixed(1), difficulty: diff.toFixed(1),
    chance: (chance*100).toFixed(1)+'%', roll: roll.toFixed(3), success,
  });
  let reward = 0, repDelta = 0, hullDamage = 0, casualties = 0;
  let cargoRewardText = '';
  const narrative = [];
  if(specialistBonus > 0) narrative.push('Specialist crew improved mission odds by '+Math.round(specialistBonus*100)+'%.');
  if(success){
    const base = rnd(task.rewardMin, task.rewardMax);
    let mult = 1 + clamp(margin,-0.25,0.55);
    mult *= 1 + skillEffectValue('exploration','reward');
    if(task.typeId === 'treasure') mult *= 1 + skillEffectValue('treasureSense','value');
    mult *= (1 + specialistBonus) * approach.reward;
    reward = Math.round(base * mult);
    repDelta = Math.round(rnd(task.repMin, task.repMax) * (1 + skillEffectValue('renown','reputation')));
    hullDamage = Math.round(ship.maxHull * rnd(0.02,0.14) * approach.hull);
    casualties = Math.round((Math.random() < 0.35 ? rndInt(0,1+Math.floor(task.tier/2)) : 0) * approach.casualties);
    narrative.push('The '+task.name.toLowerCase()+' succeeded.');
    if(task.wantedReduction){
      const reduction=Math.min(state.wantedLevel,task.wantedReduction);
      state.wantedLevel-=reduction;
      narrative.push('Escort duty reduced wanted level by '+reduction+'.');
    }

    if(task.typeId !== 'treasure'){
      const cargoChance = clamp(0.25 + task.tier*0.05 + state.reputation/500, 0.2, 0.8);
      if(Math.random() < cargoChance){
        const categoryMap = {
          smuggling: ['food','textile','luxury_good','beverage'],
          supply_run: ['food','textile','luxury_good','beverage'],
          raid: ['metal','precious_metal','luxury_good','spice'],
          naval: ['metal','precious_metal','luxury_good','spice'],
          pirate_hunt: ['metal','precious_metal','luxury_good','spice'],
          salvage: ['raw_material','construction','metal'],
          chart_recovery: ['raw_material','construction','metal'],
        };
        const cats = categoryMap[task.typeId] || ['food','raw_material','textile','construction','luxury_good'];
        const available = COMMODITIES.filter(c => cats.includes(c.category));
        if(available.length){
          const count = rndInt(1, Math.min(3, available.length));
          const cargoParts = [];
          for(let i=0;i<count;i++){
            const comm = pick(available);
            let baseQty = rndInt(5, 15) * (1 + task.tier*0.5) * (1 + state.reputation/200);
            let qty = Math.max(1, Math.round(baseQty));
            const added = addCargoToFleet(ships, comm.name, qty);
            if(added > 0){
              cargoParts.push(added + ' ' + comm.unit + ' ' + comm.name);
            }
          }
          if(cargoParts.length){
            cargoRewardText = cargoParts.join(', ');
            narrative.push('Cargo seized: '+cargoRewardText+'.');
          }
        }
      }
    }
  } else {
    reward = Math.round(rnd(0, task.rewardMin*0.22));
    repDelta = -Math.round(rnd(1,3) + task.tier);
    hullDamage = Math.round(ship.maxHull * rnd(0.12,0.38) * approach.hull);
    casualties = Math.round(rndInt(0, 1+Math.floor(task.tier/2)) * approach.casualties);
    narrative.push('The '+task.name.toLowerCase()+' ended badly.');
  }
  const ev = weightedEvent(success ? null : 'bad',task.originId);
  const evText = applyEventEffect(ev, ship, task);
  if(evText) narrative.push(evText);
  const damageRatio = hullDamage / ship.maxHull;
  for(const missionShip of ships){
    const armor = Math.max(0.5,1-(missionShip.upgrades?.armor||0)*0.02);
    missionShip.hull = clamp(missionShip.hull - Math.round(missionShip.maxHull*damageRatio*armor), 1, missionShip.maxHull);
  }
  if(ship.hull < ship.maxHull*0.2 && success){
    state.stats.survivor = 1;
    narrative.push('The hull barely held together.');
  }
  if(casualties > 0){
    const crew = ships.flatMap(missionShip=>crewOfShip(missionShip.id));
    let removed = 0;
    for(let i=0;i<casualties;i++){
      if(Math.random() < stats.casualtyReduction) continue;
      if(!crew.length) break;
      const victim = crew.splice(Math.floor(Math.random()*crew.length),1)[0];
      const idx = state.crew.findIndex(c=>c.id===victim.id);
      if(idx>=0){ state.crew.splice(idx,1); removed++; }
    }
    if(removed) narrative.push(removed+' crew member(s) lost.');
    else narrative.push('The surgeon saved the wounded.');
  }
  if(!success && ship.hull <= 1 && Math.random() < 0.22){
    const idx = state.ships.findIndex(s=>s.id===ship.id);
    if(idx >= 0 && state.ships.length > 1){
      state.ships.splice(idx,1);
      state.stats.shipsLost++;
      repDelta -= 15;
      logEntry('COMBAT', ship.name+' was lost at sea. The crew scattered.');
      toast('💀 <b>'+esc(ship.name)+'</b> was lost!','bad');
      for(const c of state.crew) if(c.shipId === ship.id) c.shipId = null;
      state.reputation = clamp(state.reputation + repDelta, 0, 1000);
      if(reward > 0) Economy.addMoney(reward, 'Mission salvage: '+task.name);
      ui.viewDirty = true;
      return;
    } else {
      ship.hull = 1;
      narrative.push('The ship limped home, barely afloat.');
    }
  }
  if(reward > 0) Economy.addMoney(reward, 'Mission: '+task.name);
  state.reputation = clamp(state.reputation + repDelta, 0, 1000);
  state.stats.missionsDone++;
  if(!success) state.stats.missionsFailed++;
  if(task.typeId === 'treasure' && success) state.stats.treasures++;
  if((task.typeId==='raid'||task.typeId==='naval'||task.typeId==='pirate_hunt') && success) state.stats.battlesWon++;
  if(missionIsLegendary(task) && success) state.stats.legendaryMissions++;
  for(const c of ships.flatMap(missionShip=>crewOfShip(missionShip.id))){
    c.morale = clamp(c.morale + (success ? rndInt(2,7) : -rndInt(3,9)), 0, 100);
    if(success && Math.random() < 0.30){
      c.level = Math.min(10, c.level+1);
      c.salary = computeSalary(c.role, c.level, c.skill, c.traits);
    }
  }
  if(success && Math.random() < 0.4){
    state.skillPoints++;
    narrative.push('You learned something out there. (+1 skill point)');
  }
  if(success && (task.typeId==='raid'||task.typeId==='naval'||task.typeId==='pirate_hunt') && Math.random() < 0.16){
    const prize = capturePrize(state.portId);
    state.ships.push(prize);
    state.stats.shipsCaptured++;
    narrative.push('You captured a '+SHIP_RARITY_BY_ID[prize.rarity].name+' '+SHIP_TYPE_BY_ID[prize.typeId].name+' — renamed "'+prize.name+'".');
    logEntry('SHIP', 'Captured a '+SHIP_RARITY_BY_ID[prize.rarity].name+' '+SHIP_TYPE_BY_ID[prize.typeId].name+' as "'+prize.name+'".');
    autoAssignCrew(true);
  }
  logEntry(
    (task.typeId==='raid'||task.typeId==='naval'||task.typeId==='pirate_hunt')?'COMBAT':'MISSION',
    ship.name+' — '+task.name+' '+(success?'SUCCESS':'FAILED')+'. '+
    (reward>0?('+'+fmtWalletValue(reward)+' '):'')+
    (repDelta?((repDelta>0?'+':'')+repDelta+' reputation '):'')+
    narrative.join(' '),
    {dedupeId: 'mission_'+task.id}
  );
  if(reward > 0 || cargoRewardText){
    let toastMsg = '✅ '+esc(task.name)+' succeeded: <b>+'+fmtWalletValue(reward)+'</b>';
    if(cargoRewardText) toastMsg += ' · cargo: '+esc(cargoRewardText);
    if(repDelta>0) toastMsg += ' <span class="muted">(+'+repDelta+' rep)</span>';
    toast(toastMsg, 'good');
  } else {
    toast('❌ '+esc(task.name)+' failed. '+(repDelta?repDelta+' reputation.':''), 'bad');
  }
  ui.viewDirty = true;
}
function addCargoToFleet(ships, commName, qty){
  const c = COMM_BY_NAME[commName];
  if(!c) return 0;
  let remaining = qty;
  for(const ship of ships){
    const cap = cargoCapacity(ship);
    const used = cargoUsed(ship);
    const space = cap - used;
    if(space <= 0) continue;
    const maxBySpace = Math.floor(space / c.cargoFactor);
    const add = Math.min(remaining, maxBySpace);
    if(add > 0){
      addCargo(ship, commName, add);
      remaining -= add;
    }
    if(remaining <= 0) break;
  }
  return qty - remaining;
}
function prizeName(){
  return pick(SHIP_NAMES);
}

function capturePrize(locationId){
  const typeId = pick(['sloop','schooner','merchantman','brigantine']);
  const rarity = weightedPick(SHIP_RARITIES.map(item=>[item,item.weight]));
  const ship = makeShip(typeId, prizeName(), locationId);
  ship.rarity = rarity.id;
  ship.maxHull = Math.round(ship.maxHull*rarity.multiplier);
  ship.hull = Math.round(ship.maxHull*rnd(0.45,0.82));
  return ship;
}

        '<button class="btn" data-act="port-bribe" data-port="'+portId+'" '+(present||governance.bribeUntilDay>state.gameDay||!portCanAfford(bribeCost,portId)?'disabled':'')+'>'+
          (present?'Safe while present':governance.bribeUntilDay>state.gameDay?'Active':'Bribe · '+fmtPortCoins(bribeCost,portId))+'</button>'+ 
        (!portCanAfford(bribeCost,portId)?'<span class="small muted">Exchange funds at a bank.</span>':'')+'</div>')+ 
      '<div class="row between" style="margin-top:10px"><span class="small muted">Stored assets and accrued revenue will remain at this port.</span>'+ 
        '<button class="btn danger" data-act="port-release-control" data-port="'+portId+'" '+(governance.marineSale?'disabled':'')+'>Relinquish Control</button></div>'+ 
      (present?'<p class="hint">Your presence prevents rebellion while you remain in port.</p>':'')+
    '</div>';
  } else {
    const idleShips=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId===state.portId);
    ui.portRaidShipSelection=ui.portRaidShipSelection.filter(id=>idleShips.some(ship=>ship.id===id));
    const fleetRows=idleShips.map(ship=>{
      const selected=ui.portRaidShipSelection.includes(ship.id);
      return '<label class="ship-select-card '+(selected?'selected':'')+'" data-ship-select data-context="port-raid" data-ship="'+ship.id+'">'+
        '<input type="checkbox" '+(selected?'checked':'')+'><div class="info"><b>'+esc(ship.name)+'</b> — '+esc(shipType(ship).name)+
        '<div class="small">Power '+Math.round(shipStats(ship).strength)+' · '+Math.round(ship.hull)+'/'+ship.maxHull+' hull</div></div></label>';
    }).join('')||'<p class="hint">No active idle ships at your current port.</p>';
    const enemyPower=portGarrisonPower(portId);
    const ownPower=ui.portRaidShipSelection.map(getShip).filter(Boolean).reduce((total,ship)=>total+shipStats(ship).strength,0);
    const chance=ownPower?clamp(0.08+0.84/(1+Math.exp(-(ownPower/Math.max(1,enemyPower)-1)*4)),0.03,0.92):0;
    management='<div class="panel solid"><div class="panel-title"><h3>'+(governance.marineOwned?'Marine Garrison':'Enemy Garrison')+'</h3><span class="tag risk-high">'+
      (governance.marineOwned?'Marine-held · 2× defense':'Not controlled')+'</span></div>'+ 
      '<div class="grid c3"><div class="kv"><span>Warships</span><span>'+portGarrisonCount(portId)+'</span></div>'+ 
        '<div class="kv"><span>Class range</span><span>'+profile.classes.map(value=>'Class '+['','I','II','III','IV','V','VI'][value]).join(' – ')+'</span></div>'+ 
        '<div class="kv"><span>Garrison power</span><span>'+fmtNum(enemyPower)+'</span></div></div>'+ 
      (activeRaid?'<div class="card"><div class="row between"><b>Assault underway</b><span>ETA <span data-task-eta="'+activeRaid.id+'">'+fmtEta(activeRaid.endDay-state.gameDay)+'</span></span></div>'+ 
        '<div class="bar progress" style="margin-top:6px"><i data-task-progress="'+activeRaid.id+'" style="width:'+(taskProgress(activeRaid)*100).toFixed(1)+'%"></i></div>'+ 
        '<div class="small muted">'+activeRaid.shipIds.length+' ships committed · estimated success '+Math.round(activeRaid.successChance*100)+'%</div>'+ 
        '<div class="row" style="margin-top:6px">'+cancelTaskButton(activeRaid)+'</div></div>':
        '<p class="small muted">Select any number of active idle ships from your current port. A failed assault destroys every committed ship and costs 25% reputation (minimum 20).</p>'+ 
        '<div class="ship-select-list">'+fleetRows+'</div>'+ 
        '<button class="btn sm" data-act="select-all-ships" data-selection-context="port-raid" '+(idleShips.length?'':'disabled')+'>Select all active ships</button>'+ 
        '<div class="row between" style="margin-top:8px"><span class="small">Estimated chance: '+Math.round(chance*100)+'% · '+ui.portRaidShipSelection.length+' selected</span>'+ 
        '<button class="btn danger" data-act="port-raid" data-port="'+portId+'" '+(ui.portRaidShipSelection.length&&!state.travel&&!portIsClosed(state.portId)&&!portIsClosed(portId)?'':'disabled')+'>Launch Port Raid</button></div>')+
    '</div>';
  }
  return '<div class="panel solid"><div class="panel-title"><h2>Port Governance</h2><span class="tag">'+
    Object.values(state.portGovernance).filter(item=>item.controlled&&!item.rebelled).length+' controlled</span></div>'+ 
    '<label class="fld" style="max-width:520px"><span>Select port</span><select id="portGovernanceSelect">'+portOptions+'</select></label>'+ 
    '<div class="row between"><div><h3>'+esc(port.name)+' <span class="tag">'+esc(port.size)+'</span></h3><div class="small muted">'+esc(port.desc)+'</div></div>'+ 
      '<span class="tag '+(governance.rebelled?'risk-high':governance.controlled?'good':'normal')+'">'+
        (governance.rebelled?'Rebelled':governance.controlled?'Controlled':'Independent')+'</span></div></div>'+management;
}

/* ---------- FLEET ---------- */
function viewFleet(){
  const maxVisibleShips=100;
  const fleetClasses=Array.from(new Set(SHIP_TYPES.map(type=>type.classLabel||'Class III')))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!fleetClasses.includes(ui.fleetSellClass)) ui.fleetSellClass=fleetClasses[0];
  const activeIdleShips=state.ships.filter(ship=>ship.status==='idle'&&shipIsActive(ship)).length;
  const inactiveIdleShips=state.ships.filter(ship=>ship.status==='idle'&&!shipIsActive(ship)).length;
  const fleetStats=new Map();
  const fleetShips=state.ships.map(ship=>{
    const stats=shipStats(ship);
    fleetStats.set(ship.id,stats);
    return {ship,strength:stats.strength};
  }).sort((a,b)=>b.strength-a.strength)
    .slice(0,maxVisibleShips).map(item=>item.ship);
  if(ui.fleetSortByClass){
    fleetShips.sort((a,b)=>shipClassLabel(a).localeCompare(shipClassLabel(b),undefined,{numeric:true})||
      a.name.localeCompare(b.name));
  }
  const shipsForSale=state.ships.filter(ship=>shipClassLabel(ship)===ui.fleetSellClass&&
    ship.status==='idle'&&ship.locationId===state.portId);
  const saleEstimate=shipsForSale.reduce((total,ship)=>total+shipSalePrice(ship),0);
  const cards = fleetShips.map(ship=>{
    const t = shipType(ship);
    const st = fleetStats.get(ship.id);
    const used = cargoUsed(ship);
    const cap = cargoCapacity(ship);
    const task = ship.taskId ? getTask(ship.taskId) : null;
    const traveling = !!(state.travel&&(state.travel.shipIds||[]).includes(ship.id));
    const hullPct = (ship.hull/ship.maxHull*100).toFixed(0);
    const cargoPct = clamp(used/Math.max(1,cap),0,1)*100;
    const loc = PORTS_BY_ID[ship.locationId] ? PORTS_BY_ID[ship.locationId].name : '—';
    let statusHtml;
    if(traveling){
      const pct=clamp((state.gameDay-state.travel.startDay)/Math.max(0.001,state.travel.arriveDay-state.travel.startDay),0,1)*100;
      statusHtml='<span class="tag">Under way → '+esc(PORTS_BY_ID[state.travel.toId].name)+'</span>'+ 
        '<div class="bar progress" style="margin:5px 0"><i data-travel-progress style="width:'+pct.toFixed(1)+'%"></i></div>'+ 
        '<span class="small muted">ETA <span data-travel-eta>'+fmtEta(state.travel.arriveDay-state.gameDay)+'</span></span>';
    } else if(task){
      if(task.kind === 'exploration'){
        const difficulty = EXPLORATION_BY_ID[task.difficultyId] || EXPLORATION_DIFFICULTIES[0];
        statusHtml = '<span class="tag">Exploration · '+esc(difficulty.name)+'</span>'+ 
          '<div class="small muted" style="margin-top:4px">'+task.daysExplored+' day(s) · '+fmtWalletValue(task.earned)+' earned</div>'+
          '<button class="btn sm" data-act="return-exploration" data-task="'+task.id+'" style="margin-top:5px">Return ship</button>';
      } else if(task.kind==='trading'){
        const route=PORTS_BY_ID[task.legToId] ? PORTS_BY_ID[task.legToId].name : 'Unknown port';
        const canRecall=task.indefinite && state.gameDay-task.startDay>=120;
        statusHtml='<span class="tag">Trading → '+esc(route)+'</span>'+ 
          '<div class="small muted" style="margin-top:4px">'+Math.floor(state.gameDay-task.startDay)+' days · Net '+fmtWalletValue(task.profit)+'</div>'+ 
          '<div class="bar progress" style="margin-top:5px"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
          (task.indefinite?'<button class="btn sm" data-act="recall-trading" data-task="'+task.id+'" style="margin-top:5px" '+(canRecall?'':'disabled')+'>'+(canRecall?'Recall fleet':'Recall after day 120')+'</button>':'');
      } else if(task.kind==='remoteCommand'){
        const source=PORTS_BY_ID[task.sourcePortId];
        const destination=PORTS_BY_ID[task.destinationId];
        statusHtml='<span class="tag">Command signal → '+esc(source?source.name:'Unknown port')+'</span>'+ 
          '<div class="small muted" style="margin-top:4px">Destination: '+esc(destination?destination.name:'Unknown port')+'</div>'+ 
          '<div class="bar progress" style="margin-top:5px"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
          '<span class="small muted">Signal ETA <span data-task-eta="'+task.id+'">'+fmtEta(taskEndDay(task)-state.gameDay)+'</span></span>';
      } else if(task.kind==='raid'){
        statusHtml='<span class="tag">Fleet raid · '+task.roundsComplete+'/'+task.roundsTotal+' rounds</span>'+ 
          '<div class="small muted" style="margin-top:4px">'+esc(task.enemyName)+'</div>'+ 
          '<div class="bar progress" style="margin-top:5px"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
          '<span class="small muted">ETA <span data-task-eta="'+task.id+'">'+fmtEta(taskEndDay(task)-state.gameDay)+'</span></span>';
      } else if(task.kind==='portRaid'){
        statusHtml='<span class="tag">Port assault · '+esc(PORTS_BY_ID[task.portId].name)+'</span>'+ 
          '<div class="bar progress" style="margin-top:5px"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
          '<span class="small muted">ETA <span data-task-eta="'+task.id+'">'+fmtEta(taskEndDay(task)-state.gameDay)+'</span></span>';
      } else {
        const label = task.kind==='mission' ? task.name : ('Trade → '+PORTS_BY_ID[task.destPortId].name+(task.phase==='back'?' (returning)':''));
        statusHtml = '<span class="tag">'+esc(label)+'</span> <span class="small muted">ETA <span data-task-eta="'+task.id+'">'+fmtEta(taskEndDay(task)-state.gameDay)+'</span></span>'+
          '<div class="bar progress" style="margin-top:5px"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>';
      }
    } else {
      statusHtml = '<span class="tag good">Idle at '+esc(loc)+'</span>';
    }
    const cargoHtml = cargoList(ship).map(c=>
      '<div class="row between small"><span>'+esc(c.name)+'</span><span class="muted">'+c.qty+' '+esc(c.unit)+'</span></div>'
    ).join('') || '<span class="hint small">Empty hold</span>';
    const cost = repairCost(ship);
    const atPort = ship.locationId === state.portId;
    const rarity = SHIP_RARITY_BY_ID[ship.rarity] || SHIP_RARITIES[0];
    const upgradesHtml = SHIP_UPGRADES.map(upgrade=>{
      const level = ship.upgrades?.[upgrade.id] || 0;
      const upgradeCost = shipUpgradeCost(ship, upgrade);
      const enabled = atPort && !portIsClosed(state.portId) && ship.status==='idle' && level<25 && Economy.canAfford(upgradeCost);
      return '<div class="row between small" style="padding:3px 0;border-bottom:1px solid rgba(201,160,74,.10)">'+
        '<span><b>'+esc(upgrade.name)+'</b> <span class="muted">'+level+'/25 · '+esc(upgrade.desc)+'</span></span>'+
        '<button class="btn sm" data-act="upgrade-ship" data-ship="'+ship.id+'" data-upgrade="'+upgrade.id+'" '+(enabled?'':'disabled')+'>'+
          (level>=25?'Max':fmtWalletValue(upgradeCost))+'</button></div>';
    }).join('');
    return '<div class="card'+(task||traveling?'':' hl')+'" style="margin-bottom:10px">'+
      '<div class="row between">'+
        '<div><h3>'+esc(ship.name)+'</h3><div class="small muted">'+esc(rarity.name)+' · '+esc(shipClassLabel(ship))+' · '+esc(t.name)+' · '+esc(loc)+'</div></div>'+ 
        '<div class="row">'+
          '<span class="tag '+(shipIsActive(ship)?'good':'normal')+'">'+(shipIsActive(ship)?'Operational':'Inactive')+'</span>'+ 
          '<button class="btn sm" data-act="toggle-ship-active" data-ship="'+ship.id+'" '+(ship.status==='idle'?'':'disabled')+' title="'+(shipIsActive(ship)?'Exclude this ship from operations':'Make this ship available for operations')+'">'+
            (shipIsActive(ship)?'Deactivate':'Activate')+'</button>'+ 
          '<button class="btn sm" data-act="rename-ship" data-ship="'+ship.id+'">Rename</button>'+
          (task||traveling?'':'<button class="btn sm" data-act="repair-ship" data-ship="'+ship.id+'" '+(ship.hull>=ship.maxHull||!atPort||portIsClosed(state.portId)?'disabled':'')+'>Repair ('+fmtWalletValue(cost)+')</button>')+
          (state.ships.length>1 && !task && !traveling ? '<button class="btn sm danger" data-act="sell-ship" data-ship="'+ship.id+'" '+(atPort?'':'disabled')+'>Sell</button>' : '')+
        '</div>'+
      '</div>'+
      '<div class="grid c3" style="margin-top:8px">'+
        '<div><div class="row between small"><span class="muted">Hull</span><span>'+Math.round(ship.hull)+' / '+ship.maxHull+'</span></div>'+
        '<div class="bar hull '+hullBarClass(ship)+'"><i style="width:'+hullPct+'%"></i></div></div>'+
        '<div><div class="row between small"><span class="muted">Crew</span><span>'+st.crewCount+' / '+st.crewCap+'</span></div>'+
        '<div class="bar morale"><i style="width:'+clamp(st.crewCount/st.crewCap*100,0,100).toFixed(0)+'%"></i></div></div>'+
        '<div><div class="row between small"><span class="muted">Cargo</span><span>'+Math.round(used)+' / '+cap+'</span></div>'+
        '<div class="bar"><i style="width:'+cargoPct.toFixed(0)+'%"></i></div></div>'+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="grid c3">'+
        '<div><div class="kv small"><span>Cannons</span><span>'+t.cannons+'</span></div>'+
        '<div class="kv small"><span>Cannon power</span><span>'+Math.round(st.cannon)+'</span></div>'+
        '<div class="kv small"><span>Boarding</span><span>'+Math.round(st.board)+'</span></div></div>'+
        '<div><div class="kv small"><span>Strength</span><span>'+Math.round(st.strength)+'</span></div>'+
        '<div class="kv small"><span>Speed</span><span>'+st.speed.toFixed(2)+'</span></div>'+
        '<div class="kv small"><span>Escape</span><span>'+Math.round(st.escape*100)+'%</span></div></div>'+
        '<div><div class="kv small"><span>Morale</span><span>'+Math.round(st.avgMorale)+'</span></div>'+
        '<div class="kv small"><span>Monthly upkeep</span><span>'+fmtWalletValue(shipMonthlyMaintenance(ship))+'</span></div></div>'+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="row between"><span class="muted small">Status</span><span style="flex:1;text-align:right">'+statusHtml+'</span></div>'+
      '<details class="ship-upgrades"><summary>Ship upgrades · '+
        SHIP_UPGRADES.filter(upgrade=>(ship.upgrades?.[upgrade.id]||0)>0).length+' upgraded</summary>'+upgradesHtml+'</details>'+
      '<div class="divider"></div><h4>Hold</h4>'+cargoHtml+
    '</div>';
  }).join('');

  const port = PORTS_BY_ID[state.portId];
  const yard = portShipyardTypes(state.portId);
  const yardHtml = yard.map(id=>{
    const t = SHIP_TYPE_BY_ID[id];
    const price = shipyardPrice(t,state.portId);
    const canAfford = Economy.canAfford(price);
    const requiredRep = t.unlock?.minReputation || 0;
    const repOk = state.reputation >= requiredRep;
    return '<div class="card" style="margin-bottom:8px">'+
      '<div class="row between"><b>'+esc(t.name)+'</b><span class="tag">'+fmtWalletValue(price)+'</span></div>'+
      '<div class="small muted" style="margin:4px 0">Crew '+t.crewCap+' · Cargo '+t.cargo+' · Hull '+t.hull+' · Cannons '+t.cannons+' · Cannon power '+t.cannonPower+' · Boarding '+t.boarding+' · Speed ×'+t.speed+' · Escape '+Math.round(t.escape*100)+'% · Detection '+t.detection.toFixed(2)+' · Stealth '+t.stealth.toFixed(2)+(t.fleetCasualtyReduction?' · Fleet casualty protection '+Math.round(t.fleetCasualtyReduction*100)+'%':'')+'</div>'+
      (t.desc?'<div class="small muted" style="margin-bottom:6px">'+esc(t.desc)+'</div>':'')+
      '<div class="row between"><span class="small muted">Upkeep '+fmtWalletValue(t.maintenance)+'/mo</span>'+
        '<button class="btn sm primary" data-act="buy-ship" data-type="'+id+'" '+(canAfford&&repOk&&!portIsClosed(state.portId)?'':'disabled')+'>'+
          (portIsClosed(state.portId)?'Port closed':repOk ? (canAfford?'Buy':'Need '+fmtWalletValue(price)) : 'Needs '+requiredRep+' rep')+
        '</button></div>'+
    '</div>';
  }).join('') || '<p class="hint">No shipyard here.</p>';

  const totalUpkeep = fleetMonthlyMaintenance() +
                      crewPayrollCost();
  return (
    '<div class="grid c2">'+
      '<div><div class="panel"><div class="row between"><div><b>Crew assignment pool</b><div class="small muted">'+
        activeIdleShips+' active · '+inactiveIdleShips+' inactive idle ships · showing '+fleetShips.length+
        ' of '+state.ships.length+' ships'+(state.ships.length>maxVisibleShips?' (strongest by power)':'')+'</div></div>'+ 
        '<button class="btn sm'+(ui.fleetSortByClass?' primary':'')+'" data-act="sort-fleet-class">'+
          (ui.fleetSortByClass?'Original order':'Sort by class')+'</button></div></div>'+cards+'</div>'+ 
      '<div>'+
        '<div class="panel solid">'+
          '<div class="panel-title"><h3>Shipyard — '+esc(port.name)+'</h3><span class="tag">'+esc(port.size)+'</span></div>'+
          (state.ordnanceDiscountUntilDay>state.gameDay?'<p class="small" style="color:#8fd6a4">Ordnance supplies: 25% off ship upgrades for '+Math.ceil(state.ordnanceDiscountUntilDay-state.gameDay)+' more day(s).</p>':'')+
          yardHtml+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-title"><h3>Sell Ships by Class</h3></div>'+ 
          '<div class="row">'+
            '<label class="small muted" for="fleetSellClass">Class</label>'+ 
            '<select id="fleetSellClass" style="max-width:220px">'+fleetClasses.map(label=>
              '<option value="'+esc(label)+'"'+(label===ui.fleetSellClass?' selected':'')+'>'+esc(label)+'</option>'
            ).join('')+'</select>'+ 
            '<span class="small muted">'+shipsForSale.length+' idle at this port · estimated return '+fmtWalletValue(saleEstimate)+'</span>'+ 
          '</div>'+ 
          '<button class="btn danger" data-act="sell-class" data-class="'+esc(ui.fleetSellClass)+'" style="margin-top:8px" '+
            (shipsForSale.length>0&&shipsForSale.length<state.ships.length?'':'disabled')+'>Sell '+shipsForSale.length+' ship(s)</button>'+ 
          '<p class="hint" style="margin:8px 0 0">Only idle ships at this port are included. At least one ship must remain in your fleet.</p>'+ 
        '</div>'+ 
        '<div class="panel">'+
          '<div class="panel-title"><h3>Monthly Costs</h3></div>'+
          '<div class="kv"><span>Crew payroll at this port</span><span>'+fmtWalletValue(crewPayrollCost())+'</span></div>'+ 
          '<div class="kv"><span>Estimated maintenance / month</span><span>'+fmtWalletValue(fleetMonthlyMaintenance())+'</span></div>'+ 
          '<div class="kv"><span>Provisions (~30d)</span><span>'+fmtWalletValue(state.crew.length*CONFIG.dailyProvisionPerCrew*30*(1-skillEffectValue('provisioner','provisions')))+'</span></div>'+
          '<div class="divider"></div>'+
          '<div class="kv"><span><b>Total / month</b></span><span><b>'+fmtWalletValue(totalUpkeep + state.crew.length*CONFIG.dailyProvisionPerCrew*30*(1-skillEffectValue('provisioner','provisions')))+'</b></span></div>'+
          '<p class="hint" style="margin-top:8px">Crew payroll is deducted every 30 game days. Ship maintenance scales with missing hull and fully repairs each ship whose bill is paid.</p>'+ 
        '</div>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- CREW MANAGEMENT ---------- */
function viewCrew(){
  const hiringClosed=portIsClosed(state.portId);
  const fillPlan=fillAllShipsStatus();
  const totalPayroll = crewPayrollCost();
  const avgMorale = state.crew.length ? state.crew.reduce((a,c)=>a+c.morale,0)/state.crew.length : 0;
  const avgLoyalty = state.crew.length ? state.crew.reduce((a,c)=>a+c.loyalty,0)/state.crew.length : 0;
  const payrollDays = Math.max(0, Math.ceil(state.nextPayrollDay - state.gameDay));
  const missedPayrolls = state.crew.some(c=>(c.lastPayrollMisses||0) > 0);
  const payrollRows = state.crew.map(c=>
    '<div class="kv small"><span>'+esc(c.name)+' <span class="muted">('+esc(ROLE_BY_ID[c.role].name)+')</span></span><span>'+fmtWalletValue(Math.round(c.salary*crewPayrollMultiplier()))+'</span></div>'
  ).join('') || '<p class="hint">No crew payroll.</p>';
  const maintenanceTotal = fleetMonthlyMaintenance();
  const maintenanceRows = state.ships.map(s=>
    '<div class="kv small"><span>'+esc(s.name)+' <span class="muted">('+esc(shipType(s).name)+')</span></span><span>'+fmtWalletValue(shipMonthlyMaintenance(s))+'</span></div>'
  ).join('') || '<p class="hint">No ships in the fleet.</p>';

  const facilityEffectText=(facility,level)=>facility.id==='housing'
    ? '+'+(level*0.2).toFixed(1)+' loyalty/day · +'+(level*0.08).toFixed(2)+' morale/day · -'+(level*10)+'% desertion risk'
    : '+'+(level*0.25).toFixed(2)+' morale/day · +'+(level*5)+'% positive crew-role effects';
  const facilitiesHtml=CREW_FACILITIES.map(facility=>{
    const level=crewFacilityLevel(facility.id);
    const cost=crewFacilityUpgradeCost(facility);
    const maxed=level>=facility.maxLevel;
    return '<div class="card" style="margin-bottom:8px">'+
      '<div class="row between"><div><b>'+esc(facility.name)+'</b> <span class="tag">Level '+level+'/'+facility.maxLevel+'</span>'+ 
        '<div class="small muted">'+esc(facility.desc)+'</div></div>'+ 
        '<button class="btn sm primary" data-act="upgrade-facility" data-facility="'+facility.id+'" '+(!maxed&&Economy.canAfford(cost)?'':'disabled')+'>'+
          (maxed?'Max level':'Upgrade · '+fmtWalletValue(cost))+'</button></div>'+ 
      '<div class="small" style="margin-top:6px">Current: '+facilityEffectText(facility,level)+'</div>'+ 
      (maxed?'':'<div class="small muted">Next level: '+facilityEffectText(facility,level+1)+'</div>')+
    '</div>';
  }).join('');

  const moraleHtml = MORALE_ACTIONS.map(a=>{
    const cost=moraleActionCost(a,state.portId);
    const can = Economy.canAfford(cost) && state.crew.length > 0;
    return '<div class="row between" style="padding:5px 0;border-bottom:1px solid rgba(201,160,74,.12)">'+
      '<div><b>'+esc(a.name)+'</b> <span class="tag">+'+a.morale+' morale / '+a.days+'d</span>'+
      '<div class="small muted">'+esc(a.desc)+'</div></div>'+
      '<div class="row">'+
        '<span class="small nowrap">'+fmtWalletValue(cost)+'</span>'+
        '<button class="btn sm primary" data-act="morale" data-action="'+a.id+'" '+(can?'':'disabled')+'>Buy</button>'+
      '</div>'+
    '</div>';
  }).join('');

  const crewCards = state.crew.map(c=>{
    const role = ROLE_BY_ID[c.role];
    const ship = c.shipId ? getShip(c.shipId) : null;
    const traits = c.traits.map(t=>'<span class="tag rare" title="'+esc(TRAIT_BY_ID[t].desc)+'">'+esc(TRAIT_BY_ID[t].name)+'</span>').join(' ');
    const buffs = (c.moraleBuffs||[]).map(b=>'<span class="morale-buff" title="'+esc(b.name)+'">'+esc(b.name)+' +'+b.amount+'</span>').join(' ');
    const training = c.training
      ? '<span class="training-badge">📚 '+esc(TRAINING_BY_ID[c.training.type].name)+' ('+
        Math.max(0,(c.training.endDay - state.gameDay)).toFixed(1)+'d left)</span>'
      : '';
    const trainOpts = TRAINING_TYPES.map(t=>{
      const terms=trainingTerms(t,state.portId);
      const disabled = c.training || c.skill >= 100 || !Economy.canAfford(terms.cost);
      return '<button class="btn sm" data-act="train" data-crew="'+c.id+'" data-training="'+t.id+'" '+(disabled?'disabled':'')+
        ' title="'+esc(t.desc)+' — '+terms.days+' days, +'+t.skillGain+' skill, '+fmtWalletValue(terms.cost)+'">'+
        esc(t.name)+'</button>';
    }).join(' ');
    return '<div class="card" style="margin-bottom:10px">'+
      '<div class="row between">'+
        '<div><h3>'+esc(c.name)+'</h3>'+
        '<div class="small muted">'+esc(role.name)+' · Level '+c.level+' · Skill '+c.skill+'/100</div></div>'+
        '<div class="right"><div class="small muted">Monthly Salary</div>'+
        '<div style="color:var(--bronze);font-size:15px">'+fmtWalletValue(Math.round(c.salary*crewPayrollMultiplier()))+'</div></div>'+
      '</div>'+
      '<div class="grid c2" style="margin-top:8px">'+
        '<div><div class="row between small"><span class="muted">Morale</span><span>'+Math.round(c.morale)+'%</span></div>'+
        '<div class="bar morale"><i style="width:'+c.morale+'%"></i></div></div>'+
        '<div><div class="row between small"><span class="muted">Loyalty</span><span>'+Math.round(c.loyalty)+'%</span></div>'+
        '<div class="bar morale"><i style="width:'+c.loyalty+'%"></i></div></div>'+
      '</div>'+
      '<div style="margin-top:6px">'+traits+' '+buffs+' '+training+'</div>'+
      '<div class="divider"></div>'+
      '<div class="row between">'+
        '<div class="small muted">Assigned: '+ (ship ? esc(ship.name) : '<span class="muted">Unassigned</span>')+'</div>'+
        '<div class="row">'+
          '<button class="btn sm danger" data-act="dismiss-crew" data-crew="'+c.id+'">✕</button>'+
        '</div>'+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="row"><span class="small muted">Train:</span> '+trainOpts+'</div>'+
    '</div>';
  }).join('') || '<p class="hint">No crew hired. Recruit from the hiring hall below.</p>';

  const poolRows = state.crewPool.map(m=>{
    const role = ROLE_BY_ID[m.role];
    const cost = recruitCost(m);
    const traits = m.traits.map(t=>'<span class="tag rare" title="'+esc(TRAIT_BY_ID[t].desc)+'">'+esc(TRAIT_BY_ID[t].name)+'</span>').join(' ');
    return '<tr>'+
      '<td><b>'+esc(m.name)+'</b></td>'+
      '<td>'+esc(role.name)+'</td>'+
      '<td class="num">'+m.level+'</td>'+
      '<td class="num">'+m.skill+'</td>'+
      '<td class="num">'+fmtWalletValue(m.salary)+'</td>'+
      '<td>'+traits+'</td>'+
      '<td class="num">'+fmtWalletValue(cost)+'</td>'+
      '<td><button class="btn sm primary" data-act="recruit" data-crew="'+m.id+'" '+(Economy.canAfford(cost)&&!hiringClosed?'':'disabled')+'>Recruit</button></td>'+
    '</tr>';
  }).join('') || '<tr><td colspan="8" class="hint">Nobody is looking for work today.</td></tr>';
  const recruitAllCost=state.crewPool.reduce((total,member)=>total+recruitCost(member),0);
  const unassignedCrewCount=state.crew.filter(member=>!member.shipId||!getShip(member.shipId)).length;

  return (
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Crew Management</h3>'+
        '<span class="tag">'+state.crew.length+' crew</span></div>'+
      '<div class="grid c4">'+
        '<div class="kv"><span>Total crew</span><span>'+state.crew.length+'</span></div>'+
        '<div class="kv"><span>Monthly payroll</span><span>'+fmtWalletValue(totalPayroll)+'</span></div>'+
        '<div class="kv"><span>Avg morale</span><span>'+Math.round(avgMorale)+'%</span></div>'+
        '<div class="kv"><span>Avg loyalty</span><span>'+Math.round(avgLoyalty)+'%</span></div>'+
        '<div class="kv"><span>Next payroll</span><span class="'+(payrollDays<=3?'payroll-due':'')+'">Day '+Math.floor(state.nextPayrollDay)+' ('+payrollDays+'d)</span></div>'+
        '<div class="kv"><span>Funds</span><span>'+fmtWalletValue(state.funds)+'</span></div>'+
        '<div class="kv"><span>Payrolls paid</span><span>'+state.stats.payrollsPaid+'</span></div>'+
        '<div class="kv"><span>Payrolls missed</span><span class="'+(missedPayrolls?'payroll-due':'')+'">'+state.stats.payrollsMissed+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Crew Facilities</h3><span class="tag">Persistent upgrades</span></div>'+
      '<div class="grid c2">'+facilitiesHtml+'</div>'+ 
      '<p class="hint" style="margin-bottom:0">Facility effects apply during offline simulation too. Tavern bonuses strengthen positive role-based ship effects.</p>'+
    '</div>'+
    '<div class="panel">'+
      '<div class="panel-title"><h3>Monthly Cost Breakdown</h3><span class="tag">30 game days</span></div>'+
      '<div class="grid c2">'+
        '<div><h4>Crew Payroll</h4><div class="scroll-y" style="max-height:220px">'+payrollRows+'</div>'+
          '<hr><div class="kv"><span><b>Total payroll</b></span><span><b>'+fmtWalletValue(totalPayroll)+'</b></span></div>'+
          '<p class="hint">Paid automatically on the next payroll day shown above.</p></div>'+
        '<div><h4>Ship Maintenance</h4><div class="scroll-y" style="max-height:220px">'+maintenanceRows+'</div>'+
          '<hr><div class="kv"><span><b>Monthly maintenance</b></span><span><b>'+fmtWalletValue(maintenanceTotal)+'</b></span></div>'+
          '<p class="hint">Estimated from missing hull; paid ships are restored to full hull every 30 game days.</p></div>'+ 
      '</div>'+
    '</div>'+
    '<div class="grid c2">'+
      '<div class="panel">'+
        '<div class="panel-title"><h3>Morale Management</h3></div>'+
        moraleHtml+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-title"><h3>Training Grounds</h3></div>'+
        TRAINING_TYPES.map(t=>{
          const terms=trainingTerms(t,state.portId);
          return '<div class="row between" style="padding:4px 0;border-bottom:1px solid rgba(201,160,74,.12)">'+
            '<div><b>'+esc(t.name)+'</b><div class="small muted">'+esc(t.desc)+'</div></div>'+ 
            '<div class="right small">'+terms.days+' days · +'+t.skillGain+' skill<br>'+fmtWalletValue(terms.cost)+'</div>'+ 
          '</div>';
        }).join('')+
        '<p class="hint" style="margin-top:6px">Training is started on individual crew cards below.</p>'+
      '</div>'+
    '</div>'+
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Your Crew</h3><div class="row">'+
        '<button class="btn sm primary" data-act="fill-all-ships" title="Hire crew for every open berth; adds a 500% surcharge to normal hiring costs." '+
          (fillPlan.ships.length&&fillPlan.vacancies&&!hiringClosed&&!state.travel?'':'disabled')+'>'+
          (fillPlan.requiredCrew?'Fill All Ships · Hire '+fillPlan.requiredCrew:
            fillPlan.vacancies?'Fill All Ships · Assign crew':'Ships fully crewed')+'</button>'+ 
        '<button class="btn sm" data-act="auto-assign-crew">Auto-assign</button>'+ 
        '<button class="btn sm danger" data-act="dismiss-unassigned-crew" '+(unassignedCrewCount?'':'disabled')+'>Dismiss unassigned · '+unassignedCrewCount+'</button>'+ 
        '<button class="btn sm danger" data-act="dismiss-all-crew" '+(state.crew.length?'':'disabled')+'>Dismiss all crew</button></div></div>'+ 
      '<div class="scroll-y">'+crewCards+'</div>'+
    '</div>'+
    '<div class="panel">'+
      '<div class="panel-title"><h3>Hiring Hall</h3><div class="row"><span class="muted small">'+(hiringClosed?'Closed until day '+Math.ceil(portClosureEndDay(state.portId)):'Refreshed daily · '+esc(PORTS_BY_ID[state.portId].name))+'</span>'+ 
        '<button class="btn sm primary" data-act="recruit-all" '+(state.crewPool.length&&!hiringClosed?'':'disabled')+'>Recruit all · '+state.crewPool.length+' · '+fmtWalletValue(recruitAllCost)+'</button></div></div>'+ 
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th>Name</th><th>Role</th><th>Lv</th><th>Skill</th><th>Salary/mo</th><th>Traits</th><th>Hire cost</th><th></th></tr></thead>'+
        '<tbody>'+poolRows+'</tbody>'+
      '</table></div>'+
    '</div>'
  );
}

/* ---------- MARKET ---------- */
function viewMarket(){
  if(state.travel){
    return '<div class="panel"><h2>At Sea</h2><p>Markets are not available while you are sailing. '+
      'ETA to '+esc(PORTS_BY_ID[state.travel.toId].name)+': <b>'+fmtEta(state.travel.arriveDay-state.gameDay)+'</b></p></div>';
  }
  if(portIsClosed(state.portId)){
    if(portIsRebelled(state.portId)){
      return '<div class="panel solid"><h2>Port in Rebellion</h2><p class="muted">Markets are sealed at '+
        esc(PORTS_BY_ID[state.portId].name)+'. Pay ransom in the Port tab to restore access.</p></div>';
    }
    return '<div class="panel solid"><h2>Port Closed</h2><p class="muted">Markets are shut at '+
      esc(PORTS_BY_ID[state.portId].name)+' until day '+Math.ceil(portClosureEndDay(state.portId))+'.</p></div>';
  }
  const port = PORTS_BY_ID[state.portId];
  const m = currentMarket();
  const idleShips = state.ships.filter(s=>shipIsActive(s)&&s.status==='idle'&&s.locationId===state.portId);
  const shipOpts = idleShips.map(s=>'<option value="'+s.id+'"'+(ui.marketShip===s.id?' selected':'')+'>'+
    esc(s.name)+' ('+Math.round(cargoUsed(s))+'/'+cargoCapacity(s)+')</option>').join('');
  if(!ui.marketShip || !idleShips.some(s=>s.id===ui.marketShip)){
    ui.marketShip = idleShips[0] ? idleShips[0].id : null;
  }
  const rows = COMMODITIES.filter(c=>m.prices[c.name]).map(c=>{
    const e = m.prices[c.name];
    const buyPrice=marketBuyUnitPrice(state.portId,e);
    const sellPrice=marketSellUnitPrice(state.portId,e);
    const stat = marketStatus(buyPrice, e.base);
    const qty = ui.marketQty[c.name] !== undefined ? ui.marketQty[c.name] : 50;
    const held = idleShips.reduce((a,s)=>a+(s.cargo[c.name]||0),0);
    const canAfford = Economy.canAfford(buyPrice);
    return '<tr>'+
      '<td><b>'+esc(c.name)+'</b><div class="tiny muted">'+esc(c.category)+'</div></td>'+
      '<td>'+esc(c.unit)+'</td>'+
      '<td class="num">'+fmtK(buyPrice)+'<div class="tiny muted">Sell '+fmtK(sellPrice)+'</div></td>'+
      '<td class="num tiny muted">'+e.base.toFixed(2)+'</td>'+
      '<td><span class="tag '+stat.cls+'">'+stat.arrow+' '+stat.label+'</span></td>'+
      '<td class="num">'+fmtNum(e.stock)+'</td>'+
      '<td class="num">'+(held>0?fmtNum(held):'<span class="muted">—</span>')+'</td>'+
      '<td class="nowrap">'+
        '<input type="number" min="0" step="1" value="'+qty+'" data-qty="'+esc(c.name)+'" style="width:64px;display:inline-block;padding:2px 5px;font-size:12px">'+
        ' <button class="btn sm primary" data-act="buy" data-comm="'+esc(c.name)+'" '+(canAfford?'':'disabled')+'>Buy</button>'+
        ' <button class="btn sm" data-act="sell" data-comm="'+esc(c.name)+'" '+(held>0?'':'disabled')+'>Sell</button>'+
      '</td>'+
    '</tr>';
  }).join('') || '<tr><td colspan="8" class="hint">This port trades nothing of note.</td></tr>';

  const compareComms = COMMODITIES.filter(c=>{
    for(const p of PORTS){ const mm = state.markets[p.id]; if(mm && mm.prices[c.name]) return true; }
    return false;
  });
  const cmpSel = ui.compareComm || (compareComms[0] && compareComms[0].name);
  ui.compareComm = cmpSel;
  const cmpRows = cmpSel ? (()=>{
    const rows = [];
    for(const p of PORTS){
      const mm = state.markets[p.id];
      if(!mm || !mm.prices[cmpSel]||portIsRebelled(p.id)) continue;
      const e = mm.prices[cmpSel];
      const buyPrice=marketBuyUnitPrice(p.id,e);
      const sellPrice=marketSellUnitPrice(p.id,e);
      const stat = marketStatus(buyPrice, e.base);
      const dist = p.id===state.portId ? 0 : portDistance(state.portId, p.id);
      const days = dist ? (dist*CONFIG.travelDaysPerMapUnit/1.2) : 0;
      rows.push({p,e,buyPrice,sellPrice,stat,dist,days});
    }
    rows.sort((a,b)=>a.buyPrice-b.buyPrice);
    return rows.map(r=>
      '<tr>'+
        '<td>'+esc(r.p.name)+(r.p.id===state.portId?' <span class="tag good">here</span>':'')+'</td>'+
        '<td class="num">'+fmtK(r.buyPrice)+'<div class="tiny muted">Sell '+fmtK(r.sellPrice)+'</div></td>'+
        '<td><span class="tag '+r.stat.cls+'">'+r.stat.arrow+' '+r.stat.label+'</span></td>'+
        '<td class="num">'+(r.dist?r.dist.toFixed(0):'—')+'</td>'+
        '<td class="num">'+(r.days?fmtEta(r.days):'—')+'</td>'+
      '</tr>'
    ).join('');
  })() : '<tr><td colspan="5" class="hint">No known markets for that commodity.</td></tr>';

  return (
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Market — '+esc(port.name)+'</h3><span class="tag">'+esc(port.size)+'</span></div>'+
      '<p class="hint">'+esc(port.desc)+'</p>'+
      '<div class="row" style="margin-bottom:10px">'+
        '<label class="small muted">Loading ship:</label>'+
        '<select id="marketShipSel" style="max-width:280px">'+(shipOpts||'<option value="">No idle ships</option>')+'</select>'+
        '<button class="btn primary" data-act="smart-buy" '+(ui.marketShip?'':'disabled')+'>Smart Buy</button>'+ 
        '<span class="small muted">Funds: '+fmtWalletValue(state.funds)+'</span>'+
      '</div>'+
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th>Commodity</th><th>Unit</th><th>Your buy / sell</th><th>Base</th><th>Status</th><th>Stock</th><th>Aboard</th><th>Trade</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>'+
    '<div class="panel">'+
      '<div class="panel-title"><h3>Port Price Comparison</h3></div>'+
      '<div class="row" style="margin-bottom:8px">'+
        '<label class="small muted">Commodity:</label>'+
        '<select id="compareSel" style="max-width:260px">'+
          compareComms.map(c=>'<option value="'+esc(c.name)+'"'+(c.name===cmpSel?' selected':'')+'>'+esc(c.name)+'</option>').join('')+
        '</select>'+
      '</div>'+
      '<table class="tbl">'+
        '<thead><tr><th>Port</th><th>Your buy / sell</th><th>Status</th><th>Distance</th><th>Travel</th></tr></thead>'+
        '<tbody>'+cmpRows+'</tbody>'+
      '</table>'+
      '<p class="hint" style="margin-top:8px">Prices are only known from ports you have visited.</p>'+
    '</div>'
  );
}

/* ---------- MISSIONS ---------- */
function viewMissions(){
  if(state.travel){
    return '<div class="panel"><h2>At Sea</h2><p>Missions are offered at port. ETA: <b>'+fmtEta(state.travel.arriveDay-state.gameDay)+'</b></p></div>';
  }
  const port = PORTS_BY_ID[state.portId];
  const idleShips = state.ships.filter(s=>shipIsActive(s)&&s.status==='idle'&&s.locationId===state.portId);
  const missionCards = state.missions.map(m=>{
    const riskCls = m.risk==='Low'?'risk-low':m.risk==='Medium'?'risk-med':m.risk==='High'?'risk-high':'risk-vhigh';
    const tmpl = MISSION_BY_ID[m.typeId];
    const selected = ui.missionShipSelection[m.id] || [];
    const selectedShips=selected.map(getShip).filter(Boolean);
    const estimatedDays=missionDurationDays(m,selectedShips);
    const shipList = idleShips.map(s => {
      const st = shipStats(s);
      const roleBonus = missionRoleBonus(m.typeId, s.id);
      const isSel = selected.includes(s.id);
      return '<label class="ship-select-card '+(isSel?'selected':'')+'" data-ship-select data-context="mission" data-mission="'+m.id+'" data-ship="'+s.id+'">'+
        '<input type="checkbox" '+(isSel?'checked':'')+'>'+
        '<div class="info"><b>'+esc(s.name)+'</b> — power '+Math.round(st.strength)+' ('+st.crewCount+' crew'+
        (roleBonus?' · specialists +'+Math.round(roleBonus*100)+'%':'')+')'+
        '<div class="small">'+esc(shipType(s).name)+' · cargo '+Math.round(cargoUsed(s))+'/'+cargoCapacity(s)+'</div></div>'+
      '</label>';
    }).join('') || '<p class="hint">No idle ships here.</p>';
    return '<div class="card" style="margin-bottom:10px">'+
      '<div class="row between">'+
        '<div><h3>'+esc(m.name)+'</h3><div class="small muted">'+esc(m.desc)+'</div></div>'+
        '<span class="tag '+riskCls+'">Risk: '+esc(m.risk)+'</span>'+
      '</div>'+
      '<div class="grid c3" style="margin-top:8px">'+
        '<div><div class="kv small"><span>Duration</span><span data-mission-duration="'+m.id+'" title="Higher fleet power increases combat time">'+
          (selected.length?'~'+estimatedDays.toFixed(1):m.days.toFixed(1))+' days</span></div>'+ 
        '<div class="kv small"><span>Difficulty</span><span>'+m.difficulty+'</span></div></div>'+
        '<div><div class="kv small"><span>Reward</span><span>'+fmtWalletValue(m.rewardMin)+' – '+fmtWalletValue(m.rewardMax)+'</span></div>'+
        '<div class="kv small"><span>Reputation</span><span>+'+m.repMin+' – +'+m.repMax+'</span></div></div>'+
        '<div><div class="kv small"><span>Tier</span><span>'+m.tier+'</span></div>'+
        '<div class="kv small"><span>Recommended</span><span>'+tmpl.roles.map(esc).join(', ')+'</span></div></div>'+
      '</div>'+
      '<div class="divider"></div>'+
      '<div class="ship-select-list">'+shipList+'</div>'+
      '<button class="btn sm" data-act="select-all-ships" data-selection-context="mission" data-mission="'+m.id+'" '+(idleShips.some(ship=>crewOfShip(ship.id).some(member=>!member.training))?'':'disabled')+'>Select all eligible ships</button>'+ 
      '<div class="row" style="margin-top:8px">'+
        '<select class="mission-approach-sel" data-mission="'+m.id+'" aria-label="Mission approach" style="max-width:140px">'+
          MISSION_APPROACHES.map(a=>'<option value="'+a.id+'" title="'+
            (a.id==='cautious'?'Lower reward, reduced hull damage and casualties.':
              a.id==='aggressive'?'Higher reward and odds, but more damage and casualties.':
              a.id==='stealth'?'Lower damage and casualties with a modest reward.':'Standard risk and reward.')+
            '">'+esc(a.name)+'</option>').join('')+
        '</select>'+
        '<button class="btn primary" data-act="dispatch-mission" data-mission="'+m.id+'" '+(idleShips.length?'':'disabled')+'>Dispatch</button>'+
      '</div>'+
    '</div>';
  }).join('') || '<p class="hint">No missions available. Raise your reputation or check back tomorrow.</p>';

  const active = state.tasks.filter(t=>t.kind==='mission').map(t=>{
    const missionShips = (t.shipIds || [t.shipId]).map(getShip).filter(Boolean);
    if(!missionShips.length) return '';
    return '<div class="card" style="margin-bottom:8px">'+
      '<div class="row between"><b>'+missionShips.map(ship=>esc(ship.name)).join(', ')+'</b><span class="tag">'+esc(t.name)+' · '+
        esc((MISSION_APPROACH_BY_ID[t.approachId] || MISSION_APPROACH_BY_ID.balanced).name)+'</span></div>'+
      '<div class="bar progress" style="margin:6px 0"><i data-task-progress="'+t.id+'" style="width:'+(taskProgress(t)*100).toFixed(1)+'%"></i></div>'+
      '<div class="row between small muted"><span>Difficulty '+t.difficulty+'</span>'+
      '<span>ETA <span data-task-eta="'+t.id+'">'+fmtEta(t.endDay-state.gameDay)+'</span></span></div>'+
      '<div class="row" style="margin-top:6px">'+cancelTaskButton(t)+'</div>'+ 
    '</div>';
  }).join('') || '<p class="hint">No missions in progress.</p>';

  const raidHtml=(ui.targets||[]).map(target=>{
    const riskCls = target.risk==='Low'?'risk-low':target.risk==='Medium'?'risk-med':target.risk==='High'?'risk-high':'risk-vhigh';
    const archetype=RAID_FLEET_ARCHETYPES.find(item=>item.id===target.archetypeId);
    const flavor=target.archetypeId==='funds'||target.archetypeId==='royal'?'Heavily Escorted':
      target.archetypeId==='smuggler'?'Fast — may evade':target.archetypeId==='civilian'?'Civilian — reputation risk':
      target.archetypeId==='naval_squadron'?'Combat fleet · no cargo':'';
    const enemyRows=target.fleet.map(enemy=>{
      const rarity=SHIP_RARITY_BY_ID[enemy.rarity]||SHIP_RARITIES[0];
      const type=shipType(enemy);
      const cargo=cargoList(enemy).slice(0,3).map(item=>item.qty+' '+item.unit+' '+item.name).join(', ')||'No cargo';
      return '<tr><td><b>'+esc(enemy.name)+'</b><div class="tiny muted">'+esc(rarity.name)+' '+esc(type.name)+
        (enemy.isTransport?' · transport':' · warship')+'</div></td>'+ 
        '<td class="num">'+Math.round(enemy.hull)+'/'+enemy.maxHull+'</td><td>'+esc(cargo)+'</td></tr>';
    }).join('');
    const selected = ui.raidShipSelection[target.id] || [];
    const shipList = idleShips.map(ship => {
      const isSel = selected.includes(ship.id);
      return '<label class="ship-select-card '+(isSel?'selected':'')+'" data-ship-select data-context="raid" data-target="'+target.id+'" data-ship="'+ship.id+'">'+
        '<input type="checkbox" '+(isSel?'checked':'')+'>'+
        '<div class="info"><b>'+esc(ship.name)+'</b> — '+esc(shipType(ship).name)+' · power '+Math.round(shipStats(ship).strength)+
        '<div class="small">cargo '+Math.round(cargoUsed(ship))+'/'+cargoCapacity(ship)+'</div></div>'+
      '</label>';
    }).join('') || '<p class="hint">No idle ships here.</p>';
    return '<div class="card" style="margin-bottom:10px">'+
      '<div class="row between"><div><b>'+esc(target.name)+'</b><div class="small muted">'+target.fleet.length+
        ' enemy ship(s) · combined strength '+target.difficulty+'</div></div><div class="row">'+
        '<span class="tag">'+esc(archetype?archetype.name:'Unknown fleet')+'</span>'+
        (flavor?'<span class="tag '+(target.archetypeId==='civilian'?'risk-high':'rare')+'">'+esc(flavor)+'</span>':'')+
        '<span class="tag '+riskCls+'">Risk: '+esc(target.risk)+'</span></div></div>'+ 
      (archetype&&archetype.description?'<div class="small muted" style="margin-top:6px">'+esc(archetype.description)+'</div>':'')+
      '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Enemy vessel</th><th>Hull</th><th>Visible cargo</th></tr></thead><tbody>'+enemyRows+'</tbody></table></div>'+ 
      '<div class="ship-select-list" style="margin-top:8px">'+shipList+'</div>'+
      '<button class="btn sm" data-act="select-all-ships" data-selection-context="raid" data-target="'+target.id+'" '+(idleShips.some(ship=>crewOfShip(ship.id).some(member=>!member.training))?'':'disabled')+'>Select all eligible ships</button>'+ 
      '<div class="small muted">Captured ships keep their cargo; cargo transfers to your raiders only when its ship is destroyed. Transports resist less, while warship crews may burn their vessel.</div>'+ 
      '<div class="small muted">Estimated cargo value '+fmtWalletValue(target.cargoValue)+
        (target.archetypeId==='smuggler'?' · cash reserve undisclosed':' · cash reserve '+fmtWalletValue(target.cashReserve))+'</div>'+ 
      '<button class="btn sm primary" style="margin-top:8px" data-act="raid-target" data-target="'+target.id+'" '+(idleShips.length?'':'disabled')+'>Launch Fleet Raid</button>'+ 
    '</div>';
  }).join('');
  const activeRaids=state.tasks.filter(task=>task.kind==='raid').map(task=>{
    const attackers=task.shipIds.map(getShip).filter(Boolean);
    const remaining=task.enemyFleet.filter(enemy=>!enemy.captured&&!enemy.destroyed).length;
    return '<div class="card" style="margin-bottom:8px"><div class="row between"><b>'+esc(attackers.map(ship=>ship.name).join(', '))+
      '</b><span class="tag">'+remaining+' / '+task.enemyFleet.length+' enemy ships remain</span></div>'+ 
      '<div class="small muted">'+esc(task.enemyName)+' · round '+task.roundsComplete+' / '+task.roundsTotal+'</div>'+ 
      '<div class="bar progress" style="margin:6px 0"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
      '<div class="row between small muted"><span>Battle resolves when its rounds finish</span><span>ETA <span data-task-eta="'+task.id+'">'+fmtEta(task.endDay-state.gameDay)+'</span></span></div>'+ 
      '<div class="row" style="margin-top:6px">'+cancelTaskButton(task)+'</div></div>';
  }).join('')||'<p class="hint">No fleet raids in progress.</p>';

  return (
    '<div class="grid c2">'+
      '<div class="panel solid">'+
        '<div class="panel-title"><h3>Mission Board — '+esc(port.name)+'</h3><span class="tag">Rep '+Math.floor(state.reputation)+'</span></div>'+
        missionCards+
      '</div>'+
      '<div>'+
        '<div class="panel"><div class="panel-title"><h3>In Progress</h3></div>'+active+'</div>'+
        '<div class="panel">'+
          '<div class="panel-title"><h3>Fleet Raids</h3></div>'+ 
          '<p class="small muted">Enemy fleets scale with reputation and the ships idle at this port. Battles proceed one round per game day; transport ships are easier to capture, while warship crews may scuttle their vessels.</p>'+ 
          '<div class="panel-title"><h4>Active Raids</h4></div>'+activeRaids+
          raidHtml+
          '<button class="btn" data-act="scan-targets" '+(state.travel||!state.ships.some(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId===state.portId)||!Economy.canAfford(raidScanCost())?'disabled':'')+'>Scan for Enemy Fleets · '+fmtWalletValue(raidScanCost())+'</button>'+ 
        '</div>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- EXPLORATION ---------- */
function viewExploration(){
  const eligibleShips = state.travel ? [] : state.ships.filter(s=>
    shipIsActive(s) && s.status==='idle' && s.locationId===state.player.locationId &&
    crewOfShip(s.id).some(c=>!c.training)
  );
  const visitedPorts=Object.keys(state.markets).filter(id=>PORTS_BY_ID[id]&&id!==state.portId);
  ui.tradingRouteDraft=ui.tradingRouteDraft.filter(id=>visitedPorts.includes(id));
  const availableRouteStops=visitedPorts.filter(id=>!ui.tradingRouteDraft.includes(id));
  const tradeShipList = eligibleShips.map(ship => {
    const isSel = ui.tradingShipSelection.includes(ship.id);
    const isEscort = ui.tradingEscortSelection.includes(ship.id);
    return '<label class="ship-select-card '+(isSel?'selected':'')+(isEscort?' disabled':'')+'" data-ship-select data-context="trading" data-ship="'+ship.id+'">'+
      '<input type="checkbox" '+(isSel?'checked':'')+' '+(isEscort?'disabled':'')+'>'+
      '<div class="info"><b>'+esc(ship.name)+'</b> — '+esc(shipType(ship).name)+' · hold '+fmtNum(cargoCapacity(ship))+
      '<div class="small">crew '+shipStats(ship).crewCount+'/'+shipStats(ship).crewCap+'</div></div>'+
    '</label>';
  }).join('') || '<p class="hint">No eligible idle ships</p>';
  const escortList = eligibleShips.map(ship => {
    const isSel = ui.tradingEscortSelection.includes(ship.id);
    const isTrader = ui.tradingShipSelection.includes(ship.id);
    return '<label class="ship-select-card '+(isSel?'selected':'')+(isTrader?' disabled':'')+'" data-ship-select data-context="trading-escort" data-ship="'+ship.id+'">'+
      '<input type="checkbox" '+(isSel?'checked':'')+' '+(isTrader?'disabled':'')+'>'+
      '<div class="info"><b>'+esc(ship.name)+'</b> — '+esc(shipType(ship).name)+' · strength '+Math.round(shipStats(ship).strength)+
      '<div class="small">cargo '+Math.round(cargoUsed(ship))+'/'+cargoCapacity(ship)+'</div></div>'+
    '</label>';
  }).join('') || '<p class="hint">No eligible idle ships</p>';
  const routeOpts=availableRouteStops.map(id=>'<option value="'+id+'">'+esc(PORTS_BY_ID[id].name)+
    ' · '+esc(PORTS_BY_ID[id].size)+'</option>').join('')||'<option value="">All known ports added</option>';
  const routeDraftHtml=ui.tradingRouteDraft.map((id,index)=>
    '<div class="row between small" style="padding:4px 0;border-bottom:1px solid rgba(201,160,74,.12)">'+
      '<span><b>'+(index+1)+'.</b> '+esc(PORTS_BY_ID[id].name)+'</span><span class="row">'+
        '<button class="btn sm" data-act="move-trading-stop" data-index="'+index+'" data-direction="up" aria-label="Move '+esc(PORTS_BY_ID[id].name)+' up" title="Move stop up" '+(index?'':'disabled')+'>↑</button>'+ 
        '<button class="btn sm" data-act="move-trading-stop" data-index="'+index+'" data-direction="down" aria-label="Move '+esc(PORTS_BY_ID[id].name)+' down" title="Move stop down" '+(index<ui.tradingRouteDraft.length-1?'':'disabled')+'>↓</button>'+ 
        '<button class="btn sm danger" data-act="remove-trading-stop" data-index="'+index+'" aria-label="Remove '+esc(PORTS_BY_ID[id].name)+'" title="Remove stop">×</button>'+ 
      '</span></div>'
  ).join('')||'<p class="hint small">Add at least one visited port to build a route.</p>';
  const shipOpts = eligibleShips.map(s=>{
    const stats = shipStats(s);
    return '<option value="'+s.id+'">'+esc(s.name)+' ('+esc(shipType(s).name)+') · '+
      stats.crewCount+' crew · strength '+Math.round(stats.strength)+'</option>';
  }).join('') || '<option value="">No eligible idle ships</option>';
  const difficultyOpts = EXPLORATION_DIFFICULTIES.map(d=>
    '<option value="'+d.id+'">'+esc(d.name)+' · '+fmtWalletValue(Math.round(d.baseReward*(PORTS_BY_ID[state.portId].explorationRewardMultiplier||1)))+' base/day · '+
      (d.dailyRisk*(PORTS_BY_ID[state.portId].explorationRiskMultiplier||1)*100).toFixed(1)+'% risk/day · -'+d.reputationLoss+' reputation if lost</option>'
  ).join('');
  const active = state.tasks.filter(t=>t.kind==='exploration').map(t=>{
    const ship = getShip(t.shipId); if(!ship) return '';
    const difficulty = EXPLORATION_BY_ID[t.difficultyId] || EXPLORATION_DIFFICULTIES[0];
    const dailyRisk=explorationRiskPerDay(ship,difficulty,t.originPortId);
    const dailyIncome=explorationRewardPerDay(ship,difficulty,t.originPortId);
    return '<div class="card" style="margin-bottom:8px">'+
      '<div class="row between"><div><b>'+esc(ship.name)+'</b><div class="small muted">'+
        esc(shipType(ship).name)+' · '+esc(difficulty.name)+' difficulty</div></div>'+
        '<span class="tag risk-'+(dailyRisk>=0.04?'high':dailyRisk>=0.015?'med':'low')+'">'+
          (dailyRisk*100).toFixed(1)+'% risk/day</span></div>'+ 
      '<p class="small muted">Ship lost: reputation -'+difficulty.reputationLoss+'.</p>'+
      '<div class="grid c4" style="margin-top:8px">'+
        '<div class="kv small"><span>Days explored</span><span>'+t.daysExplored+'</span></div>'+
        '<div class="kv small"><span>Daily income</span><span>~'+fmtWalletValue(dailyIncome)+'</span></div>'+ 
        '<div class="kv small"><span>Monthly estimate (30d)</span><span>~'+fmtWalletValue(dailyIncome*30)+'</span></div>'+ 
        '<div class="kv small"><span>Total earned</span><span>'+fmtWalletValue(t.earned)+'</span></div>'+
      '</div>'+
      '<div class="row" style="margin-top:8px">'+cancelTaskButton(t,'Abort exploration')+'</div>'+ 
    '</div>';
  }).join('') || '<p class="hint">No ships are exploring.</p>';

  const activeTrading=state.tasks.filter(task=>task.kind==='trading').map(task=>{
    const lead=getShip(task.shipId); if(!lead) return '';
    const destination=PORTS_BY_ID[task.legToId];
    const routeNames=[task.originId].concat(task.routeIds||[task.routePortId],[task.originId])
      .map(id=>PORTS_BY_ID[id]?PORTS_BY_ID[id].name:'Unknown port');
    const escortStrength=task.escortIds.reduce((total,id)=>{
      const ship=getShip(id); return total+(ship?shipStats(ship).strength:0);
    },0);
    const risk=0.35*(1-clamp(escortStrength/500,0,0.82))*(1-skillEffectValue('smuggler','hijack'));
    const elapsed=state.gameDay-task.startDay;
    const canRecall=task.indefinite&&elapsed>=120;
    return '<div class="card" style="margin-bottom:8px">'+
      '<div class="row between"><div><b>'+esc(lead.name)+(task.tradeShipIds.length>1?' + '+(task.tradeShipIds.length-1)+' ship(s)':'')+'</b>'+ 
        '<div class="small muted">'+routeNames.map(esc).join(' → ')+'<br>Now: '+esc(PORTS_BY_ID[task.currentPortId].name)+' → '+esc(destination?destination.name:'Unknown port')+
        ' · '+task.escortIds.length+' escort(s)</div></div>'+ 
        '<span class="tag risk-'+(risk<0.1?'low':risk<0.25?'med':'high')+'">'+risk.toFixed(2)+'% hijack risk/day</span></div>'+ 
      '<div class="bar progress" style="margin:8px 0"><i data-task-progress="'+task.id+'" style="width:'+(taskProgress(task)*100).toFixed(1)+'%"></i></div>'+ 
      '<div class="grid c4">'+
        '<div class="kv small"><span>Duration</span><span>'+(task.indefinite?'Indefinite':Math.floor(elapsed)+' / '+task.durationDays+' days')+'</span></div>'+ 
        '<div class="kv small"><span>Capital aboard</span><span>'+fmtWalletValue(task.balance)+'</span></div>'+ 
        '<div class="kv small"><span>Net profit</span><span>'+fmtWalletValue(task.profit)+'</span></div>'+ 
        '<div class="kv small"><span>Next port in</span><span data-task-eta="'+task.id+'">'+fmtEta(taskEndDay(task)-state.gameDay)+'</span></div>'+ 
      '</div>'+ 
      '<div class="row between small muted" style="margin-top:6px"><span>'+(task.legCommodity?'Cargo: '+esc(task.legQuantity)+' '+esc(COMM_BY_NAME[task.legCommodity].unit)+' '+esc(task.legCommodity):'Waiting for a profitable cargo opportunity')+'</span>'+ 
        (task.indefinite?'<button class="btn sm" data-act="recall-trading" data-task="'+task.id+'" '+(canRecall&&!task.recallRequested?'':'disabled')+'>'+
          (task.recallRequested?'Recall ordered · returning to origin':canRecall?'Recall fleet':'Recall available after 120 days')+'</button>':'<span>Returns automatically when duration ends</span>')+
      '</div><div class="row" style="margin-top:6px">'+cancelTaskButton(task,'Abort trading')+'</div></div>';
  }).join('')||'<p class="hint">No trade fleets are deployed.</p>';

  const modeButtons='<div class="row" role="group" aria-label="Exploration mode">'+
    '<button class="btn '+(ui.explorationMode==='exploration'?'primary':'')+'" data-act="exploration-mode" data-mode="exploration">Exploration</button>'+ 
    '<button class="btn '+(ui.explorationMode==='trading'?'primary':'')+'" data-act="exploration-mode" data-mode="trading">Trading</button></div>';
  const tradingView='<div class="grid c2">'+
    '<div class="panel solid"><div class="panel-title"><h3>Dispatch Trade Fleet</h3><span class="tag">'+eligibleShips.length+' available</span></div>'+ 
      (state.travel?'<p class="hint">Return to port before dispatching another fleet.</p>':'')+
      '<label class="fld"><span>Trading ships</span><div class="ship-select-list">'+tradeShipList+'</div></label>'+ 
      '<label class="fld"><span>Add route stop · '+ui.tradingRouteDraft.length+' / '+visitedPorts.length+' known ports</span><div class="row">'+
        '<select id="tradingRouteStopSel" style="flex:1" '+(availableRouteStops.length?'':'disabled')+'>'+routeOpts+'</select>'+ 
        '<button class="btn" data-act="add-trading-stop" '+(availableRouteStops.length?'':'disabled')+'>Add stop</button></div></label>'+ 
      '<div class="small muted" style="margin:4px 0">Route: '+esc(PORTS_BY_ID[state.portId].name)+' → '+
        (ui.tradingRouteDraft.length?ui.tradingRouteDraft.map(id=>esc(PORTS_BY_ID[id].name)).join(' → '):'…')+' → '+esc(PORTS_BY_ID[state.portId].name)+'</div>'+routeDraftHtml+
      '<label class="fld"><span>Escort ships</span><div class="ship-select-list">'+escortList+'</div></label>'+ 
      '<label class="fld"><span>Capital to allocate</span><input id="tradingCapital" type="number" min="1" max="'+Math.floor(state.funds)+'" step="1" value="'+Math.min(1000,Math.floor(state.funds))+'"></label>'+ 
      '<div class="row"><label class="fld" style="flex:1"><span>Trading duration (days)</span><input id="tradingDuration" type="number" min="1" step="1" value="30"></label>'+ 
        '<label class="fld" style="display:flex;align-items:center;gap:7px;margin-top:16px"><input id="tradingIndefinite" type="checkbox"> Indefinite</label></div>'+ 
      '<button class="btn primary" data-act="dispatch-automated-trading" '+(eligibleShips.length&&ui.tradingRouteDraft.length&&state.funds>=1&&!state.travel?'':'disabled')+'>Begin trading</button>'+ 
      '<p class="hint" style="margin-top:8px">Only visited ports are available. Ships buy goods when the route offers a margin, then sell on arrival; travel time and fleet cargo capacity affect returns. Allocated capital is committed until the run ends. Hijack risk is checked daily and escorts reduce it.</p>'+ 
    '</div><div class="panel"><div class="panel-title"><h3>Active Trade Fleets</h3><span class="tag">'+state.tasks.filter(task=>task.kind==='trading').length+'</span></div>'+activeTrading+'</div></div>';

  return (
    '<div class="panel">'+modeButtons+'</div>'+
    (ui.explorationMode==='trading'?tradingView:'<div class="grid c2">'+
      '<div class="panel solid">'+
        '<div class="panel-title"><h3>Dispatch Exploration</h3><span class="tag">'+
          eligibleShips.length+' eligible ship(s)</span></div>'+
        (state.travel ? '<p class="hint">Return to port before dispatching another ship.</p>' : '')+
        '<label class="fld"><span>Ship and crew</span><select id="explorationShipSel">'+shipOpts+'</select></label>'+
        '<label class="fld"><span>Difficulty</span><select id="explorationDifficultySel">'+difficultyOpts+'</select></label>'+
        '<button class="btn primary" data-act="dispatch-exploration" '+(eligibleShips.length?'':'disabled')+'>Send exploring</button>'+
        '<p class="hint" style="margin-top:8px">Monthly estimate is the current daily income × 30 game days; actual income changes with ship performance, crew, reputation and skills. Higher difficulties carry greater daily loss risk.</p>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-title"><h3>Active Explorations</h3><span class="tag">'+
          state.tasks.filter(t=>t.kind==='exploration').length+'</span></div>'+active+
      '</div>'+
    '</div>')
  );
}

/* ---------- MAP ---------- */
function viewMap(){
  const mapScale=clamp(ui.mapZoom,0.65,2.5);
  const idleShips=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId===state.portId);
  if(!Array.isArray(ui.travelShipSelection)&&!state.travel){
    const preferred=idleShips.find(ship=>ship.id===state.player.vesselId)||idleShips[0];
    ui.travelShipSelection=preferred?[preferred.id]:[];
  }
  if(!Array.isArray(ui.travelShipSelection)) ui.travelShipSelection=[];
  ui.travelShipSelection=ui.travelShipSelection.filter(id=>idleShips.some(ship=>ship.id===id)).slice(0,6);
  const travelShipSelectorHtml=idleShips.map(ship=>{
    const selected=ui.travelShipSelection.includes(ship.id);
    return '<label class="ship-select-card '+(selected?'selected':'')+'" data-ship-select data-context="travel" data-ship="'+ship.id+'">'+
      '<input type="checkbox" '+(selected?'checked':'')+'>'+ 
      '<div class="info"><b>'+esc(ship.name)+'</b> — '+esc(shipType(ship).name)+
      '<div class="small">'+Math.round(shipStats(ship).speed*100)/100+' speed · '+Math.round(ship.hull)+'/'+ship.maxHull+' hull</div></div>'+ 
    '</label>';
  }).join('')||'<p class="hint">No active idle ships at this port.</p>';
  const nodeHtml = PORTS.map(p=>{
    const here = p.id === state.portId && !state.travel;
    const cls = p.size==='Small'?'small':p.size==='Large'?'large':p.size==='Extra Large'?'xl':'';
    const country=PORT_COUNTRIES[p.id]||'Unknown';
    return '<button class="portnode '+cls+(here?' here':'')+'" data-act="port-click" data-port="'+p.id+'" style="left:calc(4% + '+(p.x*0.92)+'%);top:calc(4% + '+(p.y*0.92)+'%)" aria-label="'+esc(p.name+', '+country)+'">'+
      '<span class="dot"></span><span class="nm">'+esc(p.name)+'</span><span class="country">'+esc(country)+'</span>'+
    '</button>';
  }).join('');
  const lines = [];
  for(let i=0;i<PORTS.length;i++){
    for(let j=i+1;j<PORTS.length;j++){
      const d = portDistance(PORTS[i].id, PORTS[j].id);
      if(d < 34){
        lines.push('<line x1="'+PORTS[i].x+'" y1="'+PORTS[i].y+'" x2="'+PORTS[j].x+'" y2="'+PORTS[j].y+
          '" stroke="rgba(201,160,74,.18)" stroke-width="0.35" stroke-dasharray="1.5 1.5"/>');
      }
    }
  }
  const svg = '<svg class="maplines" style="left:4%;top:4%;right:auto;bottom:auto;width:92%;height:92%" viewBox="0 0 100 100" preserveAspectRatio="none">'+lines.join('')+'</svg>';
  const sel = ui.selectedPort && PORTS_BY_ID[ui.selectedPort] ? PORTS_BY_ID[ui.selectedPort] : null;
  let detail = '<p class="hint">Click a port on the chart to inspect it.</p>';
  if(sel){
    const m = state.markets[sel.id];
    const dist = sel.id === state.portId ? 0 : portDistance(state.portId, sel.id);
    const days = dist ? (dist*CONFIG.travelDaysPerMapUnit/1.2) : 0;
    const governance=portGovernance(sel.id);
    const portBank=BOND_CITY_MARKETS[sel.id];
    const tradeCategories={
      food:'Food',luxury_food:'Luxury food',beverage:'Beverages',textile:'Textiles',luxury_textile:'Luxury textiles',
      spice:'Spices',luxury_spice:'Luxury spices',dye:'Dyes',construction:'Construction',raw_material:'Raw materials',
      metal:'Metals',precious_metal:'Precious metals',luxury_good:'Luxury goods',american_commodity:'American goods',military:'Military goods',
    };
    const tradeProfile=(values,kind)=>{
      const rows=Object.entries(values||{}).filter(([,factor])=>factor!==1).map(([category,factor])=>{
        const condition=factor<0.8?'Abundant':factor<0.95?'Plentiful':factor>1.3?'Scarce':factor>1.1?'Sought after':'Steady';
        return '<span class="tag '+(factor<0.85?'cheap':factor>1.15?'expensive':'normal')+'">'+
          esc(tradeCategories[category]||category)+' · '+condition+'</span>';
      });
      return rows.length?'<div class="row" style="gap:5px;margin:4px 0"><span class="small muted nowrap">'+kind+'</span>'+rows.join('')+'</div>':
        '<div class="kv small"><span>'+kind+'</span><span class="muted">Broad local market</span></div>';
    };
    const yardTypes=portShipyardTypes(sel.id).map(id=>SHIP_TYPE_BY_ID[id].name);
    const governanceLabel=governance.rebelled?'Rebelled':governance.controlled?'Under your control':'Independent';
    const statusClass=governance.rebelled?'risk-high':governance.controlled?'good':'normal';
    const bondYields=BOND_TERMS.map(term=>(portBank.rates[term.years]*100).toFixed(2)+'%').join(' / ');
    const profileRows=tradeProfile(sel.produce,'Produces')+tradeProfile(sel.demand,'Demand');
    const harborRows='<div class="kv small"><span>Shipyard</span><span>'+yardTypes.length+' ship types</span></div>'+ 
      '<div class="kv small"><span>Hiring hall</span><span>'+PORT_CREWCOUNT[sel.size]+' candidates/day</span></div>'+ 
      '<div class="kv small"><span>Black market</span><span>'+(sel.blackMarket?'Available':'Not available')+'</span></div>';
    const portDetails='<div class="divider"></div><h4>Trade Profile</h4>'+profileRows+
      '<div class="divider"></div><h4>Harbor & Governance</h4>'+ 
      '<div class="kv small"><span>Administration</span><span class="tag '+statusClass+'">'+governanceLabel+'</span></div>'+ 
      '<div class="kv small"><span>Population</span><span>'+fmtNum(governance.population)+'</span></div>'+harborRows+
      '<div class="divider"></div><h4>Banking</h4>'+ 
      '<div class="kv small"><span>Savings yield</span><span>'+(bankSavingsRate(sel.id)*100).toFixed(2)+'% / 30 days</span></div>'+ 
      '<div class="kv small"><span>Bond yield · 3 / 5 / 10 years</span><span>'+bondYields+'</span></div>';
    const priceRows = portIsRebelled(sel.id)?'<span class="hint">Market data is inaccessible during the rebellion.</span>':m ? Object.keys(m.prices).slice(0,8).map(k=>{
      const e = m.prices[k];
      const st = marketStatus(e.price, e.base);
      return '<div class="row between small"><span>'+esc(k)+'</span><span class="tag '+st.cls+'">'+fmtK(e.price)+'</span></div>';
    }).join('') : '<span class="hint">No market data. Visit to learn prices.</span>';
    const closed=portIsClosed(sel.id);
    const selectedTravelCount=ui.travelShipSelection.length;
    const canTravel = sel.id !== state.portId && !state.travel && !closed && !portIsClosed(state.portId)&&selectedTravelCount>0;
    detail =
      '<h3>'+esc(sel.name)+' <span class="tag">'+esc(sel.size)+'</span></h3>'+
      '<p class="small muted">'+esc(sel.desc)+'</p>'+
      (portIsRebelled(sel.id)?'<p class="payroll-due small">Rebellion blocks access until ransom is paid.</p>':
        closed?'<p class="payroll-due small">Closed until day '+Math.ceil(portClosureEndDay(sel.id))+'.</p>':'')+
      '<div class="kv"><span>Distance</span><span>'+(dist?dist.toFixed(1)+' units':'—')+'</span></div>'+
      '<div class="kv"><span>Travel time</span><span>'+(days?days.toFixed(2)+' days (~'+fmtEta(days)+')':'—')+'</span></div>'+
      portDetails+
      '<div class="divider"></div>'+
      '<h4>Known Prices'+(m?' <span class="tiny muted">(day '+m.day+')</span>':'')+'</h4>'+
      (priceRows || '<span class="hint">Unknown.</span>')+
      '<div class="divider"></div>'+
      '<h4>Ships to Sail · <span data-travel-count>'+selectedTravelCount+'/6</span></h4>'+ 
      '<div class="ship-select-list">'+travelShipSelectorHtml+'</div>'+ 
      '<button class="btn sm" data-act="select-travel-ships" '+(idleShips.length?'':'disabled')+'>Select up to 6 ships</button>'+ 
      '<div class="divider"></div>'+
      '<button class="btn primary" data-act="travel" data-port="'+sel.id+'" '+(canTravel?'':'disabled')+'>'+
        (sel.id===state.portId?'You are here':state.travel?'Already sailing':portIsRebelled(sel.id)?'Rebelled':closed?'Port closed':portIsClosed(state.portId)?'Current port closed':selectedTravelCount?'Set Sail · '+selectedTravelCount+' ship(s)':'Select a ship')+
      '</button>';
  }
  let travelBox = '';
  if(state.travel){
    const t = state.travel;
    const pct = clamp((state.gameDay-t.startDay)/(t.arriveDay-t.startDay),0,1)*100;
    travelBox = '<div class="panel solid"><div class="panel-title"><h3>Under Way</h3><span class="tag">'+esc(PORTS_BY_ID[t.toId].name)+'</span></div>'+
      '<div class="bar progress"><i data-travel-progress style="width:'+pct.toFixed(1)+'%"></i></div>'+
      '<div class="row between small" style="margin-top:6px"><span class="muted">Departed '+esc(PORTS_BY_ID[t.fromId].name)+'</span>'+
      '<span>ETA <span data-travel-eta>'+fmtEta(t.arriveDay-state.gameDay)+'</span></span></div>'+ 
      '<div class="row" style="margin-top:6px">'+travelCancelButton()+'</div></div>';
  }
  const loadedShips=idleShips.filter(ship=>cargoList(ship).length);
  const selectedTradeShip=loadedShips.find(ship=>ship.id===ui.mapTradeShip)||loadedShips[0];
  ui.mapTradeShip=selectedTradeShip?selectedTradeShip.id:null;
  const recommendation=selectedTradeShip?recommendTradeDestination(selectedTradeShip):null;
  const fleetRecommendationPlan=loadedShips.length?tradeFleetRecommendationPlan(loadedShips):[];
  const fleetDestinationCounts=new Map();
  for(const {recommendation} of fleetRecommendationPlan){
    const name=recommendation.port.name;
    fleetDestinationCounts.set(name,(fleetDestinationCounts.get(name)||0)+1);
  }
  const tradeShipOpts=loadedShips.map(ship=>
    '<option value="'+ship.id+'"'+(selectedTradeShip&&ship.id===selectedTradeShip.id?' selected':'')+'>'+esc(ship.name)+' — '+
      cargoList(ship).map(item=>item.qty+' '+item.unit+' '+item.name).join(', ')+'</option>'
  ).join('');
  const destinations=PORTS.filter(port=>port.id!==state.portId&&!portIsClosed(port.id));
  if(recommendation) destinations.sort((a,b)=>a.id===recommendation.port.id?-1:b.id===recommendation.port.id?1:0);
  const destOpts=destinations.map(port=>'<option value="'+port.id+'"'+
    (recommendation&&port.id===recommendation.port.id?' selected':'')+'>'+esc(port.name)+
    (recommendation&&port.id===recommendation.port.id?' — Recommended ('+
      (recommendation.kind==='price'?'best cargo prices':'nearest')+')':'')+'</option>').join('');
  const recommendationHtml=recommendation
    ? '<p class="hint small">Recommended: <b>'+esc(recommendation.port.name)+'</b> — '+
      (recommendation.kind==='price'?'best known sale value: '+fmtWalletValue(recommendation.value)+'.':
        'nearest port; no known market offers a higher sale value.')+'</p>'
    : '';
  ui.tradeEscortSelection=ui.tradeEscortSelection.filter(id=>id!==selectedTradeShip?.id&&
    idleShips.some(ship=>ship.id===id&&!cargoList(ship).length));
  const escortList=idleShips.filter(ship=>(!selectedTradeShip||ship.id!==selectedTradeShip.id)&&!cargoList(ship).length).map(ship=>{
    const isSelected=ui.tradeEscortSelection.includes(ship.id);
    return '<label class="ship-select-card '+(isSelected?'selected':'')+'" data-ship-select data-context="trade-escort" data-ship="'+ship.id+'">'+
      '<input type="checkbox" '+(isSelected?'checked':'')+'>'+
      '<div class="info"><b>'+esc(ship.name)+'</b> — '+esc(SHIP_TYPE_BY_ID[ship.typeId].name)+' · strength '+Math.round(shipStats(ship).strength)+
      '<div class="small">cargo '+Math.round(cargoUsed(ship))+'/'+cargoCapacity(ship)+'</div></div>'+ 
    '</label>';
  }).join('')||'<p class="hint">No idle ships here.</p>';
  const remoteShips=state.ships.filter(ship=>shipIsActive(ship)&&ship.status==='idle'&&ship.locationId!==state.portId&&
    portIsControlled(ship.locationId)&&!portIsClosed(ship.locationId));
  const selectedRemoteShip=remoteShips.find(ship=>ship.id===ui.remoteCommandShip)||remoteShips[0]||null;
  ui.remoteCommandShip=selectedRemoteShip?selectedRemoteShip.id:null;
  const remoteShipOpts=remoteShips.map(ship=>'<option value="'+ship.id+'"'+
    (selectedRemoteShip&&ship.id===selectedRemoteShip.id?' selected':'')+'>'+esc(ship.name)+' — '+
    esc(PORTS_BY_ID[ship.locationId].name)+'</option>').join('');
  const remoteDestinations=selectedRemoteShip?PORTS.filter(port=>port.id!==selectedRemoteShip.locationId&&!portIsClosed(port.id)):[];
  const remoteDestOpts=remoteDestinations.map((port,index)=>'<option value="'+port.id+'"'+
    (port.id===state.portId||(!remoteDestinations.some(item=>item.id===state.portId)&&index===0)?' selected':'')+'>'+esc(port.name)+'</option>').join('');
  const remoteDestination=remoteDestinations.find(port=>port.id===state.portId)||remoteDestinations[0];
  const commandDelay=selectedRemoteShip?Math.max(0.12,baseTravelDays(state.portId,selectedRemoteShip.locationId,
    shipStats(selectedRemoteShip).speed)):0;
  const remoteCommands=state.tasks.filter(task=>task.kind==='remoteCommand').map(task=>{
    const ship=getShip(task.shipId);
    const source=PORTS_BY_ID[task.sourcePortId];
    const destination=PORTS_BY_ID[task.destinationId];
    return '<div class="kv small"><span>'+(ship?esc(ship.name):'Ship')+' · '+esc(source?source.name:'Unknown')+' → '+
      esc(destination?destination.name:'Unknown')+'</span><span data-task-eta="'+task.id+'">'+
      fmtEta(taskEndDay(task)-state.gameDay)+'</span></div>';
  }).join('');
  const remoteCommandPanel='<div class="panel"><div class="panel-title"><h3>Remote Fleet Orders</h3><span class="tag">Controlled ports only</span></div>'+ 
    (remoteShips.length?'<label class="fld"><span>Ship at a controlled port</span><select id="remoteShipSel">'+remoteShipOpts+'</select></label>'+ 
      '<label class="fld"><span>Destination</span><select id="remoteDestinationSel">'+remoteDestOpts+'</select></label>'+ 
      '<p class="hint">Signal delay to '+esc(PORTS_BY_ID[selectedRemoteShip.locationId].name)+': '+commandDelay.toFixed(2)+
      ' days. The ship starts sailing after the order arrives.</p>'+ 
      '<button class="btn primary" data-act="command-remote-ship" '+(!remoteDestination||state.travel?'disabled':'')+'>Send Delayed Order</button>':
      '<p class="hint">No active idle ships are stationed at another port under your control.</p>')+
    (remoteCommands?'<div class="divider"></div><h4>Signals in Transit</h4>'+remoteCommands:'')+'</div>';
  return (
    travelBox+
    '<div class="grid c2">'+
      '<div class="panel solid">'+
          '<div class="panel-title"><h3>Chart of the Sea</h3><div class="row"><span class="muted small">'+PORTS.length+' known ports</span>'+ 
            '<div class="map-controls" role="group" aria-label="Map zoom controls">'+
              '<button class="btn" data-act="map-zoom" data-step="-0.25" aria-label="Zoom out" title="Zoom out" '+(mapScale<=0.65?'disabled':'')+'>−</button>'+ 
              '<span class="map-zoom-value small" aria-live="polite">'+Math.round(mapScale*100)+'%</span>'+ 
              '<button class="btn" data-act="map-zoom" data-step="0.25" aria-label="Zoom in" title="Zoom in" '+(mapScale>=2.5?'disabled':'')+'>+</button>'+ 
            '</div></div></div>'+
          '<div class="mapwrap"><div class="mapstage" style="width:'+Math.round(850*mapScale)+'px;--map-scale:'+mapScale+'">'+svg+nodeHtml+'</div></div>'+ 
      '</div>'+
      '<div>'+
        '<div class="panel">'+detail+'</div>'+
        remoteCommandPanel+
        '<div class="panel">'+
          '<div class="panel-title"><h3>Dispatch Trade Fleet</h3></div>'+ 
          '<p class="hint small">Load cargo into a ship at port, then send it to sell elsewhere. Escorts reduce pirate losses.</p>'+ 
          '<label class="fld"><span>Cargo ship</span><select id="tradeShipSel">'+
            (tradeShipOpts||'<option value="">— no loaded idle ships —</option>')+'</select></label>'+ 
          '<label class="fld"><span>Destination</span><select id="tradeDestSel">'+destOpts+'</select></label>'+ 
          recommendationHtml+
          '<label class="fld"><span>Escorts</span><div class="ship-select-list">'+escortList+'</div></label>'+ 
          '<button class="btn primary" data-act="dispatch-trade" '+(tradeShipOpts?'':'disabled')+'>Dispatch Voyage</button>'+ 
          '<div class="divider"></div>'+ 
          '<div class="panel-title"><h4>Batch Dispatch</h4><span class="tag">'+loadedShips.length+' / 50 ships · '+Math.floor(state.reputation)+' / 500 rep</span></div>'+ 
          '<p class="hint small">Each loaded ship is evaluated separately and sent to the port recommended for its cargo.</p>'+ 
          (fleetDestinationCounts.size?'<div class="small">'+Array.from(fleetDestinationCounts,([name,count])=>
            '<div class="kv"><span>'+esc(name)+'</span><span>'+count+' ship(s)</span></div>'
          ).join('')+'</div>':'')+
          '<button class="btn primary" data-act="dispatch-loaded-fleet" '+
            (loadedShips.length>=50&&state.reputation>=500&&fleetRecommendationPlan.length&&!state.travel?'':'disabled')+'>Dispatch all '+
            loadedShips.length+' loaded ships</button>'+ 
        '</div>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- JOURNAL ---------- */
function viewJournal(){
  const filter = ui.logFilter || 'ALL';
  const cats = ['ALL','TRADE','COMBAT','MISSION','CREW','SHIP','ECONOMY','PAYROLL','EVENT'];
  const rows = state.log.filter(l=>filter==='ALL'||l.category===filter).slice(0,200).map(l=>
    '<div class="logitem cat-'+esc(l.category)+'"><span class="day">Day '+l.day+' · '+esc(l.category)+'</span><br>'+esc(l.text)+'</div>'
  ).join('') || '<p class="hint">Nothing recorded yet.</p>';
  return (
    '<div class="panel solid">'+
      '<div class="panel-title"><h3>Captain\'s Journal</h3>'+
        '<div class="row">'+cats.map(c=>
          '<button class="btn sm'+(filter===c?' primary':'')+'" data-act="log-filter" data-cat="'+c+'">'+c+'</button>'
        ).join('')+'</div></div>'+
      '<div class="loglist">'+rows+'</div>'+
    '</div>'+
    '<div class="panel">'+
      '<div class="panel-title"><h3>Achievements</h3></div>'+
      '<div class="grid c3">'+ACHIEVEMENTS.map(a=>{
        const got = !!state.achievements[a.id];
        return '<div class="card" style="'+(got?'border-color:var(--bronze2)':'opacity:.55')+'">'+
          '<b>'+(got?'🏆 ':'🔒 ')+esc(a.name)+'</b>'+
          '<div class="small muted">'+esc(a.desc)+'</div></div>';
      }).join('')+'</div>'+
    '</div>'
  );
}

function marineFundDisplayE4(value,minimumDigits=0){
  const amount=Number(BigInt(value))/10000;
  return Number.isFinite(amount)?amount.toLocaleString('en-US',{minimumFractionDigits:minimumDigits,maximumFractionDigits:4}):'—';
}
function marineFundChart(account,day){
